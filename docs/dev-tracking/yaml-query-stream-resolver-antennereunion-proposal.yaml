# Proposal only — requires the generic `scraper-query` resolver described in
# yaml-query-stream-resolver-analysis.md. This file is not a service source and
# must not be added to server/services until the backend/frontend contract exists.

# -----------------------------------------------------------------------------
# Proposed generic player resolver contract
# -----------------------------------------------------------------------------
#
# The frontend sends this structured descriptor to get_stream:
# {
#   "resolver": "scraper-query",
#   "target": "https://proxies.antennereunion-production.eu-west-3.alphanetworks.tv/proxy/readTrailer?idMedia=76553",
#   "source": "antennereunion-fr",
# }

resolver_contract:
  resolver: scraper-query
  target: "<stable readTrailer URL containing idMedia>"
  source: antennereunion-fr

# -----------------------------------------------------------------------------
# Proposed fragments for antennereunion-fr.yaml
# -----------------------------------------------------------------------------

get_entry_trailer_fragment:
  # Insert under get_entry > entries. The frontend contract must normalize this
  # separately from players[] because it is a trailer, not the full programme.
  - name: trailer
    type: object
    pointer: /directMetadata
    entries:
      - name: resolver
        type: object
        entries:
          - name: kind
            type: string
            actions:
              - type: format_text
                argument: scraper-query
          - name: target_id
            type: string
            pointer: /AD_LITRAILE/0/idMedia
            actions:
              - type: format_text
                argument: "{base_url}/proxy/readTrailer?idMedia={}"
          - name: source
            type: string
            actions:
              - type: format_text
                argument: antennereunion-fr

resolve_stream_query:
  # Insert in queries. The backend accepts only this fixed conventional name.
  - name: resolve_stream
    scraper_type: json
    request_method: post
    base_url: "{base_url}"
    query_url: "{base_url}/proxy/readTrailer"
    request_body_pointer: /url
    request_body_select: first
    request_body_actions:
      - type: regex_find_all
        pattern: '[?&]idMedia=([^&#]+)'
        format: 'idMedia={1}'
    request_headers:
      - name: X-AN-WebService-IdentityKey
        select: first
        actions:
          - type: format_text
            argument: "{identity_key}"
      - name: content-type
        select: first
        actions:
          - type: format_text
            argument: application/x-www-form-urlencoded
    row_pointer: /result
    entries:
      - name: stream_url
        type: string[]
        pointer: /url
        select: all
      - name: manifest_type
        type: string
        pointer: /url
        select: first
        actions:
          - type: regex_find_all
            pattern: '\.(mpd|m3u8)(?:[?#]|$)'
            format: '{1}'

