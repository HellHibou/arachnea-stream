# POST https://proxies.antennereunion-production.eu-west-3.alphanetworks.tv/proxy/readTrailer
# Content-Type: application/x-www-form-urlencoded
# X-AN-WebService-IdentityKey: HadCogoctandsxEDEsdufOcagidOad
#
# idMedia=76553
#
# Expected response extraction:
# result.url -> stream_url[0] (signed HLS .m3u8 or DASH .mpd URL)