id: rtbf-auvio-be
title: RTBF Auvio
logo: https://auvio.rtbf.be/images/icons/auvio_192x192.png
description:
  fr: "RTBF Auvio est la plateforme de streaming du groupe audiovisuel belge RTBF, offrant un large catalogue de programmes télévisés, films, séries, documentaires et contenus exclusifs en ligne. Les utilisateurs peuvent accéder à leurs émissions préférées en direct ou à la demande, avec des fonctionnalités de recherche avancées et une interface conviviale pour une expérience de visionnage optimale."

http:
  mode: direct

parameters:
  - name: page_size
    value: 20
    description: Default number of catalog entries requested for one paged section.
  - name: search_pagination
    value: true
    description: Whether search supports reliable page-based pagination.

shared:
  # ================== TYPES DE MÉDIAS & ACTIONS COMMUNES ==================
  media_types_rtbf: &media_types_rtbf
    - audio/show
    - audio/show/serie
    - audio/other
    - video/show/serie
    - video/show/other
    - video/movie
    - video/live

  actions_resolve_url: &actions_resolve_url
    - type: resolve_url

  actions_format_rtbf_pages: &actions_format_rtbf_pages
    - type: format_text
      argument: "https://bff-service.rtbf.be/auvio/v1.23/pages{}"

  actions_get_date_dd_mm_yy: &actions_get_date_dd_mm_yy
    - type: get_date
      format: dd_mm_yy

  actions_get_date_yyyy_mm_dd: &actions_get_date_yyyy_mm_dd
    - type: get_date
      format: yyyy_mm_dd

  actions_get_date_yyyy_mm_dd_hh_mm_ss: &actions_get_date_yyyy_mm_dd_hh_mm_ss
    - type: get_date
      format: yyyy_mm_dd_hh_mm_ss

  rtbf_live_player_entries: &rtbf_live_player_entries
    - name: name
      type: string
      actions:
        - type: format_text
          argument: "RTBF Auvio"
    - name: resolver
      type: object
      select: first
      entries:
        - name: kind
          type: string
          actions:
            - type: format_text
              argument: "rtbf-auvio-live"
        - name: stream
          type: object
          select: first
          entries:
            - name: kind
              type: string
              actions:
                - type: format_text
                  argument: "redbee-license-proxy"
        - name: target_id
          type: string

  actions_media_type: &actions_media_type
    - type: map
      default: "other/{}"
      argument:
        SERIE: video/show/serie
        SHOW: video/show/other
        AUDIO_SHOW: audio/show
        VIDEO: video/show/other
        AUDIO_SERIE: audio/show/serie
        AUDIO: audio/other
        STANDALONE: video/movie

  map_true_vf: &map_true_vf
    - type: map
      argument: { "true": "VF", "false": null }

  map_true_vo: &map_true_vo
    - type: map
      argument: { "true": "VO", "false": null }

  map_true_ad: &map_true_ad
    - type: map
      argument: { "true": "AD", "false": null }

  map_null_false_default_true: &map_null_false_default_true
    - type: map
      argument: { null: false }
      default: true

  rtbf_episode_entries: &rtbf_episode_entries
    - name: link
      type: string
      select: first
      pointer: /path
    - name: title
      type: string
      select: first
      pointer: /subtitle
    - name: description
      type: string
      select: first
      pointer: /description
    - name: duration
      type: string
      select: first
      pointer: /duration
    - name: release-date
      type: string
      select: first
      pointer: /releaseDate
      actions: *actions_get_date_dd_mm_yy
    - name: expire
      type: string
      select: first
      pointer: /publishedTo
      actions: *actions_get_date_yyyy_mm_dd
    - name: players
      type: object[]
      entries:
        - name: resolver
          type: object
          select: first
          entries:
            - name: kind
              type: string
              actions:
                - type: format_text
                  argument: "rtbf-auvio-video"
            - name: stream
              type: object
              select: first
              entries:
                - name: kind
                  type: string
                  actions:
                    - type: format_text
                      argument: "redbee-license-proxy"
            - name: target_id
              type: string
              select: first
              pointer: /assetId
    - name: season-name
      type: string
      select: first
      pointer: /title
    - name: img/poster > link
      type: string
      select: first
      pointer: /illustration/m

  rtbf_program_episode_sub_query: &rtbf_program_episode_sub_query
    scraper_type: json
    context_pointer: /data/widgets/*
    filters:
      /type:
        - TAB_LIST
    request_pointer: /contentPath
    row_pointer: /data/content/*
    entries:
      - name: seasons
        type: object[]
        entries:
          - name: label
            type: string
            select: first
            pointer: /title
          - name: link
            type: string
            select: first
            pointer: /contentPath
    sub_queries:
      - scraper_type: json
        filters:
          /type:
            - MEDIA_LIST
        request_pointer: /contentPath
        request_actions:
          - type: format_text
            argument: "{}&_page=1&_limit=50&_embed=content&includeFastTv=true"
        row_pointer: /data/content/*[resourceType=MEDIA]
        entries:
          - name: episodes
            type: object[]
            entries: *rtbf_episode_entries
      - scraper_type: json
        filters:
          /type:
            - MEDIA_LIST
        request_pointer: /contentPath
        request_actions:
          - type: format_text
            argument: "{}&_page=2&_limit=50&_embed=content&includeFastTv=true"
        row_pointer: /data/content/*[resourceType=MEDIA]
        entries:
          - name: episodes
            type: object[]
            entries: *rtbf_episode_entries

  # ================== SUB-QUERIES COMMUNES (load_home + get_category) ==================
  home_sub_queries: &home_sub_queries
    - scraper_type: json
      context_pointer: /widgets/*
      filters:
        /type:
          - CATEGORY_LIST
      request_pointer: /contentPath
      row_pointer: /data
      entries:
        - name: categories
          type: object[]
          pointer: /content/*
          select: all
          entries:
            - name: key
              type: string
              select: first
              pointer: /label
              actions:
                - type: map
                  default: "{}"
                  argument:
                    "Séries": series
                    Films: films
                    Sport: sport
                    Info: info
                    Kids: kids
                    Documentaires: documentaires
            - name: label
              type: string
              select: first
              pointer: /label
            - name: image
              type: string
              select: first
              pointer: /illustration/m
            - name: request > query_url
              type: string
              select: first
              pointer: /path
              actions: *actions_format_rtbf_pages

    - scraper_type: json
      context_pointer: /widgets/*
      filters:
        /type:
          - PROMOBOX
      request_pointer: /contentPath
      row_pointer: /data/content/*
      target: banners
      entries:
        - name: key
          type: string
          select: first
          pointer: /mediaId
        - name: title
          type: string
          select: first
          pointer: /title
        - name: subtitle
          type: string
          select: first
          pointer: /subtitle
        - name: description
          type: string
          select: first
          pointer: /description
        - name: image
          type: string
          select: first
          pointer: /image/xl
        - name: link
          type: string
          select: first
          pointer: /deeplink
          actions: *actions_format_rtbf_pages
        - name: web-link
          type: string
          select: first
          pointer: /deeplink
          actions:
            - type: format_text
              argument: "https://auvio.rtbf.be{}"
        - name: video
          type: object[]
          pointer: /mediaId
          actions:
            - type: format_text
              argument: "https://exposure.api.redbee.live:443/v2/customer/RTBF/businessunit/Auvio/auth/anonymous?assetId={}"
          sub_queries:
            - scraper_type: json
              request_method: post
              request_body_actions:
                - type: format_text
                  argument: '{"device":{"name":"Browser","type":"WEB"},"deviceId":"00000000-0000-4000-8000-000000000000"}'
              request_headers:
                - name: accept
                  actions:
                    - type: format_text
                      argument: "application/json"
                - name: content-type
                  actions:
                    - type: format_text
                      argument: "application/json"
              row_pointer: /
              entries:
                - name: video
                  type: object[]
                  actions:
                    - type: get_request_url
                    - type: regex_find_all
                      pattern: '[?&]assetId=([^&]+)'
                      format: "https://exposure.api.redbee.live:443/v2/customer/RTBF/businessunit/Auvio/entitlement/{1}/play"
                  sub_queries:
                    - scraper_type: json
                      request_headers:
                        - name: Authorization
                          pointer: /sessionToken
                          actions:
                            - type: format_text
                              argument: "Bearer {}"
                      row_pointer: /formats/*
                      row_filters:
                        /format:
                          - HLS
                      entries:
                        - name: video
                          type: string
                          select: first
                          pointer: /mediaLocator

    - scraper_type: json
      context_pointer: /widgets/*
      filters:
        /type:
          - BANNER
          - MEDIA_TRAILER
      request_pointer: /path
      row_pointer: /data
      entries:
        - name: banners
          type: object[]
          entries:
            - name: key
              type: string
              select: first
              pointer: /id
            - name: title
              type: string
              select: first
              pointer: /title
            - name: subtitle
              type: string
              select: first
              pointer: /subtitle
            - name: description
              type: string
              select: first
              pointer: /description
            - name: description
              type: string
              select: first
              pointer: /programDescription
            - name: image
              type: string
              select: first
              pointer: /image/xl
            - name: image
              type: string
              select: first
              pointer: /illustration/xl
            - name: video
              type: string
              select: first
              pointer: /video/url
            - name: video
              type: string
              select: first
              pointer: /media/url
            - name: video
              type: string
              select: first
              pointer: /url
            - name: video
              type: string
              select: first
              pointer: /trailerUrl
            - name: video
              type: string
              select: first
              pointer: /trailer/url
            - name: video
              type: string
              select: first
              pointer: /embedPath
              actions: *actions_resolve_url
            - name: link
              type: string
              select: first
              pointer: /deepLink
              actions: *actions_format_rtbf_pages
            - name: link
              type: string
              select: first
              pointer: /path
              actions: *actions_format_rtbf_pages
            - name: web-link
              type: string
              select: first
              pointer: /deepLink
              actions: *actions_resolve_url
            - name: web-link
              type: string
              select: first
              pointer: /path
              actions: *actions_resolve_url

# ==========================================================
# Queries
# ==========================================================
queries:
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"

  - name: search
    scraper_type: json
    base_url: https://auvio.rtbf.be
    query_url: "https://bff-service.rtbf.be/auvio/v1.23/mosaic/search?dataResourceType=MEDIA_LIST&query={search_terms}&includeFastTv=true&_page={page}&_limit={page_size}"
    media_types: *media_types_rtbf
    row_pointer: /
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        select: first
        actions:
          - type: format_text
            argument: "{page}"
      - name: total_pages
        type: number
        select: first
        pointer: /meta/page/last
      - name: entries
        type: object[]
        pointer: /data/*
        select: all
        entries:
          - name: source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: id
            type: string
            select: first
            pointer: /id
          - name: title
            type: string
            select: first
            pointer: /title
          - name: subtitle
            type: string
            select: first
            pointer: /subtitle
          - name: description
            type: string
            select: first
            pointer: /description
          - name: link
            type: string
            select: first
            pointer: /path
            actions: *actions_format_rtbf_pages
          - name: web-link
            type: string
            select: first
            pointer: /path
            actions: *actions_resolve_url
          - name: embed-link
            type: string
            select: first
            pointer: /embedPath
            actions: *actions_resolve_url
          - name: media-type
            type: string[]
            pointer: /type
            actions: *actions_media_type
          - name: release-date
            type: string
            select: first
            pointer: /releaseDate
            actions: *actions_get_date_dd_mm_yy
          - name: expire
            type: string
            select: first
            pointer: /publishedTo
            actions: *actions_get_date_yyyy_mm_dd
          - name: duration
            type: string
            select: first
            pointer: /duration
          - name: channel
            type: string
            select: first
            pointer: /channelLabel
          - name: theme
            type: string[]
            pointer: /categoryLabel
          - name: img/poster > link
            type: string
            select: first
            pointer: /illustration/m
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        remove_fields:
          - total_pages

  - name: get_entry
    scraper_type: json
    base_url: https://auvio.rtbf.be
    query_url: "{query_url}"
    media_types: *media_types_rtbf
    row_pointer: /
    entries:
      - name: title
        type: string
        select: first
        pointer: /data/content/title
      - name: title
        type: string
        select: first
        pointer: /data/content/0/title
      - name: title/alt
        type: string
        select: first
        pointer: /data/content/subtitle
      - name: title/alt
        type: string
        select: first
        pointer: /data/content/media/subtitle
      - name: title/alt
        type: string
        select: first
        pointer: /data/content/0/subtitle
      - name: description
        type: string
        select: first
        pointer: /data/content/description
      - name: description
        type: string
        select: first
        pointer: /data/content/0/description
      - name: img/poster > link
        type: string
        select: first
        pointer: /data/content/background/xl
      - name: img/poster > link
        type: string
        select: first
        pointer: /data/content/0/illustration/xl
      - name: img/logo > link
        type: string
        select: first
        pointer: /data/content/logo/m

      - name: players
        type: object[]
        entries:
          - name: resolver
            type: object
            select: first
            entries:
              - name: kind
                type: string
                actions:
                  - type: format_text
                    argument: "rtbf-auvio-video"
              - name: stream
                type: object
                select: first
                entries:
                  - name: kind
                    type: string
                    actions:
                      - type: format_text
                        argument: "redbee-license-proxy"
              - name: target_id
                type: string
                select: first
                pointer: /data/content/assetId
              - name: target_id
                type: string
                select: first
                pointer: /data/content/media/assetId
              - name: target_id
                type: string
                select: first
                pointer: /data/content/0/assetId
      - name: web-link
        type: string
        select: first
        pointer: /meta/seo/canonical
      - name: web-link
        type: string
        select: first
        pointer: /data/content/0/path

      - name: duration
        type: string
        select: first
        pointer: /data/content/duration
      - name: duration
        type: string
        select: first
        pointer: /data/content/media/duration
      - name: duration
        type: string
        select: first
        pointer: /data/content/0/duration

      - name: lang/subtitles
        type: string[]
        pointer: /data/content/hasSubtitles
        actions: *map_true_vf
      - name: lang/subtitles
        type: string[]
        pointer: /data/content/media/hasSubtitles
        actions: *map_true_vf
      - name: lang/subtitles
        type: string[]
        pointer: /data/content/0/hasSubtitles
        actions: *map_true_vf

      - name: lang/audio
        type: string[]
        pointer: /data/content/hasMultilingualVersions
        actions: *map_true_vf
      - name: lang/audio
        type: string[]
        pointer: /data/content/media/hasMultilingualVersions
        actions: *map_true_vf
      - name: lang/audio
        type: string[]
        pointer: /data/content/0/hasMultilingualVersions
        actions: *map_true_vf

      - name: lang/audio
        type: string[]
        pointer: /data/content/hasMultilingualVersions
        actions: *map_true_vo
      - name: lang/audio
        type: string[]
        pointer: /data/content/media/hasMultilingualVersions
        actions: *map_true_vo
      - name: lang/audio
        type: string[]
        pointer: /data/content/0/hasMultilingualVersions
        actions: *map_true_vo

      - name: lang/audio
        type: string[]
        pointer: /data/content/hasAudioDescriptions
        actions: *map_true_ad
      - name: lang/audio
        type: string[]
        pointer: /data/content/media/hasAudioDescriptions
        actions: *map_true_ad
      - name: lang/audio
        type: string[]
        pointer: /data/content/0/hasAudioDescriptions
        actions: *map_true_ad

      - name: release-date
        type: string
        select: first
        pointer: /data/content/releaseDate
        actions: *actions_get_date_dd_mm_yy
      - name: release-date
        type: string
        select: first
        pointer: /data/content/media/releaseDate
        actions: *actions_get_date_dd_mm_yy
      - name: release-date
        type: string
        select: first
        pointer: /data/content/0/releaseDate
        actions: *actions_get_date_dd_mm_yy
      - name: release-date
        type: string
        select: first
        pointer: /data/content/publishedFrom
        actions: *actions_get_date_yyyy_mm_dd
      - name: release-date
        type: string
        select: first
        pointer: /data/content/media/publishedFrom
        actions: *actions_get_date_yyyy_mm_dd
      - name: release-date
        type: string
        select: first
        pointer: /data/content/0/publishedFrom
        actions: *actions_get_date_yyyy_mm_dd

      - name: expire
        type: string
        select: first
        pointer: /data/content/publishedTo
        actions: *actions_get_date_yyyy_mm_dd
      - name: expire
        type: string
        select: first
        pointer: /data/content/media/publishedTo
        actions: *actions_get_date_yyyy_mm_dd
      - name: expire
        type: string
        select: first
        pointer: /data/content/0/publishedTo
        actions: *actions_get_date_yyyy_mm_dd

      - name: count-season
        type: number
        select: first
        pointer: /data/content/seasonCount
      - name: theme
        type: string[]
        pointer: /data/content/category/label
      - name: theme
        type: string[]
        pointer: /data/content/media/categoryLabel
      - name: theme
        type: string[]
        pointer: /data/content/0/categoryLabel
      - name: content-advisor
        type: string
        select: first
        pointer: /data/content/rating
      - name: content-advisor
        type: string
        select: first
        pointer: /data/content/media/rating
      - name: content-advisor
        type: string
        select: first
        pointer: /data/content/0/rating
      - name: casting
        type: string[]
        pointer: /data/content/casting/*/name
        select: all

    sub_queries:
      - scraper_type: json
        context_pointer: /data/content/program/path
        request_actions: *actions_format_rtbf_pages
        row_pointer: /
        entries: []
        sub_queries:
          - *rtbf_program_episode_sub_query
      - *rtbf_program_episode_sub_query

  - name: load_home
    scraper_type: json
    base_url: https://auvio.rtbf.be
    query_url: "https://bff-service.rtbf.be/auvio/v1.23/pages/home"
    sibling_sub_query_concurrency: 6
    sub_query_context_concurrency: 6
    sub_query_fetch_concurrency: 8
    media_types: *media_types_rtbf
    row_pointer: /data
    entries:
      - name: sections
        type: object[]
        pointer: /widgets/*[type=MEDIA_LIST]
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /title
          - name: link
            type: string
            select: first
            pointer: /contentPath
      - name: sections
        type: object[]
        pointer: /widgets/*[type=PROGRAM_LIST]
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /title
          - name: link
            type: string
            select: first
            pointer: /contentPath
    sub_queries: *home_sub_queries

  - name: get_category
    scraper_type: json
    base_url: https://auvio.rtbf.be
    query_url: "{query_url}"
    sibling_sub_query_concurrency: 6
    sub_query_context_concurrency: 6
    sub_query_fetch_concurrency: 8
    media_types: *media_types_rtbf
    row_pointer: /data
    entries:
      - name: sections
        type: object[]
        pointer: /widgets/*[type=MEDIA_LIST]
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /title
          - name: link
            type: string
            select: first
            pointer: /contentPath
      - name: sections
        type: object[]
        pointer: /widgets/*[type=PROGRAM_LIST]
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /title
          - name: link
            type: string
            select: first
            pointer: /contentPath
    sub_queries: *home_sub_queries

  - name: get_section
    scraper_type: json
    base_url: https://auvio.rtbf.be
    query_url: "{query_url}{query_separator}_page={page}&_limit={page_size}"
    media_types: *media_types_rtbf
    row_pointer: /
    entries:
      - name: current_page
        type: number
        select: first
        pointer: /meta/page/current
      - name: have_more
        type: boolean
        select: first
        pointer: /links/next
        actions: *map_null_false_default_true
      - name: entries
        type: object[]
        pointer: /data/content/*
        select: all
        entries:
          - name: source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: title
            type: string
            select: first
            pointer: /title
          - name: title/alt
            type: string
            select: first
            pointer: /subtitle
          - name: description
            type: string
            select: first
            pointer: /description
          - name: link
            type: string
            select: first
            pointer: /path
            actions: *actions_format_rtbf_pages
          - name: web-link
            type: string
            select: first
            pointer: /path
            actions: *actions_resolve_url
          - name: media-type
            type: string[]
            pointer: /type
            actions: *actions_media_type
          - name: release-date
            type: string
            select: first
            pointer: /releaseDate
            actions: *actions_get_date_dd_mm_yy
          - name: expire
            type: string
            select: first
            pointer: /publishedTo
            actions: *actions_get_date_yyyy_mm_dd
          - name: duration
            type: string
            select: first
            pointer: /duration
          - name: channel
            type: string
            select: first
            pointer: /channelLabel
          - name: theme
            type: string[]
            pointer: /categoryLabel
          - name: img/poster > link
            type: string
            select: first
            pointer: /illustration/m

  - name: get_season
    scraper_type: json
    base_url: https://auvio.rtbf.be
    query_url: "{query_url}{query_separator}_page={page}&_limit=20"
    media_types: *media_types_rtbf
    row_pointer: /data/content/*
    entries:
      - name: current_page
        type: number
        select: first
        pointer: /meta/page/current
      - name: have_more
        type: boolean
        select: first
        pointer: /links/next
        actions: *map_null_false_default_true

      # === ÉPISODES (utilise les champs communs de l'ancre) ===
      - name: episodes
        type: object[]
        entries:
          - name: link
            type: string
            select: first
            pointer: /path
          - name: title
            type: string
            select: first
            pointer: /subtitle
          - name: description
            type: string
            select: first
            pointer: /description
          - name: duration
            type: string
            select: first
            pointer: /duration
          - name: release-date
            type: string
            select: first
            pointer: /releaseDate
            actions: *actions_get_date_dd_mm_yy
          - name: expire
            type: string
            select: first
            pointer: /publishedTo
            actions: *actions_get_date_yyyy_mm_dd
          - name: players
            type: object[]
            entries:
              - name: resolver
                type: object
                select: first
                entries:
                  - name: kind
                    type: string
                    actions:
                      - type: format_text
                        argument: "rtbf-auvio-video"
                  - name: stream
                    type: object
                    select: first
                    entries:
                      - name: kind
                        type: string
                        actions:
                          - type: format_text
                            argument: "redbee-license-proxy"
                  - name: target_id
                    type: string
                    select: first
                    pointer: /assetId
          - name: episode-number
            type: string
            select: first
            pointer: /subtitle
            actions:
              - type: regex_find_all
                pattern: '^(\d+)'
                format: "{1}"
          - name: img/poster > link
            type: string
            select: first
            pointer: /illustration/m

  - name: list_lives
    scraper_type: json
    base_url: https://auvio.rtbf.be
    query_url: "https://bff-service.rtbf.be/auvio/v1.23/widgets/18989?_page=1&_limit=30&_embed=content&includeFastTv=true&disable_cache=1"
    media_types:
      - video/live
    row_pointer: /
    result_item_field: entries
    entries:
      - name: entries
        type: object[]
        pointer: /data/content/*
        select: all
        entries:
          - name: title
            type: string
            select: first
            pointer: /title
          - name: title/alt
            type: string
            select: first
            pointer: /subtitle
          - name: key
            type: string
            select: first
            pointer: /assetId
          - name: key
            type: string
            select: first
            pointer: /streamId
          - name: media-type
            type: string[]
            actions:
              - type: format_text
                argument: "video/live"
          - name: link
            type: string
            select: first
            pointer: /path
            actions: *actions_format_rtbf_pages
          - name: web-link
            type: string
            select: first
            pointer: /path
            actions:
              - type: format_text
                argument: "https://auvio.rtbf.be{}"
          - name: release-date
            type: string
            select: first
            pointer: /scheduledFrom
            actions: *actions_get_date_yyyy_mm_dd_hh_mm_ss
          - name: expire
            type: string
            select: first
            pointer: /scheduledTo
            actions: *actions_get_date_yyyy_mm_dd_hh_mm_ss
          - name: channel
            type: string
            select: first
            pointer: /channelLabel
          - name: img/poster > link
            type: string
            select: first
            pointer: /illustration/m
          - name: img/landscape > link
            type: string
            select: first
            pointer: /illustration/xl

  - name: get_live
    scraper_type: json
    base_url: https://auvio.rtbf.be
    query_url: "{channel}"
    media_types:
      - video/live
    row_pointer: /
    entries:
      - name: players
        type: object[]
        pointer: /data/content/assetId
        entries: *rtbf_live_player_entries
      - name: players
        type: object[]
        pointer: /data/content/streamId
        entries: *rtbf_live_player_entries
