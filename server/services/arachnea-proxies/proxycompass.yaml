id: proxycompass
title: ProxyCompass free proxy list
description:
  en: "Continuously updated and verified free proxy servers from ProxyCompass."
http:
  mode: auto

parameters:
  - name: base_url
    value: https://proxycompass.com/api/v1/free-proxies
    description: Base URL used to resolve requests.

queries:
  - name: list_proxies_for_country
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{base_url}/live?country={country_name}&page=1&page_size=1000"
    query_param_mappings:
      - target_param: country_name
        source_param: country
        values:
          AL: Albania
          DZ: Algeria
          AG: Antigua%20and%20Barbuda
          AR: Argentina
          AM: Armenia
          AU: Australia
          AT: Austria
          BS: Bahamas
          BD: Bangladesh
          BB: Barbados
          BE: Belgium
          BZ: Belize
          BW: Botswana
          BR: Brazil
          VG: British%20Virgin%20Islands
          BG: Bulgaria
          KH: Cambodia
          CA: Canada
          CL: Chile
          CN: China
          CO: Colombia
          CR: Costa%20Rica
          HR: Croatia
          CW: Curacao
          CY: Cyprus
          CZ: Czechia
          DK: Denmark
          EC: Ecuador
          EE: Estonia
          FI: Finland
          FR: France
          DE: Germany
