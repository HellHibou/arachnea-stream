    request_headers:
      - name: User-Agent
        actions:
          - type: format_text
            argument: Mozilla/5.0
    media_types:
      - application/arachnea-proxy
    row_pointer: /
    result_item_field: proxies
    entries:
      - name: proxies
        type: object[]
        pointer: /results/*
        select: all
        entries:
          - name: protocols
            type: string[]
            pointer: /protocols/*
            select: all
          - name: host
            type: string
            pointer: /ip_address
          - name: port
            type: number
            pointer: /port
          - name: country
            type: string
            pointer: /country_code
          - name: latency_ms
            type: number
            pointer: /latency