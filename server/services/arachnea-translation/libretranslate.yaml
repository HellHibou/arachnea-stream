id: libretranslate
title: LibreTranslate
description:
  en: "Self-hosted LibreTranslate text translation service."
  fr: "Service de traduction de texte LibreTranslate auto-hébergé."
http:
  mode: direct
credentials:
  required: false

constants:
  - name: translation_credential_login
    value: ""
    description: "Encrypted credential login, reserved for installations that need one."
  - name: translation_credential_password
    value: ""
    description: "Encrypted credential password, interpreted as the optional API key."
  - name: translation_text_format
    value: text

parameters:
  - name: base_url
    label: API base URL
    value: "http://localhost:5000"
    editor:
      type: regex
      pattern: '^https?://[^\s/?#]+(?:/[^\s?#]*)?$'
      message: "Enter an absolute HTTP(S) URL without query, fragment or trailing slash."
  - name: translation_selection_order
    label: Selection order
    value: "200"
    editor:
      type: regex
      pattern: '^[0-9]{1,6}$'
      message: "Enter a non-negative selection order with at most six digits."
  - name: translation_preferred
    label: Preferred provider
    value: "false"
    editor:
      type: select
      options:
        - { value: "false", label: "No" }
        - { value: "true", label: "Yes" }
  - name: translation_max_concurrent_requests
    label: Maximum concurrent requests
    value: "1"
    editor:
      type: regex
      pattern: '^[1-9][0-9]{0,2}$'
      message: "Enter a positive concurrency bound (1 to 999)."
  - name: translation_max_units_per_window
    label: Character quota per window
    value: "0"
    editor:
      type: regex
      pattern: '^[0-9]{1,12}$'
      message: "Enter a character quota, or 0 for no quota."
  - name: translation_budget_window_seconds
    label: Quota window (seconds)
    value: "2592000"
    editor:
      type: regex
      pattern: '^[1-9][0-9]{0,9}$'
      message: "Enter a positive window duration in seconds."

queries:
  - name: get_translation_metadata
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{base_url}/languages"
    http:
      error_on_statuses: [
        300, 301, 302, 303, 304, 305, 306, 307, 308, 309, 310, 311, 312, 313, 314, 315, 316, 317, 318, 319,
        320, 321, 322, 323, 324, 325, 326, 327, 328, 329, 330, 331, 332, 333, 334, 335, 336, 337, 338, 339,
        340, 341, 342, 343, 344, 345, 346, 347, 348, 349, 350, 351, 352, 353, 354, 355, 356, 357, 358, 359,
        360, 361, 362, 363, 364, 365, 366, 367, 368, 369, 370, 371, 372, 373, 374, 375, 376, 377, 378, 379,
        380, 381, 382, 383, 384, 385, 386, 387, 388, 389, 390, 391, 392, 393, 394, 395, 396, 397, 398, 399,
        400, 401, 402, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 416, 417, 418, 419,
        420, 421, 422, 423, 424, 425, 426, 427, 428, 429, 430, 431, 432, 433, 434, 435, 436, 437, 438, 439,
        440, 441, 442, 443, 444, 445, 446, 447, 448, 449, 450, 451, 452, 453, 454, 455, 456, 457, 458, 459,
        460, 461, 462, 463, 464, 465, 466, 467, 468, 469, 470, 471, 472, 473, 474, 475, 476, 477, 478, 479,
        480, 481, 482, 483, 484, 485, 486, 487, 488, 489, 490, 491, 492, 493, 494, 495, 496, 497, 498, 499,
        500, 501, 502, 503, 504, 505, 506, 507, 508, 509, 510, 511, 512, 513, 514, 515, 516, 517, 518, 519,
        520, 521, 522, 523, 524, 525, 526, 527, 528, 529, 530, 531, 532, 533, 534, 535, 536, 537, 538, 539,
        540, 541, 542, 543, 544, 545, 546, 547, 548, 549, 550, 551, 552, 553, 554, 555, 556, 557, 558, 559,
        560, 561, 562, 563, 564, 565, 566, 567, 568, 569, 570, 571, 572, 573, 574, 575, 576, 577, 578, 579,
        580, 581, 582, 583, 584, 585, 586, 587, 588, 589, 590, 591, 592, 593, 594, 595, 596, 597, 598, 599
      ]
    media_types:
      - application/arachnea-translation-metadata
    row_pointer: /
    entries: []
    post_process:
      - type: project_json_relations
        target: translation
        pointer: ""
        key: code
        relations: targets
        pattern: '^[a-z]{2}$'
        values_field: languages
        pairs_field: supported_pairs
        from_field: source
        to_field: target
        template:
          schema_version: 1
          source_detection:
            automatic: true
            returns_detected_language: false
            query: detect_language
          text_translation:
            query: translate_texts
            accepts_multiple_blocks: true
            size_unit: unicode_code_points
            max_blocks_per_request: 50
            max_units_per_block: 5000
            max_units_per_request: 10000
            max_request_bytes: 65536
            context_support: false
            markup_support: false
            preserves_request_order: true

  - name: translate_texts
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{base_url}/translate"
    request_method: post
    http:
      error_on_statuses: [400, 401, 403, 404, 408, 413, 415, 422, 429, 500, 502, 503, 504]
    request_headers:
      - name: Content-Type
        actions:
          - type: format_text
            argument: application/json
    request_body_actions:
      - type: build_json
        fields:
          q:
            json_array_projection:
              parameter: translation_blocks_json
              path: /text
          source: { string_parameter: translation_source_language }
          target: { string_parameter: translation_target_language }
          format: { string_parameter: translation_text_format }
          api_key: { string_parameter: translation_credential_password }
    media_types:
      - application/arachnea-translation-result
    row_pointer: /
    result_item_field: translated_blocks
    entries:
      - name: translated_blocks
        type: object[]
        pointer: /translatedText/*
        select: all
        entries:
          - name: text
            type: string

  - name: detect_language
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{base_url}/detect"
    request_method: post
    http:
      error_on_statuses: [400, 401, 403, 404, 408, 413, 415, 422, 429, 500, 502, 503, 504]
    request_headers:
      - name: Content-Type
        actions:
          - type: format_text
            argument: application/json
    request_body_actions:
      - type: build_json
        fields:
          q: { string_parameter: translation_detection_text }
          api_key: { string_parameter: translation_credential_password }
    media_types:
      - application/arachnea-translation-detection
    row_pointer: "/*"
    entries:
      - name: language
        type: string
        pointer: /language
