id: vidmoly
title: VidMoly
description:
  en: "Resolver for pour vidmoly.biz, vidmoly.net, vidmoly.to"
http:
  mode: auto

# ############################################################################
# Parameters
# ############################################################################ 
parameters:
  - name: url
    value: ""
    description: "URL of the embed page to be resolved"


# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # can_resolve_url — determines whether this rule can resolve the URL
  # --------------------------------------------------------------------------
  - name: can_resolve_url
    scraper_type: static
    entries:
      - name: resolver
        type: string
        value: "{url}"
        actions:
          - type: regex_find_all
            pattern: '^https?://(?:www\.)?vidmoly\.(?:to|net|biz)/'
            format: "{service_id}"


  # --------------------------------------------------------------------------
  # resolve_stream — extracts the video stream URL from the player page
  # --------------------------------------------------------------------------
  - name: resolve_stream
    scraper_type: html
    base_url: "{url}"
    query_url: "{url}"
    row_selector: "html"
    request_headers:
      - name: "Referer"
        actions:
          - type: format_text
            argument: "{url}"
    entries:
      - name: stream_url
        type: string[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'sources:\s*\[\s*\{\s*file:\s*["'']([^"'']+)["'']'
            format: "{1}"
          - type: resolve_url
      - name: stream_headers
        type: object
        select: first
        entries:
           - name: Referer
             type: string
             actions:
               - type: format_text
                 argument: "{url}"
      - name: manifest_type
        type: string
        actions:
          - type: format_text
            argument: "hls"
      - name: title
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: '<title>([^<]+)</title>'
            format: "{1}"
      - name: image/title > link
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'image:\s*["'']([^"'']+)["'']'
            format: "{1}"
          - type: resolve_url
            proxy: true
      - name: storyboard_vtt_url
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'file:\s*["'']([^"'']*slides[^"'']*)["'']'
            format: "{1}"
          - type: resolve_url
            proxy: true
