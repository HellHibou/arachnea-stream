id: sendvid
title: Sendvid
description:
  en: "Resolver for sendvid.com"
http:
  mode: auto


# ############################################################################
# Parameters
# ############################################################################ 
parameters:
  - name: url
    value: ""
    description: "URL of the embed page to be resolved"


# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # can_resolve_url — determines whether this rule can resolve the URL
  # --------------------------------------------------------------------------
  - name: can_resolve_url
    scraper_type: static
    entries:
      - name: resolver
        type: string
        value: "{url}"
        actions:
          - type: regex_find_all
            pattern: '^https?://(?:www\.)?sendvid\.com/'
            format: "{service_id}"


  # --------------------------------------------------------------------------
  # resolve_stream — extracts the video stream URL from the player page
  # --------------------------------------------------------------------------
  - name: resolve_stream
    scraper_type: html
    base_url: "{url}"
    query_url: "{url}"
    row_selector: "html"
    request_headers:
      - name: "Referer"
        actions:
          - type: format_text
            argument: "{url}"
    entries:
      - name: stream_url
        type: string[]
        selector: "meta[property='og:video']"
        actions:
          - type: get_attribut
            argument: content
      - name: stream_headers
        type: object
        select: first
        entries:
          - name: Referer
            type: string
            actions:
              - type: format_text
                argument: "{url}"
      - name: manifest_type
        type: string
        actions:
          - type: format_text
            argument: "mp4"
      - name: title
        type: string
        selector: "meta[property='og:title']"
        actions:
          - type: get_attribut
            argument: content
      - name: image/title > link
        type: string
        selector: "meta[property='og:image']"
        actions:
          - type: get_attribut
            argument: content
      - name: storyboard
        type: object
        select: first
        entries:
          - name: url
            type: string
            select: first
            actions:
              - type: get_response_body
              - type: regex_find_all
                pattern: '"image":\s*"([^"]+-storyboard\.jpg)"'
                format: "{1}"
              - type: resolve_url
                proxy: true
          - name: width
            type: number
            actions:
              - type: format_text
                argument: "200"
          - name: height
            type: number
            actions:
              - type: format_text
                argument: "100"
          - name: columns
            type: number
            actions:
              - type: format_text
                argument: "21"
          - name: rows
            type: number
            actions:
              - type: format_text
                argument: "1"
