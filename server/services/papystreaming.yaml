id: papystreaming
http:
  mode: auto
queries:
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        value: "{service_id}"
      - name: title
        value: "{service_title}"
      - name: logo
        value: "{service_logo}"
      - name: description
        value: "{service_description}"

  - name: search
    scraper_type: html
    base_url: https://papystreaming.one
    query_url: "{base_url}/search?q={search_terms}"
    media_types: 
      - video/show/series
      - video/movie
    row_selector: 'a.group.block.card-hover[href*="/movie/"], a.group.block.card-hover[href*="/tv/"]'
    entries:
      - name: link
        actions:
          - type: get_attribut
            argument: href
      - name: web-link
        actions:
          - type: get_attribut
            argument: href
      - name: title
        selector: "h3"
        actions:
          - type: get_text
      - name: img/poster
        selector: "img"
        actions:
          - type: get_attribut
            argument: src
      - name: media-type
        selector: "div.absolute.top-3.left-3 > span"
        actions:
          - type: get_text
          - type: map
            argument:
              Film: "video/movie"
              "Série": "video/show/serie"
      - name: rating
        selector: "div.absolute.top-3.right-3"
        actions:
          - type: get_text
          - type: ratio
            argument: 10
      - name: year
        selector: "div.mt-3.px-1 > p"
        actions:
          - type: get_text
  - name: get_entry
    scraper_type: html
    base_url: https://papystreaming.one
    query_url: "{query_url}"
    media_types: 
      - video/show/series
      - video/movie
    row_selector: "html"
    entries:
      - name: title
        selector: "h1"
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '^\s*([^\(]+)'
            format: "{1}"
      - name: year
        selector: "h1 span"
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '([0-9]{4})'
            format: "{1}"
      - name: release-date
        selector: "div.flex.flex-wrap.items-center.gap-3.mt-5 > span:nth-of-type(1)"
        actions:
          - type: get_text
          - type: get_date
            format:
              - dd_mm_yy
              - dd_mm_yyyy
              - dd_month_yyyy
              - yyyy_mm_dd
            months:
              janvier: 1
              janv: 1
              fevrier: 2
              "février": 2
              fevr: 2
              "févr": 2
              mars: 3
              avril: 4
              avr: 4
              mai: 5
              juin: 6
              juillet: 7
              juil: 7
              aout: 8
              "août": 8
              sept: 9
              septembre: 9
              octobre: 10
              oct: 10
              novembre: 11
              nov: 11
              decembre: 12
              "décembre": 12
              dec: 12
              "déc": 12
      - name: img/poster
        selector: "div.flex-shrink-0 img"
        actions:
          - type: get_attribut
            argument: src
      - name: description
        selector: "div.mt-6 > p.text-gray-300.leading-relaxed"
        actions:
          - type: get_text
      - name: link/trailer
        selector: "div.flex.flex-wrap.gap-3.mt-6 > a"
        actions:
          - type: get_attribut
            argument: href
          - type: resolve_url
      - name: creators
        selector: "div.grid.grid-cols-2.gap-3.mt-6 > div:nth-child(1) p.text-white"
        actions:
          - type: get_text
          - type: split
            argument: ","
      - name: status
        selector: "div.grid.grid-cols-2.gap-3.mt-6 > div:nth-child(2) p.text-white"
        actions:
          - type: get_text
      - name: network
        selector: "div.grid.grid-cols-2.gap-3.mt-6 > div:nth-child(3) p.text-white"
        actions:
          - type: get_text
      - name: rating
        selector: "div.flex.items-center.gap-2 span.text-white.font-bold.text-sm"
        actions:
          - type: get_text
          - type: ratio
            argument: 10
      - name: rating-count
        selector: "div.flex.items-center.gap-2 span.text-gray-500.text-xs"
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '([0-9,]+)'
            format: "{1}"
      - name: count-episodes
        selector: "div.flex.flex-wrap.items-center.gap-3.mt-5 > span:nth-of-type(3)"
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '([0-9]+)'
            format: "{1}"
      - name: theme
        selector: "div.flex.flex-wrap.gap-2.mt-4 a"
        select: all
        actions:
          - type: get_text
      - name: season > label
        selector: 'a.group.block.card-hover[href*="/season/"] p.text-white.font-semibold.text-sm'
        select: all
        actions:
          - type: get_text
      - name: season > link
        selector: 'a.group.block.card-hover[href*="/season/"]'
        select: all
        actions:
          - type: get_attribut
            argument: href
          - type: resolve_url
      - name: season > img/poster
        selector: 'a.group.block.card-hover[href*="/season/"] img'
        select: all
        actions:
          - type: get_attribut
            argument: src
          - type: resolve_url
      - name: season > count-episodes
        selector: 'a.group.block.card-hover[href*="/season/"] p.text-gray-400.text-xs'
        select: all
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '([0-9]+)'
            format: "{1}"
