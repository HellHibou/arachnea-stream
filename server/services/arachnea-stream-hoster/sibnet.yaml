id: sibnet
title: Sibnet
description:
  en: "Resolver for video.sibnet.ru"
http:
  mode: auto

# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # can_resolve_url — determines whether this rule can resolve the URL
  # --------------------------------------------------------------------------
  - name: can_resolve_url
    scraper_type: static
    entries:
      - name: resolver
        type: string
        value: "{url}"
        actions:
          - type: regex_find_all
            pattern: '^https?://video\.sibnet\.ru/'
            format: "{service_id}"


  # --------------------------------------------------------------------------
  # resolve_stream — extracts the video stream URL from the player page
  # --------------------------------------------------------------------------
  - name: resolve_stream
    scraper_type: html
    base_url: "{url}"
    query_url: "{url}"
    row_selector: "html"
    request_headers:
      - name: "Referer"
        actions:
          - type: format_text
            argument: "{url}"
    entries:
      - name: stream_url
        type: string[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: "player\\.src\\(\\s*\\[(.*?)\\]"
            format: "{1}"
          - type: regex_find_all
            pattern: 'src:\s*["'']([^"''\s]+)["'']'
            format: "{1}"
          - type: resolve_url
            proxy: true
            proxy_follow_redirects: true
            proxy_headers:
              Referer: "{url}"
      - name: stream_headers
        type: object
        select: first
        entries:
          - name: Referer
            type: string
            actions:
              - type: format_text
                argument: "{url}"
      - name: manifest_type
        type: string
        actions:
          - type: format_text
            argument: "mp4"
      - name: title
        type: string
        selector: "meta[property='og:title']"
        actions:
          - type: get_attribut
            argument: content
      - name: image/title > link
        type: string
        selector: "meta[property='og:image']"
        actions:
          - type: get_attribut
            argument: content
          - type: resolve_url
            proxy: true
      - name: storyboard
        type: object
        select: first
        entries:
          - name: url
            type: string
            select: first         
            actions:
              - type: get_response_body  
              - type: regex_find_all
                pattern: 'preview"\s*:\s*"([^"]+)"'
                format: "{1}"          
              - type: resolve_url
                proxy: true    
              - type: suffix
                argument: "{index}.jpg"
          - name: width
            type: number
            actions:
              - type: format_text
                argument: "192"
          - name: columns
            type: number
            actions:
              - type: format_text
                argument: "12"
          - name: rows
            type: number
            actions:
              - type: format_text
                argument: "6"
          - name: first_page_index
            type: number
            actions:
              - type: format_text
                argument: "1"
          - name: height
            type: number
            actions:
              - type: format_text
                argument: "108"
          - name: interval
            type: number
            actions:
              - type: format_text
                argument: "5"
