id: lulustream
title: LuluStream
description:
  en: "Resolver for luluvdo.com, lulustream.com"
http:
  mode: auto


# ############################################################################
# Parameters
# ############################################################################
parameters:
  - name: url
    value: ""
    description: "URL of the embed page to be resolved"


# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # can_resolve_url — determines whether this rule can resolve the URL
  # --------------------------------------------------------------------------
  - name: can_resolve_url
    scraper_type: static
    entries:
      - name: resolver
        type: string
        value: "{url}"
        actions:
          - type: regex_find_all
            pattern: '^https?://(?:www\.)?(?:luluvdo\.(?:com|net)|lulustream\.(?:com|to))/'
            format: "{service_id}"


  # --------------------------------------------------------------------------
  # resolve_stream — extracts the video stream URL from the player page
  # --------------------------------------------------------------------------
  - name: resolve_stream
    scraper_type: html
    base_url: "{url}"
    query_url: "{url}"
    row_selector: "html"
    request_headers:
      - name: "User-Agent"
        actions:
          - type: format_text
            argument: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"
      - name: "Accept"
        actions:
          - type: format_text
            argument: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
      - name: "Accept-Language"
        actions:
          - type: format_text
            argument: "fr-FR,fr;q=0.9"
      - name: "Sec-Fetch-Dest"
        actions:
          - type: format_text
            argument: "document"
      - name: "Sec-Fetch-Mode"
        actions:
          - type: format_text
            argument: "navigate"
      - name: "Sec-Fetch-Site"
        actions:
          - type: format_text
            argument: "none"
      - name: "Sec-Fetch-User"
        actions:
          - type: format_text
            argument: "?1"
      - name: "Referer"
        actions:
          - type: format_text
            argument: "{url}"
    entries:
      - name: stream_url
        type: string[]
        actions:
          - type: get_response_body
          - type: unpack_packer
          - type: regex_find_all
            pattern: 'file:\s*"((?:https?://)[^"]+\.m3u8[^"]*)"'
            format: "{1}"
          - type: resolve_url
            proxy: true
            proxy_headers:
              User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"
              Referer: "{url}"
              Origin: "{request_origin}"
              Accept: "*/*"
              Accept-Language: "fr-FR,fr;q=0.9"
              Sec-Fetch-Dest: "empty"
              Sec-Fetch-Mode: "cors"
              Sec-Fetch-Site: "cross-site"
              sec-ch-ua: '"Chromium";v="138", "Google Chrome";v="138", "Not(A:Brand";v="8"'
              sec-ch-ua-mobile: "?0"
              sec-ch-ua-platform: '"Windows"'
            proxy_replace_all:
              - pattern: '(?m)^(https?://[^\r\n]+)'
                replacement: '{proxy_inherited}/$1'
                content_types:
                  - application/vnd.apple.mpegurl
      - name: manifest_type
        type: string
        actions:
          - type: format_text
            argument: "hls"
      - name: title
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: '<title>([^<]+)</title>'
            format: "{1}"
      - name: image/title > link
        type: string
        selector: "meta[name='og:image']"
        actions:
          - type: get_attribut
            argument: content
          - type: replace_text
            search: "_xt"
            replace: ""
          - type: resolve_url
            proxy: true
      - name: storyboard
        type: object
        select: first
        entries:
          - name: url
            type: string
            select: first
            selector: "meta[name='og:image']"
            actions:
              - type: get_attribut
                argument: content
              - type: resolve_url
                proxy: true
          - name: width
            type: number
            actions:
              - type: format_text
                argument: "300"
          - name: height
            type: number
            actions:
              - type: format_text
                argument: "170"
          - name: columns
            type: number
            actions:
              - type: format_text
                argument: "4"
          - name: rows
            type: number
            actions:
              - type: format_text
                argument: "4"
