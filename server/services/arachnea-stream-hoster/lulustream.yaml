id: lulustream
title: LuluStream
description:
  en: "Resolver for luluvdo.com, lulustream.com"
http:
  mode: auto

# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # can_resolve_html — identifies LuluStream-compatible player pages independently
  # of the mirror domain.
  # --------------------------------------------------------------------------
  - name: can_resolve_html
    scraper_type: static
    entries:
      - name: resolver
        type: string
        value: "{html}"
        actions:
          - type: regex_find_all
            pattern: '(?i)<title>[^<]*\s-\s*LuluStream</title>'
            format: "{service_id}"


  # --------------------------------------------------------------------------
  # resolve_stream — extracts the video stream URL from the player page
  # --------------------------------------------------------------------------
  - name: resolve_stream
    scraper_type: html
    base_url: "{url}"
    query_url: "{url}"
    row_selector: "html"
    request_headers:
      - name: "User-Agent"
        actions:
          - type: format_text
            argument: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:153.0) Gecko/20100101 Firefox/153.0"
      - name: "Accept"
        actions:
          - type: format_text
            argument: "*/*"
      - name: "Accept-Language"
        actions:
          - type: format_text
            argument: "fr,fr-FR;q=0.9,en-US;q=0.8,en;q=0.7"
      - name: "Sec-Fetch-Dest"
        actions:
          - type: format_text
            argument: "empty"
      - name: "Sec-Fetch-Mode"
        actions:
          - type: format_text
            argument: "cors"
      - name: "Sec-Fetch-Site"
        actions:
          - type: format_text
            argument: "cross-site"
      - name: "Referer"
        actions:
          - type: format_text
            argument: "{request_origin}/"
      - name: "Origin"
        actions:
          - type: format_text
            argument: "{request_origin}"
    entries:
      - name: stream_url
        type: string[]
        actions:
          - type: get_response_body
          - type: unpack_packer
          - type: regex_find_all
            pattern: 'file:\s*"((?:https?://)[^"]+\.m3u8[^"]*)"'
            format: "{1}"
          - type: resolve_url
            proxy: true
            proxy_headers:
              User-Agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:153.0) Gecko/20100101 Firefox/153.0"
              Referer: "{request_origin}/"
              Origin: "{request_origin}"
              Accept: "*/*"
              Accept-Language: "fr,fr-FR;q=0.9,en-US;q=0.8,en;q=0.7"
              Sec-Fetch-Dest: "empty"
              Sec-Fetch-Mode: "cors"
              Sec-Fetch-Site: "cross-site"
            proxy_replace_all:
              - pattern: '(?m)^(https?://[^\r\n]+)'
                replacement: '{proxy_inherited}/$1'
                content_types:
                  - application/vnd.apple.mpegurl
      - name: manifest_type
        type: string
        actions:
          - type: format_text
            argument: "hls"
      - name: title
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: '<title>([^<]+)</title>'
            format: "{1}"
      - name: image/title > link
        type: string
        selector: "meta[name='og:image']"
        actions:
          - type: get_attribut
            argument: content
          - type: replace_text
            search: "_xt"
            replace: ""
          - type: resolve_url
            proxy: true
      - name: storyboard
        type: object
        select: first
        entries:
          - name: url
            type: string
            select: first
            selector: "meta[name='og:image']"
            actions:
              - type: get_attribut
                argument: content
              - type: resolve_url
                proxy: true
          - name: columns
            type: number
            actions:
              - type: format_text
                argument: "4"
          - name: rows
            type: number
            actions:
              - type: format_text
                argument: "4"
