id: vidzy
title: Vidzy
description:
  en: "Resolver for Vidzy embed pages (vidzy.cc, vidzy.live)"
http:
  mode: auto

queries:
  - name: can_resolve_url
    scraper_type: static
    entries:
      - name: resolver
        type: string
        value: "{url}"
        actions:
          - type: regex_find_all
            pattern: '^https?://(?:www\.)?vidzy\.(?:cc|live)/embed-[A-Za-z0-9]+\.html(?:[?#].*)?$'
            format: "{service_id}"

  - name: resolve_stream
    scraper_type: html
    base_url: "{url}"
    query_url: "{url}"
    row_selector: "html"
    entries:
      - name: stream_url
        type: string[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'sources:\s*\[\{src:\s*\(function\(s\)\{[\s\S]*?\}\)\("([^"]+)"\)'
            format: "{1}"
          # The page decodes the payload at runtime with a key derived from
          # `location.hostname` (base64, reverse, XOR). The hostname is
          # extracted here from the request URL so a single resolver covers
          # every Vidzy mirror domain. `document.write` is the string channel
          # exposed by `exec_js`; the numeric globals it also returns are
          # filtered out by the next `regex_find_all`.
          - type: format_text
            argument: >-
              var s='{}',u='{request_url}',h=u.split('/')[2].split(':')[0].replace(/^www\./,''),H=0,b='',a='',r='';for(var j=0;j<h.length;j++)H=(H+h.charCodeAt(j))&255;for(var i=0;i<s.length;i+=4){var c1='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'.indexOf(s.charAt(i)),c2='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'.indexOf(s.charAt(i+1)),c3='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'.indexOf(s.charAt(i+2)),c4='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'.indexOf(s.charAt(i+3));b+=String.fromCharCode((c1<<2)|(c2>>4));if(c3>=0)b+=String.fromCharCode(((c2&15)<<4)|(c3>>2));if(c4>=0)b+=String.fromCharCode(((c3&3)<<6)|c4);}a=b.split('').reverse().join('');for(var k=0;k<a.length;k++)r+=String.fromCharCode(a.charCodeAt(k)^((61+k*89+H)&255));document.write(r);
          - type: exec_js
          - type: regex_find_all
            pattern: '^document_write=(.+)$'
            format: "{1}"
          - type: resolve_url
            proxy: true
            proxy_headers:
              Referer: "{url}"
              Origin: "{request_origin}"
              User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"
            proxy_replace_all:
              - pattern: '(?m)^(https?://[^\r\n]+)'
                replacement: '{proxy_inherited}/$1'
                content_types:
                  - application/vnd.apple.mpegurl
              - pattern: '(?m)^([^#/\r\n][^\r\n]*)$'
                replacement: '{proxy_inherited}/{base_url}{path_base}$1'
                content_types:
                  - application/vnd.apple.mpegurl
      - name: stream_headers
        type: object
        select: first
        entries:
          - name: Referer
            type: string
            actions:
              - type: format_text
                argument: "{url}"
          - name: Origin
            type: string
            actions:
              - type: format_text
                argument: "{origine}"
          - name: User-Agent
            type: string
            actions:
              - type: format_text
                argument: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"
      - name: manifest_type
        type: string
        actions:
          - type: format_text
            argument: "hls"
      - name: title
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'title:\s*"([^"]+)"'
            format: "{1}"
      - name: image/title > link
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'metaThumbnail:\s*"([^"]+)"'
            format: "{1}"
          - type: resolve_url
            proxy: true
      - name: _subtitle_tracks_source
        type: string
        actions:
          - type: get_response_body
    post_process:
      - type: extract_regex_items
        source: _subtitle_tracks_source
        target: subtitles
        pattern: "kind:\\s*'([^']+)'\\s*,\\s*srclang:\\s*'([^']*)'\\s*,\\s*label:\\s*'([^']*)'\\s*,\\s*src:\\s*\\(function\\(u\\)\\{[\\s\\S]*?\\}\\)\\('([^']+)'\\)"
        entries:
          - name: kind
            type: string
            capture_group: 1
          - name: lang
            type: string
            capture_group: 2
          - name: label
            type: string
            capture_group: 3
          - name: link
            type: string
            capture_group: 4
            actions:
              - type: resolve_url
                proxy: true
                proxy_headers:
                  Referer: "{url}"
                  Origin: "{request_origin}"
                  User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36"
      - type: filter_items
        source: subtitles
        field: kind
        pattern: '^subtitles$'
      - type: remove_fields
        fields:
          - _subtitle_tracks_source
