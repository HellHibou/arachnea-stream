id: vidara
title: Vidara
description:
  en: "Resolver for vidara.to"
http:
  mode: auto

# ############################################################################
# Parameters
# ############################################################################ 
parameters:
  - name: url
    value: ""
    description: "URL of the embed page to be resolved"


# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # can_resolve_url — determines whether this rule can resolve the URL
  # --------------------------------------------------------------------------
  - name: can_resolve_url
    scraper_type: static
    entries:
      - name: resolver
        type: string
        value: "{url}"
        actions:
          - type: regex_find_all
            pattern: '^https?://(?:www\.)?vidara\.to/e/'
            format: "{service_id}"


  # --------------------------------------------------------------------------
  # resolve_stream — extracts the video stream URL from the player page
  #   Uses the internal JSON API at POST /api/stream
  # --------------------------------------------------------------------------
  - name: resolve_stream
    scraper_type: json
    base_url: "https://vidara.to"
    query_url: "{base_url}/api/stream"
    request_method: post
    request_body_pointer: "/url"
    request_body_actions:
      - type: regex_find_all
        pattern: '^https?://(?:www\.)?vidara\.to/e/([^/?#]+)'
        format: "{1}"
      - type: format_text
        argument: '{"filecode":"{}","device":"web"}'
    request_headers:
      - name: "Referer"
        actions:
          - type: format_text
            argument: "{url}"
      - name: "Content-Type"
        actions:
          - type: format_text
            argument: "application/json"
    row_pointer: "/"
    entries:
      - name: stream_url
        type: string[]
        pointer: "/streaming_url"
        actions:
          - type: resolve_url
            proxy: true
      - name: stream_headers
        type: object
        select: first
        entries:
          - name: Referer
            type: string
            actions:
              - type: format_text
                argument: "{url}"
      - name: manifest_type
        type: string
        actions:
          - type: format_text
            argument: "hls"
      - name: title
        type: string
        pointer: "/title"
      - name: image/title > link
        type: string
        pointer: "/thumbnail"
        actions:
          - type: resolve_url
            proxy: true
