id: vidara
title: Vidara
description:
  en: "Resolver for Vidara-compatible embed pages"
http:
  mode: auto

# ############################################################################
# Parameters
# ############################################################################ 
parameters:
  - name: url
    value: ""
    description: "URL of the embed page to be resolved"
  - name: html
    value: ""
    description: "Optional pre-fetched HTML document used for content-based resolution"
  - name: origine
    value: ""
    description: "Origin of the final embed URL after redirects"


# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # can_resolve_html — identifies the Vidara player implementation independently
  # of the domain that hosts it.
  # --------------------------------------------------------------------------
  - name: can_resolve_html
    scraper_type: static
    entries:
      - name: resolver
        type: string
        value: "{html}"
        actions:
          - type: regex_find_all
            pattern: '(?s)fetch\(apiURL,\{method:"POST",headers:\{"Content-Type":"application/json"\},body:JSON\.stringify\(\{filecode:filecode,device:detectDevice\(\)\}\)\}\).*?abouttext:"Vidara"'
            format: "{service_id}"


  # --------------------------------------------------------------------------
  # resolve_stream — extracts the video stream URL from the player page
  #   Uses the internal JSON API at POST /api/stream on the resolved embed origin.
  # --------------------------------------------------------------------------
  - name: resolve_stream
    scraper_type: json
    base_url: "{origine}"
    query_url: "{origine}/api/stream"
    request_method: post
    request_body_pointer: "/url"
    request_body_actions:
      - type: regex_find_all
        pattern: '^https?://[^/]+/e/([^/?#]+)'
        format: "{1}"
      - type: format_text
        argument: '{"filecode":"{}","device":"web"}'
    request_headers:
      - name: "Referer"
        actions:
          - type: format_text
            argument: "{url}"
      - name: "Content-Type"
        actions:
          - type: format_text
            argument: "application/json"
    row_pointer: "/"
    entries:
      - name: stream_url
        type: string[]
        pointer: "/streaming_url"
        actions:
          - type: resolve_url
            proxy: true
      - name: stream_headers
        type: object
        select: first
        entries:
          - name: Referer
            type: string
            actions:
              - type: format_text
                argument: "{url}"
      - name: manifest_type
        type: string
        actions:
          - type: format_text
            argument: "hls"
      - name: title
        type: string
        pointer: "/title"
      - name: image/title > link
        type: string
        pointer: "/thumbnail"
        actions:
          - type: resolve_url
            proxy: true
