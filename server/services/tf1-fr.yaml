queries:
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        value: "{service_id}"
      - name: title
        value: "{service_title}"
      - name: logo
        value: "{service_logo}"
      - name: description
        value: "{service_description}"

  - name: search
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{graphql_url}?id=eb07383bb0a758366983a970b6b9c633a5639e1f&variables=%7B%22query%22%3A%22{search_terms}%22%2C%22programsLimit%22%3A6%2C%22videosLimit%22%3A12%7D"
    request_headers: *generic_request_headers
    media_types: *media_types_tf1
    row_pointer: /data/sliderOfSearchVideos/items/*
    entries:
      - name: source
        actions:
          - type: format_text
            argument: "{source}"
      - name: title
        pointer: /video/decoration/label
      - name: description
        pointer: /video/decoration/shortLabel
      - name: theme
        pointer: /video/program/topics/*
        select: all
      - name: media-type
        pointer: /video/program/typology
        actions: *actions_typology_media_type
      - name: link
