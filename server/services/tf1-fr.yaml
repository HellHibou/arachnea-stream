    request_headers: *generic_request_headers
    media_types: *media_types_tf1
    row_pointer: /data/programs
    entries:
      - name: source
        actions:
          - type: format_text
            argument: "{source}"
      - name: sections
        entries:
          - name: label
            actions:
              - type: format_text
                argument: "{channel_label}"
          - name: current_page
            actions:
              - type: format_text
                argument: "{page}"
          - name: page_size
            actions:
              - type: format_text
                argument: "{page_size}"
          - name: total
            pointer: /total
          - name: link
            actions:
              - type: get_request_url
          - name: request > channel
            actions:
              - type: format_text
                argument: "{channel}"
          - name: request > channel_label
            actions:
              - type: format_text
                argument: "{channel_label}"
          - name: request > page_size
            actions:
              - type: format_text
                argument: "{page_size}"
          - name: entries
            pointer: /items/*
            select: all
            entries: *category_program_entries
    post_process:
      - type: compute_items_field
        source: sections
        target: total_pages
        expression: "ceil({total} / {page_size})"
      - type: derive_pagination
        source: sections
        entries_field: entries
        current_page_field: current_page
        total_pages_field: total_pages
        have_more_field: have_more
        remove_fields:
          - total
          - total_pages
          - page_size

