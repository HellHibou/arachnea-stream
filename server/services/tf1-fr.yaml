id: tf1-fr
title: TF1+
logo: "https://www.tf1.fr/_next/static/media/tf1-plus-logo-white.107m~.6am38d6.svg"
description:
  fr: "TF1+ est la plateforme de streaming du groupe audiovisuel français TF1, offrant un large catalogue de programmes télévisés, films, séries, documentaires et contenus exclusifs en ligne. Les utilisateurs peuvent accéder à leurs émissions préférées en direct ou à la demande, avec des fonctionnalités de recherche avancées et une interface conviviale pour une expérience de visionnage optimale."
  
http:
  mode: direct
  user_agent_profile: firefox

parameters:
  - name: catalog_code
    value: fr-fr
    description: TF1 catalog code used by the Smart TV API.
  - name: base_url
    value: https://www.tf1.fr/{catalog_code}
    description: Public website base URL for TF1+.
  - name: graphql_url
    value: https://www.tf1.fr/graphql/{catalog_code}/web
    description: TF1+ public GraphQL endpoint used for catalog data.
  - name: android_graphql_url
    value: https://app-api.tf1.fr/graphql/{catalog_code}/android
    description: TF1+ Android GraphQL endpoint used for home rails and covers.
  - name: android_home_sliders_url
    value: "{android_graphql_url}?id=7fc592f35355d21d4154f6af49251a0f2d1c9f36092b219821d119b6a5276007&variables=%7B%22rightType%22%3A%22SHORT%22%2C%22contentTypes%22%3A%5B%22VIDEO%22%2C%22PROGRAM%22%2C%22PROGRAM_BY_CATEGORY%22%2C%22COLLECTION%22%2C%22CATEGORY%22%2C%22TOP_PROGRAM%22%2C%22LIVE%22%2C%22EXTERNAL_LINK%22%5D%2C%22channelTypes%22%3A%5B%22TV%22%2C%22EVENT%22%2C%22PARTNER%22%5D%7D"
    description: TF1+ Android home sliders request.
  - name: android_home_covers_url
    value: "{android_graphql_url}?id=3aded9f1ff735906a0e293b90dd7301372ed2b0c8b8bae06930c82b8ca53e52a&variables=%7B%22contentTypes%22%3A%5B%22VIDEO%22%2C%22PROGRAM%22%2C%22COLLECTION%22%2C%22EXTERNAL_LINK%22%2C%22LIVE%22%2C%22CATEGORY%22%5D%2C%22channelTypes%22%3A%5B%22TV%22%2C%22EVENT%22%2C%22PARTNER%22%5D%2C%22rightType%22%3A%22SHORT%22%7D"
    description: TF1+ Android home covers request.
  - name: smarttv_api_root
    value: https://smart-tv.tf1.fr/catalog/{catalog_code}/smarttv
    description: TF1+ Smart TV catalog endpoint used for detailed program data.
  - name: home_programs_limit
    value: 120
    description: Number of programs fetched for the TF1 home payload.
  - name: page_size
    value: 20
    description: Default TF1 page size for paged program and season requests.

shared:
  media_types_tf1: &media_types_tf1
    - video/movie
    - video/show/serie
    - video/show/documentary
    - video/show/other

  generic_request_headers: &generic_request_headers
    - name: content-type
      actions:
        - type: format_text
          argument: "application/json"
    - name: referer
      actions:
        - type: format_text
          argument: "{base_url}/programmes-tv"

  android_request_headers: &android_request_headers
    - name: content-type
      actions:
        - type: format_text
          argument: "application/json"

  actions_android_photo_url: &actions_android_photo_url
    - type: format_text
      argument: "https://photos.tf1.fr{}"

  action_program_media_type: &action_program_media_type
    type: map
    default: "video/show/other"
    argument:
      series-et-fictions: video/show/serie
      cinema: video/movie
      divertissements: video/show/other
      infos-mag-et-sport: video/news
      jeunesse: video/show/kids

  actions_program_media_type: &actions_program_media_type
    - *action_program_media_type

  action_typology_media_type: &action_typology_media_type
    type: map
    default: "video/show/other/{}"
    argument:
      "Serie": video/show/serie
      "Série": video/show/serie
      "Emission": video/show/other
      "Émission": video/show/other
      Film: video/movie
      Telefilm: video/movie
      "Téléfilm": video/movie
      Documentaire: video/show/documentary
      Information: video/news

  actions_typology_media_type: &actions_typology_media_type
    - *action_typology_media_type

  actions_live_channel_id: &actions_live_channel_id
    - type: regex_find_all
      pattern: '^L_(.+)$'
      format: "{1}"

  actions_live_date: &actions_live_date
    - type: get_date
      format: yyyy_mm_dd_hh_mm_ss

  action_program_link: &action_program_link
    type: build_url
    base: "{smarttv_api_root}?id=379fec96081ab1a2&variables=%7B%22programId%22%3A%22{id}%22%7D&programSlug={slug}&channel={channel}"
    fields:
      id: /id
      slug: /slug
      channel: /mainChannel/slug

  action_program_web_link: &action_program_web_link
    type: build_url
    base: "{base_url}/{channel}/{slug}"
    fields:
      slug: /slug
      channel: /mainChannel/slug

  actions_program_link: &actions_program_link
    - *action_program_link

  actions_program_web_link: &actions_program_web_link
    - *action_program_web_link

  action_static_request_source: &action_static_request_source
    type: format_text
    argument: "{source}"

