          - type: regex_find_all
            pattern: 'programSlug=([^&]+).*\|\|\|([^|]+)$'
            format: '{graphql_url}?id=76bc5c35edb166fa637a6c6686cb05c7140d2a8b&variables=%7B%22programSlug%22%3A%22{1}%22%2C%22listId%22%3A%22{2}%22%2C%22offset%22%3A0%2C%22limit%22%3A1%7D'
        row_pointer: /data/programBySlug/editorialSections/*/listById/items/0/video
        entries:
