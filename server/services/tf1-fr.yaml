  - name: get_entry
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}"
    request_headers: *generic_request_headers
    media_types: *media_types_tf1
    row_pointer: /data/programById
    entries:
      - name: title
        pointer: decoration/label
      - name: description
        pointer: decoration/description
      - name: media-type
        pointer: typology
        actions: *actions_typology_media_type
      - name: language
        pointer: hasDescriptionTrack/total
        actions:
          - type: map
            default: AD
            argument:
              0: ""
      - name: subtitles
        pointer: hasFrenchDeafSubtitles/total
        actions:
          - type: map
            default: VF
            argument:
              0: ""
      - name: subtitles
        pointer: hasFrenchSubtitles/total
        actions:
          - type: map
            default: VF
            argument:
              0: ""
      - name: link
        actions:
          - type: get_request_url
          - type: regex_find_all
            pattern: '[?&]programSlug=([^&]+).*?[?&]channel=([^&]+)'
            format: '{2}/{1}'
          - type: format_text
            argument: "{base_url}/{}"
      - name: web-link
        actions:
          - type: get_request_url
          - type: regex_find_all
            pattern: '[?&]programSlug=([^&]+).*?[?&]channel=([^&]+)'
            format: '{2}/{1}'
          - type: format_text
            argument: "{base_url}/{}"
      - name: img/logo > link
        pointer: decoration/logoImage/logo/0/url
      - name: img/logo > link
        pointer: decoration/logo/logo/0/url
      - name: img/poster > link
        pointer: decoration/image/sourcesWithScales/0/url
      - name: count-season
        pointer: decoration/subLabel
        actions:
          - type: regex_find_all
            pattern: '([0-9]+)'
            format: '{1}'
      - name: theme
        pointer: topics/*
        select: all
      - name: director
        pointer: editorialSections/*/directors/*/members/*
        select: all
        actions:
          - type: regex_find_all
            pattern: '"firstName":"([^"]*)","lastName":"([^"]*)"'
            format: "{1} {2}"
      - name: casting
        pointer: editorialSections/*/actors/*/members/*
        select: all
        actions:
          - type: regex_find_all
            pattern: '"firstName":"([^"]*)","lastName":"([^"]*)"'
            format: "{1} {2}"
      - name: season
        pointer: /editorialSections/*/lists/*
        select: all
        entries:
          - name: label
            pointer: /decoration/label
          - name: link
            pointer: /id
            actions:
              - type: format_text
                argument: "{request_url}|||{}"
              - type: regex_find_all
                pattern: 'programSlug=([^&]+).*\|\|\|([^|]+)$'
                format: '{graphql_url}?id=76bc5c35edb166fa637a6c6686cb05c7140d2a8b&variables=%7B%22programSlug%22%3A%22{1}%22%2C%22listId%22%3A%22{2}%22'
    sub_queries:
