id: crunchyroll
http:
  mode: direct
queries:
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        value: "{service_id}"
      - name: title
        value: "{service_title}"
      - name: logo
        value: "{service_logo}"
      - name: description
        value: "{service_description}"

  - name: search
    scraper_type: html
    base_url: https://www.crunchyroll.com/fr
    media_types: 
      - video/show/anime
    query_url: "{base_url}/search?f=series&q={search_terms}"
    row_selector: '[data-t*="search-series-card"]'
    entries:
      - name: title
        selector: "h2 > a"
        actions:
          - type: get_text
      - name: link
        selector: "h2 > a"
        actions:
          - type: get_attribut
            argument: href
          - type: resolve_url
      - name: web-link
        selector: "h2 > a"
        actions:
          - type: get_attribut
            argument: href
          - type: resolve_url
      - name: img/poster
        selector: '[data-t*="original-image"]'
        actions:
          - type: get_attribut
            argument: src
          - type: resolve_url
      - name: count-season
        selector: span.search-show-card-hover__extended-meta-item--NgVOV
        actions:
          - type: get_text
      - name: count-episodes
        selector: span.search-show-card-hover__extended-meta-item--NgVOV + span
        actions:
          - type: get_text
      - name: rating
        selector: p.star-rating-short-static__rating--bdAfR
        actions:
          - type: get_text
          - type: ratio
            argument: 20
      - name: rating-count
        selector: '[data-t*="rating-count"]'
        actions:
          - type: get_text
  - name: get_entry
    scraper_type: html
    base_url: https://www.crunchyroll.com/fr
    media_types: 
      - video/show/anime
    query_url: "{query_url}"
    row_selector: "html"
    entries:
      - name: title
        selector: h1
        actions:
          - type: get_text
      - name: description
        selector: div.erc-series-description > p
        actions:
          - type: get_text
      - name: lang/audio
        selector: '[data-t*="detail-row-audio-language"] > dd > span'
        actions:
          - type: get_text
          - type: split
            argument: ","
      - name: lang/subtitles
        selector: '[data-t*="detail-row-subtitles-language"] > dd > span'
        actions:
          - type: get_text
          - type: split
            argument: ","
      - name: theme
        selector: 'dd > div > div > span > a'
        select: all
        actions:
          - type: get_text
      - name: content-advisor
        selector: '[data-t*="detail-row-content-advisor"] > dd > span + span'
        actions:
          - type: get_text
          - type: split
            argument: ","
      - name: img/poster
        selector: 'figure > div > picture + picture > img'
        actions:
          - type: get_attribut
            argument: src
          - type: resolve_url
      - name: season > label
        selector: "h3 > a"
        select: all
        actions:
          - type: get_text
      - name: season > link
        selector: "h3 > a"
        select: all
        actions:
          - type: get_attribut
            argument: href
          - type: resolve_url   
      - name: season > description
        selector: 'div.playable-card-hover__description-wrapper--T4J30 > p'
        select: all
        actions:
          - type: get_text
      - name: season > img/poster
        selector: 'div.episode-list > div > div > div > a > div > div > div > div > figure > div > picture + picture > img'
        select: all
        actions:
          - type: get_attribut
            argument: src
          - type: resolve_url
      - name: season > release-date
        selector: '[data-t*="meta-info"]'
        select: all
        actions:
          - type: get_text
          - type: get_date
            format:
              - dd_month_yyyy
              - dd_mm_yyyy
              - dd_mm_yy
              - yyyy_mm_dd
            months:
              janvier: 1
              janv: 1
              fevrier: 2
              "février": 2
              fevr: 2
              "févr": 2
              mars: 3
              avril: 4
              avr: 4
              mai: 5
              juin: 6
              juillet: 7
              juil: 7
              aout: 8
              "août": 8
              sept: 9
              septembre: 9
              octobre: 10
              oct: 10
              novembre: 11
              nov: 11
              decembre: 12
              "décembre": 12
              dec: 12
              "déc": 12
              january: 1
              jan: 1
              february: 2
              feb: 2
              march: 3
              mar: 3
              april: 4
              apr: 4
              may: 5
              june: 6
              jun: 6
              july: 7
              jul: 7
              august: 8
              aug: 8
              september: 9
              sep: 9
              october: 10
              oct: 10
              november: 11
              nov: 11
              december: 12
              dec: 12
