id: m6play-fr
title: M6 Play
# logo: https://www.m6.fr/assets/images/icons/touch/apple-touch-icon-ipad-retina.png
logo: https://www.groupem6.fr/app/uploads/sites/3/cache/2024/07/logo-m6-groupe/883637834.png
description:
  fr: "M6 Play est la plateforme de streaming du groupe audiovisuel français M6, offrant un large catalogue de programmes télévisés, films, séries, documentaires et contenus exclusifs en ligne. Les utilisateurs peuvent accéder à leurs émissions préférées en direct ou à la demande, avec des fonctionnalités de recherche avancées et une interface conviviale pour une expérience de visionnage optimale."
credentials:
  required: true
  signup_url: https://auth.m6.fr/inscription?ad_targeting=true&multi_device_matching=false&personalization=true&tracking=true&pixel_email_deliverability=false&pixel_email_marketing=false&redirect_uri=https%3A%2F%2Fwww.m6.fr%2F&auth_flow_type=login&redirect_reason=OIDC+Login
http:
  mode: direct
  user_agent_profile: firefox


# ############################################################################
# Parameters
# ############################################################################
parameters:
  - name: base_url
    value: https://www.6play.fr
    description: Public website base URL for the 6play service.
  - name: api_root
    value: https://android.middleware.6play.fr/6play/v2/platforms/m6group_androidmob/services
    description: Base URL of the public 6play Android middleware API.
  - name: image_root
    value: https://images.6play.fr/v1/images
    description: Base URL used to build image assets from external keys.
  - name: max_banners
    value: 5
    description: Maximum number of banners to fetch.
  - name: page_size
    value: 18
    description: Default number of catalog entries requested for one paged section.
  - name: live_channels
    value: "M6,W9,6T,gulli,fast3,fats7,fats8,fast14,fast6,fast9"
    description: Comma-separated list of 6play live channel identifiers for the API.
  - name: search_pagination
    value: true
    description: Whether search supports reliable page-based pagination.
  - name: recommendation_signing_key
    value: "Ocohp1AhK0leek6aew2aeSiedee3ies2Aipes5Aa"
    description: Public anonymous signing key observed in the M6 web client; update when the client changes.
  - name: recommendation_capacity
    value: token-web-32
    description: Public web layout capability token, distinct from the anonymous JWT.
  - name: recommendation_client_release
    value: "6.51.3"
    description: Client release header for anonymous token acquisition.


# ############################################################################
# Shared structs
# ############################################################################
shared:
  media_types_6play: &media_types_6play
    - video/movie
    - video/show/serie
    - video/show/documentary
    - video/show/other

  generic_request_headers: &generic_request_headers []

  # No account credentials are used for anonymous recommendation requests.
  recommendation_signature: &recommendation_signature
    - type: format_text
      argument: 'var timestamp = Math.floor(Date.now() / 1000); document.write(sign("{recommendation_signing_key}", "/v2/platforms/m6group_web/getJwt" + Math.floor(timestamp / 60)) + "|" + timestamp);'
    - type: exec_js
      timeout_ms: 1000
      scripts:
        - |
          function sha1(bytes) {
            var length = bytes.length * 8, data = bytes.slice(), words = [];
            data.push(128);
            while (data.length % 64 !== 56) data.push(0);
            for (var i = 7; i >= 0; i--) data.push(i >= 4 ? 0 : (length >>> (i * 8)) & 255);
            var h = [1732584193, -271733879, -1732584194, 271733878, -1009589776];
            function rotate(x, n) { return (x << n) | (x >>> (32 - n)); }
            for (var offset = 0; offset < data.length; offset += 64) {
              for (i = 0; i < 16; i++) {
                var j = offset + i * 4;
                words[i] = (data[j] << 24) | (data[j + 1] << 16) | (data[j + 2] << 8) | data[j + 3];
              }
              for (i = 16; i < 80; i++) words[i] = rotate(words[i - 3] ^ words[i - 8] ^ words[i - 14] ^ words[i - 16], 1);
              var a = h[0], b = h[1], c = h[2], d = h[3], e = h[4];
              for (i = 0; i < 80; i++) {
                var f = i < 20 ? (b & c) | (~b & d) : i < 40 ? b ^ c ^ d : i < 60 ? (b & c) | (b & d) | (c & d) : b ^ c ^ d;
                var k = i < 20 ? 1518500249 : i < 40 ? 1859775393 : i < 60 ? -1894007588 : -899497514;
                var next = (rotate(a, 5) + f + e + k + words[i]) | 0;
                e = d; d = c; c = rotate(b, 30); b = a; a = next;
              }
              h = [(h[0] + a) | 0, (h[1] + b) | 0, (h[2] + c) | 0, (h[3] + d) | 0, (h[4] + e) | 0];
            }
            var out = [];
            for (i = 0; i < 20; i++) out.push((h[i >> 2] >>> (24 - (i % 4) * 8)) & 255);
            return out;
          }
          function utf8(value) {
            var encoded = encodeURIComponent(value), bytes = [];
            for (var i = 0; i < encoded.length; i++) {
              if (encoded.charAt(i) === '%') {
                bytes.push(parseInt(encoded.slice(i + 1, i + 3), 16));
                i += 2;
              } else {
                bytes.push(encoded.charCodeAt(i));
              }
            }
            return bytes;
          }
          function sign(key, message) {
            var bytes = utf8(key), inner = [], outer = [];
            if (bytes.length > 64) bytes = sha1(bytes);
            for (var i = 0; i < 64; i++) {
              inner.push((bytes[i] || 0) ^ 54);
              outer.push((bytes[i] || 0) ^ 92);
            }
            return sha1(outer.concat(sha1(inner.concat(utf8(message))))).map(function(x) {
              return ('0' + x.toString(16)).slice(-2);
            }).join('');
          }
    - type: regex_find_all
      pattern: '^document_write=([a-f0-9]{40})\|[0-9]+$'
      format: "{1}"

  recommendation_headers: &recommendation_headers
    - name: Authorization
      actions:
        - type: format_text
          argument: "Bearer {_jwt}"

  recommendation_cards: &recommendation_cards
    - name: _next_card_page
      type: number
      select: first
      pointer: /content/pagination/nextPage
    - name: have_more
      type: boolean
      select: first
      pointer: /content/pagination/nextPage
      actions:
        - type: map
          argument: { null: false }
          default: true
    - name: entries
      type: object[]
      select: all
      pointer: /content/items/*/itemContent
      entries:
        - name: source
          type: string
          actions:
            - type: format_text
              argument: "{source}"
        - name: title
          type: string
          select: first
          pointer: /title
        - name: _target_type
          type: string
          select: first
          pointer: /action/target/value_layout/type
        - name: link
          type: string
          select: first
          pointer: /action/target/value_layout/id
        - name: web-link
          type: string
          select: first
          actions:
            - type: build_url
              base: "https://www.m6.fr/{slug}-p_{id}"
              fields:
                slug: /action/target/value_layout/seo
                id: /action/target/value_layout/id
        - name: img/poster > link
          type: string
          select: first
          pointer: /image/id
          actions:
            - type: format_text
              argument: "{image_root}/{}/raw"
        - name: img/portrait > link
          type: string
          select: first
          pointer: /image/id
          actions:
            - type: format_text
              argument: "{image_root}/{}/raw"

  recommendation_block: &recommendation_block
    name: _block
    type: string
    select: first
    pointer: /blocks/*[analytics/tealium/from=feature.recommended_programs_by_program]/blockId
    actions:
      - type: format_text
        argument: "https://layout.6cloud.fr/front/v1/m6web/m6group_web/main/{recommendation_capacity}/program/{query_url}/block/{}?page={page}&nbPages=1"
    sub_queries:
      - scraper_type: json
        target: parent
        request_headers: *recommendation_headers
        row_pointer: /
        entries: *recommendation_cards

  actions_default_media_type: &actions_default_media_type
    - type: map
      default: "video/other/{}"
      argument:
        sport: video/show/sport
        magazine: video/news
        divertissement: video/show/other
        serie: video/show/serie
        series: video/show/serie
        documentaire: video/show/documentary
        "dessin-anime": video/show/anime
        "episode": video/show/serie

  actions_image_key_to_url: &actions_image_key_to_url
    - type: format_text
      argument: "{image_root}/{}/raw"

  actions_extract_release_date: &actions_extract_release_date
    - type: get_date
      format: yyyy_mm_dd_hh_mm_ss

  actions_proxy_countries_from_area: &actions_proxy_countries_from_area
    - type: map
      argument:
        "11": "AD,FR,GP,GF,MQ,YT,MC,NC,PF,RE,BL,MF,PM,TF,WF"
        "34": null
      default: null
    - type: split
      argument: ","


# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"


  # ---------------------------------------------------------------
  # Home page
  # ---------------------------------------------------------------
  - name: load_home
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{api_root}/m6replay/folders?limit=10&offset=0"
    request_headers: *generic_request_headers
    media_types: *media_types_6play
    row_pointer: /
    entries:
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            select: first
            actions:
              - type: format_text
                argument: "m6"
          - name: label
            type: string
            select: first
            actions:
              - type: format_text
                argument: "M6"
          - name: request > query_url
            type: string
            select: first
            actions:
              - type: format_text
                argument: "{api_root}/m6replay/folders?limit=999&offset=0"

      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            select: first
            actions:
              - type: format_text
                argument: "w9"
          - name: label
            type: string
            select: first
            actions:
              - type: format_text
                argument: "W9"
          - name: request > query_url
            type: string
            select: first
            actions:
              - type: format_text
                argument: "{api_root}/w9replay/folders?limit=999&offset=0"

      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            select: first
            actions:
              - type: format_text
                argument: "6ter"
          - name: label
            type: string
            select: first
            actions:
              - type: format_text
                argument: "6ter"
          - name: request > query_url
            type: string
            select: first
            actions:
              - type: format_text
                argument: "{api_root}/6terreplay/folders?limit=999&offset=0"

      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            select: first
            actions:
              - type: format_text
                argument: "gulli"
          - name: label
            type: string
            select: first
            actions:
              - type: format_text
                argument: "Gulli"
          - name: request > query_url
            type: string
            select: first
            actions:
              - type: format_text
                argument: "{api_root}/gulli/folders?limit=999&offset=0"

      - name: sections
        type: object[]
        pointer: /*
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /name
          - name: link
            type: string
            select: first
            pointer: /id
            actions:
              - type: format_text
                argument: "{api_root}/6play/folders/{}/programs?csa=6&with=parentcontext"
      - name: banners > link
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{api_root}/m6replay/programs?limit={max_banners}&offset=0&csa=6&sort=last_video_publication&with=layout"
  

  # ---------------------------------------------------------------
  # Banners listing
  # ---------------------------------------------------------------
  - name: get_banners
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}"
    request_headers: *generic_request_headers
    row_pointer: /
    entries:
      - name: banners
        type: object[]
        pointer: /*
        select: all
        entries:
          - name: key
            type: string
            select: first
            pointer: /id
          - name: title
            type: string
            select: first
            pointer: /title
          - name: description
            type: string
            select: first
            pointer: /description
          - name: link
            type: string
            select: first
            pointer: /id
          - name: entryUrl
            type: string
            select: first
            pointer: /id
          - name: web-link
            type: string
            select: first
            pointer: /id
          - name: image
            type: string
            select: first
            pointer: /images_with_context/defaults/banner_31/external_key
            actions: *actions_image_key_to_url
          - name: logo
            type: string
            pointer: /images_with_context/defaults/logo/external_key
            select: first
            actions: *actions_image_key_to_url
          - name: expire
            type: string
            select: first
            pointer: publication_date_vi/date_start_max
            actions: *actions_extract_release_date
          - name: year
            type: number
            pointer: /year_copyright
            select: first
          - name: year
            type: number
            select: first
            pointer: /year_production
          - name: release-date
            type: string
            select: first
            pointer: year_copyright

  # ---------------------------------------------------------------
  # Category listing
  # ---------------------------------------------------------------
  - name: get_category
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}"
    request_headers: *generic_request_headers
    media_types: *media_types_6play
    row_pointer: /
    entries:
      - name: sections
        type: object[]
        pointer: /*
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /name
          - name: link
            type: string
            select: first
            pointer: /id
            actions:
              - type: format_text
                argument: "{api_root}/6play/folders/{}/programs?csa=6&with=parentcontext"


  # ---------------------------------------------------------------
  # Sections listing
  # ---------------------------------------------------------------
  - name: get_section
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}&limit={page_size}&offset={offset}"
    request_headers: *generic_request_headers
    media_types: *media_types_6play
    row_pointer: /
    entries:
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: have_more
        type: boolean
        actions:
          - type: format_text
            argument: "false"
      - name: page_size
        type: number
        actions:
          - type: format_text
            argument: "{page_size}"
      - name: infer_have_more_from_full_page
        type: boolean
        actions:
          - type: format_text
            argument: "true"
      - name: entries
        type: object[]
        pointer: /*
        select: all
        entries:
          - name: source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: title
            type: string
            select: first
            pointer: /title
          - name: description
            type: string
            select: first
            pointer: /description
          - name: duration
            type: string
            select: first
            pointer: /duration
          - name: release-date
            type: string
            select: first
            pointer: /product/last_diffusion
            actions: *actions_extract_release_date
          - name: release-date
            type: string
            select: first
            pointer: update_date
            actions: *actions_extract_release_date
          - name: media-type
            type: string[]
            pointer: /neustar/category
            actions: *actions_default_media_type
          - name: media-type
            type: string[]
            pointer: /program_type_wording/code
            actions: *actions_default_media_type
          - name: link
            type: string
            select: first
            pointer: /id
          - name: web-link
            type: string
            select: first
            pointer: /id
          - name: img/poster > link
            type: string
            pointer: /images/*[role=cover]/external_key
            select: all
            actions: *actions_image_key_to_url
          - name: img/landscape > link
            type: string
            pointer: /images/*[role=vignette]/external_key
            select: all
            actions: *actions_image_key_to_url
          - name: year
            type: number
            pointer: /year_copyright
            select: all
          - name: year
            type: number
            select: first
            pointer: /year_production
          - name: release-date
            type: string
            select: first
            pointer: year_copyright
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        page_size_field: page_size
        infer_from_full_page_field: infer_have_more_from_full_page
        remove_fields:
          - total_pages
          - page_size
          - infer_have_more_from_full_page


  # --------------------------------------------------------------------------
  # Search
  # --------------------------------------------------------------------------
  - name: search
    scraper_type: json
    base_url: "{base_url}"
    query_url: "https://nhacvivxxk-dsn.algolia.net/1/indexes/*/queries?x-algolia-agent=Algolia%20for%20JavaScript%20(4.24.0)%3B%20Browser"
    request_method: post
    request_headers:
      - name: content-type
        actions:
          - type: format_text
            argument: "application/json"
      - name: x-algolia-api-key
        actions:
          - type: format_text
            argument: "6ef59fc6d78ac129339ab9c35edd41fa"
      - name: x-algolia-application-id
        actions:
          - type: format_text
            argument: "NHACVIVXXK"
    request_body_actions:
      - type: format_text
        argument: '{"requests":[{"indexName":"rtlmutu_prod_bedrock_layout_items_v2_m6web_main","query":{search_query_json},"params":"clickAnalytics=true&hitsPerPage={page_size}&page={page_index}&facetFilters=[[\"metadata.item_type:program\"],[\"metadata.platforms_assets:m6group_web\"]]"}]}'
    media_types: *media_types_6play
    row_pointer: /
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        select: first
        actions:
          - type: format_text
            argument: "{page}"
      - name: total_pages
        type: number
        select: first
        pointer: /results/0/nbPages
      - name: entries
        type: object[]
        pointer: /results/*/hits/*
        select: all
        entries:
          - name: title
            type: string
            select: first
            pointer: /item/itemContent/title
          - name: description
            type: string
            select: first
            pointer: /item/itemContent/description
          - name: media-type
            type: string[]
            pointer: /metadata/tags/type
            actions: *actions_default_media_type
          - name: link
            type: string
            select: first
            pointer: /content/id
          - name: img/poster > link
            type: string
            select: first
            pointer: /item/itemContent/image/id
            actions: *actions_image_key_to_url
          - name: img/poster > link
            type: string
            select: first
            pointer: /item/itemContent/secondaryImage/id
            actions: *actions_image_key_to_url
          - name: theme
            type: string[]
            pointer: /item/itemContent/extraDetails
            actions:
              - type: split
                argument: " | "
          - name: release-date
            type: string
            select: first
            pointer: /metadata/last_activity_date
            actions: *actions_extract_release_date
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        remove_fields:
          - total_pages


  # ---------------------------------------------------------------
  # Entry detail page
  # ---------------------------------------------------------------
  - name: get_entry
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{api_root}/6play/programs/{query_url}?with=links,subcats,rights"
    request_headers: *generic_request_headers
    media_types: *media_types_6play
    row_pointer: /
    entries:
      - name: recommendations > link
        type: string
        select: first
        pointer: /id
      - name: title
        type: string
        select: first
        pointer: /title
      - name: description
        type: string
        select: first
        pointer: /description
      - name: media-type
        type: string[]
        pointer: /program_type_wording/code
        actions: *actions_default_media_type
      - name: img/poster > link
        type: string
        pointer: /images/*[role=cover]/external_key
        select: all
        actions: *actions_image_key_to_url
      - name: img/landscape > link
        type: string
        pointer: /images/*[role=box]/external_key
        select: all
        actions: *actions_image_key_to_url
      - name: img/logo > link
        type: string
        pointer: /images/*[role=logo]/external_key
        select: all
        actions: *actions_image_key_to_url
      - name: year
        type: number
        pointer: /year_copyright
        select: first
      - name: year
        type: number
        pointer: /year_production
        select: first
      - name: content-advisor
        type: string
        select: first
        pointer: /csa/label
      - name: release-date
        type: string
        select: first
        pointer: first_local_air_date/date
        actions: *actions_extract_release_date
      - name: duration
        type: string
        select: first
        pointer: /duration
      - name: expire
        type: string
        select: first
        pointer: publication_date_vi/date_end_max
        actions: *actions_extract_release_date
      - name: link
        type: string
        select: first
        pointer: /code
        actions:
          - type: format_text
            argument: "{base_url}/{}-p_{query_url}"
      - name: web-link
        type: string
        select: first
        pointer: /code
        actions:
          - type: format_text
            argument: "{base_url}/{}-p_{query_url}"
      - name: seasons
        type: object[]
        entries:
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "All videos"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{query_url}/videos?"

      - name: seasons
        type: object[]
        pointer: /program_subcats/*
        select: all
        entries:
           - name: label
             type: string
             select: first
             pointer: /title
           - name: link
             type: string
             select: first
             pointer: /id
             actions:
               - type: format_text
                 argument: "{query_url}/videos?subcat={}"

  # ---------------------------------------------------------------
  # Deferred recommendations: inspect at most eight layout pages.
  # ---------------------------------------------------------------
  - name: get_recommendations
    scraper_type: json
    base_url: https://www.m6.fr
    query_url: https://front-auth.6cloud.fr/v2/platforms/m6group_web/getJwt
    request_headers:
      - name: X-Auth-Token
        actions: *recommendation_signature
      - name: X-Auth-Token-Timestamp
        actions:
          - type: format_text
            argument: 'document.write(Math.floor(Date.now() / 1000));'
          - type: exec_js
            timeout_ms: 1000
          - type: regex_find_all
            pattern: '^document_write=([0-9]+)$'
            format: "{1}"
      - name: X-Customer-Name
        actions:
          - type: format_text
            argument: m6web
      - name: X-Client-Release
        actions:
          - type: format_text
            argument: "{recommendation_client_release}"
      - name: x-auth-device-id
        actions:
          - type: format_text
            argument: 'document.write("xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) { var r = Math.floor(Math.random() * 16); return (c === "x" ? r : (r & 3) | 8).toString(16); }));'
          - type: exec_js
            timeout_ms: 1000
          - type: regex_find_all
            pattern: '^document_write=([a-f0-9-]+)$'
            format: "{1}"
    media_types: *media_types_6play
    row_pointer: /
    entries:
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: _layout
        type: string[]
        select: all
        pointer: /token
        actions:
          - type: format_text
            argument: 'document.write(Array.from({length: 8}, function(_, i) { return "https://layout.6cloud.fr/front/v1/m6web/m6group_web/main/{recommendation_capacity}/program/{query_url}/layout?nbPages=1&blockPage=" + (i + 1) + "#jwt={}"; }).join("\n"));'
          - type: exec_js
            timeout_ms: 1000
          - type: regex_find_all
            pattern: '(https://layout\.6cloud\.fr/[^\s]+)'
            format: "{1}"
        sub_queries:
          - scraper_type: json
            target: parent
            request_headers:
              - name: Authorization
                actions:
                  - type: get_request_url
                  - type: regex_find_all
                    pattern: '#jwt=([A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)$'
                    format: 'Bearer {1}'
            row_pointer: /
            entries:
              - name: _jwt
                type: string
                actions:
                  - type: get_request_url
                  - type: regex_find_all
                    pattern: '#jwt=([A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)$'
                    format: "{1}"
              - *recommendation_block
    post_process:
      - type: filter_items
        source: entries
        field: _target_type
        pattern: '^program$'
      - type: filter_fields
        source: entries
        field: _target_type
        pattern: '^program$'
        remove:
          - _target_type
      - type: derive_pagination
        next_value_field: _next_card_page
        remove_fields:
          - _next_card_page
      - type: remove_fields
        fields:
          - _layout
          - _jwt
          - _block

  # ---------------------------------------------------------------
  # Season
  # ---------------------------------------------------------------
  - name: get_season
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{api_root}/6play/programs/{query_url}&csa=6&with=clips,freemiumpacks&type=vi,vc,playlist&sort=episode_asc&limit=100&offset=0"
    request_headers: *generic_request_headers
    media_types: *media_types_6play
    row_pointer: /
    entries:
      - name: current_page
        type: number
        select: first
        actions:
          - type: format_text
            argument: "1"
      - name: have_more
        type: boolean
        select: first
        actions:
          - type: format_text
            argument: "false"
      - name: episodes
        type: object[]
        pointer: /*
        entries:
          - name: title
            type: string
            select: first
            pointer: /title
          - name: description
            type: string
            select: first
            pointer: /clips/0/description
          - name: description
            type: string
            select: first
            pointer: /description
          - name: duration
            type: string
            select: first
            pointer: /clips/0/duration
          - name: duration
            type: string
            select: first
            pointer: /duration
          - name: season-name
            type: string
            select: first
            pointer: /clips/0/product/season_title
          - name: season-name
            type: string
            select: first
            pointer: /product/season_title
          - name: release-date
            type: string
            select: first
            pointer: /clips/0/product/last_diffusion
            actions: *actions_extract_release_date
          - name: release-date
            type: string
            select: first
            pointer: /product/last_diffusion
            actions: *actions_extract_release_date
          - name: players > name
            type: string
            actions:
              - type: format_text
                argument: "M6+"

          - name: players > resolver > kind
            type: string
            actions:
              - type: format_text
                argument: "m6play-video"
          - name: players > resolver > target_id
            type: string
            select: first
            pointer: /id
          - name: players > resolver > proxy > countries
            type: string[]
            select: all
            pointer: /clips/0/areas/*/zone_id
            actions: *actions_proxy_countries_from_area
          - name: link
            type: string
            actions:
              - type: build_url
                base: "https://www.m6.fr/{prg}-p_{query_url}/{prg}-c_{cid}"
                fields:
                  prg: /code
                  cid: /clips/0/id
          - name: players > web-link
            type: string
            actions:
              - type: build_url
                base: "https://www.m6.fr/{prg}-p_{query_url}/{prg}-c_{cid}"
                fields:
                  prg: /code
                  cid: /clips/0/id
              - type: regex_find_all
                pattern: '^(https://www\.m6\.fr/[^/]+-p_[^/]+)/videos\?/(.+)$'
                format: "{1}/{2}"
          - name: img/preview > link
            type: string
            select: first
            pointer: /display_image/external_key
            actions: *actions_image_key_to_url
          - name: img/preview > link
            type: string
            pointer: /clips/0/images/*/external_key
            select: first
            actions: *actions_image_key_to_url
          - name: img/preview > link
            type: string
            pointer: /images/*[role=vignette]/external_key
            select: first
            actions: *actions_image_key_to_url
  # ---------------------------------------------------------------
  # List lives
  # ---------------------------------------------------------------
  - name: list_lives
    scraper_type: json
    base_url: ""
    query_url: "{api_root}/6play/live?channel={live_channels}&with=service_display_images,nextdiffusion,extra_data"
    request_headers: *generic_request_headers
    media_types:
      - video/live
    row_pointer: /
    result_item_field: entries
    entries:
      - name: entries
        type: object[]
        pointer: /*/*
        select: all
        entries:
          - name: title
            type: string
            select: first
            pointer: /service_display/title
          - name: title/alt
            type: string
            select: first
            pointer: /title
          - name: key
            type: string
            select: first
            pointer: /live/channel/code_url
          - name: description
            type: string
            select: first
            pointer: /description
          - name: link
            type: string
            select: first
            pointer: /live/channel/code_url
            actions:
              - type: map
                default: "{}"
                argument:
                  m6: M6
                  w9: W9
                  6ter: 6T
                  gulli: gulli
          - name: web-link
            type: string
            select: first
            pointer: /live/channel/code_url
            actions:
              - type: format_text
                argument: "{base_url}/{}/direct"
          - name: img/landscape > link
            type: string
            select: first
            pointer: /display_image/external_key
            actions: *actions_image_key_to_url
          - name: release-date
            type: string
            select: first
            pointer: /diffusion_start_date
            actions: *actions_extract_release_date
          - name: expire
            type: string
            select: first
            pointer: /diffusion_end_date
            actions: *actions_extract_release_date

  # ---------------------------------------------------------------
  # Get live
  # ---------------------------------------------------------------
  - name: get_live
    scraper_type: json
    base_url: ""
    query_url: "{api_root}/6play/live?channel={channel}&with=service_display_images,nextdiffusion,extra_data"
    request_headers: *generic_request_headers
    media_types:
      - video/live
    row_pointer: "/*/*"
    entries:
      - name: players
        type: object[]
        entries:
          - name: web-link
            type: string
            select: first
            pointer: /live/channel/code_url
            actions:
              - type: format_text
                argument: "{base_url}/{}/direct"
          - name: resolver
            type: object
            select: first
            entries:
              - name: kind
                type: string
                actions:
                  - type: format_text
                    argument: "m6play-live"
              - name: target_id
                type: string
                select: first
                pointer: /live/channel/code_url
