  # ---------------------------------------------------------------
  # Get live
  # ---------------------------------------------------------------
  - name: get_live
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{api_mobile}/generic/directs?platform=apps"
    request_headers: *generic_request_headers
    media_types:
      - video/live
    row_pointer: /
    entries:
      - name: players
        type: object[]
        entries:
          - name: name
            type: string
            actions:
              - type: format_text
                argument: "FranceTV"
          - name: resolver
            type: object
            select: first
            entries:
              - name: kind
                type: string
                actions:
                  - type: format_text
                    argument: "francetv-live"
              - name: stream
                type: object
                select: first
                entries:
                  - name: kind
                    type: string
                    actions:
                      - type: format_text
                        argument: "francetv-license-proxy"
              - name: target_id
                type: string
                actions:
                  - type: format_text
                    argument: "{channel}"
