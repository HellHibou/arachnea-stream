id: francetv
title: France TV
logo: https://www.france.tv/favicons/favicon-192.png
description:
  fr: "France TV est le groupe audiovisuel public français, offrant une large gamme de contenus télévisés, de films, de séries, de documentaires et d'émissions en ligne. La plateforme de streaming de France TV permet aux utilisateurs d'accéder à leurs programmes préférés en direct ou à la demande, avec une interface conviviale et des fonctionnalités de recherche avancées pour une expérience de visionnage optimale."
http:
  mode: direct
  user_agent_profile: firefox

# ############################################################################
# Parameters
# ############################################################################
parameters:
  - name: base_url
    value: https://www.france.tv
    description: Public website base URL for france.tv.
  - name: api_mobile
    value: https://api-mobile.yatta.francetv.fr
    description: Mobile/catalog API used by the FranceTV Kodi source.
  - name: api_front
    value: https://api-front.yatta.francetv.fr
    description: Front API used to resolve a Yatta content id into media metadata.
  - name: country_code
    value: FR
    description: Country code passed to the FranceTV playback API.


# ############################################################################
# Shared structs
# ############################################################################
shared:
  media_types_francetv: &media_types_francetv
    - video/movie
    - video/show/serie
    - video/show/documentary
    - video/show/sport
    - video/news
    - video/show/other
    - video/live

  generic_request_headers: &generic_request_headers []

  actions_francetv_category_media_type: &actions_francetv_category_media_type
    - type: map
      default: video/show/other
      argument:
        series-et-fictions: video/show/serie
        documentaires: video/show/documentary
        films: video/movie
        societe: video/news
        info: video/news
        sport: video/show/sport
        spectacles-et-culture: video/show/other
        jeux-et-divertissements: video/show/other
        enfants: video/show/other

  actions_francetv_item_media_type: &actions_francetv_item_media_type
    - type: map
      default: video/show/other
      argument:
        integrale: video/show/other
        unitaire: video/show/other
        extrait: video/show/other
        resume: video/show/other
        bonus: video/show/other
        bande-annonce: video/show/other
        program: video/show/other
        collection: video/show/other
        categorie: video/show/other
        sous_categorie: video/show/other
        event: video/show/other
        live: video/live

  actions_program_web_link: &actions_program_web_link
    - type: regex_find_all
      pattern: '^([^_]+)_(.+)$'
      format: "{1}/{2}"
    - type: format_text
      argument: "{base_url}/{}"

  source_entry: &source_entry
    name: source
    type: string
    actions:
      - type: format_text
        argument: "{source}"

  common_image_poster_3x4: &common_image_poster_3x4
    name: img/poster > link
    type: string
    pointer: /images/*[type=vignette_3x4]/urls/w:1024
    select: first

  common_image_poster_2x3: &common_image_poster_2x3
    name: img/poster > link
    type: string
    pointer: /images/*[type=vignette_2x3]/urls/w:2000
    select: first

  common_image_poster_square: &common_image_poster_square
    name: img/poster > link
    type: string
    pointer: /images/*[type=carre]/urls/w:800
    select: first

  common_image_landscape_background: &common_image_landscape_background
    name: img/landscape > link
    type: string
    pointer: /images/*[type=background_16x9]/urls/w:2500
    select: first

  common_image_landscape_thumbnail: &common_image_landscape_thumbnail
    name: img/landscape > link
    type: string
    pointer: /images/*[type=vignette_16x9]/urls/w:1024
    select: first

  common_image_logo: &common_image_logo
    name: img/logo > link
    type: string
    pointer: /images/*[type=logo]/urls/w:450
    select: first

  program_card_entries: &program_card_entries
    - *source_entry
    - name: title
      type: string
      select: first
      pointer: /label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: description
      type: string
      select: first
      pointer: /synopsis
    - name: media-type
      type: string[]
      pointer: /category/url_complete
      actions: *actions_francetv_category_media_type
    - name: media-type
      type: string[]
      pointer: /type
      actions: *actions_francetv_item_media_type
    - name: link
      type: string
      select: first
      pointer: /program_path
      actions:
        - type: format_text
          argument: "{api_mobile}/apps/program/{}?platform=apps&page=0"
    - name: web-link
      type: string
      select: first
      pointer: /program_path
      actions: *actions_program_web_link
    - name: theme
      type: string[]
      pointer: /categories/*/label
      select: all
    - name: theme
      type: string[]
      pointer: /sub_categories/*/label
      select: all
    - name: count-season
      type: number
      select: first
      pointer: /number_of_seasons
    - name: count-season
      type: number
      select: first
      pointer: /number_of_episodes
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo

  collection_card_entries: &collection_card_entries
    - *source_entry
    - name: title
      type: string
      select: first
      pointer: /label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: description
      type: string
      select: first
      pointer: /subtitle
    - name: media-type
      type: string[]
      pointer: /category/url_complete
      actions: *actions_francetv_category_media_type
    - name: media-type
      type: string[]
      pointer: /type
      actions: *actions_francetv_item_media_type
    - name: link
      type: string
      select: first
      pointer: /collection_path
      actions:
        - type: format_text
          argument: "{api_mobile}/apps/collections/{}?platform=apps&page=0"
    - name: theme
      type: string[]
      pointer: /category/label
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo

  category_card_entries: &category_card_entries
    - *source_entry
    - name: title
      type: string
      select: first
      pointer: /label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: description
      type: string
      select: first
      pointer: /synopsis
    - name: media-type
      type: string[]
      pointer: /url_complete
      actions: *actions_francetv_category_media_type
    - name: link
      type: string
      select: first
      pointer: /url_complete
      actions:
        - type: format_text
          argument: "{api_mobile}/apps/sub-categories/{}?platform=apps&page=0"
    - name: web-link
      type: string
      select: first
      pointer: /url_complete
      actions:
        - type: format_text
          argument: "{base_url}/{}"
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo

  event_card_entries: &event_card_entries
    - *source_entry
    - name: title
      type: string
      select: first
      pointer: /label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: media-type
      type: string[]
      pointer: /category/url_complete
      actions: *actions_francetv_category_media_type
    - name: media-type
      type: string[]
      pointer: /type
      actions: *actions_francetv_item_media_type
    - name: link
      type: string
      select: first
      pointer: /url_complete
      actions: 
         - type: format_text
           argument: "{api_mobile}/apps/events/{}?platform=apps&page=0"
    - name: theme
      type: string[]
      pointer: /sub_categories/*/label
      select: all
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo

  video_card_entries: &video_card_entries
    - *source_entry
    - name: title
      type: string
      select: first
      pointer: /episode_title
    - name: title
      type: string
      select: first
      pointer: /title
    - name: title/alt
      type: string
      select: first
      pointer: /program/label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: description
      type: string
      select: first
      pointer: /text
    - name: media-type
      type: string[]
      pointer: /category/url_complete
      actions: *actions_francetv_category_media_type
    - name: media-type
      type: string[]
      pointer: /type
      actions: *actions_francetv_item_media_type
    - name: link
      type: string
      select: first
      pointer: /id
      actions: 
        - type: format_text
          argument: "{api_front}/standard/publish/contents/{}"
    - name: duration
      type: string
      select: first
      pointer: /duration
    - name: content-advisor
      type: string
      select: first
      pointer: /rating_csa
    - name: content-advisor
      type: string
      select: first
      pointer: /rating_csa_code
    - name: theme
      type: string[]
      pointer: /category/label
    - name: theme
      type: string[]
      pointer: /sub_categories/*/label
      select: all
    - name: channel
      type: string
      select: first
      pointer: /channel/label
    - name: director
      type: string[]
      pointer: /director
    - name: casting
      type: string[]
      pointer: /casting
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo

  episode_entries: &episode_entries
    - name: title
      type: string
      select: first
      pointer: /episode_title
    - name: title
      type: string
      select: first
      pointer: /title
    - name: title/alt
      type: string
      select: first
      pointer: /program/label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: duration
      type: string
      select: first
      pointer: /duration
    - name: season-name
      type: string
      select: first
      pointer: /season
      actions:
        - type: format_text
          argument: "Season {}"
    - name: episode-number
      type: number
      select: first
      pointer: /episode
    - name: content-advisor
      type: string
      select: first
      pointer: /rating_csa
    - name: content-advisor
      type: string
      select: first
      pointer: /rating_csa_code
    - name: channel
      type: string
      select: first
      pointer: /channel/label
    - name: link
      type: string
      select: first
      pointer: /id
      actions:
        - type: format_text
          argument: "{api_front}/standard/publish/contents/{}"
    - name: players
      type: object[]
      pointer: /si_id
      entries:
        - name: name
          type: string
          actions:
            - type: format_text
              argument: "FranceTV"
        - name: resolver > kind
          type: string
          actions:
            - type: format_text
              argument: "francetv-video"
        - name: resolver > stream > kind
          type: string
          actions:
            - type: format_text
              argument: "francetv-license-proxy"
        - name: resolver > target_id
          type: string
    - name: img/preview > link
      type: string
      pointer: /images/*[type=vignette_16x9]/urls/w:1024
      select: first
    - name: img/poster > link
      type: string
      pointer: /images/*[type=vignette_3x4]/urls/w:1024
      select: first

  section_entries: &section_entries
    - name: label
      type: string
      select: first
      pointer: /label
    - name: have_more
      type: boolean
      select: first
      actions:
        - type: format_text
          argument: "false"
    - name: entries
      type: object[]
      pointer: /items/*[type=program]
      select: all
      entries: *program_card_entries
    - name: entries
      type: object[]
      pointer: /items/*[type=collection]
      select: all
      entries: *collection_card_entries
    - name: entries
      type: object[]
      pointer: /items/*[type=categorie]
      select: all
      entries: *category_card_entries
    - name: entries
      type: object[]
      pointer: /items/*[type=sous_categorie]
      select: all
      entries: *category_card_entries
    - name: entries
      type: object[]
      pointer: /items/*[type=event]
      select: all
      entries: *event_card_entries
    - name: entries
      type: object[]
      pointer: /items/*[type=integrale]
      select: all
      entries: *video_card_entries
    - name: entries
      type: object[]
      pointer: /items/*[type=unitaire]
      select: all
      entries: *video_card_entries
    - name: entries
      type: object[]
      pointer: /items/*[type=extrait]
      select: all
      entries: *video_card_entries
    - name: entries
      type: object[]
      pointer: /items/*[type=resume]
      select: all
      entries: *video_card_entries
    - name: entries
      type: object[]
      pointer: /items/*[type=bonus]
      select: all
      entries: *video_card_entries
    - name: entries
      type: object[]
      pointer: /items/*[type=bande-annonce]
      select: all
      entries: *video_card_entries


# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"

  # ---------------------------------------------------------------
  # Home page
  # ---------------------------------------------------------------
  - name: load_home
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{api_mobile}/generic/homepage?platform=apps_tv"
    request_headers: *generic_request_headers
    media_types: *media_types_francetv
    row_pointer: /
    entries:
      - *source_entry
      - name: categories
        type: object[]
        pointer: /collections/*[type=playlist_categories]/items/*
        select: all
        entries:
          - name: key
            type: string
            select: first
            pointer: /url_complete
          - name: label
            type: string
            select: first
            pointer: /label
          - name: image
            type: string
            pointer: /images/*[type=background_16x9]/urls/w:1024
            select: first
          - name: request > name
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: request > source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: request > query_url
            type: string
            select: first
            pointer: /url_complete
            actions: 
              - type: format_text
                argument: "{api_mobile}/apps/categories/{}?platform=apps&page=0"
      - name: sections
        type: object[]
        pointer: /collections/*[type=mise_en_avant]
        select: all
        entries: *section_entries
      - name: sections
        type: object[]
        pointer: /collections/*[type=playlist_mixed]
        select: all
        entries: *section_entries
      - name: sections
        type: object[]
        pointer: /collections/*[type=playlist_top_10]
        select: all
        entries: *section_entries
      - name: sections
        type: object[]
        pointer: /collections/*[type=playlist_program]
        select: all
        entries: *section_entries
      - name: sections
        type: object[]
        pointer: /collections/*[type=playlist_video]
        select: all
        entries: *section_entries


  # ---------------------------------------------------------------
  # Category listing
  # ---------------------------------------------------------------
  - name: get_category
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}{query_separator}"
    request_headers: *generic_request_headers
    media_types: *media_types_francetv
    row_pointer: /
    entries:
      - *source_entry
      - name: sections
        type: object[]
        pointer: /collections/*
        select: all
        entries: *section_entries


  # --------------------------------------------------------------------------
  # Search
  # --------------------------------------------------------------------------
  - name: search
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{api_mobile}/apps/search?platform=apps&filters=with-collections&term={search_terms}"
    request_headers: *generic_request_headers
    media_types: *media_types_francetv
    row_pointer: /
    entries:
      - *source_entry
      - name: have_more
        type: boolean
        actions:
          - type: format_text
            argument: "false"
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=program]
        select: all
        entries: *program_card_entries
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=collection]
        select: all
        entries: *collection_card_entries
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=categorie]
        select: all
        entries: *category_card_entries
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=sous_categorie]
        select: all
        entries: *category_card_entries
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=event]
        select: all
        entries: *event_card_entries
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=integrale]
        select: all
        entries: *video_card_entries
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=unitaire]
        select: all
        entries: *video_card_entries
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=extrait]
        select: all
        entries: *video_card_entries
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=resume]
        select: all
        entries: *video_card_entries
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=bonus]
        select: all
        entries: *video_card_entries
      - name: entries
        type: object[]
        pointer: /collections/*/items/*[type=bande-annonce]
        select: all
        entries: *video_card_entries


  # ---------------------------------------------------------------
  # Entry detail page
  # ---------------------------------------------------------------
  - name: get_entry
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}"
    request_headers: *generic_request_headers
    media_types: *media_types_francetv
    row_pointer: /
    entries:
      - name: title
        type: string
        select: first
        pointer: /item/label
      - name: title
        type: string
        select: first
        pointer: /item/title
      - name: title
        type: string
        select: first
        pointer: /label
      - name: title
        type: string
        select: first
        pointer: /title
      - name: description
        type: string
        select: first
        pointer: /item/description
      - name: description
        type: string
        select: first
        pointer: /item/synopsis
      - name: description
        type: string
        select: first
        pointer: /description
      - name: description
        type: string
        select: first
        pointer: /text
      - name: media-type
        type: string[]
        pointer: /item/category/url_complete
        actions: *actions_francetv_category_media_type
      - name: media-type
        type: string[]
        pointer: /category/url_complete
        actions: *actions_francetv_category_media_type
      - name: media-type
        type: string[]
        pointer: /item/type
        actions: *actions_francetv_item_media_type
      - name: media-type
        type: string[]
        pointer: /type
        actions: *actions_francetv_item_media_type
      - name: link
        type: string
        select: first
        pointer: /item/program_path
        actions: *actions_program_web_link
      - name: link
        type: string
        select: first
        pointer: /path
        actions:
          - type: format_text
            argument: "{base_url}/{}/"
      - name: web-link
        type: string
        select: first
        pointer: /item/program_path
        actions: *actions_program_web_link
      - name: web-link
        type: string
        select: first
        pointer: /path
        actions:
          - type: format_text
            argument: "{base_url}/{}/"
      - name: count-season
        type: number
        select: first
        pointer: /item/number_of_seasons
      - name: count-season
        type: number
        select: first
        pointer: /item/number_of_episodes
      - name: theme
        type: string[]
        pointer: /item/categories/*/label
        select: all
      - name: theme
        type: string[]
        pointer: /item/sub_categories/*/label
        select: all
      - name: theme
        type: string[]
        pointer: /content_has_taxonomys/*/taxonomy/label
        select: all
      - name: director
        type: string[]
        pointer: /item/director
      - name: director
        type: string[]
        pointer: /director
      - name: casting
        type: string[]
        pointer: /item/casting
      - name: casting
        type: string[]
        pointer: /casting
      - name: content-advisor
        type: string
        select: first
        pointer: /item/rating_csa_code
      - name: content-advisor
        type: string
        select: first
        pointer: /content_has_medias/0/media/rating_csa_code
      - name: duration
        type: string
        select: first
        pointer: /content_has_medias/0/media/duration
      - name: players
        type: object[]
        pointer: /content_has_medias/0/media/si_id
        entries:
          - name: name
            type: string
            actions:
              - type: format_text
                argument: "FranceTV"
          - name: resolver > kind
            type: string
            actions:
              - type: format_text
                argument: "francetv-video"
          - name: resolver > stream > kind
            type: string
            actions:
              - type: format_text
                argument: "francetv-license-proxy"
          - name: resolver > target_id
            type: string
      - name: img/poster > link
        type: string
        pointer: /item/images/*[type=vignette_3x4]/urls/w:1024
        select: first
      - name: img/poster > link
        type: string
        pointer: /item/images/*[type=vignette_2x3]/urls/w:2000
        select: first
      - name: img/poster > link
        type: string
        pointer: /item/images/*[type=carre]/urls/w:800
        select: first
      - name: img/landscape > link
        type: string
        pointer: /item/images/*[type=background_16x9]/urls/w:2500
        select: first
      - name: img/landscape > link
        type: string
        pointer: /item/images/*[type=vignette_16x9]/urls/w:1024
        select: first
      - name: img/logo > link
        type: string
        pointer: /item/images/*[type=logo]/urls/w:450
        select: first
      - name: seasons
        type: object[]
        pointer: /collections/*[type=playlist_video]
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /label
          - name: episodes
            type: object[]
            pointer: /items/*[type=integrale]
            select: all
            entries: *episode_entries
          - name: episodes
            type: object[]
            pointer: /items/*[type=unitaire]
            select: all
            entries: *episode_entries
          - name: episodes
            type: object[]
            pointer: /items/*[type=extrait]
            select: all
            entries: *episode_entries
          - name: episodes
