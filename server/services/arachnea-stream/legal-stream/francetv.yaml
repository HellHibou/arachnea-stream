id: francetv
metadata:
  languages: [fr]
  geo_countries: [fr]
  content_types: [movies, series, documentaries]
title: France TV
logo: https://www.france.tv/favicons/favicon-192.png
description:
  fr: "France TV est le groupe audiovisuel public français, offrant une large gamme de contenus télévisés, de films, de séries, de documentaires et d'émissions en ligne. La plateforme de streaming de France TV permet aux utilisateurs d'accéder à leurs programmes préférés en direct ou à la demande, avec une interface conviviale et des fonctionnalités de recherche avancées pour une expérience de visionnage optimale."
http:
  mode: direct
  user_agent_profile: firefox

# ############################################################################
# Constants
# ############################################################################
constants:
  - name: base_url
    value: https://www.france.tv
    description: Public website base URL for france.tv.
  - name: api_mobile
    value: https://api-mobile.yatta.francetv.fr
    description: Mobile/catalog API used by the FranceTV Kodi source.
  - name: api_front
    value: https://api-front.yatta.francetv.fr
    description: Front API used to resolve a Yatta content id into media metadata.
  - name: country_code
    value: FR
    description: Country code passed to the FranceTV playback API.


# ############################################################################
# Shared structs
# ############################################################################
shared:
  media_types_francetv: &media_types_francetv
    - collection
    - video/movie
    - video/show/serie
    - video/show/documentary
    - video/show/sport
    - video/news
    - video/show/other
    - video/live

  generic_request_headers: &generic_request_headers []

  actions_francetv_category_media_type: &actions_francetv_category_media_type
    - type: map
      default: video/show/other
      argument:
        series-et-fictions: video/show/serie
        documentaires: video/show/documentary
        films: video/movie
        societe: video/news
        info: video/news
        sport: video/show/sport
        spectacles-et-culture: video/show/other
        jeux-et-divertissements: video/show/other
        enfants: video/show/other

  actions_francetv_item_media_type: &actions_francetv_item_media_type
    - type: map
      default: video/show/other
      argument:
        integrale: video/show/other
        unitaire: video/show/other
        extrait: video/show/other
        resume: video/show/other
        bonus: video/show/other
        bande-annonce: video/show/other
        program: video/show/other
        collection: video/show/other
        categorie: video/show/other
        sous_categorie: video/show/other
        event: video/show/other
        live: video/live

  actions_program_web_link: &actions_program_web_link
    - type: regex_find_all
      pattern: '^([^_]+)_(.+)$'
      format: "{1}/{2}"
    - type: format_text
      argument: "{base_url}/{}"

  source_entry: &source_entry
    name: source
    type: string
    actions:
      - type: format_text
        argument: "{source}"

  common_image_poster_3x4: &common_image_poster_3x4
    name: img/poster > link
    type: string
    pointer: /images/*[type=vignette_3x4]/urls/w:1024
    select: first

  common_image_poster_2x3: &common_image_poster_2x3
    name: img/poster > link
    type: string
    pointer: /images/*[type=vignette_2x3]/urls/w:2000
    select: first

  common_image_poster_square: &common_image_poster_square
    name: img/poster > link
    type: string
    pointer: /images/*[type=carre]/urls/w:800
    select: first

  common_image_landscape_background: &common_image_landscape_background
    name: img/landscape > link
    type: string
    pointer: /images/*[type=background_16x9]/urls/w:2500
    select: first

  common_image_landscape_thumbnail: &common_image_landscape_thumbnail
    name: img/landscape > link
    type: string
    pointer: /images/*[type=vignette_16x9]/urls/w:1024
    select: first

  common_image_logo: &common_image_logo
    name: img/logo > link
    type: string
    pointer: /images/*[type=logo]/urls/w:450
    select: first

  program_card_entries: &program_card_entries
    - *source_entry
    - name: title
      type: string
      select: first
      pointer: /label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: description
      type: string
      select: first
      pointer: /synopsis
    - name: media-type
      type: string[]
      pointer: /category/url_complete
      actions: *actions_francetv_category_media_type
    - name: media-type
      type: string[]
      pointer: /type
      actions: *actions_francetv_item_media_type
    - name: link
      type: string
      select: first
      pointer: /program_path
      actions:
        - type: format_text
          argument: "{api_mobile}/apps/program/{}?platform=apps&page=0"
    - name: web-link
      type: string
      select: first
      pointer: /program_path
      actions: *actions_program_web_link
    - name: theme
      type: string[]
      pointer: /categories/*/label
      select: all
    - name: theme
      type: string[]
      pointer: /sub_categories/*/label
      select: all
    - name: count-season
      type: number
      select: first
      pointer: /number_of_seasons
    - name: count-season
      type: number
      select: first
      pointer: /number_of_episodes
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo

  collection_card_entries: &collection_card_entries
    - *source_entry
    - name: media-type
      type: string
      actions:
        - type: format_text
          argument: collection
    - name: title
      type: string
      select: first
      pointer: /label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: description
      type: string
      select: first
      pointer: /subtitle
    - name: link
      type: string
      select: first
      pointer: /collection_path
      actions: &francetv_collection_query
        - type: format_text
          argument: "{api_mobile}/apps/collections/{}?platform=apps&page=0"
    - name: theme
      type: string[]
      pointer: /category/label
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo

    - name: request > query_url
      type: string
      select: first
      pointer: /collection_path
      actions: *francetv_collection_query

  # Discovery rails can contain collections alongside programmes. Keep their
  # catalogue API links and expose the corresponding public collection page.
  recommendation_collection_entries: &recommendation_collection_entries
    - *source_entry
    - name: media-type
      type: string
      actions:
        - type: format_text
          argument: collection
    - name: title
      type: string
      select: first
      pointer: /label
    - name: description
      type: string
      select: first
      pointer: /subtitle
    - name: link
      type: string
      select: first
      pointer: /collection_path
      actions: &francetv_recommendation_collection_query
        - type: format_text
          argument: "{api_mobile}/apps/collections/{}?platform=apps&page=0"
    - name: web-link
      type: string
      select: first
      pointer: /collection_path
      actions:
        - type: regex_find_all
          pattern: '^collection_(.+)$'
          format: "{1}"
        - type: format_text
          argument: "{base_url}/collection/{}/"
    - *common_image_poster_3x4
    - *common_image_landscape_thumbnail
    - name: request > query_url
      type: string
      select: first
      pointer: /collection_path
      actions: *francetv_recommendation_collection_query

  category_card_entries: &category_card_entries
    - *source_entry
    - name: media-type
      type: string
      actions:
        - type: format_text
          argument: collection
    - name: title
      type: string
      select: first
      pointer: /label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: description
      type: string
      select: first
      pointer: /synopsis
    - name: link
      type: string
      select: first
      pointer: /url_complete
      actions: &francetv_category_query
        - type: format_text
          argument: "{api_mobile}/apps/sub-categories/{}?platform=apps&page=0"
    - name: web-link
      type: string
      select: first
      pointer: /url_complete
      actions:
        - type: format_text
          argument: "{base_url}/{}"
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo
    - name: request > query_url
      type: string
      select: first
      pointer: /url_complete
      actions: *francetv_category_query

  event_card_entries: &event_card_entries
    - *source_entry
    - name: media-type
      type: string
      actions:
        - type: format_text
          argument: collection
    - name: title
      type: string
      select: first
      pointer: /label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: link
      type: string
      select: first
      pointer: /url_complete
      actions: &francetv_event_query
         - type: format_text
           argument: "{api_mobile}/apps/events/{}?platform=apps&page=0"
    - name: theme
      type: string[]
      pointer: /sub_categories/*/label
      select: all
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo
    - name: request > query_url
      type: string
      select: first
      pointer: /url_complete
      actions: *francetv_event_query

  video_card_entries: &video_card_entries
    - *source_entry
    - name: title
      type: string
      select: first
      pointer: /episode_title
    - name: title
      type: string
      select: first
      pointer: /title
    - name: title/alt
      type: string
      select: first
      pointer: /program/label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: description
      type: string
      select: first
      pointer: /text
    - name: media-type
      type: string[]
      pointer: /category/url_complete
      actions: *actions_francetv_category_media_type
    - name: media-type
      type: string[]
      pointer: /type
      actions: *actions_francetv_item_media_type
    - name: link
      type: string
      select: first
      pointer: /id
      actions: 
        - type: format_text
          argument: "{api_front}/standard/publish/contents/{}"
    - name: duration
      type: string
      select: first
      pointer: /duration
    - name: content-advisor
      type: string
      select: first
      pointer: /rating_csa
    - name: content-advisor
      type: string
      select: first
      pointer: /rating_csa_code
    - name: theme
      type: string[]
      pointer: /category/label
    - name: theme
      type: string[]
      pointer: /sub_categories/*/label
      select: all
    - name: channel
      type: string
      select: first
      pointer: /channel/label
    - name: director
      type: string[]
      pointer: /director
    - name: casting
      type: string[]
      pointer: /casting
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo

  episode_entries: &episode_entries
    - name: title
      type: string
      select: first
      pointer: /episode_title
    - name: title
      type: string
      select: first
      pointer: /title
    - name: title/alt
      type: string
      select: first
      pointer: /program/label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: duration
      type: string
      select: first
      pointer: /duration
    - name: season-name
      type: string
      select: first
      pointer: /season
      actions:
        - type: format_text
          argument: "Season {}"
    - name: episode-number
      type: number
      select: first
      pointer: /episode
    - name: content-advisor
      type: string
      select: first
      pointer: /rating_csa
    - name: content-advisor
      type: string
      select: first
      pointer: /rating_csa_code
    - name: channel
      type: string
      select: first
      pointer: /channel/label
    - name: link
      type: string
      select: first
      pointer: /id
      actions:
        - type: format_text
          argument: "{api_front}/standard/publish/contents/{}"
    - name: players
      type: object[]
      pointer: /si_id
      entries:
        - name: name
          type: string
          actions:
            - type: format_text
              argument: "FranceTV"
        - name: resolver > kind
          type: string
          actions:
            - type: format_text
              argument: "francetv-video"
        - name: resolver > target_id
          type: string
    - name: img/preview > link
      type: string
      pointer: /images/*[type=vignette_16x9]/urls/w:1024
      select: first
    - name: img/poster > link
      type: string
      pointer: /images/*[type=vignette_3x4]/urls/w:1024
      select: first

  catalog_card_entries: &catalog_card_entries
    - *source_entry
    - name: title
      type: string
      select: first
      pointer: /label
    - name: title
      type: string
      select: first
      pointer: /episode_title
    - name: title
      type: string
      select: first
      pointer: /title
    - name: title/alt
      type: string
      select: first
      pointer: /program/label
    - name: description
      type: string
      select: first
      pointer: /description
    - name: description
      type: string
      select: first
      pointer: /synopsis
    - name: description
      type: string
      select: first
      pointer: /subtitle
    - name: description
      type: string
      select: first
      pointer: /text
    - name: media-type
      type: string[]
      actions:
        - type: build_url
          base: "{kind}|{live}|{category}"
          fields:
            kind: /type
            live: /is_live
            category: /category/url_complete
        - type: regex_replace_all
          pattern: '^.*\|true\|.*$'
          replacement: video/live
        - type: regex_replace_all
          pattern: '^(collection|categorie|sous_categorie|event)\|.*$'
          replacement: collection
        - type: regex_replace_all
          pattern: '^[^|]*\|[^|]*\|(.+)$'
          replacement: '$1'
        - type: map
          argument:
            collection: collection
            video/live: video/live
            series-et-fictions: video/show/serie
            documentaires: video/show/documentary
            films: video/movie
            societe: video/news
            info: video/news
            sport: video/show/sport
          default: video/show/other
    - name: link
      type: string
      select: first
      actions:
        - type: build_url
          base: "{kind}|{collection}|{program}|{path}|{id}|{api_mobile}|{api_front}"
          fields:
            kind: /type
            collection: /collection_path
            program: /program_path
            path: /url_complete
            id: /id
        - type: regex_replace_all
          pattern: '^collection\|([^|]+)\|[^|]*\|[^|]*\|[^|]*\|([^|]+)\|.*$'
          replacement: '$2/apps/collections/$1?platform=apps&page=0'
        - type: regex_replace_all
          pattern: '^program\|[^|]*\|([^|]+)\|[^|]*\|[^|]*\|([^|]+)\|.*$'
          replacement: '$2/apps/program/$1?platform=apps&page=0'
        - type: regex_replace_all
          pattern: '^(categorie|sous_categorie)\|[^|]*\|[^|]*\|([^|]+)\|[^|]*\|([^|]+)\|.*$'
          replacement: '$3/apps/sub-categories/$2?platform=apps&page=0'
        - type: regex_replace_all
          pattern: '^event\|[^|]*\|[^|]*\|([^|]+)\|[^|]*\|([^|]+)\|.*$'
          replacement: '$2/apps/events/$1?platform=apps&page=0'
        - type: regex_replace_all
          pattern: '^(integrale|unitaire|extrait|resume|bonus|bande-annonce)\|[^|]*\|[^|]*\|[^|]*\|([^|]+)\|[^|]*\|([^|]+)$'
          replacement: '$3/standard/publish/contents/$2'
        - type: regex_find_all
          pattern: '^(https://[^|{}]+)$'
          format: '{1}'
    - name: request > query_url
      type: string
      select: first
      actions:
        - type: build_url
          base: "{kind}|{collection}|{path}|{api_mobile}"
          fields:
            kind: /type
            collection: /collection_path
            path: /url_complete
        - type: regex_replace_all
          pattern: '^collection\|([^|]+)\|[^|]*\|([^|]+)$'
          replacement: '$2/apps/collections/$1?platform=apps&page=0'
        - type: regex_replace_all
          pattern: '^(categorie|sous_categorie)\|[^|]*\|([^|]+)\|([^|]+)$'
          replacement: '$3/apps/sub-categories/$2?platform=apps&page=0'
        - type: regex_replace_all
          pattern: '^event\|[^|]*\|([^|]+)\|([^|]+)$'
          replacement: '$2/apps/events/$1?platform=apps&page=0'
        - type: regex_find_all
          pattern: '^(https://[^|{}]+)$'
          format: '{1}'
    - name: request > channel
      type: string
      select: first
      actions: &catalog_live_target
        - type: build_url
          base: "{live}|{id}"
          fields:
            live: /is_live
            id: /si_id
        - type: regex_find_all
          pattern: '^true\|([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
          format: '{1}'
    - name: link
      type: string
      select: first
      actions: *catalog_live_target
    - name: web-link
      type: string
      select: first
      pointer: /program_path
      actions: *actions_program_web_link
    - name: web-link
      type: string
      select: first
      pointer: /collection_path
      actions:
        - type: regex_find_all
          pattern: '^collection_(.+)$'
          format: '{base_url}/collection/{1}/'
    - name: duration
      type: string
      select: first
      pointer: /duration
    - name: theme
      type: string[]
      pointer: /category/label
    - name: theme
      type: string[]
      pointer: /categories/*/label
      select: all
    - name: theme
      type: string[]
      pointer: /sub_categories/*/label
      select: all
    - name: count-season
      type: number
      select: first
      pointer: /number_of_seasons
    - name: count-season
      type: number
      select: first
      pointer: /number_of_episodes
    - name: channel
      type: string
      select: first
      pointer: /channel/label
    - name: director
      type: string[]
      pointer: /director
    - name: casting
      type: string[]
      pointer: /casting
    - name: content-advisor
      type: string
      select: first
      pointer: /rating_csa
    - name: content-advisor
      type: string
      select: first
      pointer: /rating_csa_code
    - *common_image_poster_3x4
    - *common_image_poster_2x3
    - *common_image_poster_square
    - *common_image_landscape_background
    - *common_image_landscape_thumbnail
    - *common_image_logo

  section_entries: &section_entries
    - name: key
      type: string
      select: first
      pointer: /type
      actions:
        - type: map
          argument: {live: 'rail:live-channels'}
          default: null
    - name: key
      type: string
      select: first
      pointer: /id
      actions:
        - type: format_text
          argument: "rail:{}"
    - name: label
      type: string
      select: first
      pointer: /label
    - name: have_more
      type: boolean
      select: first
      actions:
        - type: format_text
          argument: "false"
    - name: entries
      type: object[]
      pointer: /items/*
      select: all
      entries: *catalog_card_entries


# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: metadata
        type: object
        value: "{service_metadata}"
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"

  # ---------------------------------------------------------------
  # Home page
  # ---------------------------------------------------------------
  - name: load_home
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{api_mobile}/generic/homepage?platform=apps_tv"
    request_headers: *generic_request_headers
    media_types: *media_types_francetv
    row_pointer: /
    entries:
      - *source_entry
      - name: categories
        type: object[]
        pointer: /collections/*[type=playlist_categories]/items/*
        select: all
        entries:
          - name: key
            type: string
            select: first
            pointer: /url_complete
          - name: label
            type: string
            select: first
            pointer: /label
          - name: image
            type: string
            pointer: /images/*[type=background_16x9]/urls/w:1024
            select: first
          - name: request > name
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: request > source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: request > query_url
            type: string
            select: first
            pointer: /url_complete
            actions: 
              - type: format_text
                argument: "{api_mobile}/apps/categories/{}?platform=apps&page=0"
      - name: sections
        type: object[]
        pointer: /collections/*[type=mise_en_avant]
        select: all
        entries: *section_entries
      - name: sections
        type: object[]
        pointer: /collections/*[type=playlist_mixed]
        select: all
        entries: *section_entries
      - name: sections
        type: object[]
        pointer: /collections/*[type=playlist_top_10]
        select: all
        entries: *section_entries
      - name: sections
        type: object[]
        pointer: /collections/*[type=playlist_program]
        select: all
        entries: *section_entries
      - name: sections
        type: object[]
        pointer: /collections/*[type=playlist_video]
        select: all
        entries: *section_entries
      - name: sections
        type: object[]
        pointer: /collections/*[type=live]
        select: all
        entries: *section_entries
      - name: sections
        type: object[]
        pointer: /collections/*[type=playlist_collection]
        select: all
        entries: *section_entries


  # ---------------------------------------------------------------
  # Category listing
  # ---------------------------------------------------------------
  - name: get_category
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}{query_separator}"
    request_headers: *generic_request_headers
    media_types: *media_types_francetv
    row_pointer: /
    entries:
      - *source_entry
      - name: categories
        type: object[]
        pointer: /collections/*/items/*[type=categorie]
        select: all
        entries:
          - *source_entry
          - name: key
            type: string
            select: first
            pointer: /url_complete
          - name: label
            type: string
            select: first
            pointer: /label
          - name: image
            type: string
            pointer: /images/*[type=background_16x9]/urls/w:1024
            select: first
          - name: request > name
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: request > source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: request > query_url
            type: string
            select: first
            pointer: /url_complete
            actions:
              - type: format_text
                argument: "{api_mobile}/apps/sub-categories/{}?platform=apps&page=0"
      - name: categories
        type: object[]
        pointer: /collections/*/items/*[type=sous_categorie]
        select: all
        entries:
          - *source_entry
          - name: key
            type: string
            select: first
            pointer: /url_complete
          - name: label
            type: string
            select: first
            pointer: /label
          - name: image
            type: string
            pointer: /images/*[type=background_16x9]/urls/w:1024
            select: first
          - name: request > name
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: request > source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: request > query_url
            type: string
            select: first
            pointer: /url_complete
            actions:
              - type: format_text
                argument: "{api_mobile}/apps/sub-categories/{}?platform=apps&page=0"
      - name: sections
        type: object[]
        pointer: /collections/*
        select: all
        entries: *section_entries


