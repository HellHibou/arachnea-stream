  # ---------------------------------------------------------------
  # Search
  # ---------------------------------------------------------------
  - name: search
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{graphql_url}?id=eb07383bb0a758366983a970b6b9c633a5639e1f&variables=%7B%22query%22%3A%22{search_terms}%22%2C%22programsLimit%22%3A{search_program_limit}%2C%22videosLimit%22%3A{search_video_limit}%7D"
    request_headers: *generic_request_headers
    media_types: *media_types_tf1
    row_pointer: /
    entries:
      - name: have_more
        type: boolean
        actions:
          - type: format_text
            argument: "false"
      - name: entries
        type: object[]
        pointer: /data/sliderOfSearchPrograms/items/*
        select: all
        entries:
          - name: source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: title
            type: string
            select: first
            pointer: /program/name
          - name: description
            type: string
            select: first
            pointer: /program/decoration/description
          - name: theme
            type: string[]
            pointer: /program/topics/*
            select: all
          - name: media-type
            type: string[]
            pointer: /program/typology
            actions: *actions_typology_media_type
          - name: link
            type: string
            actions:
              - type: build_url
                base: "{smarttv_api_root}?id=379fec96081ab1a2&variables=%7B%22programId%22%3A%22{id}%22%7D&programSlug={slug}&channel={channel}"
                fields:
                  id: /program/id
                  slug: /program/slug
                  channel: /program/mainChannel/slug
          - name: web-link
            type: string
            actions:
              - type: build_url
                base: "{base_url}/{channel}/{slug}"
                fields:
                  slug: /program/slug
                  channel: /program/mainChannel/slug
          - name: img/poster > link
            type: string
            select: first
            pointer: /program/decoration/image/sourcesWithScales/0/url
          - name: img/portrait > link
            type: string
            select: first
            pointer: /program/decoration/portrait/sourcesWithScales/0/url
          - name: img/landscape > link
            type: string
            select: first
            pointer: /program/decoration/thumbnail/sourcesWithScales/0/url
      - name: entries
        type: object[]
        pointer: /data/sliderOfSearchVideos/items/*
        select: all
        entries:
          - name: source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: title
            type: string
            select: first
            pointer: /video/decoration/label
          - name: description
            type: string
            select: first
            pointer: /video/decoration/shortLabel
          - name: theme
            type: string[]
            pointer: /video/program/topics/*
            select: all
          - name: media-type
            type: string[]
            pointer: /video/program/typology
            actions: *actions_typology_media_type
          - name: link
            type: string
            actions:
              - type: build_url
                base: "{smarttv_api_root}?id=379fec96081ab1a2&variables=%7B%22programId%22%3A%22{id}%22%7D&programSlug={slug}&channel={channel}"
                fields:
                  id: /video/program/id
                  slug: /video/program/slug
                  channel: /video/program/mainChannel/slug
          - name: web-link
            type: string
            actions:
              - type: build_url
                base: "{base_url}/{channel}/{slug}"
                fields:
                  slug: /video/program/slug
                  channel: /video/program/mainChannel/slug
          - name: img/landscape > link
            type: string
            select: first
            pointer: /video/decoration/image/sourcesWithScales/0/url


  # ---------------------------------------------------------------
  # Entry / detail page
  # ---------------------------------------------------------------
  - name: get_entry
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}"
    request_headers: *generic_request_headers
    media_types: *media_types_tf1
    row_pointer: /data/programById
    entries:
      - name: title
        type: string
        select: first
        pointer: decoration/label
      - name: description
        type: string
        select: first
        pointer: decoration/description
      - name: media-type
        type: string[]
        pointer: typology
        actions: *actions_typology_media_type
      - name: language
        type: string[]
        pointer: hasDescriptionTrack/total
        actions:
          - type: map
            default: AD
            argument:
              0: ""
      - name: subtitles
        type: string
        select: first
        pointer: hasFrenchDeafSubtitles/total
        actions:
          - type: map
            default: VF
            argument:
              0: ""
      - name: subtitles
        type: string
        select: first
        pointer: hasFrenchSubtitles/total
        actions:
          - type: map
            default: VF
            argument:
              0: ""
      - name: link
        type: string
        actions:
          - type: get_request_url
          - type: regex_find_all
            pattern: '[?&]programSlug=([^&]+).*?[?&]channel=([^&]+)'
            format: '{2}/{1}'
          - type: format_text
            argument: "{base_url}/{}"
      - name: web-link
        type: string
        actions:
          - type: get_request_url
          - type: regex_find_all
            pattern: '[?&]programSlug=([^&]+).*?[?&]channel=([^&]+)'
            format: '{2}/{1}'
          - type: format_text
            argument: "{base_url}/{}"
      - name: img/logo > link
        type: string
        select: first
        pointer: decoration/logoImage/logo/0/url
      - name: img/logo > link
        type: string
        select: first
        pointer: decoration/logo/logo/0/url
      - name: img/poster > link
        type: string
        select: first
        pointer: decoration/image/sourcesWithScales/0/url
      - name: count-season
        type: number
        select: first
        pointer: decoration/subLabel
        actions:
          - type: regex_find_all
            pattern: '([0-9]+)'
            format: '{1}'
      - name: theme
        type: string[]
        pointer: topics/*
        select: all
      - name: director
        type: string[]
        pointer: editorialSections/*/directors/*/members/*
        select: all
        actions:
          - type: regex_find_all
            pattern: '"firstName":"([^"]*)","lastName":"([^"]*)"'
            format: "{1} {2}"
      - name: casting
        type: string[]
        pointer: editorialSections/*/actors/*/members/*
        select: all
        actions:
          - type: regex_find_all
            pattern: '"firstName":"([^"]*)","lastName":"([^"]*)"'
            format: "{1} {2}"
      - name: program-id
        type: string
        select: first
        pointer: /id
      - name: seasons
        type: object[]
        pointer: /editorialSections/*/lists/*
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /decoration/label
          - name: link
            type: string
            select: first
            pointer: /id
            actions:
              - type: format_text
                argument: "{request_url}|||{}"
              - type: regex_find_all
                pattern: 'programSlug=([^&]+).*\|\|\|([^|]+)$'
                format: '{graphql_url}?id=76bc5c35edb166fa637a6c6686cb05c7140d2a8b&variables=%7B%22programSlug%22%3A%22{1}%22%2C%22listId%22%3A%22{2}%22'
    sub_queries:
      - scraper_type: json
        context_pointer: /editorialSections/*/lists/0/id
        request_actions:
          - type: format_text
            argument: "{request_url}|||{}"
          - type: regex_find_all
            pattern: 'programSlug=([^&]+).*\|\|\|([^|]+)$'
            format: '{graphql_url}?id=76bc5c35edb166fa637a6c6686cb05c7140d2a8b&variables=%7B%22programSlug%22%3A%22{1}%22%2C%22listId%22%3A%22{2}%22%2C%22offset%22%3A0%2C%22limit%22%3A1%7D'
        row_pointer: /data/programBySlug/editorialSections/*/listById/items/0/video
        entries:
          - name: video/trailer
            type: string
            select: first
            pointer: /decoration/preview/sourcesWithScales/0/url
          - name: players
            type: object[]
            entries:
              - name: web-link
                type: string
                actions:
                  - type: build_url
                    base: "{base_url}/{channel}/{program_slug}/videos/{slug}.html"
                    fields:
                      channel: /program/mainChannel/slug
                      program_slug: /program/slug
                      slug: /slug
              - name: resolver
                type: object
                select: first
                entries:
                  - name: kind
                    type: string
                    actions:
                      - type: format_text
                        argument: tf1-video
                  - name: target_id
                    type: string
                    select: first
                    pointer: /id
      # Some program pages expose a playable video without an editorial list.
      - scraper_type: json
        request_actions:
          - type: format_text
            argument: "{request_url}"
          - type: regex_find_all
            pattern: '^https?://smart-tv\.tf1\.fr/catalog/([^/]+)/smarttv\?.*[?&]programSlug=([^&]+)'
            format: 'https://www.tf1.fr/graphql/{1}/web?id=eb07383bb0a758366983a970b6b9c633a5639e1f&variables=%7B%22query%22%3A%22{2}%22%2C%22programsLimit%22%3A0%2C%22videosLimit%22%3A1%7D'
        request_headers: *generic_request_headers
        row_pointer: /data/sliderOfSearchVideos/items/0/video
        entries:
          - name: video/trailer
            type: string
            select: first
            pointer: /decoration/preview/sourcesWithScales/0/url
          - name: players
            type: object[]
            entries:
              - name: web-link
                type: string
                actions:
                  - type: build_url
                    base: "{base_url}/{channel}/{program_slug}/videos/{slug}.html"
                    fields:
                      channel: /program/mainChannel/slug
                      program_slug: /program/slug
                      slug: /slug
              - name: resolver
                type: object
                select: first
                entries:
                  - name: kind
                    type: string
                    actions:
                      - type: format_text
                        argument: tf1-video
                  - name: target_id
                    type: string
                    select: first
                    pointer: /id


