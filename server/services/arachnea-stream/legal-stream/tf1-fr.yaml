          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{graphql_url}?id=483ce0f&variables=%7B%22context%22%3A%7B%22persona%22%3A%22PERSONA_2%22%2C%22application%22%3A%22WEB%22%2C%22device%22%3A%22DESKTOP%22%2C%22os%22%3A%22WINDOWS%22%7D%2C%22filter%22%3A%7B%22channel%22%3A%22{channel}%22%7D%2C%22offset%22%3A{offset}%2C%22limit%22%3A{page_size}%7D"
