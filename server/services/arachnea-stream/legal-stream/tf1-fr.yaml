# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"
        

  # ---------------------------------------------------------------
  # Home page
  # ---------------------------------------------------------------
  - name: load_home
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{android_home_sliders_url}"
    request_headers: *android_request_headers
    http:
      user_agent: "Mozilla/5.0 (Linux; Android 13) Arachnea/1.0"
    media_types: *media_types_tf1
    row_pointer: /
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - *load_home_category_tf1
      - *load_home_category_tmc
      - *load_home_category_tfx
      - *load_home_category_tf1_series_films
      - *load_home_category_lci
      - *load_home_category_all
      - name: sections
        type: object[]
        pointer: /data/homeSliders/*[__typename=SliderOfTopProgram]
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /decoration/label
          - name: entries
            type: object[]
            pointer: /items/*[__typename=TopProgramItem]
            select: all
            entries: *android_home_item_entries
          - name: entries
            type: object[]
            pointer: /items/*[__typename=ProgramItem]
            select: all
            entries: *android_home_item_entries
          - name: entries
            type: object[]
            pointer: /items/*[__typename=VideoItem]
            select: all
            entries: *android_home_video_item_entries
      - name: sections
        type: object[]
        pointer: /data/homeSliders/*[__typename=SliderOfProgram]
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /decoration/label
          - name: entries
            type: object[]
            pointer: /items/*[__typename=TopProgramItem]
            select: all
            entries: *android_home_item_entries
          - name: entries
            type: object[]
            pointer: /items/*[__typename=ProgramItem]
            select: all
            entries: *android_home_item_entries
          - name: entries
            type: object[]
            pointer: /items/*[__typename=VideoItem]
            select: all
            entries: *android_home_video_item_entries
      - name: sections
        type: object[]
        pointer: /data/homeSliders/*[__typename=SliderOfVideo]
        select: all
        entries:
          - name: label
            type: string
            select: first
            pointer: /decoration/label
          - name: entries
            type: object[]
            pointer: /items/*[__typename=TopProgramItem]
            select: all
            entries: *android_home_item_entries
          - name: entries
            type: object[]
            pointer: /items/*[__typename=ProgramItem]
            select: all
            entries: *android_home_item_entries
          - name: entries
            type: object[]
            pointer: /items/*[__typename=VideoItem]
            select: all
            entries: *android_home_video_item_entries
      - name: banners > entries
        type: object[]
        pointer: /data/homeSliders/*[__typename=BannerOfProgram]
        select: all
        entries:
          - name: key
            type: string
            select: first
            pointer: /id
          - name: title
            type: string
            select: first
            pointer: /decoration/label
          - name: description
            type: string
            select: first
            pointer: /bannerDecoration/catchPhrase
          - name: image
            type: string
            select: first
            pointer: /bannerDecoration/tabletBannerImg/sourcesWithScales/0/src
            actions: *actions_android_photo_url
          - name: logo
            type: string
            select: first
            pointer: /bannerDecoration/logoImg/sourcesWithScales/0/src
            actions: *actions_android_photo_url
          - name: link
            type: string
            actions:
              - type: build_url
                base: "{smarttv_api_root}?id=379fec96081ab1a2&variables=%7B%22programId%22%3A%22{id}%22%7D&programSlug={slug}&channel={channel}"
                fields:
                  id: /program/id
                  slug: /program/slug
                  channel: /program/mainChannel/slug
          - name: web-link
            type: string
            actions:
              - type: build_url
                base: "{base_url}/{channel}/{slug}"
                fields:
                  slug: /program/slug
                  channel: /program/mainChannel/slug
    
  # ---------------------------------------------------------------
  # Category listing
  # ---------------------------------------------------------------
  - name: get_category
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{graphql_url}?id=483ce0f&variables=%7B%22context%22%3A%7B%22persona%22%3A%22PERSONA_2%22%2C%22application%22%3A%22WEB%22%2C%22device%22%3A%22DESKTOP%22%2C%22os%22%3A%22WINDOWS%22%7D%2C%22filter%22%3A%7B%22channel%22%3A%22{channel}%22%7D%2C%22offset%22%3A{offset}%2C%22limit%22%3A{page_size}%7D"
    request_headers: *generic_request_headers
