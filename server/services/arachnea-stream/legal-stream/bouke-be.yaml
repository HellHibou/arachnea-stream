  # --------------------------------------------------------------------------
  # Get live stream — the Drupal settings JSON of `/direct` carries the
  # `live_token` used by the Freecaster embed, whose JSON then exposes the HLS
  # live manifest at `/video/src`.
  # --------------------------------------------------------------------------
  - name: get_live
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}/direct"
    media_types:
      - video/live
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: title
        type: string
        actions:
          - type: format_text
            argument: "Bouké"
      - name: players
        type: object[]
        entries:
          - name: name
            type: string
            actions:
              - type: format_text
                argument: "Bouké"
          - name: direct-link
            type: string
            actions:
              - type: get_response_body
              - type: regex_find_all
                pattern: '"live_token"\s*:\s*"([^"]+)"'
                format: "{player_base_url}/embed/{1}.json"
            sub_queries:
              - scraper_type: json
                row_pointer: "/video/src"
                entries:
                  - name: direct-link
                    type: string
                    select: first
                    pointer: "/*[type=application/x-mpegurl]/src"

