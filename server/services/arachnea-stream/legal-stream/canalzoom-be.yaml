id: canalzoom-be
title: Canal Zoom
logo: "https://www.canalzoom.be/sites/default/files/logo3.png"
description:
  fr: "Canal Zoom est la télévision locale de Gembloux, Chastre, Perwez et Walhain, accessible en direct et en replay sur son site web."
http:
  mode: auto
  user_agent_profile: firefox


# ############################################################################
# Parameters
# ############################################################################
parameters:
  - name: base_url
    value: https://www.canalzoom.be
    description: "Base URL — update on domain change"
  - name: player_base_url
    value: https://tvlocales-player.freecaster.com
    description: "Freecaster player JSON base URL"


# ############################################################################
# Shared structs
# ############################################################################
shared:
  media_types_canalzoom: &media_types_canalzoom
    - video/show/other
    - video/show/serie
    - video/show/documentary
    - video/show/sport
    - video/news
    - video/other
    - video/live

  media_type_category_map: &media_type_category_map
    ~: video/show/other
    Actu: video/news
    Culture: video/show/documentary
    Sport: video/show/sport

  # Card category label (`div.bullet … div.field-item`) → media type. Labels
  # outside the known categories (sub-categories such as Basketball or Football,
  # "Émissions", …) keep their own label through the generic
  # `video/other/<label>` media-type form that the frontend displays verbatim.
  actions_card_category_media_type: &actions_card_category_media_type
    - type: get_text
    - type: map
      argument: *media_type_category_map
      default: "video/other/{}"

  # Entry pages have no category bullet: the taxonomy label only lives in the
  # `article:tag` meta tags, mixed with town and programme labels, so the
  # response body is scanned for the known categories. The `~` key of the shared
  # map keeps `video/show/other` for pages without any category tag (for instance
  # `/emission/<slug>` programme pages).
  actions_entry_category_media_type: &actions_entry_category_media_type
    - type: get_response_body
    - type: regex_find_all
      pattern: 'property="article:tag"[^>]*content="(Actu|Culture|Sport)"'
      format: "{1}"
    - type: map
      argument: *media_type_category_map

  actions_get_href_resolve: &actions_get_href_resolve
    - type: get_attribut
      argument: href
    - type: resolve_url

  actions_get_src_resolve: &actions_get_src_resolve
    - type: get_attribut
      argument: src
    - type: resolve_url

  # Featured rail cards (`paragraph--type--feat-content`, e.g. Actu / Sport /
  # Culture): the rail title lives in
  # `.field-paragraph--field-feat-content-title` and the "see all" link in
  # `.field-paragraph--field-feat-content-link a`. The lead story uses
  # `view-mode-content_spotlight_w_half` with a dedicated spotlight block
  # while the following stories use smaller spotlight view modes with no
  # `div.content` block, so card fields are anchored generically (`h2 span`
  # title, `time` date, `a.overlink` link). The rails mix video and text
  # articles and only videos get the `camera-icon` class on their
  # `div.view-mode-* > div.content-media` wrapper (the text-only article keeps
  # a plain `div.content-media`), so `:has()` restricts the row selector to
  # video cards. `article[id]` only matches the outer card articles, not the
  # nested bare `<article>` media wrappers.
  entries_feat_card: &entries_feat_card
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "h2 span"
      actions:
        - type: get_text
    - name: title
      type: string
      select: first
      selector: "h2"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: release-date
      type: string
      select: first
      selector: "time[datetime]"
      actions:
        - type: get_attribut
          argument: datetime
        - type: get_date
          format: yyyy_mm_dd
    - name: release-date
      type: string
      select: first
      selector: "time"
      actions:
        - type: get_text
        - type: regex_find_all
          pattern: '(\d{2}/\d{2}/\d{4})'
          format: "{1}"
        - type: get_date
          format: dd_mm_yyyy
    - name: img/landscape > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/other"
    # Category-aware override: `select: first` replaces the generic value as soon
    # as the card exposes its category bullet.
    - name: media-type
      type: string[]
      select: first
      selector: "div.bullet div.field-item"
      actions: *actions_card_category_media_type

  # Suggestion cards (`paragraph--type--recommendation`, "Nos suggestions") use
  # `div.view-mode-editor_suggestion`: title in `h3 span`, publication date as
  # `time` text plus `datetime` attribute, synopsis in
  # `.field-type-text-with-summary` and the card link on `a.overlink`.
  entries_suggestion_card: &entries_suggestion_card
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "h3 span"
      actions:
        - type: get_text
    - name: title
      type: string
      select: first
      selector: "h3"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: description
      type: string
      select: first
      selector: "div.field-type-text-with-summary div.field-item"
      actions:
        - type: get_text
    - name: release-date
      type: string
      select: first
      selector: "time[datetime]"
      actions:
        - type: get_attribut
          argument: datetime
        - type: get_date
          format: yyyy_mm_dd
    - name: release-date
      type: string
      select: first
      selector: "time"
      actions:
        - type: get_text
        - type: regex_find_all
          pattern: '(\d{2}/\d{2}/\d{4})'
          format: "{1}"
        - type: get_date
          format: dd_mm_yyyy
    - name: img/landscape > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/other"

  # Taxonomy listing cards (`/actu`, `/culture`, `/sport`) are
  # `article.teaser-item` rows exposing a real `div.content` block: category
  # bullet, `<time>` text date, `h2 span` title, the summary field and an
  # `a.overlink` card link. Those listings also mix video and text articles,
  # and only videos carry the `camera-icon` class on the
  # `div.view-mode-* > div.teaser-item` media wrapper, so the rows are
  # filtered with `:has()` to keep playable cards only.
  entries_video_card: &entries_video_card
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "div.content h2 span"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: description
      type: string
      select: first
      selector: "div.content div.field-type-text-with-summary div.field-item"
      actions:
        - type: get_text
    - name: release-date
      type: string
      select: first
      selector: "div.content time"
      actions:
        - type: get_text
        - type: regex_find_all
          pattern: '(\d{2}/\d{2}/\d{4})'
          format: "{1}"
        - type: get_date
          format: dd_mm_yyyy
    - name: img/landscape > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/other"
    # Category-aware override: `select: first` replaces the generic value as soon
    # as the card exposes its category bullet.
    - name: media-type
      type: string[]
      select: first
      selector: "div.bullet div.field-item"
      actions: *actions_card_category_media_type

  # The `/emissions` index lists programs as `div.view-mode-portrait` cards
  # with a portrait title (`h4 a span`) and a program link (`a.overlink` to
  # `/emission/<slug>`). No date or plot is exposed there, and the same card
  # shape is reused by the home programme teaser rail.
  entries_program_card: &entries_program_card
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "h4 a span"
      actions:
        - type: get_text
    - name: title
      type: string
      select: first
      selector: "h4 a"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: img/poster > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/serie"

  # Episode cards (`div.view-episode`) reuse the listing card shape, but the
  # publication date only exists as the `time[datetime]` attribute and the
  # duration is prepended to the `time` text ("15 min - publié le …").
  entries_episode_card: &entries_episode_card
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "div.content h2 span"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
      # The teaser card does not carry the synopsis, so each episode page is
      # fetched once. `target: parent` keeps `link` and merges the extracted
      # fields next to it, as required by the entry sub-query contract.
      sub_queries:
        - scraper_type: html
          target: parent
          row_selector: "html"
          entries:
            - name: description
              type: string
              select: first
              selector: "meta[property='og:description']"
              actions:
                - type: get_attribut
                  argument: content
    - name: web-link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: release-date
      type: string
      select: first
      selector: "time[datetime]"
      actions:
        - type: get_attribut
          argument: datetime
        - type: get_date
          format: yyyy_mm_dd
    - name: duration
      type: string
      select: first
      selector: "div.content time"
      actions:
        - type: get_text
        - type: regex_find_all
          pattern: '(\d+\s*min)'
          format: "{1}"
    - name: img/preview > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/other"

  # Both `get_entry` and `get_players` resolve the same Freecaster player: a
  # playable replay page carries `div.freecaster-player[data-video-id]`, and
  # the player JSON exposes every rendition at `/video/src`.
  entry_players_freecaster: &entry_players_freecaster
    name: players
    type: object[]
    entries:
      - name: name
        type: string
        actions:
          - type: format_text
            argument: "Canal Zoom"
      - name: direct-link
        type: string
        select: first
        selector: "div.freecaster-player"
        actions:
          - type: get_attribut
            argument: data-video-id
          - type: format_text
            argument: "{player_base_url}/embed/{}.json"
        sub_queries:
          - scraper_type: json
            row_pointer: "/video/src"
            entries:
              - name: direct-link
                type: string
                select: first
                pointer: "/*[type=application/x-mpegurl]/src"
      - name: web-link
        type: string
        actions:
          - type: format_text
            argument: "{query_url}"

# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
        actions:
          - type: resolve_url
      - name: description
        type: object
        value: "{service_description}"


  # --------------------------------------------------------------------------
  # Home page — categories plus the three featured rails, the suggestion rail
  # and the programme teaser rail. Featured paragraphs
  # (`paragraph--type--feat-content`, e.g. Actu / Sport / Culture) expose
  # their rail title in `.field-paragraph--field-feat-content-title`, their
  # "see all" link in `.field-paragraph--field-feat-content-link a` and their
  # cards as `article[id]` (the lead story and the smaller spotlights share
  # the same generic `h2` / `time` / `a.overlink` shape) and keep only the
  # cards whose media wrapper carries the `camera-icon` class, since the rails
  # also advertise text-only articles.
  # --------------------------------------------------------------------------
  - name: load_home
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}"
    media_types: *media_types_canalzoom
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"

      # Main navigation entries are the browsable categories consumed by
      # `get_category`.
      - name: categories
        type: object[]
        selector: "nav#block-main-nav-page ul[block='block-main-nav-page'] li a"
        select: all
        entries:
          - name: key
            type: string
            actions:
              - type: get_attribut
                argument: href
              - type: regex_replace_all
                pattern: "^.*/([^/]+)/?$"
                replacement: "$1"
          - name: label
            type: string
            actions:
              - type: get_text
          - name: link
            type: string
            actions: *actions_get_href_resolve
          - name: request > query_url
            type: string
            actions: *actions_get_href_resolve

#      - name: localities
#        type: string
#        actions:
#          - type: format_text
#            argument: "{base_url}/liste-localite"
#        sub_queries:
#          - scraper_type: html
#            target: parent
#            row_selector: "div#block-tv-theme-content div.locality-list a[href^='/commune/']"
#            entries:
#              - name: categories
#                type: object[]
#                entries:
#                  - name: key
#                    type: string
#                    actions:
#                      - type: get_attribut
#                        argument: href
#                      - type: regex_replace_all
#                        pattern: "^.*/([^/]+)/?$"
#                        replacement: "$1"
#                  - name: label
#                    type: string
#                    actions:
#                      - type: get_text
#                      - type: map
#                        default: "{}"
#                        argument:     
#                          "Nos communes": "Toutes les communes"                     
#                  - name: link
#                    type: string
#                    actions: *actions_get_href_resolve
#                  - name: request > query_url
#                    type: string
#                    actions: *actions_get_href_resolve            

      # Featured rails (Actu / Sport / Culture): one section per paragraph.
      - name: sections
        type: object[]
        selector: "div.paragraph--type--feat-content"
        select: all
        entries:
          - name: label
            type: string
            select: first
            selector: ".field-paragraph--field-feat-content-title .field-item"
            actions:
              - type: get_text
          - name: link
            type: string
            select: first
            selector: ".field-paragraph--field-feat-content-link a"
            actions: *actions_get_href_resolve
          - name: entries
            type: object[]
            selector: "article[id]:has(> div > div.camera-icon)"
            select: all
            entries: *entries_feat_card

      # Suggestion rail ("Nos suggestions"): one section whose cards use the
      # `view-mode-editor_suggestion` shape with their synopsis.
      - name: sections
        type: object[]
        selector: "div.paragraph--type--recommendation"
        select: all
        entries:
          - name: label
            type: string
            select: first
            selector: ".field-paragraph--field-recommendation-title .field-item"
            actions:
              - type: get_text
          - name: entries
            type: object[]
            selector: "article[id]"
            select: all
            entries: *entries_suggestion_card

      # Programme teaser rail ("Nos émissions"): one section whose cards reuse
      # the `/emissions` portrait shape (`/emission/<slug>` program pages).
      - name: sections
        type: object[]
        selector: "div.paragraph--type--teasing-slider"
        select: all
        entries:
          - name: label
            type: string
            select: first
            selector: ".field-paragraph--field-teasing-slider-title .field-item"
            actions:
              - type: get_text
          - name: link
            type: string
            select: first
            selector: ".field-paragraph--field-teasing-slider-link a"
            actions: *actions_get_href_resolve
          - name: entries
            type: object[]
            selector: "div.view-mode-portrait"
            select: all
            entries: *entries_program_card
    post_process:
      - type: filter_items
        source: categories
        field: link
        pattern: "^https?://"
        keep_matching: true

  # --------------------------------------------------------------------------
  # Category — first page of a taxonomy listing (`/actu`, `/culture`,
  # `/sport`) or of the `/emissions` programme index. Drupal pagers are
  # zero-based (`?page=N`) while `{page}` is the one-based page requested by
  # the frontend, so `{page_index}` (= page - 1) is appended. Both card shapes
  # are extracted: taxonomy pages list `article.teaser-item` rows and
  # `/emissions` lists `div.view-mode-portrait` program cards.
  # --------------------------------------------------------------------------
  - name: get_category
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}{query_separator}page={page_index}"
    media_types: *media_types_canalzoom
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: sections
        type: object[]
        entries:
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Vidéos"
          - name: link
            type: string
            actions:
              - type: get_request_url
          - name: current_page
            type: number
            actions:
              - type: format_text
                argument: "{page}"
          - name: have_more
            type: boolean
            select: first
            selector: "ul.js-pager__items a[rel='next']"
            actions:
              - type: format_text
                argument: "true"
          - name: entries
            type: object[]
            selector: "div#block-tv-theme-content article.teaser-item:has(> div > div.camera-icon)"
            select: all
            entries: *entries_video_card
          - name: entries
            type: object[]
            selector: "div#block-tv-theme-content div.view-mode-portrait"
            select: all
            entries: *entries_program_card
    post_process:
      - type: derive_pagination
        source: sections
        next_param: page

  # --------------------------------------------------------------------------
  # Section — next pages of a category listing, requested by the frontend with
  # the `link` emitted by `get_category` and a one-based page number.
  # --------------------------------------------------------------------------
  - name: get_section
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}{query_separator}page={page_index}"
    media_types: *media_types_canalzoom
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: have_more
        type: boolean
        select: first
        selector: "ul.js-pager__items a[rel='next']"
        actions:
          - type: format_text
            argument: "true"
      - name: entries
        type: object[]
        selector: "div#block-tv-theme-content article.teaser-item:has(> div > div.camera-icon)"
        select: all
        entries: *entries_video_card
      - name: entries
        type: object[]
        selector: "div#block-tv-theme-content div.view-mode-portrait"
        select: all
        entries: *entries_program_card
    post_process:
      - type: derive_pagination
        entries_field: entries
        next_param: page

  # --------------------------------------------------------------------------
  # Entry — one programme, episode or news article page
  # `/emission/<slug>` describes a programme and lists its episodes,
  # `/replay/emission/...` and `/actu/...` describe one playable page and
  # embed its Freecaster player in `div.freecaster-player[data-video-id]`.
  # --------------------------------------------------------------------------
  - name: get_entry
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_canalzoom
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: title
        type: string
        select: first
        selector: "h1 span"
        actions:
          - type: get_text
      - name: title
        type: string
        select: first
        selector: "h1"
        actions:
          - type: get_text
      - name: description
        type: string
        select: first
        selector: "meta[property='og:description']"
        actions:
          - type: get_attribut
            argument: content
      - name: release-date
        type: string
        select: first
        selector: "script[type='application/ld+json']"
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '"datePublished"\s*:\s*"(\d{4}-\d{2}-\d{2})'
            format: "{1}"
          - type: get_date
            format: yyyy_mm_dd

      - name: link
        type: string
        actions:
          - type: get_request_url
      - name: web-link
        type: string
        actions:
          - type: get_request_url
      - name: img/landscape > link
        type: string
        select: first
        selector: "meta[property='og:image']"
        actions:
          - type: get_attribut
            argument: content
          - type: resolve_url
      # Category-aware media type: the entry page exposes its taxonomy label
      # through the `article:tag` meta tags only.
      - name: media-type
        type: string[]
        select: first
        actions: *actions_entry_category_media_type
      - name: seasons
        type: object[]
        selector: "div.view-episode"
        select: all
        entries:
          - name: label
            type: string
            select: first
            selector: "header h2"
            actions:
              - type: get_text
          - name: link
            type: string
            actions:
              - type: get_request_url
      - *entry_players_freecaster


  # --------------------------------------------------------------------------
  # Get players — same Freecaster player as `get_entry`.
  # --------------------------------------------------------------------------
  - name: get_players
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_canalzoom
    row_selector: "html"
    entries:
      - *entry_players_freecaster

  # --------------------------------------------------------------------------
  # Season — episodes of a programme page, paginated with the same zero-based
  # Drupal pager.
  # --------------------------------------------------------------------------
  - name: get_season
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}{query_separator}page={page_index}"
    media_types: *media_types_canalzoom
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: have_more
        type: boolean
        select: first
        selector: "ul.js-pager__items a[rel='next']"
        actions:
          - type: format_text
            argument: "true"
      - name: episodes
        type: object[]
        selector: "div.view-episode article.teaser-item:has(> div > div.camera-icon)"
        select: all
        entries: *entries_episode_card
    post_process:
      - type: derive_pagination
        entries_field: episodes
        next_param: page


  # --------------------------------------------------------------------------
  # List live channels — Canal Zoom exposes a single live channel on `/direct`
  # --------------------------------------------------------------------------
  - name: list_lives
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}/direct"
    media_types:
      - video/live
    row_selector: "html"
    result_item_field: entries
    entries:
      - name: entries
        type: object[]
        entries:
          - name: source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: title
            type: string
            actions:
              - type: format_text
                argument: "Canal Zoom"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{query_url}"
          - name: web-link
            type: string
            actions:
              - type: format_text
                argument: "{query_url}"
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "canalzoom"
          - name: channel
            type: string
            actions:
              - type: format_text
                argument: "Canal Zoom"
          - name: media-type
            type: string[]
            actions:
              - type: format_text
                argument: "video/live"
          - name: img/landscape > link
            type: string
            select: first
            selector: "meta[property='og:image']"
            actions:
              - type: get_attribut
                argument: content
              - type: resolve_url


  # --------------------------------------------------------------------------
  # Get live stream — the Drupal settings JSON of `/direct` carries the
  # `live_token` used by the Freecaster embed, whose JSON then exposes the
  # HLS live manifest at `/video/src`. This ports the `canalzoom.py`
  # `get_live_url` resolver (`live_token` then
  # `tvlocales-live.freecaster.com/<token>/<token>.isml/master.m3u8`).
  # --------------------------------------------------------------------------
  - name: get_live
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}/direct"
    media_types:
      - video/live
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: title
        type: string
        actions:
          - type: format_text
            argument: "Canal Zoom"
      - name: players
        type: object[]
        entries:
          - name: name
            type: string
            actions:
              - type: format_text
                argument: "Canal Zoom"
          - name: direct-link
            type: string
            actions:
              - type: get_response_body
              - type: regex_find_all
                pattern: '"live_token"\s*:\s*"([^"]+)"'
                format: "{player_base_url}/embed/{1}.json"
            sub_queries:
              - scraper_type: json
                row_pointer: "/video/src"
                entries:
                  - name: direct-link
                    type: string
                    select: first
                    pointer: "/*[type=application/x-mpegurl]/src"
