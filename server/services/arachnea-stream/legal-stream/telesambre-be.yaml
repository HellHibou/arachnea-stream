id: telesambre-be
title: Télésambre
logo: "https://www.telesambre.be/modules/custom/local_tvs/modules/telesambre/assets/telesambre-rect.svg"
description:
  fr: "Télésambre est la télévision locale de Charleroi et de sa région, accessible en direct et en replay sur son site web."
http:
  mode: auto
  user_agent_profile: firefox


# ############################################################################
# Parameters
# ############################################################################
parameters:
  - name: base_url
    value: https://www.telesambre.be
    description: "Base URL -- update on domain change"
  - name: player_base_url
    value: https://tvlocales-player.freecaster.com
    description: "Freecaster player JSON base URL"


# ############################################################################
# Shared structs
# ############################################################################
shared:
  media_types_telesambre: &media_types_telesambre
    - video/show/other
    - video/show/serie
    - video/show/sport
    - video/show/documentary
    - video/news
    - video/other
    - video/live

  # Listing/entry URL token -> media type. After the 2026 site redesign every
  # browsable page is routed through one of the four navigation categories
  # (`/info`, `/sport`, `/culture`, `/emission(s)`), so the media type is read
  # from the request URL instead of the card bullet: bullet labels are
  # sub-categories (`Société`, `Foot`, ...) that do not map to top-level
  # categories. The `emission` token also matches the `/emissions` index and
  # `/emission/<slug>` programme pages.
  media_type_category_map: &media_type_category_map
    info: video/news
    sport: video/show/sport
    culture: video/show/documentary
    emission: video/show/serie

  # Category-aware media-type override shared by listing cards and entry
  # pages: scans the request URL for a known category token and falls back to
  # `video/show/other` when the URL carries none.
  actions_url_category_media_type: &actions_url_category_media_type
    - type: get_request_url
    - type: regex_find_all
      pattern: '/(info|sport|culture|emission)'
      format: "{1}"
    - type: map
      argument: *media_type_category_map
      default: "video/show/other"

  # Same override for cards served by the home page: the request URL there is
  # the bare `/` root and carries no category token, so the card's own link
  # href is scanned instead.
  actions_card_url_category_media_type: &actions_card_url_category_media_type
    - type: get_attribut
      argument: href
    - type: regex_find_all
      pattern: '/(info|sport|culture|emission)'
      format: "{1}"
    - type: map
      argument: *media_type_category_map
      default: "video/show/other"

  actions_get_href_resolve: &actions_get_href_resolve
    - type: get_attribut
      argument: href
    - type: resolve_url

  actions_get_src_resolve: &actions_get_src_resolve
    - type: get_attribut
      argument: src
    - type: resolve_url

  # Listing cards (`article.teaser-item` rows of `/info`, `/sport` and
  # `/culture`) expose a real `div.content` block: `<time>` date, `h2 span`
  # title, the summary field and an `a.overlink` card link. Those listings mix
  # video and text articles; only videos carry the `camera-icon` class on
  # their media wrapper, so the row selectors are restricted with `:has()` to
  # keep playable cards only.
  entries_video_card: &entries_video_card
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "div.content h2 span"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: description
      type: string
      select: first
      selector: "div.content div.field-node--field-content-main-content div.field-item"
      actions:
        - type: get_text
    - name: release-date
      type: string
      select: first
      selector: "div.content time[datetime]"
      actions:
        - type: get_attribut
          argument: datetime
        - type: get_date
          format: yyyy_mm_dd
    - name: img/landscape > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/other"
    # Category-aware override: `select: first` replaces the generic value as
    # soon as the listing URL carries a known category token.
    - name: media-type
      type: string[]
      select: first
      actions: *actions_url_category_media_type

  # Featured rails (`paragraph--type--feat-content`: "À la Une", "Le sport de
  # votre région", "L'info de votre région", "La culture de votre région",
  # "L'Edito", "Votre magazine C Local") expose their cards as `article[id]`
  # rows of `div.view-mode-content_*` view modes: `h2 span` title, `a.overlink`
  # link and either the `div.spotlight--content-trimmed` (lead card) or the
  # `div.teaser--content-trimmed` (spotlight) synopsis. Only videos carry the
  # `camera-icon` class on their media wrapper, so the row selectors are
  # restricted with `:has()`; `article[id]` only matches the outer card
  # articles, not the nested bare `<article>` media wrappers.
  entries_feat_card: &entries_feat_card
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "h2 span"
      actions:
        - type: get_text
    - name: title
      type: string
      select: first
      selector: "h2"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: description
      type: string
      select: first
      selector: "div.spotlight--content-trimmed"
      actions:
        - type: get_text
    - name: description
      type: string
      select: first
      selector: "div.teaser--content-trimmed"
      actions:
        - type: get_text
    - name: release-date
      type: string
      select: first
      selector: "time[datetime]"
      actions:
        - type: get_attribut
          argument: datetime
        - type: get_date
          format: yyyy_mm_dd
    - name: release-date
      type: string
      select: first
      selector: "time"
      actions:
        - type: get_text
        - type: regex_find_all
          pattern: '(\d{2}/\d{2}/\d{4})'
          format: "{1}"
        - type: get_date
          format: dd_mm_yyyy
    - name: img/landscape > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/other"
    # Category-aware override: the card link carries the category token.
    - name: media-type
      type: string[]
      select: first
      selector: "a.overlink"
      actions: *actions_card_url_category_media_type

  # Suggestion rails (`paragraph--type--recommendation`: "Nos dernières
  # émissions", "Vu sur nos réseaux") use `div.view-mode-editor_suggestion`
  # cards: `h3 span` title, publication date as `time` attribute/text,
  # synopsis in `div.field-type-text-with-summary` and the card link on
  # `a.overlink`. Every card links to its `/emission/<program>/<slug>` episode
  # page, so the link-derived media type resolves to `video/show/serie`.
  entries_suggestion_card: &entries_suggestion_card
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "h3 span"
      actions:
        - type: get_text
    - name: title
      type: string
      select: first
      selector: "h3"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: description
      type: string
      select: first
      selector: "div.field-type-text-with-summary div.field-item"
      actions:
        - type: get_text
    - name: release-date
      type: string
      select: first
      selector: "time[datetime]"
      actions:
        - type: get_attribut
          argument: datetime
        - type: get_date
          format: yyyy_mm_dd
    - name: release-date
      type: string
      select: first
      selector: "time"
      actions:
        - type: get_text
        - type: regex_find_all
          pattern: '(\d{2}/\d{2}/\d{4})'
          format: "{1}"
        - type: get_date
          format: dd_mm_yyyy
    - name: img/landscape > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/other"
    # Category-aware override: the card link carries the category token.
    - name: media-type
      type: string[]
      select: first
      selector: "a.overlink"
      actions: *actions_card_url_category_media_type

  # Programme cards (`div.view-mode-portrait`, used by the `/emissions` index)
  # expose a portrait title (`h4 a span`), a programme link (`a.overlink` to
  # `/emission/<slug>`) and no date or synopsis.
  entries_program_card: &entries_program_card
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "h4 a span"
      actions:
        - type: get_text
    - name: title
      type: string
      select: first
      selector: "h4 a"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: img/poster > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/serie"

  # Episode cards (`div.view-episode` on a `/emission/<slug>` programme page)
  # reuse the listing card shape, but the publication date is exposed as the
  # `time[datetime]` attribute, the duration is prepended to the `time` text
  # ("20 min - publié le ...") and the teaser carries no synopsis.
  entries_episode_card: &entries_episode_card
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "div.content h2 span"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
      # The teaser card does not carry the synopsis, so each episode page is
      # fetched once. `target: parent` keeps `link` and merges the extracted
      # fields next to it, as required by the entry sub-query contract.
      sub_queries:
        - scraper_type: html
          target: parent
          row_selector: "html"
          entries:
            - name: description
              type: string
              select: first
              selector: "meta[property='og:description']"
              actions:
                - type: get_attribut
                  argument: content
    - name: web-link
      type: string
      select: first
      selector: "a.overlink"
      actions: *actions_get_href_resolve
    - name: release-date
      type: string
      select: first
      selector: "time[datetime]"
      actions:
        - type: get_attribut
          argument: datetime
        - type: get_date
          format: yyyy_mm_dd
    - name: duration
      type: string
      select: first
      selector: "div.content time"
      actions:
        - type: get_text
        - type: regex_find_all
          pattern: '(\d+\s*min)'
          format: "{1}"
    - name: img/preview > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/other"

  # Both `get_entry` and `get_players` resolve the same Freecaster player: a
  # playable replay or article page carries
  # `div.freecaster-player[data-video-id]`, and the player JSON exposes every
  # rendition at `/video/src`.
  entry_players_freecaster: &entry_players_freecaster
    name: players
    type: object[]
    entries:
      - name: name
        type: string
        actions:
          - type: format_text
            argument: "Télésambre"
      - name: direct-link
        type: string
        select: first
        selector: "div.freecaster-player"
        actions:
          - type: get_attribut
            argument: data-video-id
          - type: format_text
            argument: "{player_base_url}/embed/{}.json"
        sub_queries:
          - scraper_type: json
            row_pointer: "/video/src"
            entries:
              - name: direct-link
                type: string
                select: first
                pointer: "/*[type=application/x-mpegurl]/src"
      - name: web-link
        type: string
        actions:
          - type: format_text
            argument: "{query_url}"
# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
        actions:
          - type: resolve_url
      - name: description
        type: object
        value: "{service_description}"

  # --------------------------------------------------------------------------
  # Home -- the four navigation categories as static categories (`Info
  # locales`, `Sport`, `Culture`, `Nos émissions`). The landing page exposes
  # no reusable card rail, so categories are browsed on demand through
  # `get_category`.
  # --------------------------------------------------------------------------
  - name: load_home
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}"
    media_types: *media_types_telesambre
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"

      # Browsable categories are emitted as stable static groups: each
      # selector-less `categories` group yields one object, and the request URL
      # of each category is the listing consumed by `get_category`. The labels
      # follow the navigation plugin wording rather than the raw nav links.
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "info"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Info locales"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/info"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/info"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "sport"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Sport"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/sport"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/sport"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "culture"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Culture"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/culture"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/culture"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "emissions"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Nos émissions"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/emissions"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/emissions"
      # The locality directory is not part of the four editorial categories.
      # `/liste-localite` itself carries no media cards: it lists the communes
      # as sub-categories, which `get_category` exposes when called with this
      # URL. Expose it as one stable "Localités" category without preloading
      # the individual communes.
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "localites"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Localités"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/liste-localite"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/liste-localite"

      # Featured rails (`paragraph--type--feat-content`: "À la Une", "Le sport
      # de votre région", "L'info de votre région", "La culture de votre
      # région", "L'Edito", "Votre magazine C Local"). Only video cards carry
      # the `camera-icon` class on their media wrapper, so text-only rails such
      # as "L'Edito" are skipped by the `:has()` restriction.
      - name: sections
        type: object[]
        selector: "div.paragraph--type--feat-content"
        select: all
        entries:
          - name: label
            type: string
            select: first
            selector: ".field-paragraph--field-feat-content-title .field-item"
            actions:
              - type: get_text
          - name: link
            type: string
            select: first
            selector: ".field-paragraph--field-feat-content-link a"
            actions: *actions_get_href_resolve
          - name: entries
            type: object[]
            selector: "article[id]:has(> div > div.camera-icon)"
            select: all
            entries: *entries_feat_card

      # Suggestion rails (`paragraph--type--recommendation`: "Nos dernières
      # émissions", "Vu sur nos réseaux"). Every suggestion card is a video, so
      # the rows are restricted with the `icon-camera-fill` tag.
      - name: sections
        type: object[]
        selector: "div.paragraph--type--recommendation"
        select: all
        entries:
          - name: label
            type: string
            select: first
            selector: ".field-paragraph--field-recommendation-title .field-item"
            actions:
              - type: get_text
          - name: entries
            type: object[]
            selector: "article[id]:has(.icon-camera-fill)"
            select: all
            entries: *entries_suggestion_card

      # Programme teaser rail (`paragraph--type--teasing-slider`, "Nos
      # émissions"): cards reuse the `/emissions` portrait shape
      # (`/emission/<slug>` program pages).
      - name: sections
        type: object[]
        selector: "div.paragraph--type--teasing-slider"
        select: all
        entries:
          - name: label
            type: string
            select: first
            selector: ".field-paragraph--field-teasing-slider-title .field-item"
            actions:
              - type: get_text
          - name: link
            type: string
            select: first
            selector: ".field-paragraph--field-teasing-slider-link a"
            actions: *actions_get_href_resolve
          - name: entries
            type: object[]
            selector: "div.view-mode-portrait"
            select: all
            entries: *entries_program_card

  # --------------------------------------------------------------------------
  # Category -- first page of a taxonomy listing (`/info`, `/sport`,
  # `/culture`) or of the `/emissions` programme index. Drupal pagers are
  # zero-based (`?page=N`) while `{page}` is the one-based page requested by
  # the frontend, so `{page_index}` (= page - 1) is appended. Both card shapes
  # are extracted: listing pages list `article.teaser-item` rows and
  # `/emissions` lists `div.view-mode-portrait` programme cards (that index is
  # not paginated, so no "load more" link is emitted there).
  # --------------------------------------------------------------------------
  - name: get_category
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}{query_separator}page={page_index}"
    media_types: *media_types_telesambre
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: sections
        type: object[]
        entries:
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Vidéos"
          # Exposed so the frontend can load further pages through `get_section`
          # with the same listing URL.
          - name: link
            type: string
            actions:
              - type: get_request_url
          - name: current_page
            type: number
            actions:
              - type: format_text
                argument: "{page}"
          # The infinite-scroll pager only renders a "Load more" link while more
          # rows exist; its presence is the only pagination signal.
          - name: have_more
            type: boolean
            select: first
            selector: "ul.js-pager__items a[rel='next']"
            actions:
              - type: format_text
                argument: "true"
          - name: entries
            type: object[]
            selector: "div#block-tv-theme-content article.teaser-item:has(> div > div.camera-icon)"
            select: all
            entries: *entries_video_card
          - name: entries
            type: object[]
            selector: "div#block-tv-theme-content div.view-mode-portrait"
            select: all
            entries: *entries_program_card
      # The locality directory (`/liste-localite`) itself carries no media
      # cards. Each locality is a navigable category whose request URL is its
      # `/commune/<slug>` page.
      - name: categories
        type: object[]
        selector: "div#block-tv-theme-content div.locality-list a[href^='/commune/']"
        select: all
        entries:
          - name: key
            type: string
            actions:
              - type: get_attribut
                argument: href
              - type: regex_replace_all
                pattern: "^.*/([^/]+)/?$"
                replacement: "$1"
          - name: label
            type: string
            actions:
              - type: get_text
          - name: link
            type: string
            actions: *actions_get_href_resolve
          - name: request > query_url
            type: string
            actions: *actions_get_href_resolve
      # Editorial listings (`/info`, `/sport`, `/culture` and their
      # sub-categories) expose a `nav#block-categories` menu listing the
      # sibling sub-categories (`Economie`, `Faits Divers`, ...). Each one is a
      # navigable listing reached through `get_category` with its own URL, so
      # they are exposed as `categories`. The block is absent from
      # `/liste-localite` and `/emissions`, so it never collides with the
      # locality or programme listings.
      - name: categories
        type: object[]
        selector: "nav#block-categories ul[block='block-categories'] li a"
        select: all
        entries:
          - name: key
            type: string
            actions:
              - type: get_attribut
                argument: href
              - type: regex_replace_all
                pattern: "^.*/([^/]+)/?$"
                replacement: "$1"
          - name: label
            type: string
            actions:
              - type: get_text
          - name: link
            type: string
            actions: *actions_get_href_resolve
          - name: request > query_url
            type: string
            actions: *actions_get_href_resolve
    post_process:
      - type: derive_pagination
        source: sections
        next_param: page

  # --------------------------------------------------------------------------
  # Section -- next pages of a category listing, requested by the frontend with
  # the `link` emitted by `get_category` and a one-based page number.
  # --------------------------------------------------------------------------
  - name: get_section
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}{query_separator}page={page_index}"
    media_types: *media_types_telesambre
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: have_more
        type: boolean
        select: first
        selector: "ul.js-pager__items a[rel='next']"
        actions:
          - type: format_text
            argument: "true"
      - name: entries
        type: object[]
        selector: "div#block-tv-theme-content article.teaser-item:has(> div > div.camera-icon)"
        select: all
        entries: *entries_video_card
      - name: entries
        type: object[]
        selector: "div#block-tv-theme-content div.view-mode-portrait"
        select: all
        entries: *entries_program_card
    post_process:
      - type: derive_pagination
        entries_field: entries
        next_param: page

  # --------------------------------------------------------------------------
  # Entry -- one programme, episode or news article page.
  # `/emission/<slug>` describes a programme and lists its episodes,
  # `/replay/emission/...`, `/info/...`, `/sport/...` and `/culture/...`
  # describe one playable page and embed its Freecaster player in
  # `div.freecaster-player[data-video-id]`. The episode rail only exists on
  # programme pages, so `seasons` is emitted only there.
  # --------------------------------------------------------------------------
  - name: get_entry
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_telesambre
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: title
        type: string
        select: first
        selector: "h1 span"
        actions:
          - type: get_text
      - name: title
        type: string
        select: first
        selector: "h1"
        actions:
          - type: get_text
      # The HTML parser already decodes the attribute entities, and
      # `html_to_text` would replace the attribute value with the (empty) inner
      # markup of the `<meta>` element.
      - name: description
        type: string
        select: first
        selector: "meta[property='og:description']"
        actions:
          - type: get_attribut
            argument: content
      # Programme pages expose their synopsis in the program summary field
      # instead of the Open Graph tag.
      - name: description
        type: string
        select: first
        selector: "div.field-node--field-program-summary div.field-item"
        actions:
          - type: html_to_text
      - name: release-date
        type: string
        select: first
        selector: "time[datetime]"
        actions:
          - type: get_attribut
            argument: datetime
          - type: get_date
            format: yyyy_mm_dd
      - name: link
        type: string
        actions:
          - type: get_request_url
      - name: web-link
        type: string
        actions:
          - type: get_request_url
      - name: img/landscape > link
        type: string
        select: first
        selector: "meta[property='og:image']"
        actions:
          - type: get_attribut
            argument: content
          - type: resolve_url
      - name: img/landscape > link
        type: string
        select: first
        selector: "article img"
        actions: *actions_get_src_resolve
      - name: media-type
        type: string[]
        actions:
          - type: format_text
            argument: "video/show/other"
      # Category-aware media type: the entry URL carries the top-level
      # category (`/info/...`, `/replay/emission/...`).
      - name: media-type
        type: string[]
        select: first
        actions: *actions_url_category_media_type
      # Episode rail of a programme page. Episodes are loaded lazily through
      # `get_season` with this link, so the HTTP cache stays payload-based.
      - name: seasons
        type: object[]
        selector: "div.view-episode"
        select: all
        entries:
          - name: label
            type: string
            select: first
            selector: "header h2"
            actions:
              - type: get_text
          - name: link
            type: string
            actions:
              - type: get_request_url
      # Editorial recommendation rails of an entry page. Programme pages embed
      # a `composant-emission` slider of `view-mode-portrait` programme cards;
      # article pages embed an `editor-suggestion--main-container` of
      # `view-mode-editor_suggestion` cards. Only the suggestions that carry the
      # `icon-camera-fill` marker are videos, so the row selector keeps playable
      # cards only (matching the `entries_suggestion_card` shape), and the
      # portrait cards reuse the programme shape.
      - name: recommendations
        type: object
        select: first
        selector: "div.editor-suggestion--main-container, div.composant-emission"
        entries:
          - name: entries
            type: object[]
            selector: "div.views-row div.view-mode-editor_suggestion:has(div.icon-camera-fill)"
            select: all
            entries: *entries_suggestion_card
          - name: entries
            type: object[]
            selector: "div.view-mode-portrait"
            select: all
            entries: *entries_program_card
      - *entry_players_freecaster

  # --------------------------------------------------------------------------
  # Get players -- the frontend calls this with the `link` of a `get_season`
  # episode card, which carries no embedded player. The episode page embeds the
  # same `div.freecaster-player` as `get_entry`, so both queries share one
  # player block.
  # --------------------------------------------------------------------------
  - name: get_players
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_telesambre
    row_selector: "html"
    entries:
      - *entry_players_freecaster

  # --------------------------------------------------------------------------
  # Season -- episodes of a programme page, paginated with the same zero-based
  # Drupal pager. The frontend calls this with the `link` emitted by
  # `get_entry.seasons` and a one-based page number.
  # --------------------------------------------------------------------------
  - name: get_season
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}{query_separator}page={page_index}"
    media_types: *media_types_telesambre
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: have_more
        type: boolean
        select: first
        selector: "ul.js-pager__items a[rel='next']"
        actions:
          - type: format_text
            argument: "true"
      - name: episodes
        type: object[]
        selector: "div.view-episode article.teaser-item:has(> div > div.camera-icon)"
        select: all
        entries: *entries_episode_card
    post_process:
      - type: derive_pagination
        entries_field: episodes
        next_param: page

  # --------------------------------------------------------------------------
  # List live channels -- Télésambre exposes a single live channel on `/direct`
  # --------------------------------------------------------------------------
  - name: list_lives
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}/direct"
    media_types:
      - video/live
    row_selector: "html"
    result_item_field: entries
    entries:
      - name: entries
        type: object[]
        entries:
          - name: source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: title
            type: string
            actions:
              - type: format_text
                argument: "Télésambre"
          - name: title/alt
            type: string
            actions:
              - type: format_text
                argument: "Direct"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{query_url}"
          - name: web-link
            type: string
            actions:
              - type: format_text
                argument: "{query_url}"
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "telesambre"
          - name: channel
            type: string
            actions:
              - type: format_text
                argument: "Télésambre"
          - name: media-type
            type: string[]
            actions:
              - type: format_text
                argument: "video/live"
          - name: img/landscape > link
            type: string
            select: first
            selector: "meta[property='og:image']"
            actions:
              - type: get_attribut
                argument: content
              - type: resolve_url

  # --------------------------------------------------------------------------
  # Get live stream -- the Drupal settings JSON of `/direct` carries the
  # `live_token` used by the Freecaster embed, whose JSON then exposes the HLS
  # live manifest at `/video/src`. This ports the `telesambre.py`
  # `get_live_url` resolver (`live_token` then
  # `tvlocales-player.freecaster.com/embed/<token>.json`).
  # --------------------------------------------------------------------------
  - name: get_live
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}/direct"
    media_types:
      - video/live
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: title
        type: string
        actions:
          - type: format_text
            argument: "Télésambre"
      - name: players
        type: object[]
        entries:
          - name: name
            type: string
            actions:
              - type: format_text
                argument: "Télésambre"
          - name: direct-link
            type: string
            actions:
              - type: get_response_body
              - type: regex_find_all
                pattern: '"live_token"\s*:\s*"([^"]+)"'
                format: "{player_base_url}/embed/{1}.json"
            sub_queries:
              - scraper_type: json
                row_pointer: "/video/src"
                entries:
                  - name: direct-link
                    type: string
                    select: first
                    pointer: "/*[type=application/x-mpegurl]/src"
