  - name: get_season
    scraper_type: json
    base_url: "{api_base}"
    query_url: "{api_base}/getSecurityToken.php?&{common_query}"
    request_headers: *fawesome_origin_headers
    media_types: *media_types_fawesome_tv
    row_pointer: /
    entries:
      - name: _catalog_url
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{query_url}&start-index={page_index}"
          - type: regex_replace_all
            pattern: "^https://rapi\\.ifood\\.tv"
            replacement: "{api_base}"
          - *strip_empty_query_param
          - *strip_empty_query_param
          - *strip_empty_query_param
          - *strip_empty_query_param
        sub_queries:
          - scraper_type: json
            target: "parent"
            request_headers: *fawesome_api_headers
            row_pointer: /
            entries:
              - name: current_page
                type: number
                select: first
                actions:
                  - type: format_text
                    argument: "{page}"
              - name: page_size
                type: number
                pointer: /params/limit
                select: first
              - name: total
                type: number
                pointer: /count
                select: first
              - name: total_pages
                type: number
                pointer: /count
                select: first
                actions:
                  - type: format_text
                    argument: "({} + 19) / 20"
                  - type: math_formula
              - name: episodes
                type: object[]
                pointer: /results/*
                select: all
                entries:
                  - name: title
                    type: string
                    pointer: /title
                    select: first
                  - name: description
                    type: string
                    pointer: /description
                    select: first
                  - name: duration
                    type: number
                    pointer: /runtime
                    select: first
                  - name: season
                    type: string
                    pointer: /season
                    select: first
                  - name: season-name
                    type: string
                    pointer: /series_name
                    select: first
                  - name: episode-number
                    type: string
                    pointer: /episode
                    select: first
                  - name: link
                    type: string
                    pointer: /node_id
                    select: first
                    actions:
                      - type: regex_find_all
                        pattern: "^(\\d+)$"
                        format: "{api_base}/recipes.php?searchType=nodeid&start-index=0&gridstyle=flat-movie&max-results=1&platform_id={platform_id}&{common_query}&dltype=1&nid={1}"
              - name: web-link
                type: string
                pointer: /web_url
                select: first
                actions:
                  - type: map
                    argument:
                      "": null
          
                  - type: format_text
                    argument: "{public_base}/{}"
              - name: img/poster > link
                type: string
                pointer: /main_picture
                select: first
              - name: img/preview > link
                type: string
                pointer: /bg_image_landscape
                select: first
              - name: players
                type: object[]
                pointer: /
                select: all
                entries: *player_entries_fawesome
      - name: _token
        type: string
        pointer: /securityToken
        select: first
        actions:
          - type: extract_variables
            regex: "^(.*)$"
            name: "@security_token"
            value: "{1}"
            on_duplicate: replace
    post_process:
      - type: set_nested_fields
        source: episodes
        nested_source: players
        fields:
          - target: name
            value: "Fawesome"
      - type: derive_pagination
        entries_field: episodes
        total_pages_field: total_pages
        page_size_field: page_size
      - type: remove_fields
        fields:
          - _catalog_url
          - _token
          - total_pages
          - page_size

