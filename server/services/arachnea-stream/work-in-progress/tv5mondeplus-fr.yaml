id: tv5mondeplus-fr
title: "TV5MONDE+"
logo: "https://www.tv5mondeplus.com/build/img/icon/logo-refonte.9728769c.svg"
description:
  fr: "Plateforme de streaming de TV5MONDE : films, séries, documentaires, magazines et directs en français."
  en: "TV5MONDE streaming platform: movies, series, documentaries, magazines and live TV in French."
http:
  mode: auto
  user_agent_profile: chrome

parameters:
  - name: base_url
    value: "https://www.tv5mondeplus.com"
    description: "Base URL of TV5MONDE+"
  - name: category_url
    value: "/fr/series"
    description: "Category page path (e.g. /fr/series or /fr/series/drame)"
  - name: content_url
    value: "/fr/series/comedie/groupe-de-soutien"
    description: "Programme page path"

shared:
  media_types_tv5mondeplus: &media_types_tv5mondeplus
    - video/movie
    - video/show/serie
    - video/show/documentary
    - video/show/kids
    - video/show/other
    - video/news
    - video/live

  actions_media_type: &actions_media_type
    - type: get_text
    - type: map
      argument:
        Films: video/movie
        "Séries": video/show/serie
        Documentaires: video/show/documentary
        Jeunesse: video/show/kids
        Divertissement: video/show/other
        "Info et société": video/news
        Sport: video/show/sport
        "Culture et art de vivre": video/show/other
      default: "video/show/other"

  actions_year: &actions_year
    - type: get_text
    - type: regex_find_all
      pattern: "\\b(19|20)\\d{2}\\b"
      format: "{1}"

  actions_duration: &actions_duration
    - type: get_text
    - type: regex_find_all
      pattern: "(\\d+)\\s*min"
      format: "{1}"
    - type: normalize_duration

  # MediaItem extraction shared by home sections and category grids.
  entries_catalog_card: &entries_catalog_card
    - name: title
      type: string
      selector: "a.poster-card"
      select: first
      actions:
        - type: get_attribut
          argument: aria-label
    - name: link
      type: string
      selector: "a.poster-card"
      select: first
      actions:
        - type: get_attribut
          argument: href
        - type: resolve_url
    - name: web-link
      type: string
      selector: "a.poster-card"
      select: first
      actions:
        - type: get_attribut
          argument: href
        - type: resolve_url
    - name: description
      type: string
      selector: ".hover-card-description p"
      select: first
      actions:
        - type: get_text
    - name: media-type
      type: string[]
      selector: ".hover-card-genre span:first-child"
      select: first
      actions: *actions_media_type
    - name: year
      type: number
      selector: ".hover-card-info"
      select: first
      actions: *actions_year
    - name: duration
      type: string
      selector: ".hover-card-info"
      select: first
      actions: *actions_duration
    - name: img/poster > link
      type: string
      selector: "img.poster-image"
      select: first
      actions:
        - type: get_attribut
          argument: src
        - type: resolve_url

queries:
  # ---------------------------------------------------------------------------
  # 1. Service metadata
  # ---------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"
      - name: search_themes
        type: string[]
        value:
          - "Action"
          - "Aventure"
          - "Comédie"
          - "Drame"
          - "Documentaire"
          - "Magazine"
          - "Sport"
          - "Jeunesse"

  # ---------------------------------------------------------------------------
  # 2. Home page: banners, categories and sections
  # ---------------------------------------------------------------------------
  - name: load_home
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}/fr"
    row_selector: "main.home-content"
    entries:
      # Channel filters (from the "Parcourir toute l'offre" section)
      - name: categories
        type: object[]
        selector: "section.check-offer a"
        select: all
        entries:
          - name: key
            type: string
            actions:
              - type: get_attribut
                argument: href
              - type: regex_find_all
                pattern: "/fr/([^/]+)"
                format: "{1}"
          - name: label
            type: string
            actions:
              - type: get_text
          - name: link
            type: string
            actions:
              - type: get_attribut
                argument: href
              - type: resolve_url
          - name: request > query_url
            type: string
            actions:
              - type: get_attribut
                argument: href
              - type: resolve_url

      # Content rails (portrait poster sliders)
      - name: sections
        type: object[]
        selector: "div.slider-portrait.st-portrait-card-slider"
        select: all
        entries:
          - name: label
            type: string
            selector: ".slider-portrait-title"
            select: first
            actions:
              - type: get_text
          - name: entries
            type: object[]
            selector: "div.swiper-wrapper > div.swiper-slide"
            select: all
            entries: *entries_catalog_card

      # Promotional hero banners
      - name: banners
        type: object[]
        selector: "div.slider-full.st-hero div.swiper-slide"
        select: all
        entries:
          - name: key
            type: string
            selector: "img.poster-image.slider-full-poster"
            select: first
            actions:
              - type: get_attribut
                argument: src
              - type: regex_find_all
                pattern: "/assets/([^/]+)/"
                format: "{1}"
          - name: title
            type: string
            selector: "img.title-image"
            select: first
            actions:
              - type: get_attribut
                argument: alt
          - name: description
            type: string
            selector: ".slider-full-description"
            select: first
            actions:
              - type: get_text
          - name: image
            type: string
            selector: "img.poster-image.slider-full-poster"
            select: first
            actions:
              - type: get_attribut
                argument: src
              - type: resolve_url
          - name: logo
            type: string
            selector: "img.title-image"
            select: first
            actions:
              - type: get_attribut
                argument: src
              - type: resolve_url
          - name: link
            type: string
            selector: "div.slider-full-metadata a[href]"
            select: first
            actions:
              - type: get_attribut
                argument: href
              - type: resolve_url
          - name: web-link
            type: string
            selector: ".slider-full-cta a"
            select: first
            actions:
              - type: get_attribut
                argument: href
              - type: resolve_url

  # ---------------------------------------------------------------------------
  # 3. Category page: categories + poster grid
  # ---------------------------------------------------------------------------
  - name: get_category
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}{category_url}"
    row_selector: "main.content-section.sub-category-page"
    entries:
      # Same channel filters as load_home
      - name: categories
        type: object[]
        selector: "section.check-offer a"
        select: all
        entries:
          - name: key
            type: string
            actions:
              - type: get_attribut
                argument: href
              - type: regex_find_all
                pattern: "/fr/([^/]+)"
                format: "{1}"
          - name: label
            type: string
            actions:
              - type: get_text
          - name: link
            type: string
            actions:
              - type: get_attribut
                argument: href
              - type: resolve_url
          - name: request > query_url
            type: string
            actions:
              - type: get_attribut
                argument: href
              - type: resolve_url

      # Single rail containing the whole poster grid of the page
      - name: sections
        type: object[]
        selector: "div.sub-category-title"
        select: all
        entries:
          - name: label
            type: string
            selector: "h1"
            select: first
            actions:
              - type: get_text
          - name: current_page
            type: number
            actions:
              - type: format_text
                argument: "1"
          - name: page_size
            type: number
            actions:
              - type: format_text
                argument: "60"
          - name: entries
            type: object[]
            selector: "ul.sub-category-posters-container > li.sub-category-poster"
            select: all
            entries: *entries_catalog_card
    post_process:
      - type: derive_pagination
        current_page_field: "current_page"
        have_more_field: "have_more"
        page_size_field: "page_size"
        next_param: "page"
        remove_fields:
          - current_page
          - page_size

  # ---------------------------------------------------------------------------
  # 4. Entry detail: seasons, episodes and trailer
  # ---------------------------------------------------------------------------
  - name: get_entry
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}{content_url}"
    row_selector: "section.header-player.st-header-player"
    entries:
      - name: title
        type: string
        selector: "h1.push-card-title-1"
        select: first
        actions:
          - type: get_text
      - name: description
        type: string
        selector: ".header-player-description"
        select: first
        actions:
          - type: get_text
      - name: media-type
        type: string[]
        selector: ".header-player-content .cat"
        select: first
        actions:
          - type: get_text
          - type: map
            argument:
              Films: video/movie
              "Séries": video/show/serie
              Documentaires: video/show/documentary
              Jeunesse: video/show/kids
              Divertissement: video/show/other
              "Info et société": video/news
              Sport: video/show/sport
              "Culture et art de vivre": video/show/other
            default: "video/show/serie"
      - name: web-link
        type: string
        selector: "a.button-white.st-button"
        select: first
        actions:
          - type: get_attribut
            argument: href
          - type: resolve_url
      - name: year
        type: number
        selector: ".header-player-data .text-body-md"
        select: first
        actions:
          - type: get_text
      - name: video/trailer
        type: string
        selector: "button.js-play-video-trailer"
        select: first
        actions:
          - type: get_attribut
            argument: data-assetid
          - type: format_text
            argument: "{base_url}/fr/play/{}/"
      - name: img/landscape > link
        type: string
        selector: ".header-player-image-container img"
        select: first
        actions:
          - type: get_attribut
            argument: src
          - type: resolve_url

      # Seasons and episodes (all rails are present on the page)
      - name: seasons
        type: object[]
        selector: "div.st-tvshow-season-rail"
        select: all
        entries:
          - name: label
            type: string
            selector: ".slider-landscape-title"
            select: first
            actions:
              - type: get_text
          - name: link
            type: string
            selector: "a[href^='#season-rail']"
            select: first
            actions:
              - type: get_attribut
                argument: href
          - name: episodes
            type: object[]
            selector: ".tvshow-episode-card"
            select: all
            entries:
              - name: title
                type: string
                selector: ".tvshow-episode-title"
                select: first
                actions:
                  - type: get_text
              - name: description
                type: string
                selector: ".tvshow-episode-description"
                select: first
                actions:
                  - type: get_text
              - name: episode-number
                type: string
                selector: ".tvshow-episode-number"
                select: first
                actions:
                  - type: get_text
                  - type: regex_find_all
                    pattern: "(\\d+)"
                    format: "{1}"
              - name: duration
                type: string
                selector: ".tvshow-episode-duration span"
                select: first
                actions:
                  - type: get_text
                  - type: regex_find_all
                    pattern: "(\\d+)\\s*min"
                    format: "{1}"
                  - type: normalize_duration
              - name: link
                type: string
                selector: ".tvshow-episode-overlay-link"
                select: first
                actions:
                  - type: get_attribut
                    argument: href
                  - type: resolve_url
              - name: web-link
                type: string
                selector: ".tvshow-episode-overlay-link"
                select: first
                actions:
                  - type: get_attribut
                    argument: href
                  - type: resolve_url
              - name: players
                type: object[]
                selector: ".tvshow-episode-play-btn a"
                select: all
                entries:
                  - name: name
                    type: string
                    actions:
                      - type: format_text
                        argument: "TV5MONDE+"
                  - name: resolver
                    type: string
                    actions:
                      - type: format_text
                        argument: "stream-resolver"
                  - name: target
                    type: string
                    actions:
                      - type: get_attribut
                        argument: href
                      - type: resolve_url
              - name: img/preview > link
                type: string
                selector: "img.tvshow-episode-image"
                select: first
                actions:
                  - type: get_attribut
                    argument: src
                  - type: resolve_url
