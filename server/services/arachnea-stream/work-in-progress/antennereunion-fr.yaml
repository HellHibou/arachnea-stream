id: antennereunion-fr
title: "Antenne Réunion"
logo: "https://antennereunion-production.eu-west-3.ancdn.tv/configuration/HadCogoctandsxEDEsdufOcagidOad/data/images/b6f24743b9bda84965732853163e52b0979129872630db4b3940689e003fe512.png"
description:
  fr: "Plateforme de streaming légale de la chaîne de télévision régionale Antenne Réunion (La Réunion) : replay, séries, films et chaînes en direct."
  en: "Legal streaming platform of the regional TV channel Antenne Réunion (La Réunion): catch-up TV, series, movies and live channels."
credentials:
  required: true
  signup_url: https://www.antennereunion.fr/inscription

http:
  mode: direct
  user_agent_profile: firefox

parameters:
  - name: base_url
    value: "https://proxies.antennereunion-production.eu-west-3.alphanetworks.tv"
  - name: cdn_base_url
    value: "https://antennereunion-production.eu-west-3.ancdn.tv"
  - name: identity_key
    value: "HadCogoctandsxEDEsdufOcagidOad"
  - name: language_id
    value: "fra"
  - name: include_root
    value: "true"
  - name: epg_hours
    value: "72"

shared:
  media_types_antennereunion: &media_types_antennereunion
    - video/movie
    - video/show/serie
    - video/show/documentary
    - video/show/sport
    - video/show/kids
    - video/show/other
    - video/news
    - video/live
    - video/other

  request_identity_header: &request_identity_header
    - name: "X-AN-WebService-IdentityKey"
      select: first
      actions:
        - type: format_text
          argument: "{identity_key}"

  # Headers for JSON POST calls: identity key + JSON content type.
  request_headers_json: &request_headers_json
    - name: "X-AN-WebService-IdentityKey"
      select: first
      actions:
        - type: format_text
          argument: "{identity_key}"
    - name: "content-type"
      select: first
      actions:
        - type: format_text
          argument: "application/x-www-form-urlencoded"

  request_body_language: &request_body_language
    - type: format_text
      argument: 'type=anonymous&languageId={language_id}'

  actions_image_to_url: &actions_image_to_url
    - type: build_url
      base: "{cdn_base_url}/proxy/imgdata?type=image&objectId={id}&languageId={language_id}"
      fields:
        id: /content/0/tags/imageId

  actions_channel_image_to_url: &actions_channel_image_to_url
    - type: build_url
      base: "{cdn_base_url}/proxy/imgdata?type=channel_taui&objectId={id}&languageId={language_id}"
      fields:
        id: /idChannel

  actions_asset_image_to_url: &actions_asset_image_to_url
    - type: build_url
      base: "{cdn_base_url}/proxy/imgdata?type=asset_vod-background&objectId={id}&languageId={language_id}"
      fields:
        id: /idAsset

  entries_media_item_asset: &entries_media_item_asset
    - name: title
      type: string
      pointer: /directMetadata/AD_ASSTITLE
    - name: title/alt
      type: string
      pointer: /directMetadata/AD_ORITITLE
    - name: description
      type: string
      pointer: /directMetadata/AD_SYNO600C
    - name: media-type
      type: string
      actions:
        - type: format_text
          argument: "video/show/other"
    - name: link
      type: string
      pointer: /idAsset
      actions:
        - type: format_text
          argument: "{base_url}/proxy/assets?assetIds=%5B{}%5D&languageId={language_id}"
    - name: img/poster > link
      type: string
      actions: *actions_asset_image_to_url
    - name: img/landscape > link
      type: string
      actions: *actions_asset_image_to_url
    - name: duration
      type: number
      pointer: /directMetadata/TS_DURATION
      actions:
        - type: ratio
          argument: 60
    - name: release-date
      type: string
      pointer: /directMetadata/TS_STARTUTC
      actions:
        - type: get_date
          format: yyyy_mm_dd_hh_mm_ss
    - name: expire
      type: string
      pointer: /directMetadata/TS_ENDUTC
      actions:
        - type: get_date
          format: yyyy_mm_dd_hh_mm_ss
    - name: theme
      type: string[]
      pointer: /directMetadata/AD_LIGENRES
    - name: rating
      type: number
      pointer: /directMetadata/AD_SCORPUBL
    - name: morality
      type: number
      pointer: /moralityLevel
  entries_episode: &entries_episode
    - name: title
      type: string
      pointer: /directMetadata/AD_ASSTITLE
    - name: title/alt
      type: string
      pointer: /directMetadata/AD_SUBTITLE
    - name: description
      type: string
      pointer: /directMetadata/AD_SYNO600C
    - name: duration
      type: number
      pointer: /directMetadata/TS_DURATION
      actions:
        - type: ratio
          argument: 60
    - name: release-date
      type: string
      pointer: /directMetadata/TS_STARTUTC
      actions:
        - type: get_date
          format: yyyy_mm_dd_hh_mm_ss
    - name: expire
      type: string
      pointer: /directMetadata/TS_ENDUTC
      actions:
        - type: get_date
          format: yyyy_mm_dd_hh_mm_ss
    - name: link
      type: string
      pointer: /idAsset
      actions:
        - type: format_text
          argument: "{base_url}/proxy/assets?assetIds=%5B{}%5D&languageId={language_id}"
    - name: img/poster > link
      type: string
      actions:
        # Episodes have no poster on the CDN (`asset_vod-poster` 404s for every
        # asset) while `asset_vod-background` always resolves; the landscape
        # visual is served in the poster slot because the frontend episode
        # preview only reads `img/poster`.
        - type: build_url
          base: "{cdn_base_url}/proxy/imgdata?type=asset_vod-background&objectId={id}&languageId={language_id}"
          fields:
            id: /idAsset
    - name: season-name
      type: string
      pointer: /directMetadata/AD_SERIESEA
      actions:
        - type: format_text
          argument: "Saison {}"
    - name: episode-number
      type: string
      pointer: /directMetadata/AD_SERIESEP
    - name: season
      type: string
      pointer: /directMetadata/AD_SERIESEA
      actions:
        - type: format_text
          argument: "Saison {}"
    - name: morality
      type: number
      pointer: /moralityLevel
    - name: players
      type: object[]
      pointer: /
      select: all
      entries:
        - name: name
          type: string
          actions:
            - type: format_text
              argument: "Antenne Réunion"
        - name: resolver
          type: object
          entries:
            - name: kind
              type: string
              actions:
                - type: format_text
                  argument: "antennereunion-video"
            - name: target_id
              type: string
              pointer: /idAsset

queries:
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"
      - name: search_themes
        type: string[]
        value:
          - "Séries"
          - "Films"
          - "Magazines"
          - "Divertissement"
          - "Sport"
          - "Jeunesse"
          - "Infos"
          - "Documentaire"

  - name: load_home
    scraper_type: json
    request_method: post
    base_url: "{base_url}"
    query_url: "{base_url}/proxy/homeContent"
    request_body_pointer: /status
    request_body_select: first
    request_body_actions:
      - type: format_text
        argument: 'type=anonymous&languageId={language_id}'
    request_headers: *request_headers_json
    media_types: *media_types_antennereunion
    row_pointer: /result/homecontent
    entries: &entries_home_content
      # Fullscreen hero banners: catalog items flagged with a fullscreen
      # design mode. Link-less rows (raw assets, link tiles) are dropped by
      # the frontend because they expose no `link`.
      - name: banners
        type: object[]
        pointer: "/*[content/0/tags/designMode/0=fullscreen]"
        select: all
        entries:
          - name: key
            type: string
            pointer: /content/0/idItem
          - name: title
            type: string
            pointer: /content/0/content/directMetadata/AD_ASSTITLE
          - name: title
            type: string
            pointer: /content/0/content/name
          - name: description
            type: string
            pointer: /content/0/content/directMetadata/AD_SYNO600C
          - name: description
            type: string
            pointer: /content/0/content/synopsis
          - name: image
            type: string
            actions: *actions_image_to_url
          - name: link
            type: string
            pointer: /content/0[idType=8]/content/idCatalog
            actions:
              - type: format_text
                argument: "{base_url}/proxy/listContent?id={}&includeRoot={include_root}&languageId={language_id}"

      # The "Nos catégories" tiles are `idType=7` application routes. Their
      # route names select the matching editorial `homeContent` page when the
      # frontend opens a category; unrelated link tiles remain excluded below.
      - name: categories
        type: object[]
        pointer: "/*[content/0/idType=7]"
        select: all
        entries:
          - name: key
            type: string
            pointer: /content/0/content/url
          - name: label
            type: string
            pointer: /content/0/content/description
          - name: image
            type: string
            actions: *actions_image_to_url
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/proxy/homeContent"
          - name: request > home_type
            type: string
            pointer: /content/0/content/url
            actions:
              - type: map
                argument:
                  "/page/MenuSerie": "MenuSerie"
                  "/page/MenuFilms": "MenuFilms"
                  "/page/MenuInfo": "MenuInfo"
                  "/page/MenuDIVERTISSEMENT": "MenuDIVERTISSEMENT"
                  "/page/MenuJeunesse": "MenuJeunesse"
                  "/page/MenuCollabs": "MenuCollabs"
                  "/page/MenuMagazine": "MenuMagazine"

      # The home endpoint returns a flat ordered grid. `idType=6` rows are
      # section headers (title in `content.description`), followed by mixed
      # item rows: catalog items (`idType=8`), raw assets (`idType=4`),
      # live channels (`idType=1`) and link tiles (`idType=7`). Every row is
      # extracted into `home_rows`, then `group_items_by_header` rebuilds the
      # editorial sections between headers.
      - name: home_rows
        type: object[]
        pointer: "/*"
        select: all
        entries:
          - name: is_header
            type: boolean
            pointer: /content/0/idType
            actions:
              - type: map
                default: "false"
                argument:
                  "6": "true"
          - name: header_label
            type: string
            pointer: /content/0/content/description
          # Navigation link tiles are emitted above as categories; all other
          # link tiles are not media cards. Live channel rows duplicate
          # list_lives, and fullscreen rows are already exposed as banners.
          - name: is_skipped
            type: boolean
            pointer: /content/0/idType
            actions:
              - type: map
                default: "false"
                argument:
                  "7": "true"
                  "1": "true"
          - name: is_skipped
            type: boolean
            pointer: /content/0/tags/designMode/0
            actions:
              - type: map
                default: "false"
                argument:
                  "fullscreen": "true"
          # Card design mode drives the image slot: poster/square rows are
          # natively portrait, cover/hero-banner rows are natively landscape.
          - name: _design_mode
            type: string
            select: first
            pointer: /content/0/tags/designMode/0
          - name: title
            type: string
            pointer: /content/0/content/name
          - name: title
            type: string
            pointer: /content/0/content/directMetadata/AD_ASSTITLE
          - name: description
            type: string
            pointer: /content/0/content/synopsis
          - name: description
            type: string
            pointer: /content/0/content/directMetadata/AD_SYNO600C
          - name: link
            type: string
            pointer: /content/0[idType=8]/content/idCatalog
            actions:
              - type: format_text
                argument: "{base_url}/proxy/listContent?id={}&includeRoot={include_root}&languageId={language_id}"
          - name: link
            type: string
            pointer: /content/0/content/idChannel
          - name: link
            type: string
            pointer: /content/0[idType=4]/idItem
            actions:
              # Assets are fetched through their own endpoint. Keeping this URL
              # self-contained avoids incorrectly resolving the parent category.
              - type: format_text
                argument: "{base_url}/proxy/assets?assetIds=%5B{}%5D&languageId={language_id}"
          - name: media-type
            type: string
            select: first
            pointer: /content/0/idType
            actions:
              - type: map
                default: "video/show/other"
                argument:
                  "1": video/live
          # Catalog rows (idType=8) carry a `serie` flag; select: first lets it
          # replace the idType-derived value so series are typed correctly
          # (assets have no `serie` field and keep the idType-derived value).
          - name: media-type
            type: string
            select: first
            pointer: /content/0/content/serie
            actions:
              - type: map
                default: "video/show/other"
                argument:
                  "true": video/show/serie
          - name: img/poster > link
            type: string
            select: first
            actions:
              # Some portrait catalog cards (for example, MenuSerie's
              # "Nou rigole" and "Séries françaises" rails) provide an
              # imageType and item id but no imageId. Use the native CDN image
              # descriptor so poster cards remain visualized in both cases.
              - type: build_url
                base: "{cdn_base_url}/proxy/imgdata?type={image_type}&objectId={item_id}&languageId={language_id}"
                fields:
                  image_type: /content/0/tags/imageType
                  item_id: /content/0/idItem
          # Native image type + item id: works for rows carrying an `imageId`
          # (same bytes as type=image, verified live) and for rows without one
          # (e.g. `asset_vod-background` on bare assets), which type=image
          # cannot serve.
          - name: img/landscape > link
            type: string
            select: first
            actions:
              - type: build_url
                base: "{cdn_base_url}/proxy/imgdata?type={image_type}&objectId={item_id}&languageId={language_id}"
                fields:
                  image_type: /content/0/tags/imageType
                  item_id: /content/0/idItem
          - name: rating
            type: number
            pointer: /content/0/content/directMetadata/AD_SCORPUBL
          - name: morality
            type: number
            pointer: /content/0/content/moralityLevel
    post_process: &post_process_home_content
      - type: filter_items
        source: categories
        field: request > home_type
        pattern: "^Menu"
      # Keep exactly one image per row, in the slot matching its design mode:
      # poster/square rows keep img/poster, cover/hero-banner rows keep
      # img/landscape.
      - type: filter_fields
        source: home_rows
        field: _design_mode
        pattern: "^(poster|square)$"
        keep_matching: true
        remove:
          - img/landscape > link
      - type: filter_fields
        source: home_rows
        field: _design_mode
        pattern: "^(poster|square)$"
        keep_matching: false
        remove:
          - img/poster > link
          - _design_mode
      - type: group_items_by_header
        source: home_rows
        target: sections
        is_header_field: is_header
        label_field: header_label
        skip_fields:
          - is_skipped
        remove_item_fields:
          - is_header
          - header_label
          - is_skipped
          - _design_mode
        remove_source: true

  - name: get_category
    scraper_type: json
    request_method: post
    base_url: "{base_url}"
    query_url: "{base_url}/proxy/homeContent"
    request_body_actions:
      # Menu tiles resolve through the same editorial home endpoint as the
      # official `/page/Menu…` routes, not through the generic VOD hierarchy.
      - type: format_text
        argument: 'type={home_type}&languageId={language_id}'
    request_headers: *request_headers_json
    media_types: *media_types_antennereunion
    row_pointer: /result/homecontent
    entries: *entries_home_content
    post_process: *post_process_home_content

  - name: get_section
    scraper_type: json
    request_method: post
    base_url: "{base_url}"
    query_url: "{base_url}/proxy/listContent"
    request_body_actions:
      # The frontend sends the section link as the per-source `link` parameter.
      - type: format_text
        argument: 'id={link}&includeRoot={include_root}&languageId={language_id}'
    request_headers: *request_headers_json
    media_types: *media_types_antennereunion
    row_pointer: /result/items/0/payload
    entries:
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: total_pages
        type: number
        actions:
          - type: format_text
            argument: "1"
      - name: page_size
        type: number
        pointer: /absolute_asset_number
      - name: entries
        type: object[]
        pointer: /assets/*
        select: all
        entries: *entries_media_item_asset
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        page_size_field: page_size
        remove_fields:
          - total_pages
          - page_size

  - name: search
    scraper_type: json
    request_method: get
    base_url: "{base_url}"
    query_url: "{base_url}/cms/search?languageId={language_id}&fts={search_terms}"
    request_headers: *request_identity_header
    media_types: *media_types_antennereunion
    row_pointer: /result/data
    entries:
      # select: first: the scalar pagination fields are evaluated once per
      # result row and would otherwise accumulate one value per row.
      - name: current_page
        type: number
        select: first
        actions:
          - type: format_text
            argument: "{page}"
      - name: total_pages
        type: number
        select: first
        actions:
          - type: format_text
            argument: "1"
      - name: entries
        type: object[]
        pointer: "*"
        select: all
        entries:
          - name: title
            type: string
            pointer: /item/payload/title
          - name: description
            type: string
            pointer: /item/payload/synopsis
          - name: media-type
            type: string
            pointer: /item/type
            actions:
              - type: map
                default: "video/show/other"
                argument:
                  "asset": video/show/other
                  "series": video/show/serie
          # Series rows expose their catalog id in `usedIn.vod[0].idCatalog`.
          - name: link
            type: string
            pointer: /usedIn/vod/0/idCatalog
            actions:
              - type: format_text
                argument: "{base_url}/proxy/listContent?id={}&includeRoot={include_root}&languageId={language_id}"
          # Assets use their direct API endpoint rather than their parent
          # category, which may contain many unrelated programmes.
          - name: link
            type: string
            pointer: /usedIn/vod/0/idAsset
            actions:
              - type: format_text
                argument: "{base_url}/proxy/assets?assetIds=%5B{}%5D&languageId={language_id}"
          # Images: series use the category artwork, assets fall back to the
          # reliable asset background (asset posters return 404 on the CDN).
          - name: img/poster > link
            type: string
            pointer: /usedIn/vod/0/idCatalog
            actions:
              - type: build_url
                base: "{cdn_base_url}/proxy/imgdata?type=category_vod-poster&objectId={id}&languageId={language_id}"
                fields:
                  id: /usedIn/vod/0/idCatalog
          - name: img/poster > link
            type: string
            pointer: /usedIn/vod/0/idAsset
            actions:
              - type: build_url
                base: "{cdn_base_url}/proxy/imgdata?type=asset_vod-background&objectId={id}&languageId={language_id}"
                fields:
                  id: /usedIn/vod/0/idAsset
          - name: img/landscape > link
            type: string
            pointer: /usedIn/vod/0/idCatalog
            actions:
              - type: build_url
                base: "{cdn_base_url}/proxy/imgdata?type=category_vod-background&objectId={id}&languageId={language_id}"
                fields:
                  id: /usedIn/vod/0/idCatalog
          - name: img/landscape > link
            type: string
            pointer: /usedIn/vod/0/idAsset
            actions:
              - type: build_url
                base: "{cdn_base_url}/proxy/imgdata?type=asset_vod-background&objectId={id}&languageId={language_id}"
                fields:
                  id: /usedIn/vod/0/idAsset
          - name: year
            type: number
            pointer: /item/payload/metadata/tv.alphanetworks.tucano.releaseYear
          - name: theme
            type: string[]
            pointer: /item/payload/genre
          - name: morality
            type: number
            pointer: /item/payload/moralityLevel
    post_process:
      # EPG-only search hits have no VOD catalogue or asset target and cannot
      # open an entry page, so do not expose them as media cards.
      - type: filter_items
        source: entries
        field: link
        pattern: "^https://"
      - type: derive_pagination
        total_pages_field: total_pages
        remove_fields:
          - total_pages

  - name: get_entry
    scraper_type: json
    request_method: post
    base_url: "{base_url}"
    # Cards provide the complete, resource-specific API URL: listContent for
    # catalogues and assets for standalone programmes.
    query_url: "{query_url}"
    request_headers: *request_headers_json
    media_types: *media_types_antennereunion
    row_pointer: /result/items/0
    entries:
      - name: title
        type: string
        pointer: /payload/name
      - name: title
        type: string
        pointer: /directMetadata/AD_ASSTITLE
      - name: description
        type: string
        pointer: /payload/synopsis
      - name: description
        type: string
        pointer: /directMetadata/AD_SYNO600C
      - name: media-type
        type: string
        pointer: /payload/serie
        actions:
          - type: map
            default: "video/show/other"
            argument:
              "true": video/show/serie
      - name: media-type
        type: string
        pointer: /idAsset
        actions:
          - type: format_text
            argument: "video/show/other"
      - name: link
        type: string
        pointer: /payload/idCatalog
        actions:
          # Expose the catalog id as a dynamic variable so the `web-link` entry
          # below can build the official site's `<slug>-<id>` URL.
          - type: extract_variables
            pattern: '^(.*)$'
            name: '@id'
            value: '{1}'
      - name: link
        type: string
        pointer: /idAsset
        actions:
          - type: extract_variables
            pattern: '^(.*)$'
            name: '@id'
            value: '{1}'
      # Slugified catalog title (helper for web-link). The official site uses
      # `/series/<slug>-<id>/details` and `/content/<slug>-<id>`; the server
      # tolerates any slug (the id is authoritative), so a plain
      # transliterated slug is enough. The raw field is ignored by the frontend.
      - name: slug
        type: string
        select: first
        pointer: /payload/name
        actions:
          - type: regex_replace_all
            pattern: '[éèêëÉÈÊË]'
            replacement: 'e'
          - type: regex_replace_all
            pattern: '[àâäÀÂÄ]'
            replacement: 'a'
          - type: regex_replace_all
            pattern: '[îïÎÏ]'
            replacement: 'i'
          - type: regex_replace_all
            pattern: '[ôöÔÖ]'
            replacement: 'o'
          - type: regex_replace_all
            pattern: '[ùûüÙÛÜ]'
            replacement: 'u'
          - type: regex_replace_all
            pattern: '[çÇ]'
            replacement: 'c'
          - type: regex_replace_all
            pattern: '[œŒ]'
            replacement: 'oe'
          - type: regex_replace_all
            pattern: '[^A-Za-z0-9]+'
            replacement: '-'
          - type: regex_replace_all
            pattern: '^-+|-+$'
            replacement: ''
          - type: extract_variables
            pattern: '^(.*)$'
            name: '@slug'
            value: '{1}'
      - name: rating
        type: number
        pointer: /payload/directMetadata/AD_SCORPUBL
      - name: rating
        type: number
        pointer: /directMetadata/AD_SCORPUBL
      - name: morality
        type: number
        pointer: /payload/moralityLevel
      - name: morality
        type: number
        pointer: /moralityLevel
      - name: content-advisor
        type: string
        pointer: /directMetadata/AD_SUBTITLE
      - name: director
        type: string[]
        pointer: /directMetadata/AD_LIREALIS
        actions:
          - type: regex_replace_all
            pattern: '^\s+|\s+$'
            replacement: ''
      - name: duration
        type: number
        pointer: /directMetadata/TS_DURATION
        actions:
          - type: ratio
            argument: 60
      - name: theme
        type: string[]
        pointer: /directMetadata/AD_LIGENRES
      - name: img/poster > link
        type: string
        pointer: /payload/idCatalog
        actions:
          # Catalog visuals are served by the CDN directly from the catalog id
          # (verified live: category_vod-poster/background/logo all resolve).
          - type: build_url
            base: "{cdn_base_url}/proxy/imgdata?type=category_vod-poster&objectId={id}&languageId={language_id}"
            fields:
              id: /payload/idCatalog
      - name: img/poster > link
        type: string
        pointer: /idAsset
        actions:
          - type: build_url
            base: "{cdn_base_url}/proxy/imgdata?type=asset_vod-background&objectId={id}&languageId={language_id}"
            fields:
              id: /idAsset
      - name: img/landscape > link
        type: string
        pointer: /payload/idCatalog
        actions:
          - type: build_url
            base: "{cdn_base_url}/proxy/imgdata?type=category_vod-background&objectId={id}&languageId={language_id}"
            fields:
              id: /payload/idCatalog
      - name: img/landscape > link
        type: string
        pointer: /idAsset
        actions:
          - type: build_url
            base: "{cdn_base_url}/proxy/imgdata?type=asset_vod-background&objectId={id}&languageId={language_id}"
            fields:
              id: /idAsset
      - name: img/logo > link
        type: string
        pointer: /payload/idCatalog
        actions:
          - type: build_url
            base: "{cdn_base_url}/proxy/imgdata?type=category_vod-logo&objectId={id}&languageId={language_id}"
            fields:
              id: /payload/idCatalog
      - name: players
        type: object[]
        pointer: /
        select: all
        entries:
          - name: name
            type: string
            actions:
              - type: format_text
                argument: "Antenne Réunion"
          - name: resolver
            type: object
            entries:
              - name: kind
                type: string
                actions:
                  - type: format_text
                    argument: "antennereunion-video"
              - name: target_id
                type: string
                pointer: /idAsset
      - name: trailer
        type: object
        pointer: /directMetadata
        entries:
          - name: resolver
            type: object
            entries:
              - name: kind
                type: string
                actions:
                  - type: format_text
                    argument: scraper-query
              - name: target_id
                type: string
                pointer: /AD_LITRAILE/0/idMedia
                actions:
                  - type: format_text
                    argument: "{base_url}/proxy/readTrailer?idMedia={}"
              - name: source
                type: string
                actions:
                  - type: format_text
                    argument: antennereunion-fr
      # Official website URL. Series live under /series/<slug>-<id>/details
      # (the server only answers series pages with the /details suffix),
      # everything else under /content/<slug>-<id> (no suffix). Both verified
      # live against www.antennereunion.fr.
      - name: web-link
        type: string
        select: first
        pointer: /payload/serie
        actions:
          - type: map
            argument:
              "true": "https://www.antennereunion.fr/series/{@slug}-{@id}/details"
              "false": "https://www.antennereunion.fr/content/{@slug}-{@id}"
          - type: replace_variables
          - type: format_text
            argument: "{}"
      - name: web-link
        type: string
        pointer: /idAsset
        actions:
          # Asset URLs require a slug, but the official website resolves it by
          # id; a stable generic slug is therefore sufficient here.
          - type: format_text
            argument: "https://www.antennereunion.fr/content/asset-{@id}"
          - type: replace_variables
      - name: seasons
        type: object[]
        pointer: /payload/categories/*
        select: all
        entries:
          - name: label
            type: string
            pointer: /name
          - name: link
            type: string
            pointer: /idCatalog

  - name: resolve_stream
    scraper_type: json
    request_method: post
    base_url: "{base_url}"
    query_url: "{base_url}/proxy/readTrailer"
    request_body_pointer: /url
    request_body_select: first
    request_body_actions:
      - type: regex_find_all
        pattern: '[?&]idMedia=([^&#]+)'
        format: 'idMedia={1}'
    request_headers: *request_headers_json
    row_pointer: /result
    entries:
      - name: stream_url
        type: string[]
        pointer: /url
        select: all
      - name: manifest_type
        type: string
        pointer: /url
        select: first
        actions:
          - type: regex_find_all
            pattern: '\.(mpd|m3u8)(?:[?#]|$)'
            format: '{1}'

  - name: get_season
    scraper_type: json
    request_method: post
    base_url: "{base_url}"
    query_url: "{base_url}/proxy/listContent"
    request_body_actions:
      # The backend `get_season` feeds `query_url` with the season link
      # (the season's `idCatalog` emitted by `get_entry > seasons`).
      - type: format_text
        argument: 'id={query_url}&includeRoot={include_root}&languageId={language_id}'
    request_headers: *request_headers_json
    media_types: *media_types_antennereunion
    row_pointer: /result/items/0/payload
    entries:
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: have_more
        type: boolean
        actions:
          - type: format_text
            argument: "false"
      - name: episodes
        type: object[]
        pointer: /assets/*
        select: all
        entries: *entries_episode

  - name: list_lives
    scraper_type: json
    request_method: post
    base_url: "{base_url}"
    query_url: "{base_url}/proxy/listChannels"
    request_body_actions: *request_body_language
    request_headers: *request_headers_json
    media_types:
      - video/live
    # The unified executor merges every extracted row into a single root node,
    # so a multi-item payload like live channels needs a group field combined
    # with `result_item_field` to flatten one item per channel back out.
    row_pointer: /
    result_item_field: entries
    entries:
      - name: entries
        type: object[]
        pointer: /result/channels/*
        select: all
        entries:
          - name: key
            type: string
            select: first
            pointer: /idChannel
          - name: title
            type: string
            select: first
            pointer: /name
          - name: media-type
            type: string
            select: first
            actions:
              - type: format_text
                argument: "video/live"
          - name: link
            type: string
            select: first
            pointer: /idChannel
          - name: channel
            type: string
            select: first
            pointer: /name
          - name: tags
            type: string[]
            pointer: /tags
          - name: img/poster > link
            type: string
            select: first
            actions: *actions_channel_image_to_url
          - name: img/portrait > link
            type: string
            select: first
            actions: *actions_channel_image_to_url
          - name: img/landscape > link
            type: string
            select: first
            actions: *actions_channel_image_to_url

  - name: get_live
    scraper_type: json
    request_method: post
    base_url: "{base_url}"
    query_url: "{base_url}/proxy/epg"
    request_body_actions:
      - type: format_text
        argument: 'languageId={language_id}&midnight={midnight}&startHour=0&endHour={epg_hours}&channelIds={channel_id}'
    request_headers: *request_headers_json
    media_types:
      - video/live
    row_pointer: /result/epg/*/*
    entries:
      - name: key
        type: string
        actions:
          - type: format_text
            argument: "{channel_id}"
      - name: title
        type: string
        pointer: /title
      - name: description
        type: string
        pointer: /synopsis
      - name: release-date
        type: number
        pointer: /startutc
      - name: expire
        type: number
        pointer: /endutc
      - name: genre
        type: string
        pointer: /genre
      - name: rating
        type: number
        pointer: /rating
      - name: players
        type: object[]
        entries:
          - name: name
            type: string
            actions:
              - type: format_text
                argument: "Antenne Réunion"
          - name: resolver
            type: object
            entries:
              - name: kind
                type: string
                actions:
                  - type: format_text
                    argument: "antennereunion-live"
              - name: target_id
                type: string
                actions:
                  - type: format_text
                    argument: "{channel_id}"
