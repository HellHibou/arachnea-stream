  - name: search
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{graphql_url}"
    request_method: post
    request_headers: *live_headers
    media_types: *catalogue_types
    request_body_actions:
      - type: build_json
        fields:
          text: {string_parameter: search_query}
      - type: format_text
        argument: >-
          {"query":"query($text: String!) { searchFor(userQuery: $text, platform: \"web\") {
          channels { edges { item { ... on User { {channel_fields} stream { {live_fields} } } } } } } }",
          "variables":{}}
    row_pointer: /data/searchFor/channels
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - *current_page
      - name: have_more
        type: boolean
        actions:
          - type: format_text
            argument: "false"
      - name: entries
        type: object[]
        pointer: /edges/*/item
        entries: *channel_cards
      - name: entries
        type: object[]
        pointer: /edges/*/item/stream
        entries: *live_cards
    post_process:
      - type: filter_items
        source: entries
        field: web-link
        pattern: '^https://www\.twitch\.tv/[a-z0-9_]+$'

  - name: get_entry
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{graphql_url}"
    request_method: post
    request_headers: *live_headers
    media_types: *live_types
    request_body_actions:
      - &media_target
        type: format_text
        argument: "{query_url}"
      - &media_path
        type: regex_find_all
        pattern: '^https://(www\.twitch\.tv/(?:videos/[0-9]+|[a-zA-Z0-9_]+)|clips\.twitch\.tv/[a-zA-Z0-9_-]+)/?$'
        format: "{1}"
      - type: format_text
        argument: >-
          const path = "{}".split("/");
          const id = path[path.length - 1];
          let query;
          if (path[0] === "clips.twitch.tv") {
            query = "query($id: ID!) { clip(slug: $id) { {clip_fields} channel: broadcaster { {channel_fields} } } }";
          } else if (path.length === 3) {
            query = "query($id: ID!) { video(id: $id) { {vod_fields} {vod_chapters} description seekPreviewsURL channel: owner { {channel_fields} } } }";
          } else if (path[0] === "www.twitch.tv") {
            query = "query($id: String!) { user(login: $id) { {channel_fields} description stream { {live_fields} } } }";
          }
          if (query) document.write(JSON.stringify({query, variables: {id}}));
      - *exec_js
      - *unwrap_js
    row_pointer: /data/*
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: title
        type: string
        select: first
        pointer: /displayName
      - name: title
        type: string
        select: first
        pointer: /title
      - name: title
        type: string
        select: first
        pointer: /stream/title
      - name: description
        type: string
        pointer: /description
      - *video_type
      - *entry_live_media_type
      - name: theme
        type: string[]
        pointer: /stream/broadcaster/login
        actions:
          - type: format_text
            argument: Live
      - name: link
        type: string
        actions:
          - type: format_text
            argument: "{query_url}"
      - name: web-link
        type: string
        actions:
          - type: format_text
            argument: "{query_url}"
      - *archive_image
      - name: img/landscape > link
        type: string
        pointer: /stream/previewImageURL
      - *archive_date
      - name: release-date
        type: string
        pointer: /stream/createdAt
        actions: *release_date
      - *archive_duration
      - *archive_genre
      - name: genre
        type: string[]
        pointer: /stream/game/displayName
      - name: lang/audio
        type: string[]
        pointer: /language
        actions: *language_code
      - name: lang/audio
        type: string[]
        pointer: /stream/language
        actions: *language_code
      - name: channel > name
        type: string
        pointer: /displayName
      - name: channel > name
        type: string
        pointer: /channel/displayName
      - name: channel > logo
        type: string
        pointer: /profileImageURL
      - name: channel > logo
        type: string
        pointer: /channel/profileImageURL
      - name: channel > request > query_url
        type: string
        pointer: /login
        actions: *channel_link
      - name: channel > request > query_url
        type: string
        pointer: /channel/login
        actions: *channel_link
      - name: players
        type: object[]
        entries: *player
    post_process:
      - type: filter_items
        source: players
        field: name
        pattern: '.+'
      - type: filter_fields
        source: players
        field: name
        pattern: '.+'
        remove: [_storyboard_index]

  - name: resolve_stream
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{graphql_url}"
    request_method: post
    request_headers: *live_headers
    request_body_actions:
      - *media_target
      - *media_path
      - type: format_text
        argument: >-
          const path = "{}".split("/");
          const id = path[path.length - 1];
          const params = '{playback_params}';
          let query;
          if (path[0] === "clips.twitch.tv") {
            query = "query($id: ID!) { clip(slug: $id) { id: slug videoQualities { sourceURL quality frameRate }" +
              " playbackAccessToken(params: {" + params + "}) { value signature } } }";
          } else if (path.length === 3) {
            query = "query($id: ID!) { video(id: $id) { id {vod_chapters} seekPreviewsURL } vod: videoPlaybackAccessToken(id: $id, params: {" +
              params + "}) { value signature authorization { isForbidden } } }";
          } else if (path[0] === "www.twitch.tv") {
            query = "query PlaybackAccessToken_Template($id: String!) { user(login: $id) { login stream { id } }" +
              " live: streamPlaybackAccessToken(channelName: $id, params: {" + params +
              "}) { value signature authorization { isForbidden } } }";
          }
          if (query) document.write(JSON.stringify({query, variables: {id}}));
      - *exec_js
      - *unwrap_js
    row_pointer: /
    entries:
      - name: error_message
        type: string
        pointer: /errors/0/message
      - name: chapters
        type: object[]
        pointer: /data/video/moments/edges/*/node
        entries: *chapter_entries
      - name: _storyboard_index
        type: string
        pointer: /data/video/seekPreviewsURL
        sub_queries: *vod_storyboard
      - name: streams
        type: object[]
        entries:
          - name: type
            type: string
            select: first
            actions:
              - type: format_text
                argument: hls
          - name: type
            type: string
            select: first
            pointer: /data/clip/id
            actions:
              - type: format_text
                argument: mp4
          - name: url
            type: string
            pointer: /data
            actions:
              - type: format_text
                argument: >-
                  const data = {};
                  if (data) {
                    let url;
                    let access;
                    if (data.clip) {
                      access = data.clip.playbackAccessToken;
                      const qualities = (data.clip.videoQualities || []).filter(quality => quality && quality.sourceURL);
                      qualities.sort((a, b) => Number(b.quality) - Number(a.quality) || b.frameRate - a.frameRate);
                      url = qualities.length ? qualities[0].sourceURL : "";
                    } else if (data.user && data.user.stream) {
                      access = data.live;
                      url = "{usher_url}/api/channel/hls/" + encodeURIComponent(data.user.login) + ".m3u8";
                    } else if (data.video) {
                      access = data.vod;
                      url = "{usher_url}/vod/" + encodeURIComponent(data.video.id) + ".m3u8";
                    }
                    if (url && access && access.value && access.signature && !access.authorization?.isForbidden) {
                      const separator = url.includes("?") ? "&" : "?";
                      const hls = data.clip ? "" : "allow_source=true&allow_audio_only=true&player_backend=mediaplayer&playlist_include_framerate=true&";
                      document.write(url + separator + hls + "sig=" + encodeURIComponent(access.signature) +
                        "&token=" + encodeURIComponent(access.value));
                    }
                  }
              - *exec_js
              - type: regex_find_all
                pattern: '^document_write=(https://[^\s]+)$'
                format: "{1}"
          - name: stream_headers
            type: object
            select: first
            entries:
              # Distinct YAML keys carry separate actions for the same case-insensitive proxy header.
              - name: Arachnea-Proxy-ReplaceAll
                type: string
                actions:
                  - type: format_text
                    argument: >-
                      {"pattern":"(?m)^#EXT-X-DATERANGE:(?:[A-Z0-9-]+=(?:\"[^\"\\r\\n]*\"|[^\",\\r\\n]+),)*CLASS=\"twitch-ad-quartile\"(?:,[^\\r\\n]*)?(?:\\r?\\n|\\z)",
                      "order":0,
                      "replacement":"",
                      "content_types":["application/vnd.apple.mpegurl","application/x-mpegurl","audio/mpegurl","audio/x-mpegurl"]}
              - name: arachnea-proxy-replaceall
                type: string
                actions:
                  - type: format_text
                    argument: >-
                      {"pattern":"(?m)^(#EXTINF:[0-9]+(?:\\.[0-9]+)?),Amazon\\|[^\\r\\n]*(\\r?\\n)[^#\\r\\n \\t][^\\r\\n]*",
                      "order":1,
                      "replacement":"$1,$2#EXT-X-GAP${2}data:application/octet-stream,",
                      "content_types":["application/vnd.apple.mpegurl","application/x-mpegurl","audio/mpegurl","audio/x-mpegurl"]}
    post_process:
      - type: filter_items
        source: streams
        field: url
        pattern: '.+'
      - type: remove_fields
        fields: [_storyboard_index]
