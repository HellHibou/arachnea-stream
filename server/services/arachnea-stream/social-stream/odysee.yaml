id: odysee
title: "Odysee"
logo: "https://plugins.grayjay.app/Odysee/OdyseeIcon.png"
description:
  fr: "Plateforme de partage video decentralisee Odysee (reseau LBRY)."
  en: "Odysee decentralized video sharing platform (LBRY network)."

http:
  mode: direct
  user_agent_profile: chrome

# ############################################################################
# Parameters and constants
# ############################################################################
parameters:
  - name: language
    value: en
    label: Language
    description: Language of the channel tabs from Odysee's interface dictionary.
    editor:
      type: select
      options:
        - value: en
          label: English
        - value: fr
          label: Français

constants:
  - name: base_url
    value: "https://odysee.com"
    description: Public website base URL used for content API calls, web links and player stream redirects.
  - name: api_base
    value: "https://api.na-backend.odysee.com"
    description: Odysee LBRY backend API used for claim searches.
  - name: content_url
    value: "{base_url}/$/api/content/v2/get"
    description: Content API endpoint returning the category tree.
  - name: claim_search_url
    value: "{api_base}/api/v1/proxy?m=claim_search"
    description: Claim search proxy endpoint used for category listings.
  - name: resolve_url
    value: "{api_base}/api/v1/proxy?m=resolve"
  - name: comments_url
    value: "https://comments.odysee.tv/api/v2?m=setting.Get"
  - name: live_url
    value: "https://api.odysee.live"
    description: Odysee live API endpoint.
  - name: search_url
    value: "https://lighthouse.odysee.tv/search"
    description: Lighthouse full-text search endpoint returning claim identifiers.
  - name: page_size
    value: "24"
    description: Number of upstream search results requested per page.
  - name: category_body
    value: '{"jsonrpc":"2.0","method":"claim_search","params":{{category_filter},"page":{page},"page_size":24,"no_totals":true},"id":1}'
    description: JSON-RPC body used to list tagged claims or videos from one channel.
  - name: category_kind
    value: tag
    description: Category search mode, overridden by category requests for a channel ID or URL.
  - name: category_label
    value: "{any_tags}"
    description: Section label, overridden with the channel title by channel category requests.
  - name: entry_body
    value: '{"jsonrpc":"2.0","method":"claim_search","params":{"claim_ids":["{query_url}"],"page_size":1,"no_totals":true},"id":1}'
    description: JSON-RPC body used to resolve one claim by its id.

shared:
  media_types_odysee: &media_types_odysee
    - video/movie
    - video/show/anime
    - video/show/documentary
    - video/show/other
    - video/news
    - video/live
    - video/other

  headers_json: &headers_json
    - name: "Content-Type"
      actions:
        - type: format_text
          argument: "application/json"

  entries_media_cards: &entries_media_cards
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      pointer: /value/title
    - name: description
      type: string
      pointer: /value/description
    - name: duration
      type: number
      pointer: /value/video/duration
    - name: media-type
      type: string
      actions:
        - type: format_text
          argument: "video/other"
    - name: theme
      type: string[]
      pointer: /value/tags
    - name: link
      type: string
      pointer: /claim_id
    - name: web-link
      type: string
      pointer: /canonical_url
      actions:
        - type: replace_text
          search: "lbry://"
          replace: "https://odysee.com/"
    - name: img/landscape > link
      type: string
      pointer: /value/thumbnail/url
    - name: img > link
      type: string
      pointer: /value/thumbnail/url

queries:
  - name: service_stream_metadata
    scraper_type: static
    media_types: *media_types_odysee
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"

  - name: load_home
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{content_url}"
    row_pointer: /
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: banners > entries
        type: object[]
        pointer: /data/en/featured/items/*
        entries:
          - name: media-type
            type: string
            actions:
              - type: format_text
                argument: collection
          - name: title
            type: string
            pointer: /label
          - name: image
            type: string
            pointer: /image
          - name: link
            type: string
            pointer: /url
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{claim_search_url}"
          - name: request > category_kind
            type: string
            actions:
              - type: format_text
                argument: channel_url
          - name: request > channel_url
            type: string
            pointer: /url
            actions:
              - type: regex_find_all
                pattern: '^https://odysee\.com/(@[\p{L}\p{N}_.~%-]+(?::[0-9a-fA-F]+)?)/?$'
                format: "lbry://{1}"
          - name: request > category_label
            type: string
            pointer: /label
      - name: sections
        type: object[]
        pointer: /data/en/categories/*
        entries:
          - name: key
            type: string
            pointer: /name
          - name: label
            type: string
            pointer: /label
          - name: description
            type: string
            pointer: /description
          - name: link
            type: string
            pointer: /name
          - name: request > category_filter
            type: string
            pointer: /name
            actions:
              - type: format_text
                argument: '"any_tags":"{}","order_by":["trending_group","trending_mixed"],"has_source":true,"exclude_shorts":true'
          - name: request > category_label
            type: string
            pointer: /label

  - name: get_category
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{claim_search_url}"
    request_method: post
    request_body_pointer: /category_body
    query_param_mappings:
      - target_param: category_filter
        source_param: category_kind
        values:
          tag: '"any_tags":"{any_tags}","order_by":["trending_group","trending_mixed"],"has_source":true,"exclude_shorts":true'
          channel: '"channel_ids":["{channel_id}"],"claim_type":"stream","stream_types":["video"],"order_by":["trending_group","trending_mixed"],"has_source":true,"exclude_shorts":true'
          channel_url: '"channel":"{channel_url}","claim_type":"stream","stream_types":["video"],"order_by":["release_time"],"has_source":true,"exclude_shorts":true'
          channel_content: '"channel":"{channel_url}","claim_type":"stream","stream_types":["video"],"order_by":["release_time"],"has_source":true'
          channel_shorts: '"channel":"{channel_url}","claim_type":"stream","stream_types":["video"],"order_by":["release_time"],"has_source":true,"duration":"<=180"'
          channel_playlists: '"channel":"{channel_url}","claim_type":"collection","order_by":["release_time"]'
          playlist: '"claim_ids":{playlist_ids},"claim_type":"stream","stream_types":["video"],"has_source":true'
        item_suffix: ""
    request_headers: *headers_json
    row_pointer: /
    entries:
      - name: channel_request
        type: string
        actions:
          - type: format_text
            argument: "{category_kind}|{channel_url}"
          - type: regex_find_all
            pattern: '^channel(?:_url|_content|_shorts|_playlists)?\|lbry://@[^/\s"\\]+$'
            format: "{resolve_url}"
        sub_queries:
          - scraper_type: json
            target: parent
            request_method: post
            request_headers: *headers_json
            request_body_actions:
              - type: format_text
                argument: '{"jsonrpc":"2.0","method":"resolve","params":{"urls":["{channel_url}"]},"id":1}'
            row_pointer: /result/*
            row_filters:
              /value_type: [channel]
            entries:
              - name: channel_claim_id
                type: string
                pointer: /claim_id
              - name: channel_name
                type: string
                pointer: /name
              - name: banners > entries
                type: object[]
                pointer: /
                entries:
                  - name: key
                    type: string
                    pointer: /claim_id
                  - name: title
                    type: string
                    select: first
                    pointer: /name
                  - name: title
                    type: string
                    select: first
                    pointer: /value/title
                  - name: image
                    type: string
                    pointer: /value/cover/url
                  - name: logo
                    type: string
                    pointer: /value/thumbnail/url
              - name: channel_labels_request
                type: string
                pointer: /claim_id
                actions:
                  - type: format_text
                    argument: "{base_url}/app-strings/{language}.json"
                sub_queries:
                  - scraper_type: json
                    target: parent
                    http:
                      empty_on_statuses: [404, 429, 502, 503, 504]
                    row_pointer: /
                    entries:
                      - name: categories
                        type: object[]
                        pointer: /
                        entries:
                          - name: key
                            type: string
                            actions:
                              - type: format_text
                                argument: home
                          - name: label
                            type: string
                            select: first
                            actions:
                              - type: format_text
                                argument: Home
                          - name: label
                            type: string
                            select: first
                            pointer: /Home
                          - &odysee_tab_query_url
                            name: request > query_url
                            type: string
                            actions:
                              - type: format_text
                                argument: "{claim_search_url}"
                          - name: request > category_kind
                            type: string
                            actions:
                              - type: format_text
                                argument: channel_url
                          - &odysee_tab_channel_url
                            name: request > channel_url
                            type: string
                            actions:
                              - type: format_text
                                argument: "{channel_url}"
                          - &odysee_tab_category_label
                            name: request > category_label
                            type: string
                            actions:
                              - type: format_text
                                argument: "{category_label}"
                      - name: categories
                        type: object[]
                        pointer: /
                        entries:
                          - name: key
                            type: string
                            actions:
                              - type: format_text
                                argument: content
                          - name: label
                            type: string
                            select: first
                            actions:
                              - type: format_text
                                argument: Content
                          - name: label
                            type: string
                            select: first
                            pointer: /Content
                          - *odysee_tab_query_url
                          - name: request > category_kind
                            type: string
                            actions:
                              - type: format_text
                                argument: channel_content
                          - *odysee_tab_channel_url
                          - *odysee_tab_category_label
                      - name: categories
                        type: object[]
                        pointer: /
                        entries:
                          - name: key
                            type: string
                            actions:
                              - type: format_text
                                argument: shorts
                          - name: label
                            type: string
                            select: first
                            actions:
                              - type: format_text
                                argument: Shorts
                          - name: label
                            type: string
                            select: first
                            pointer: /Shorts
                          - *odysee_tab_query_url
                          - name: request > category_kind
                            type: string
                            actions:
                              - type: format_text
                                argument: channel_shorts
                          - *odysee_tab_channel_url
                          - *odysee_tab_category_label
                      - name: categories
                        type: object[]
                        pointer: /
                        entries:
                          - name: key
                            type: string
                            actions:
                              - type: format_text
                                argument: playlists
                          - name: label
                            type: string
                            select: first
                            actions:
                              - type: format_text
                                argument: Playlists
                          - name: label
                            type: string
                            select: first
                            pointer: /Playlists
                          - *odysee_tab_query_url
                          - name: request > category_kind
                            type: string
                            actions:
                              - type: format_text
                                argument: channel_playlists
                          - *odysee_tab_channel_url
                          - *odysee_tab_category_label
              - name: channel_settings_request
                type: string
                pointer: /claim_id
                actions:
                  - type: format_text
                    argument: "{category_kind}:{page}"
                  - type: regex_find_all
                    pattern: '^channel(?:_url)?:1$'
                    format: "{comments_url}"
                sub_queries:
                  - scraper_type: json
                    target: parent
                    http:
                      empty_on_statuses: [404, 429, 502, 503, 504]
                    request_method: post
                    request_headers: *headers_json
                    request_body_actions:
                      - type: format_text
                        argument: '{"jsonrpc":"2.0","method":"setting.Get","params":{"channel_id":"{channel_claim_id}","channel_name":"{channel_name}"},"id":1}'
                    row_pointer: /
                    entries:
                      - name: pinned_claim_id
                        type: string
                        select: first
                        pointer: /result/homepage_settings/*[type=featured]/claim_id
                      - name: pinned_claim_id
                        type: string
                        select: first
                        pointer: /result/homepage_settings/sections/*[type=featured]/claim_id
                      - name: pinned_video_request
                        type: string
                        select: first
                        pointer: /result/homepage_settings/*[type=featured]/claim_id
                        actions: &pinned_video_actions
                          - type: regex_find_all
                            pattern: '^[0-9a-f]{40}$'
                            format: "{claim_search_url}"
                        sub_queries: &pinned_video_queries
                          - scraper_type: json
                            target: parent
                            request_method: post
                            request_headers: *headers_json
                            request_body_actions:
                              - type: format_text
                                argument: '{"jsonrpc":"2.0","method":"claim_search","params":{"claim_ids":["{pinned_claim_id}"],"page_size":1,"no_totals":true},"id":1}'
                            row_pointer: /
                            entries:
                              - name: sections
                                type: object[]
                                pointer: /result/items/*[value/stream_type=video]
                                entries:
                                  - name: key
                                    type: string
                                    actions:
                                      - type: format_text
                                        argument: pinned
                                  - name: entries
                                    type: object[]
                                    pointer: /
                                    entries: *entries_media_cards
                      - name: pinned_video_settings_request
                        type: string
                        select: first
                        pointer: /result/homepage_settings/sections/*[type=featured]/claim_id
                        actions: *pinned_video_actions
                        sub_queries: *pinned_video_queries
      - &odysee_category_section
        name: sections
        type: object[]
        pointer: /
        select: all
        entries:
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "{category_label}"
          - &odysee_rail_key
            name: key
            type: string
            actions:
              - type: format_text
                argument: "rail:{category_label}"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{claim_search_url}"
          - name: current_page
            type: number
            actions:
              - type: format_text
                argument: "{page}"
          - name: request > category_filter
            type: string
            actions:
              - type: format_text
                argument: "{category_filter}"
          - name: request > category_kind
            type: string
            actions:
              - type: format_text
                argument: "{category_kind}"
          - name: request > category_label
            type: string
            actions:
              - type: format_text
                argument: "{category_label}"
          - name: page_size
            type: number
            pointer: /result/page_size
          - name: infer_have_more_from_full_page
            type: boolean
            actions:
              - type: format_text
                argument: "true"
          - name: pagination_items
            type: object[]
            pointer: /result/items/*
            entries:
              - name: id
                type: string
                pointer: /claim_id
      # Filter candidates before merging them into the paginated rail.
      - &odysee_category_channel
        name: sections
        type: object[]
        pointer: /result/items/*[value_type=channel]
        entries:
          - *odysee_rail_key
          - name: entries
            type: object[]
            pointer: /
            entries: &entries_channel_cards
              - name: media-type
                type: string
                actions:
                  - type: format_text
                    argument: collection
              - name: key
                type: string
                pointer: /claim_id
              - name: title
                type: string
                pointer: /value/title
              - name: img > link
                type: string
                pointer: /value/thumbnail/url
              - name: request > query_url
                type: string
                actions:
                  - type: format_text
                    argument: "{claim_search_url}"
              - name: request > category_kind
                type: string
                actions:
                  - type: format_text
                    argument: channel
              - name: request > channel_id
                type: string
                pointer: /claim_id
              - name: request > channel_url
                type: string
                pointer: /canonical_url
              - name: request > category_label
                type: string
                pointer: /value/title
              - name: request > source
                type: string
                actions:
                  - type: format_text
                    argument: "{source}"
      - &odysee_category_video
        name: sections
        type: object[]
        pointer: /result/items/*[value/stream_type=video]
        entries:
          - *odysee_rail_key
          - name: hide_from_shorts
            type: boolean
            actions:
              - type: extract_field
                path: /value
              - type: format_text
                argument: "{category_kind}|{}"
              - type: regex_find_all
                pattern: '(?s)^channel_shorts\|(\{.+\})$'
                format: 'document.write(hideFromShorts({1}.video));'
              - type: exec_js
                scripts:
                  - 'function hideFromShorts(video) { return !video || !(video.width > 0 && video.height > 0 && video.width / video.height <= 0.8); }'
              - type: regex_find_all
                pattern: '^document_write=(true|false)$'
                format: "{1}"
          - name: entries
            type: object[]
            pointer: /
            entries: *entries_media_cards
      - &odysee_category_playlist
        name: sections
        type: object[]
        pointer: /result/items/*[value_type=collection]
        entries:
          - *odysee_rail_key
          - name: entries
            type: object[]
            pointer: /
            entries:
              - name: media-type
                type: string
                actions:
                  - type: format_text
                    argument: collection
              - name: title
                type: string
                pointer: /value/title
              - name: img/landscape > link
                type: string
                pointer: /value/thumbnail/url
              - name: request > query_url
                type: string
                actions:
                  - type: format_text
                    argument: "{claim_search_url}"
              - name: request > category_kind
                type: string
                actions:
                  - type: format_text
                    argument: playlist
              - name: request > playlist_ids
                type: string
                actions:
                  - type: extract_field
                    path: /value/claims
              - name: request > category_label
                type: string
                pointer: /value/title
    post_process:
      - &odysee_filter_shorts
        type: filter_items
        source: sections
        field: hide_from_shorts
        pattern: '^true$'
        keep_matching: false
      - &odysee_merge_rail
        type: merge_items_by_field
        source: sections
        field: key
        merge_fields: [entries]
      - &odysee_category_pagination
        type: derive_pagination
        source: sections
        entries_field: pagination_items
        page_size_field: page_size
        infer_from_full_page_field: infer_have_more_from_full_page
        remove_fields:
          - pagination_items
          - page_size
          - infer_have_more_from_full_page
      - type: sort_items
        source: sections
        field: key
        method: asc
      - type: remove_fields
        fields: [channel_request, channel_name, channel_claim_id, channel_labels_request, channel_settings_request, pinned_claim_id, pinned_video_request, pinned_video_settings_request]

  - name: get_section
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{claim_search_url}"
    request_method: post
    request_body_pointer: /category_body
    request_headers: *headers_json
    row_pointer: /
    entries:
      - *odysee_category_section
      - *odysee_category_channel
      - *odysee_category_video
      - *odysee_category_playlist
    post_process:
      - *odysee_filter_shorts
      - *odysee_merge_rail
      - *odysee_category_pagination

  - name: search
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{search_url}?s={search_terms}&size={page_size}&from={offset}"
    media_types: *media_types_odysee
    row_pointer: /
    entries:
      - name: source
        select: first
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        select: first
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: page_size
        select: first
        type: number
        actions:
          - type: format_text
            argument: "{page_size}"
      - name: infer_have_more_from_full_page
        select: first
        type: boolean
        actions:
          - type: format_text
            argument: "true"
      - name: pagination_items
        type: object[]
        pointer: /*
        entries:
          - name: id
            type: string
            pointer: /claimId
      # One selected hit builds the batch body from the full response; an empty page skips it.
      - name: search_body
        type: string
        pointer: /0/claimId
        actions:
          - type: extract_field
            path: ""
          - type: format_text
            argument: >-
              document.write(JSON.stringify({jsonrpc: "2.0", method: "claim_search", id: 1,
                params: {claim_ids: {}.map(item => item.claimId),
                  page_size: {page_size}, no_totals: true}}));
          - type: exec_js
          - type: replace_text
            search: "document_write="
            replace: ""
      - name: search_request
        type: string
        pointer: /0/claimId
        actions:
          - type: format_text
            argument: "{claim_search_url}"
        sub_queries:
          - scraper_type: json
            target: parent
            request_actions:
              - type: format_text
                argument: "{claim_search_url}"
            request_method: post
            request_body_actions:
              - type: format_text
                argument: "{search_body}"
            request_headers: *headers_json
            row_pointer: /
            entries:
              - name: entries
                type: object[]
                pointer: /result/items/*[value_type=channel]
                entries: *entries_channel_cards
              - name: entries
                type: object[]
                pointer: /result/items/*[value/stream_type=video]
                entries: *entries_media_cards
    post_process:
      - type: derive_pagination
        entries_field: pagination_items
        page_size_field: page_size
        infer_from_full_page_field: infer_have_more_from_full_page
        remove_fields:
          - search_body
          - search_request
          - pagination_items
          - page_size
          - infer_have_more_from_full_page

  - name: get_entry
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{claim_search_url}"
    request_method: post
    request_body_pointer: /entry_body
    request_headers: *headers_json
    row_pointer: /
    entries:
      - name: title
        type: string
        pointer: /result/items/0/value/title
      - name: description
        type: string
        pointer: /result/items/0/value/description
      - name: duration
        type: number
        pointer: /result/items/0/value/video/duration
      - name: media-type
        type: string
        actions:
          - type: format_text
            argument: "video/other"
      - name: theme
        type: string[]
        pointer: /result/items/0/value/tags
      - name: link
        type: string
        actions:
          - type: format_text
            argument: "{query_url}"
      - name: web-link
        type: string
        pointer: /result/items/0/canonical_url
        actions:
          - type: replace_text
            search: "lbry://"
            replace: "https://odysee.com/"
      - name: img/landscape > link
        type: string
        pointer: /result/items/0/value/thumbnail/url
      - name: img > link
        type: string
        pointer: /result/items/0/value/thumbnail/url
      - name: players
        type: object[]
        pointer: /result/items/*[value/stream_type=video]
        select: all
        entries:
          - name: name
            type: string
            actions:
              - type: format_text
                argument: "Odysee"
          - name: streams
            type: object[]
            entries:
              - name: type
                type: string
                actions:
                  - type: format_text
                    argument: hls
              - name: url
                type: string
                actions:
                  - type: build_url
                    base: "https://player.odycdn.com/v6/streams/{claim_id}/{sd_hash}/master.m3u8"
                    fields:
                      claim_id: /claim_id
                      sd_hash: /value/source/sd_hash
          - name: streams
            type: object[]
            entries:
              - name: type
                type: string
                actions:
                  - type: format_text
                    argument: mp4
              - name: url
                type: string
                pointer: /name
                actions:
                  - type: format_text
                    argument: "{base_url}/$/rss/media/{}/{query_url}/stream.mp4"
    post_process:
      - type: extract_regex_items
        source: description
        target: players
        target_field: chapters
        pattern: '(?mR)^[ \t]*([0-9]{1,3}(?::[0-5][0-9]){1,2})[ \t]+(\S[^\r\n]*?)[ \t]*$'
        entries:
          - name: start
            type: number
            capture_group: 1
            actions:
              - type: normalize_duration
          - name: title
            type: string
            capture_group: 2
          - name: type
            type: string
            actions:
              - type: format_text
                argument: chapter
      - type: offset_items_field
        source: players
        nested_source: chapters
        field: start
        target: end
        offset: 1
        default_field: duration
      - type: zip_fields
        source: "** > streams"
        values_field: url
