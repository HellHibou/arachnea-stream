id: coflix
title: Coflix
logo: "{base_url}/wp-content/uploads/2023/01/cropped-coflix.png"
description:
  fr: "Films, Séries et Animés en streaming VF/HD."
http:
  mode: auto


# ############################################################################
# Parameters
# ############################################################################
parameters:
  - name: base_url
    value: https://coflix.wiki
    description: "Base URL — update on domain change"


# ############################################################################
# Shared structs
# ############################################################################
shared:
  media_types_coflix: &media_types_coflix
    - video/movie
    - video/show/serie
    - video/show/anime

  actions_img_html_to_url: &actions_img_html_to_url
    - type: regex_find_all
      pattern: 'src="(?:https?:)?(//[^"]+)'
      format: "https:{1}"

  optional_html_entry: &optional_html_entry
    - type: map
      default: "{}"
      argument:
        "false": null

# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"


  # ---------------------------------------------------------------
  # Home page
  # ---------------------------------------------------------------
  - name: load_home
    scraper_type: html
    media_types: *media_types_coflix
    base_url: "{base_url}"
    query_url: "{base_url}"
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: banners
        type: object[]
        selector: 'article.splide__slide'
        entries:
          - name: title
            type: string
            select: first
            selector: "h2"
            actions:
              - type: get_text
          - name: image
            type: string
            selector: "figure.bg > img"
            select: all
            actions:
              - type: get_attribut
                argument: data-splide-lazy
              - type: format_text
                argument: "https:{}"
          - name: link
            type: string
            select: first
            selector: ul > li > a.btn
            actions:
              - type: get_attribut
                argument: href
          - name: web-link
            type: string
            select: first
            selector: ul > li > a.btn
            actions:
              - type: get_attribut
                argument: href
          - name: description
            type: string
            select: first
            selector: "div.entry-content > p"
            actions:
              - type: get_text
          - name: theme
            type: string[]
            selector: "span.categories > div > a"
            actions:
              - type: get_text
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "movies"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Films"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/wp-json/apiflix/v1/options/?post_type=movies&sort=1"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "series"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Séries"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/wp-json/apiflix/v1/options/?post_type=series&sort=1"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "animes"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Animés"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/wp-json/apiflix/v1/options/?post_type=animes&sort=1"
      - name: sections
        type: object[]
        selector: ".main > section.wdgt_home_movies"
        select: all
        entries:
          - name: label
            type: string
            select: first
            selector: "header > div"
            actions:
                - type: get_text
          - name: entries
            type: object[]
            selector: "div.movie-lst > div"
            select: all
            entries:
              - name: title
                type: string
                select: first
                selector: a
                actions:
                  - type: get_attribut
                    argument: "aria-label"
              - name: link
                type: string
                select: first
                selector: a
                actions:
                  - type: get_attribut
                    argument: href
              - name: web-link
                type: string
                select: first
                selector: a
                actions:
                  - type: get_attribut
                    argument: href
              - name: img/poster > link
                type: string
                select: first
                selector: div > figure > img
                actions:
                  - type: get_attribut
                    argument: src
                  - type: format_text
                    argument: "http:{}"
              - name: year
                type: number
                select: first
                selector: .yearyear
                actions:
                  - type: get_text
              - name: rating
                type: number
                select: first
                selector: .imdb > span
                actions:
                  - type: get_text


  # ---------------------------------------------------------------
  # Category listing
  # ---------------------------------------------------------------
  - name: get_category
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}&page={page}"
    media_types: *media_types_coflix
    row_pointer: "/"
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: sections
        type: object[]
        entries:
          - name: current_page
            type: number
            actions:
              - type: format_text
                argument: "{page}"
          - name: have_more
            type: boolean
            select: first
            pointer: "/next"
          - name: page_size
            type: number
            actions:
              - type: format_text
                argument: "20"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{query_url}"
          - name: entries
            type: object[]
            pointer: "/results/*"
            select: all
            entries:
              - name: title
                type: string
                select: first
                pointer: "/name"
              - name: link
                type: string
                select: first
                pointer: "/url"
              - name: web-link
                type: string
                select: first
                pointer: "/url"
              - name: img/poster > link
                type: string
                select: first
                pointer: "/path"
                actions:
                  - type: regex_find_all
                    pattern: 'src="(?:https?:)?(//[^"]+)'
                    format: "https:{1}"
              - name: img/poster > link
                type: string
                select: first
                pointer: "/image"
                actions:
                  - type: regex_find_all
                    pattern: 'src="(?:https?:)?(//[^"]+)'
                    format: "https:{1}"
              - name: media-type
                type: string[]
                pointer: "/ts"
                select: first
                actions:
                  - type: map
                    argument:
                      movies: "video/movie"
                      series: "video/show/serie"
                      animes: "video/show/anime"
              - name: year
                type: number
                select: first
                pointer: "/release"
                actions:
                  - type: map
                    default: "{}"
                    argument:
                      "false": null
              - name: description
                type: string
                select: first
                pointer: "/excerpt"
                actions:
                  - type: html_to_text
                  - type: map
                    default: "{}"
                    argument:
                      "false": null
              - name: rating
                type: number
                select: first
                pointer: "/ranking"
              - name: director
                type: string[]
                pointer: "/director"
                actions:
                  - type: regex_find_all
                    pattern: ">([^<]+)</a>"
                    format: "{1}"
                  - type: map
                    default: "{}"
                    argument:
                      "false": null
              - name: casting
                type: string[]
                pointer: "/casts"
                actions:
                  - type: regex_find_all
                    pattern: ">([^<]+)</a>"
                    format: "{1}"
                  - type: map
                    argument:
                      "false": null
                    default: "{}"


  # ---------------------------------------------------------------
  # Sections listing
  # ---------------------------------------------------------------
  - name: get_section
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}&page={page}"
    media_types: *media_types_coflix
    row_pointer: "/"
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        remove_fields:
          - total_pages
    entries:
      - name: total_pages
        type: number
        select: first
        pointer: /total
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: have_more
        type: boolean
        select: first
        pointer: "/next"
      - name: page_size
        type: number
        actions:
          - type: format_text
            argument: "20"
      - name: entries
        type: object[]
        pointer: "/results/*"
        select: all
        entries:
          - name: source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: title
            type: string
            select: first
            pointer: "/name"
          - name: link
            type: string
            select: first
            pointer: "/url"
          - name: web-link
            type: string
            select: first
            pointer: "/url"
          - name: img/poster > link
            type: string
            select: first
            pointer: "/path"
            actions:
              - type: regex_find_all
                pattern: 'src="(?:https?:)?(//[^"]+)'
                format: "https:{1}"
          - name: img/poster > link
            type: string
            select: first
            pointer: "/image"
            actions:
              - type: regex_find_all
                pattern: 'src="(?:https?:)?(//[^"]+)'
                format: "https:{1}"
          - name: media-type
            type: string[]
            select: first
            pointer: "/ts"
            actions:
              - type: map
                argument:
                  movies: "video/movie"
                  series: "video/show/serie"
                  animes: "video/show/anime"
          - name: year
            type: number
            select: first
            pointer: "/release"
            actions:
              - type: map
                default: "{}"
                argument:
                  "false": null
          - name: description
            type: string
            select: first
            pointer: "/excerpt"
            actions:
              - type: html_to_text
              - type: map
                default: "{}"
                argument:
                  "false": null
          - name: rating
            type: number
            select: first
            pointer: "/ranking"
          - name: director
            type: string[]
            pointer: "/director"
            actions:
              - type: map
                default: "{}"
                argument:
                  "false": null
          - name: casting
            type: string[]
            pointer: "/casts"
            actions:
              - type: html_to_text
              - type: split
                argument: ","
              - type: map
                argument:
                  "false": null
                default: "{}"
       
  # --------------------------------------------------------------------------
  # Search
  # --------------------------------------------------------------------------
  - name: search
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{base_url}/filter?keyword={search_terms}"
    media_types: *media_types_coflix
    row_pointer: "/"
    entries:
    - name: source
      type: string
      pointer: "/0"
      select: first
      actions:
        - type: format_text
          argument: "{source}"
    - name: current_page
      type: number
      pointer: "/0"
      select: first
      actions:
        - type: format_text
          argument: "1"
    - name: have_more
      type: boolean
      pointer: "/0"
      select: first
      actions:
        - type: format_text
          argument: "false"
    - name: entries
      type: object[]
      pointer: "/*"
      select: all
      entries:
        - name: title
          type: string
          select: first
          pointer: "/title"
        - name: link
          type: string
          select: first
          pointer: "/url"
        - name: web-link
          type: string
          select: first
          pointer: "/url"
        - name: img/poster > link
          type: string
          select: first
          pointer: "/image"
          actions: *actions_img_html_to_url
        - name: media-type
          type: string[]
          pointer: "/post_type"
          actions:
            - type: map
              argument:
                movies: "video/movie"
                series: "video/show/serie"
                animes: "video/show/anime"
        - name: year
          type: number
          select: first
          pointer: "/year"
          actions:
          - type: map
            default: "{}"
            argument:
              "false": null
        - name: description
          type: string
          select: first
          pointer: "/excerpt"
        - name: rating
          type: number
          select: first
          pointer: "/rating"
        - name: director
          type: string[]
          pointer: "/director"
          actions: *optional_html_entry
        - name: casting
          type: string[]
          pointer: "/cast"
          actions: *optional_html_entry

  # ---------------------------------------------------------------
  # Entry detail page
  # ---------------------------------------------------------------
  - name: get_entry
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_coflix
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: title
        type: string
        select: first
        selector: "h1.entry-title, h1"
        actions:
          - type: get_text
      - name: description
        type: string
        select: first
        selector: "div.summary p"
        actions:
          - type: get_text
      - name: img/poster > link
        type: string
        select: first
        selector: "figure > img"
        actions:
          - type: get_attribut
            argument: src
          - type: resolve_url
      - name: year
        type: number
        select: first
        selector: ".year, span.release-year, .date"
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '(\d{4})'
            format: "{1}"
      - name: seasons > label
        type: string
        selector: 'input[name="seasons"] + span'
        select: all
        actions:
          - type: get_text
      - name: seasons > link
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'name="seasons"\s[^>]*data-season="(\d+)"\s[^>]*post-id="(\d+)'
            format: "{base_url}/wp-json/apiflix/v1/series/{2}/{1}"
      - name: players
        type: object[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: '<iframe[^>]+src="([^"]+)'
            format: "{1}"
        sub_queries:
          - scraper_type: html
            row_selector: "html"
            context_pointer: "/*"
            request_headers:
              - name: "Referer"
                actions:
                  - type: format_text
                    argument: "{base_url}"
            entries:
              - name: embed-link
                type: string
                actions:
                  - type: get_response_body
                  - type: regex_find_all
                    pattern: "showVideo\\(\\s*['\"]([A-Za-z0-9+/=]+)['\"]"
                    format: "{1}"
                  - type: base64_decode
              - name: name
                type: string
                actions:
                  - type: get_response_body
                  - type: regex_find_all
                    pattern: "showVideo\\(\\s*['\"]([A-Za-z0-9+/=]+)['\"]"
                    format: "{1}"
                  - type: base64_decode
                  - type: get_url_host
      - name: rating
        type: number
        select: first
        selector: "span.imdb > span"
        actions:
            - type: get_text
      - name: casting
        type: string[]
        selector: p.cast > a
        select: all
        actions:
          - type: get_text
      - name: director
        type: string[]
        selector: aside.title-content > p > a
        select: all
        actions:
          - type: get_text

      - name: year
        type: number
        select: first
        selector: "h1 + span"
        actions:
          - type: get_text
      - name: theme
        type: string[]
        selector: "header > div > div > a"
        select: all
        actions:
          - type: get_text

  # ---------------------------------------------------------------
  # Season
  # ---------------------------------------------------------------
  - name: get_season
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types:
      - video/show/series
      - video/show/anime
    row_pointer: "/"
    entries:
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "1"
      - name: have_more
        type: boolean
        actions:
          - type: format_text
            argument: "false"
    sub_queries:
      - scraper_type: json
        context_pointer: "/episodes/*"
        target: episodes
        request_pointer: "/id"
        request_actions:
          - type: format_text
            argument: "{base_url}/wp-json/apiflix/v1/playerepisode?post_id={}"
        row_pointer: "/"
        context_entries:
          - name: id
            type: string
            select: first
            pointer: "/id"
          - name: title
            type: string
            select: first
            pointer: "/title"
          - name: episode-number
            type: number
            select: first
            pointer: "/number"
          - name: img/preview > link
            type: string
            select: first
            pointer: "/image"
            actions: *actions_img_html_to_url
        entries:
          - name: players
            type: object[]
            actions:
              - type: get_response_body
              - type: regex_find_all
                pattern: '"link":"([^"]+)"'
                format: "{1}"
            sub_queries:
              - scraper_type: html
                row_selector: "html"
                request_headers:
                  - name: "Referer"
                    actions:
                      - type: format_text
                        argument: "{base_url}"
                entries:
                  - name: embed-link
                    type: string
                    actions:
                      - type: get_response_body
                      - type: regex_find_all
                        pattern: "showVideo\\(\\s*['\"]([A-Za-z0-9+/=]+)['\"]"
                        format: "{1}"
                      - type: base64_decode
                  - name: name
                    type: string
                    actions:
                      - type: get_response_body
                      - type: regex_find_all
                        pattern: "showVideo\\(\\s*['\"]([A-Za-z0-9+/=]+)['\"]"
                        format: "{1}"
                      - type: base64_decode
                      - type: get_url_host
          - name: release-date
            type: string
            pointer: "/links/online/*/date"
            select: first
