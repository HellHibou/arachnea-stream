id: coflix
title: Coflix
logo: "{base_url}/images/coflix-logo.png"
description:
  fr: "Films, Séries et Animés en streaming VF/HD."
http:
  mode: auto


# ############################################################################
# Parameters
# ############################################################################
parameters:
  - name: base_url
    value: https://coflix.wiki
    description: "Base URL — update on domain change"


# ############################################################################
# Shared structs
# ############################################################################
shared:
  media_types_coflix: &media_types_coflix
    - video/movie
    - video/show/serie
    - video/show/anime

  actions_img_html_to_url: &actions_img_html_to_url
    - type: regex_find_all
      pattern: 'src="(?:https?:)?(//[^"]+)'
      format: "https:{1}"

  optional_html_entry: &optional_html_entry
    - type: map
      default: "{}"
      argument:
        "false": null

  # Player fields read from one `/ajax/episode/player` message row. The owning
  # post-process captures the serialized row as group 1, and every field applies
  # its own regex so the extraction does not depend on the JSON key order.
  entries_coflix_player: &entries_coflix_player
    - name: name
      type: string
      capture_group: 1
      actions:
        # `server_name` is `false` for the first server, whose name is only
        # exposed by the player list page: fall back to the link host.
        - type: regex_find_all
          pattern: '"server_name":"([^"]+)"'
          format: "{1}"
    - name: web-link
      type: string
      capture_group: 1
      actions:
        - type: regex_find_all
          pattern: '"server_link":"([^"]+)"'
          format: "{1}"
    - name: resolver > kind
      type: string
      actions:
        - type: format_text
          argument: "stream-resolver"
    - name: resolver > target_id
      type: string
      capture_group: 1
      actions:
        - type: regex_find_all
          pattern: '"server_link":"([^"]+)"'
          format: "{1}"
    - name: lang
      type: string[]
      capture_group: 1
      actions:
        - type: regex_find_all
          pattern: '"version":"([^"]+)"'
          format: "{1}"
        - type: map
          argument:
            VF: vf
            VOSTFR: vostfr

# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
        actions:
          - type: resolve_url
      - name: description
        type: object
        value: "{service_description}"


  # ---------------------------------------------------------------
  # Home page
  # ---------------------------------------------------------------
  - name: load_home
    scraper_type: html
    media_types: *media_types_coflix
    base_url: "{base_url}"
    query_url: "{base_url}"
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: banners > entries
        type: object[]
        selector: '#slider-main .slide'
        select: all
        entries:
          - name: title
            type: string
            select: first
            selector: "h2.title"
            actions:
              - type: get_attribut
                argument: data-jp
          - name: image
            type: string
            select: first
            selector: "img.thum-img"
            actions:
              - type: get_attribut
                argument: src
          - name: link
            type: string
            select: first
            selector: a.btn-watch
            actions:
              - type: get_attribut
                argument: href
          - name: web-link
            type: string
            select: first
            selector: a.btn-watch
            actions:
              - type: get_attribut
                argument: href
          - name: description
            type: string
            select: first
            selector: "p.excerpt"
            actions:
              - type: get_text
          - name: theme
            type: string[]
            select: first
            selector: "span.cats"
            actions:
              - type: get_text
              - type: split
                argument: ", "
          - name: year
            type: number
            select: first
            selector: "span.year"
            actions:
              - type: get_text
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "movies"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Films"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/wp-json/apiflix/v1/options/?post_type=movies&sort=1"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "series"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Séries"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/wp-json/apiflix/v1/options/?post_type=series&sort=1"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "animes"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Animés"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/wp-json/apiflix/v1/options/?post_type=animes&sort=1"
      - name: sections
        type: object[]
        selector: "aside.main > section"
        select: all
        entries:
          - name: label
            type: string
            select: first
            selector: "div.head h2.title"
            actions:
              - type: get_text
          - name: entries
            type: object[]
            selector: "div.ani.items > div.item"
            select: all
            entries:
              - name: title
                type: string
                select: first
                selector: a.name
                actions:
                  - type: get_attribut
                    argument: data-jp
              - name: link
                type: string
                select: first
                selector: a.ani.poster
                actions:
                  - type: get_attribut
                    argument: href
              - name: web-link
                type: string
                select: first
                selector: a.ani.poster
                actions:
                  - type: get_attribut
                    argument: href
              - name: img/poster > link
                type: string
                select: first
                selector: a.ani.poster > img
                actions:
                  - type: get_attribut
                    argument: src


  # ---------------------------------------------------------------
  # Category listing
  # ---------------------------------------------------------------
  - name: get_category
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}&page={page}"
    media_types: *media_types_coflix
    row_pointer: "/"
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: sections
        type: object[]
        entries:
          - name: current_page
            type: number
            actions:
              - type: format_text
                argument: "{page}"
          - name: have_more
            type: boolean
            select: first
            pointer: "/next"
          - name: page_size
            type: number
            actions:
              - type: format_text
                argument: "20"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{query_url}"
          - name: entries
            type: object[]
            pointer: "/results/*"
            select: all
            entries:
              - name: title
                type: string
                select: first
                pointer: "/name"
              - name: link
                type: string
                select: first
                pointer: "/url"
              - name: web-link
                type: string
                select: first
                pointer: "/url"
              - name: img/poster > link
                type: string
                select: first
                pointer: "/path"
                actions:
                  - type: regex_find_all
                    pattern: 'src="(?:https?:)?(//[^"]+)'
                    format: "https:{1}"
              - name: img/poster > link
                type: string
                select: first
                pointer: "/image"
                actions:
                  - type: regex_find_all
                    pattern: 'src="(?:https?:)?(//[^"]+)'
                    format: "https:{1}"
              - name: media-type
                type: string[]
                pointer: "/ts"
                select: first
                actions:
                  - type: map
                    argument:
                      movies: "video/movie"
                      series: "video/show/serie"
                      animes: "video/show/anime"
              - name: year
                type: number
                select: first
                pointer: "/release"
                actions:
                  - type: map
                    default: "{}"
                    argument:
                      "false": null
              - name: description
                type: string
                select: first
                pointer: "/excerpt"
                actions:
                  - type: html_to_text
                  - type: map
                    default: "{}"
                    argument:
                      "false": null
              - name: rating
                type: number
                select: first
                pointer: "/ranking"
              - name: director
                type: string[]
                pointer: "/director"
                actions:
                  - type: regex_find_all
                    pattern: ">([^<]+)</a>"
                    format: "{1}"
                  - type: map
                    default: "{}"
                    argument:
                      "false": null
              - name: casting
                type: string[]
                pointer: "/casts"
                actions:
                  - type: regex_find_all
                    pattern: ">([^<]+)</a>"
                    format: "{1}"
                  - type: map
                    argument:
                      "false": null
                    default: "{}"


  # ---------------------------------------------------------------
  # Sections listing
  # ---------------------------------------------------------------
  - name: get_section
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}&page={page}"
    media_types: *media_types_coflix
    row_pointer: "/"
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        remove_fields:
          - total_pages
    entries:
      - name: total_pages
        type: number
        select: first
        pointer: /total
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: have_more
        type: boolean
        select: first
        pointer: "/next"
      - name: page_size
        type: number
        actions:
          - type: format_text
            argument: "20"
      - name: entries
        type: object[]
        pointer: "/results/*"
        select: all
        entries:
          - name: source
            type: string
            actions:
              - type: format_text
                argument: "{source}"
          - name: title
            type: string
            select: first
            pointer: "/name"
          - name: link
            type: string
            select: first
            pointer: "/url"
          - name: web-link
            type: string
            select: first
            pointer: "/url"
          - name: img/poster > link
            type: string
            select: first
            pointer: "/path"
            actions:
              - type: regex_find_all
                pattern: 'src="(?:https?:)?(//[^"]+)'
                format: "https:{1}"
          - name: img/poster > link
            type: string
            select: first
            pointer: "/image"
            actions:
              - type: regex_find_all
                pattern: 'src="(?:https?:)?(//[^"]+)'
                format: "https:{1}"
          - name: media-type
            type: string[]
            select: first
            pointer: "/ts"
            actions:
              - type: map
                argument:
                  movies: "video/movie"
                  series: "video/show/serie"
                  animes: "video/show/anime"
          - name: year
            type: number
            select: first
            pointer: "/release"
            actions:
              - type: map
                default: "{}"
                argument:
                  "false": null
          - name: description
            type: string
            select: first
            pointer: "/excerpt"
            actions:
              - type: html_to_text
              - type: map
                default: "{}"
                argument:
                  "false": null
          - name: rating
            type: number
            select: first
            pointer: "/ranking"
          - name: director
            type: string[]
            pointer: "/director"
            actions:
              - type: map
                default: "{}"
                argument:
                  "false": null
          - name: casting
            type: string[]
            pointer: "/casts"
            actions:
              - type: html_to_text
              - type: split
                argument: ","
              - type: map
                argument:
                  "false": null
                default: "{}"
       
  # --------------------------------------------------------------------------
  # Search
  # --------------------------------------------------------------------------
  - name: search
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{base_url}/filter?keyword={search_terms}"
    media_types: *media_types_coflix
    row_pointer: "/"
    entries:
    - name: source
      type: string
      pointer: "/0"
      select: first
      actions:
        - type: format_text
          argument: "{source}"
    - name: current_page
      type: number
      pointer: "/0"
      select: first
      actions:
        - type: format_text
          argument: "1"
    - name: have_more
      type: boolean
      pointer: "/0"
      select: first
      actions:
        - type: format_text
          argument: "false"
    - name: entries
      type: object[]
      pointer: "/*"
      select: all
      entries:
        - name: title
          type: string
          select: first
          pointer: "/title"
        - name: link
          type: string
          select: first
          pointer: "/url"
        - name: web-link
          type: string
          select: first
          pointer: "/url"
        - name: img/poster > link
          type: string
          select: first
          pointer: "/image"
          actions: *actions_img_html_to_url
        - name: media-type
          type: string[]
          pointer: "/post_type"
          actions:
            - type: map
              argument:
                movies: "video/movie"
                series: "video/show/serie"
                animes: "video/show/anime"
        - name: year
          type: number
          select: first
          pointer: "/year"
          actions:
          - type: map
            default: "{}"
            argument:
              "false": null
        - name: description
          type: string
          select: first
          pointer: "/excerpt"
        - name: rating
          type: number
          select: first
          pointer: "/rating"
        - name: director
          type: string[]
          pointer: "/director"
          actions: *optional_html_entry
        - name: casting
          type: string[]
          pointer: "/cast"
          actions: *optional_html_entry

  # ---------------------------------------------------------------
  # Entry detail page
  # ---------------------------------------------------------------
  - name: get_entry
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_coflix
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: title
        type: string
        select: first
        selector: "h1.title"
        actions:
          - type: get_attribut
            argument: data-jp
      - name: description
        type: string
        select: first
        selector: "div.synopsis div.content p"
        actions:
          - type: get_text
      - name: img/poster > link
        type: string
        select: first
        selector: "section#w-info div.poster img"
        actions:
          - type: get_attribut
            argument: src
      - name: year
        type: number
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'Date aired:</span>\s*(\d{4})'
            format: "{1}"
      - name: theme
        type: string[]
        selector: "div.list-genres a"
        select: all
        actions:
          - type: get_text
      - name: lang/audio
        type: string[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'Version:</span>\s*([^<\s]+)'
            format: "{1}"
          - type: map
            argument:
              VF: vf
              VOSTFR: vostfr
      - name: episode-requests
        type: object[]
        entries:
          - name: link
            type: string
            actions:
              - type: get_response_body
              - type: regex_find_all
                pattern: 'movie\s*=\s*\{[\s\S]*?id\s*:\s*"(\d+)"'
                format: "{base_url}/ajax/episode/list-episode?movieId={1}"
          - name: lang
            type: string[]
            actions:
              - type: get_response_body
              - type: regex_find_all
                pattern: 'Version:</span>\s*([^<\s]+)'
                format: "{1}"
              - type: map
                argument:
                  VF: vf
                  VOSTFR: vostfr
      - name: player-requests
        type: object[]
        entries:
          - name: link
            type: string
            actions:
              - type: get_response_body
              - type: regex_find_all
                pattern: 'episode_play\s*=\s*\{[\s\S]*?id\s*:\s*"(\d+)"'
                format: "{base_url}/ajax/episode/player?episode_id={1}"
    post_process:
      # Entry-level players, fetched from the player endpoint indexed by
      # `episode_play` (films and the currently watched episode of a series).
      - type: fetch_regex_items_from_items
        source: player-requests
        request_field: link
        request_method: post
        response_pointer: /message/*
        target: players
        pattern: '^(.+)$'
        entries: *entries_coflix_player
      - type: fetch_regex_items_from_items
        source: episode-requests
        request_field: link
        response_pointer: /html
        target: seasons > episodes
        pattern: '<a class="ep-item" href="([^"]+)" data-num="(\d+)" data-id="(\d+)">\s*<div class="title">([^<]+)'
        entries:
          - name: link
            type: string
            capture_group: 1
          - name: episode-number
            type: number
            capture_group: 2
          - name: id
            type: string
            capture_group: 3
          - name: title
            type: string
            capture_group: 4
          - name: player-request
            type: string
            capture_group: 3
            actions:
              - type: format_text
                argument: "{base_url}/ajax/episode/player?episode_id={}"
        copy_item_fields:
          - source: lang
            target: lang
      - type: fetch_regex_items_from_items
        source: seasons > episodes
        request_field: player-request
        request_method: post
        response_pointer: /message/*
        target: players
        target_per_source: true
        pattern: '^(.+)$'
        entries: *entries_coflix_player
      - type: filter_fields
        source: seasons > episodes
        field: id
        pattern: '.+'
        remove:
          - player-request
      - type: remove_fields
        fields:
          - episode-requests
          - player-requests
