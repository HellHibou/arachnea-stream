id: frenchanimes
title: French Animes
logo: "{base_url}/templates/franime/images/favicon3.png"
description:
  fr: "Animés VF et VOSTFR en streaming."
http:
  mode: auto


# ############################################################################
# Parameters
# ############################################################################
parameters:
  - name: base_url
    value: https://french-anime.com
    description: "Base URL — update on domain change"


# ############################################################################
# Shared structs
# ############################################################################
shared:
  media_types_anime: &media_types_anime
    - video/show/anime
    - video/movie

  actions_total_pages_from_pagi: &actions_total_pages_from_pagi
    - type: get_response_body
    - type: regex_find_all
      pattern: 'page/(\d+)/"'
      format: "{1}"
    - type: max

  actions_get_src_resolve: &actions_get_src_resolve
    - type: get_attribut
      argument: src
    - type: resolve_url
      proxy: true
      proxy_headers:
        Referer: "{base_url}/"      

  entries_catalog_row: &entries_catalog_row
    - name: source
      select: first
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "img"
      actions:
        - type: get_attribut
          argument: alt
    - name: link
      type: string
      select: first
      selector: a
      actions:
        - type: get_attribut
          argument: href
        - type: resolve_url
    - name: web-link
      type: string
      select: first
      selector: a
      actions:
        - type: get_attribut
          argument: href
        - type: resolve_url
    - name: img/poster > link
      type: string
      select: first
      selector: "img"
      actions: *actions_get_src_resolve
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/anime"
    - name: lang
      type: string[]
      selector: :is(span.block-sai, span.nbloc1)
      actions:
        - type: get_text
        - type: regex_find_all
          pattern: '(VOSTFR|FRENCH)'
          format: "{1}"
        - type: map
          argument:
            "VOSTFR" : vostfr
            "FRENCH" : "vf"

  entries_latest_added: &entries_latest_added
    - name: title
      type: string
      select: first
      selector: "a"
      actions:
        - type: get_text
    - name: link
      type: string
      select: first
      selector: "a"
      actions:
        - type: get_attribut
          argument: href
        - type: resolve_url
    - name: web-link
      type: string
      select: first
      selector: "a"
      actions:
        - type: get_attribut
          argument: href
        - type: resolve_url
    - name: media-type
      type: string[]
      actions:
        - type: format_text
          argument: "video/show/anime"
    - name: lang
      type: string[]
      selector: "i.langue"
      actions:
        - type: get_attribut
          argument: "class"
        - type: map
          default: "{}"
          argument:
            "langue vostfr": vostfr
            "langue vf": vf

# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
        actions:
          - type: resolve_url
            proxy: true
            proxy_headers:
              Referer: "{base_url}/"
      - name: description
        type: object
        value: "{service_description}"


  # ---------------------------------------------------------------
  # Home page
  # ---------------------------------------------------------------
  - name: load_home
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}"
    media_types: *media_types_anime
    row_selector: "html"
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"

      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "vf"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Animés VF"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/animes-vf/"

      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "vostfr"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Animés VOSTFR"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/animes-vostfr/"

      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "films"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Films Animés"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/films-vf-vostfr/"

      - name: sections
        type: object[]
        entries:
          - name: id
            type: string
            actions:
              - type: format_text
                argument: "top-carousel"
          - name: label
            type: string
            select: first
            selector: "h1.rel-title"
            actions:
              - type: get_text
              - type: regex_find_all
                pattern: "^([^:]+)"
                format: "{1}"
          - name: entries
            type: object[]
            selector: ".owl-carousel.caroustyle > .item"
            select: all
            entries: 
              - name: title
                type: string
                select: first
                selector: "span.title1"
                actions:
                  - type: get_text
              - name: title/alt
                type: string
                select: first
                selector: "span.title0"
                actions:
                  - type: get_text
              - name: link
                type: string
                select: first
                selector: "a"
                actions:
                  - type: get_attribut
                    argument: href
                  - type: resolve_url
              - name: web-link
                type: string
                select: first
                selector: "a"
                actions:
                  - type: get_attribut
                    argument: href
                  - type: resolve_url
              - name: img/poster > link
                type: string
                select: first
                selector: "img"
                actions: *actions_get_src_resolve
              - name: media-type
                type: string[]
                actions:
                  - type: format_text
                    argument: "video/show/anime"
      - name: sections
        type: object[]
        entries:
          - name: id
            type: string
            actions:
              - type: format_text
                argument: "latest-added"
          - name: label
            type: string
            select: first
            selector: "span.t-b-recent"
            actions:
              - type: get_text
              - type: regex_find_all
                pattern: "^([^:]+)"
                format: "{1}"
          - name: entries
            type: object[]
            selector: ".lastserieadd li"
            select: all
            entries: *entries_latest_added

      - name: sections
        type: object[]
        entries:
          - name: id
            type: string
            actions:
              - type: format_text
                argument: "latest-added-vf"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Derniers Animes VF ajoutées"
          - name: entries
            type: object[]
            selector: ".lastfilmadd li"
            select: all
            entries: *entries_latest_added

      - name: sections
        type: object[]
        entries:
          - name: id
            type: string
            actions:
              - type: format_text
                argument: "top-vostfr"
          - name: label
            type: string
            selector: "div.block-main div.block-title span.left-ma"
            select: first
            actions:
              - type: get_text
          - name: entries
            type: object[]
            selector: "div.block-main div.mov.clearfix"
            select: all
            entries:
              - name: source
                type: string
                actions:
                  - type: format_text
                    argument: "{source}"
              - name: title
                type: string
                select: first
                selector: "a.mov-t"
                actions:
                  - type: get_text
              - name: link
                type: string
                select: first
                selector: "a.mov-t"
                actions:
                  - type: get_attribut
                    argument: href
                  - type: resolve_url
              - name: web-link
                type: string
                select: first
                selector: "a.mov-t"
                actions:
                  - type: get_attribut
                    argument: href
                  - type: resolve_url
              - name: title/alt
                type: string
                select: first
                selector: "div.mov-i img"
                actions:
                  - type: get_attribut
                    argument: alt
              - name: img/poster > link
                type: string
                select: first
                selector: "div.mov-i img"
                actions: *actions_get_src_resolve
              - name: media-type
                type: string[]
                actions:
                  - type: format_text
                    argument: "video/show/anime"
              - name: lang
                type: string[]
                actions:
                  - type: format_text
                    argument: "vostfr"
  # ---------------------------------------------------------------
  # Category listing with pagination
  # ---------------------------------------------------------------
  - name: get_category
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}page/{page}/"
    media_types: *media_types_anime
    row_selector: "html"
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: sections
        type: object[]
        entries:
          - name: current_page
            type: number
            actions:
              - type: format_text
                argument: "{page}"
          - name: page_size
            type: number
            actions:
              - type: format_text
                argument: "12"
          - name: total_pages
            type: number
            actions: *actions_total_pages_from_pagi
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{query_url}"
          - name: entries
            type: object[]
            selector: "div.mov.clearfix"
            select: all
            entries: *entries_catalog_row
    post_process:
      - type: derive_pagination
        source: sections
        total_pages_field: total_pages

  # ---------------------------------------------------------------
  # Section listing (flat)
  # ---------------------------------------------------------------
  - name: get_section
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}page/{page}/"
    media_types: *media_types_anime
    row_selector: "html"
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: page_size
        type: number
        actions:
          - type: format_text
            argument: "12"
      - name: total_pages
        type: number
        actions: *actions_total_pages_from_pagi
      - name: link
        type: string
        actions:
          - type: format_text
            argument: "{query_url}"
      - name: entries
        type: object[]
        selector: "div.mov.clearfix"
        select: all
        entries: *entries_catalog_row
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages

  # ---------------------------------------------------------------
  # Search
  # ---------------------------------------------------------------
  - name: search
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}/?do=search&mode=advanced&subaction=search&story={search_terms}&search_start={page}"
    media_types: *media_types_anime
    row_selector: "html"
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: page_size
        type: number
        actions:
          - type: format_text
            argument: "10"
      - name: total_pages
        type: number
        selector: span.navigation
        select: first
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '\b(\d+)\b'
            format: "{1}"
          - type: max
      - name: entries
        type: object[]
        selector: "div.mov.clearfix"
        select: all
        entries: *entries_catalog_row
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages

  # ---------------------------------------------------------------
  # Entry / detail page
  # ---------------------------------------------------------------
  - name: get_entry
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_anime
    row_selector: "html"
    entries:
      - name: title
        type: string
        select: first
        selector: "h1[itemprop='name'], h1"
        actions:
          - type: get_text
      - name: title/alt
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'TITRE ORIGINAL:\s*</div>\s*<div class="mov-desc">([^<]+)'
            format: "{1}"
      - name: description
        type: string
        select: first
        selector: 'span[itemprop="description"]'
        actions:
          - type: get_text
      - name: img/poster > link
        type: string
        select: first
        selector: "#posterimg"
        actions:
          - type: get_attribut
            argument: src
          - type: resolve_url
            proxy: true
            proxy_headers:
              Referer: "{request_origin}/"
              Origin: "{request_origin}"
      - name: year
        type: number
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'Date de sortie:\s*</div>\s*<div class="mov-desc">(\d{4})'
            format: "{1}"
      - name: theme
        type: string[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'GENRE:\s*</div>\s*<div class="mov-desc">\s*<span[^>]*>(.*?)</span>'
            format: "{1}"
          - type: regex_find_all
            pattern: '>([^<]+)</a>'
            format: "{1}"
      - name: director
        type: string[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'RÉALISATEUR:\s*</div>\s*<div class="mov-desc"(?:[^>]*)>\s*<span[^>]*>(?:<span[^>]*>)?([^<]+)'
            format: "{1}"
      - name: casting
        type: string[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'ACTEURS:\s*</div>\s*<div class="mov-desc"(?:[^>]*)>\s*<span[^>]*>(?:<span[^>]*>)?([^<]+)'
            format: "{1}"
      - name: lang/audio
        type: string[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'Version:\s*</div>\s*<div class="mov-desc">\s*<span[^>]*>([^<]+)'
            format: "{1}"
      - name: duration
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'Durée:\s*</div>\s*<div class="mov-desc">\s*<span[^>]*>([^<]+)'
            format: "{1}"
      - name: _raw_eps
        type: string
        select: first
        selector: "div.eps"
        actions:
          - type: get_text
    post_process:
      - type: extract_regex_items
        source: _raw_eps
        target: seasons > episodes
        pattern: '(\d+)!((?:(?:https?:)?//[^,\s]+(?:,(?:https?:)?//[^,\s]+)*))'
        entries:
          - name: episode-number
            type: number
            capture_group: 1
          - name: title
            type: string
            capture_group: 1
            actions:
              - type: format_text
                argument: "Episode {}"
          - name: players > resolver > kind
            type: string
            capture_group: 1
            actions:
              - type: format_text
                argument: "stream-resolver"
          - name: players > resolver > target_id
            type: string
            capture_group: 2
            actions:
              - type: split
                argument: ","
              - type: resolve_url
          - name: players > web-link
            type: string
            capture_group: 2
            actions:
              - type: split
                argument: ","
              - type: resolve_url
          - name: players > name
            type: string
            capture_group: 2
            actions:
              - type: split
                argument: ","
              - type: resolve_url
              - type: get_url_host
      - type: derive_pagination
        remove_fields:
          - _raw_eps
