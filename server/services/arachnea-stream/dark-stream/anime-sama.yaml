id: anime-sama
title: Anime-Sama
logo: https://raw.githubusercontent.com/Anime-Sama/IMG/img/autres/logo.png
description:
  fr : "Anime-Sama est une plateforme de streaming et de lecture en ligne dédiée aux animés, mangas et webtoons. Elle propose un large catalogue de contenus, allant des dernières sorties aux classiques du genre, avec des options de filtrage par type de média, thème et langue."
http:
  mode: auto


# ############################################################################
# Parameters
# ############################################################################
parameters:
  - name: base_url
    value: https://anime-sama.to
    description: Base URL used to resolve Anime-Sama requests.


# ############################################################################
# Shared structs
# ############################################################################
shared:
  media_types_anime_sama: &media_types_anime_sama
    - video/show/anime
    - images/manga
    - images/webtoon

  actions_catalog_total_pages_from_response: &actions_catalog_total_pages_from_response
    - type: get_response_body
    - type: regex_find_all
      pattern: '(?s)<div\s+id=["'']list_pagination["''][^>]*>(.*?)</div>'
      format: "{1}"
    - type: regex_find_all
      pattern: '(?:[?&]|&amp;)page=(\d+)'
      format: "{1}"
    - type: max

  actions_get_href_resolve: &actions_get_href_resolve
    - type: get_attribut
      argument: href
    - type: resolve_url

  actions_get_href_catalog_root_resolve: &actions_get_href_catalog_root_resolve
    - type: get_attribut
      argument: href
    - type: regex_find_all
      pattern: '^(/catalogue/[^/]+)'
      format: "{1}"
    - type: resolve_url

  actions_media_type_search: &actions_media_type_search
    - type: get_text
    - type: split
      argument: ","
    - type: map
      argument:
        Anime: "video/show/anime"
        Scans: "images/manga"
        Manga: "images/manga"
        Webtoon: "images/webtoon"
        Film: "video/movie"
        Autres: "video/show/other"

  # Listing cards (home rails, catalogue pages, sections, search results and the
  # "Oeuvres similaires" rail) all share the same `div.as-carte` component: the
  # title, the type badge(s), the language flag(s) and the link are the only
  # fields it exposes. The synopsis, genre tags and alternate title that older
  # `catalog-card` markup carried are no longer present in listings.
  entries_catalog_cards: &entries_catalog_cards
    - name: title
      type: string
      select: first
      selector: "h3.as-carte-titre"
      actions:
        - type: get_text
    - name: media-type
      type: string[]
      selector: "span.as-badge"
      actions: *actions_media_type_search
    - name: img/landscape > link
      type: string
      select: first
      selector: "div.as-carte-image > img"
      actions:
        - type: get_attribut
          argument: src
    - name: link
      type: string
      select: first
      selector: "a.as-carte-lien"
      actions: *actions_get_href_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.as-carte-lien"
      actions: *actions_get_href_resolve
    - name: lang
      type: string[]
      selector: "span.as-drapeau > img"
      actions:
        - type: get_attribut
          argument: title

  entries_catalog_cards_with_other: &entries_catalog_cards_with_other
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      type: string
      select: first
      selector: "h3.as-carte-titre"
      actions:
        - type: get_text
    - name: media-type
      type: string[]
      selector: "span.as-badge"
      actions: *actions_media_type_search
    - name: img/landscape > link
      type: string
      select: first
      selector: "div.as-carte-image > img"
      actions:
        - type: get_attribut
          argument: src
    - name: link
      type: string
      select: first
      selector: "a.as-carte-lien"
      actions: *actions_get_href_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.as-carte-lien"
      actions: *actions_get_href_resolve
    - name: lang
      type: string[]
      selector: "span.as-drapeau > img"
      actions:
        - type: get_attribut
          argument: title

  # Home "release" cards (`as-carte-anime`): the same `as-carte` shell as the
  # catalogue cards, plus an `as-carte-info` line holding the season/episode and
  # the air time (a clock time for the daily releases, a relative label such as
  # "Aujourd'hui · 18:23" for the latest additions). These cards are always
  # anime, so the media type is set statically.
  entries_release_anime_cards: &entries_release_anime_cards
    - name: title
      type: string
      select: first
      selector: "h3.as-carte-titre"
      actions:
        - type: get_text
    - name: media-type
      type: string[]
      select: first
      actions:
        - type: format_text
          argument: "video/show/anime"
    - name: episode > label
      type: string
      select: first
      selector: "div.as-carte-info > span:not(.as-carte-temps)"
      actions:
        - type: get_text
    - name: release-date
      type: string
      select: first
      selector: "span.as-carte-temps"
      actions:
        - type: get_text
    - name: lang
      type: string[]
      selector: "span.as-drapeau > img"
      actions:
        - type: get_attribut
          argument: title
    - name: link
      type: string
      select: first
      selector: "a.as-carte-lien"
      actions: *actions_get_href_catalog_root_resolve
    - name: web-link
      type: string
      select: first
      selector: "a.as-carte-lien"
      actions: *actions_get_href_catalog_root_resolve
    - name: img/landscape > link
      type: string
      select: first
      selector: "div.as-carte-image > img"
      actions:
        - type: get_attribut
          argument: src


# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"
      - name: search_themes
        type: string[]
        value:
          - "Action"
          - "Adolescence"
          - "Friendship"
          - "Love"
          - "Martial Arts"
          - "Assassination"
          - "Other World"
          - "Adventure"
          - "Fighting"
          - "Comedy"
          - "Crime"
          - "Demons"
          - "Donghua"
          - "Drama"
          - "Ecchi"
          - "School"
          - "Family"
          - "Fantasy"
          - "Fantasy"
          - "Ghibli"
          - "War"
          - "Harem"
          - "Historical"
          - "Horror"
          - "Isekai"
          - "Games"
          - "Josei"
          - "Magic"
          - "Mecha"
          - "Military"
          - "Monsters"
          - "Music"
          - "Mystery"
          - "Nostalgia"
          - "Politics"
          - "Psychological"
          - "Daily Life"
          - "Romance"
          - "Samurai"
          - "School Life"
          - "Science Fiction"
          - "Seinen"
          - "Shojo"
          - "Shonen"
          - "Slice of Life"
          - "Sports"
          - "Supernatural"
          - "Thriller"
          - "Tournaments"
          - "Work"
          - "Vampires"
          - "Revenge"
          - "Time Travel"


  # ---------------------------------------------------------------
  # Home page
  # ---------------------------------------------------------------
  - name: load_home
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}"
    media_types: *media_types_anime_sama
    row_selector: "html"
    pre_process:
      - type: remove_text_blocks
        start: '<script>window.__CF$cv$params='
        end: '</script>'
    entries:
    - name: banners > entries
      type: object[]
      selector: "div.ak-slide:not([aria-hidden=\"true\"])"
      select: all
      entries:
      - name: key
        type: string
        actions:
          - type: format_text
            argument: "anime-sama-season-banner"
      - name: title
        type: string
        select: first
        selector: "h2.ak-slide-title"
        actions:
          - type: get_text
      - name: image
        type: string
        select: first
        selector: "img"
        actions: 
          - type: get_attribut
            argument: src
      - name: link
        type: string
        select: first
        selector: ".ak-slide-cta"
        actions:
        - type: get_attribut
          argument: href
        - type: regex_find_all
          pattern: '(/catalogue/[^/]+)(?:/[^/]+)*'
          format: "{base_url}{1}"
      - name: web-link
        type: string
        select: first
        selector: ".ak-slide-cta"
        actions:
        - type: get_attribut
          argument: href
        - type: regex_find_all
          pattern: '(/catalogue/[^/]+)(?:/[^/]+)*'
          format: "{base_url}{1}"
      - name: description
        type: string
        select: first
        selector: "p.ak-slide-synopsis"
        actions:
          - type: get_text
    - name: categories
      type: object[]
      entries:
        - name: key
          type: string
          actions:
            - type: format_text
              argument: "Animés"
        - name: label
          type: string
          actions:
            - type: format_text
              argument: "Animés"
        - name: request > query_url
          type: string
          actions:
            - type: format_text
              argument: "{base_url}/catalogue/?type%5B%5D=Anime"
    - name: categories
      type: object[]
      entries:
        - name: key
          type: string
          actions:
            - type: format_text
              argument: "manga"
        - name: label
          type: string
          actions:
            - type: format_text
              argument: "Scans"
        - name: request > query_url
          type: string
          actions:
            - type: format_text
              argument: "{base_url}/catalogue/?type%5B%5D=Scans"
    - name: categories
      type: object[]
      entries:
        - name: key
          type: string
          actions:
            - type: format_text
              argument: "webtoon"
        - name: label
          type: string
          actions:
            - type: format_text
              argument: "Webtoon"
        - name: request > query_url
          type: string
          actions:
            - type: format_text
              argument: "{base_url}/catalogue/?type%5B%5D=Webtoon"
    - name: sections
      type: object[]
      entries:
        - name: key
          type: string
          actions:
            - type: format_text
              argument: "daily-releases"
        - name: label
          type: string
          actions:
            - type: format_text
              argument: "Sorties quotidiennes"
        - name: subsections
          type: object[]
          selector: "div.fadeJours"
          select: all
          entries:
            - name: key
              type: string
              select: first
              actions:
                - type: get_attribut
                  argument: id
            - name: label
              type: string
              select: first
              selector: "h2.titreJours"
              actions:
                - type: get_text
            - name: entries
              type: object[]
              selector: "div.as-carte"
              select: all
              entries: *entries_release_anime_cards
    - name: sections
      type: object[]
      selector: "div#containerSorties"
      entries:
        - name: label
          type: string
          actions:
            - type: format_text
              argument: "Derniers contenus sortis"
        - name: entries
          type: object[]
          selector: "div.as-carte"
          select: all
          entries: *entries_catalog_cards
    - name: sections
      type: object[]
      selector: "div#containerAjoutsAnimes"
      entries:
        - name: label
          type: string
          actions:
            - type: format_text
              argument: "Derniers épisodes ajoutés"
        - name: entries
          type: object[]
          selector: "div.as-carte"
          select: all
          entries: *entries_release_anime_cards
    - name: sections
      type: object[]
      selector: "div#containerAjoutsScans"
      entries:
        - name: label
          type: string
          actions:
            - type: format_text
              argument: "Derniers scans ajoutés"
        - name: entries
          type: object[]
          selector: "div.as-carte"
          select: all
          entries:
            - name: title
              type: string
              select: first
              selector: "h3.as-carte-titre"
              actions:
                - type: get_text
            - name: media-type
              type: string[]
              selector: "span.as-badge"
              actions: *actions_media_type_search
            - name: episode > label
              type: string
              select: first
              selector: "div.as-carte-info > span:not(.as-carte-temps)"
              actions:
                - type: get_text
            - name: release-date
              type: string
              select: first
              selector: "span.as-carte-temps"
              actions:
                - type: get_text
            - name: lang
              type: string[]
              selector: "span.as-drapeau > img"
              actions:
                - type: get_attribut
                  argument: title
            - name: link
              type: string
              select: first
              selector: "a.as-carte-lien"
              actions: *actions_get_href_catalog_root_resolve
            - name: web-link
              type: string
              select: first
              selector: "a.as-carte-lien"
              actions: *actions_get_href_catalog_root_resolve
            - name: img/landscape > link
              type: string
              select: first
              selector: "div.as-carte-image > img"
              actions:
                - type: get_attribut
                  argument: src
    - name: sections
      type: object[]
      selector: "div#containerPepites"
      entries:
        - name: label
          type: string
          actions:
            - type: format_text
              argument: "Découvrez des pépites"
        - name: entries
          type: object[]
          selector: "div.as-carte"
          select: all
          entries: *entries_catalog_cards
    - name: sections
      type: object[]
      selector: "div#containerClassiques"
      entries:
        - name: label
          type: string
          actions:
            - type: format_text
              argument: "Les classiques"
        - name: entries
          type: object[]
          selector: "div.as-carte"
          select: all
          entries: *entries_catalog_cards


  # ---------------------------------------------------------------
  # Category listing
  # ---------------------------------------------------------------
  - name: get_category
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}&page={page}"
    media_types: *media_types_anime_sama
    row_selector: "html"
    pre_process:
      - type: remove_text_blocks
        start: '<script>window.__CF$cv$params='
        end: '</script>'
    entries:
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "anime"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Anime"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/catalogue/?type%5B%5D=Anime"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "manga"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Scans"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/catalogue/?type%5B%5D=Scans"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "webtoon"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Webtoon"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/catalogue/?type%5B%5D=Webtoon"
      - name: sections
        type: object[]
        entries:
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Catalogue"
          - name: link
            type: string
            actions:
              - type: format_text
                argument: "{query_url}"
          - name: current_page
            type: number
            actions:
              - type: format_text
                argument: "{page}"
          - name: total_pages
            type: number
            actions: *actions_catalog_total_pages_from_response
          - name: entries
            type: object[]
            selector: "div.as-carte"
            select: all
            entries: *entries_catalog_cards_with_other
    post_process:
      - type: derive_pagination
        source: sections
        total_pages_field: total_pages
        remove_fields:
          - total_pages


  # ---------------------------------------------------------------
  # Sections listing
  # ---------------------------------------------------------------
  - name: get_section
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}&page={page}"
    media_types: *media_types_anime_sama
    row_selector: "html"
    pre_process:
      - type: remove_text_blocks
        start: '<script>window.__CF$cv$params='
        end: '</script>'
    entries:
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: total_pages
        type: number
        actions: *actions_catalog_total_pages_from_response
      - name: entries
        type: object[]
        selector: "div.as-carte"
        select: all
        entries: *entries_catalog_cards_with_other
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        remove_fields:
          - total_pages


  # --------------------------------------------------------------------------
  # Search
  # --------------------------------------------------------------------------
  - name: search
    scraper_type: html
    base_url: "{base_url}"
    media_types: *media_types_anime_sama
    query_url: "{base_url}/catalogue/?{media_type_filter}{themes_filter}search={search_terms}&page={page}"
    pre_process:
      - type: remove_text_blocks
        start: '<script>window.__CF$cv$params='
        end: '</script>'
    query_param_mappings:
      - target_param: media_type_filter
        source_param: media_types
        item_suffix: "&"
        values:
          video/show/anime: "type%5B%5D=Anime"
          images/manga: "type%5B%5D=Scans"
          video/movie: "type%5B%5D=Film"
          video/show/other: "type%5B%5D=Autres"
          video/other: "type%5B%5D=Autres"
      - target_param: themes_filter
        source_param: themes
        item_suffix: "&"
        values:
          "Action" : "genre%5B%5D=Action"
          "Adolescence" : "genre%5B%5D=Adolescence"
          "Friendship" : "genre%5B%5D=Amitié"
          "Love" : "genre%5B%5D=Amour"
          "Martial Arts" : "genre%5B%5D=Arts martiaux"
          "Assassination" : "genre%5B%5D=Assassinat"
          "Other World" : "genre%5B%5D=Autre monde"
          "Adventure" : "genre%5B%5D=Aventure"
          "Fighting" : "genre%5B%5D=Combats"
          "Comedy" : "genre%5B%5D=Comédie"
          "Crime" : "genre%5B%5D=Crime"
          "Demons" : "genre%5B%5D=Démons"
          "Donghua" : "genre%5B%5D=Donghua"
          "Drama" : "genre%5B%5D=Drame"
          "Ecchi" : "genre%5B%5D=Ecchi"
          "School" : "genre%5B%5D=Ecole"
          "Family" : "genre%5B%5D=Famille"
          "Fantasy" : "genre%5B%5D=Fantastique"
          "Fantasy" : "genre%5B%5D=Fantasy"
          "Ghibli" : "genre%5B%5D=Ghibli"
          "War" : "genre%5B%5D=Guerre"
          "Harem" : "genre%5B%5D=Harem"
          "Historical" : "genre%5B%5D=Historique"
          "Horror" : "genre%5B%5D=Horreur"
          "Isekai" : "genre%5B%5D=Isekai"
          "Games" : "genre%5B%5D=Jeux"
          "Josei" : "genre%5B%5D=Josei"
          "Magic" : "genre%5B%5D=Magie"
          "Mecha" : "genre%5B%5D=Mechas"
          "Military" : "genre%5B%5D=Militaire"
          "Monsters" : "genre%5B%5D=Monstres"
          "Music" : "genre%5B%5D=Musique"
          "Mystery" : "genre%5B%5D=Mystère"
          "Nostalgia" : "genre%5B%5D=Nostalgie"
          "Politics" : "genre%5B%5D=Politique"
          "Psychological" : "genre%5B%5D=Psychologique"
          "Daily Life" : "genre%5B%5D=Quotidien"
          "Romance" : "genre%5B%5D=Romance"
          "Samurai" : "genre%5B%5D=Samouraïs"
          "School Life" : "genre%5B%5D=School Life"
          "Science Fiction" : "genre%5B%5D=Science-fiction"
          "Seinen" : "genre%5B%5D=Seinen"
          "Shojo" : "genre%5B%5D=Shôjo"
          "Shonen" : "genre%5B%5D=Shônen"
          "Slice of Life" : "genre%5B%5D=Slice of Life"
          "Sports" : "genre%5B%5D=Sport"
          "Supernatural" : "genre%5B%5D=Surnaturel"
          "Thriller" : "genre%5B%5D=Thriller"
          "Tournaments" : "genre%5B%5D=Tournois"
          "Work" : "genre%5B%5D=Travail"
          "Vampires" : "genre%5B%5D=Vampires"
          "Revenge" : "genre%5B%5D=Vengeance"
          "Time Travel" : "genre%5B%5D=Voyage temporel"
    row_selector: "html"
    entries:
      - name: source
        type: string
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "{page}"
      - name: total_pages
        type: number
        actions: *actions_catalog_total_pages_from_response
      - name: entries
        type: object[]
        selector: "div.as-carte"
        select: all
        entries: *entries_catalog_cards_with_other
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        remove_fields:
          - total_pages

  # ---------------------------------------------------------------
  # Entry detail page
  # ---------------------------------------------------------------
  - name: get_entry
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_anime_sama
    row_selector: "html"
    pre_process:
      - type: remove_text_blocks
        start: '<script>window.__CF$cv$params='
        end: '</script>'
    entries:
      - name: title
        type: string
        select: first
        selector: "h1"
        actions:
          - type: get_text
      - name: title/alt
        type: string
        select: first
        selector: "#titreAlter"
        actions:
          - type: get_text
      - name: rating
        type: number
        select: first
        selector: ".oe-notes .oe-note:first-child b"
        actions:
          - type: get_text
          # Deux notes sont présentes (Anime et Manga) : on ne garde que la
          # première (Anime). La virgule décimale est normalisée en point.
          - type: regex_replace_all
            pattern: ','
            replacement: '.'
      - name: img/landscape > link
        type: string
        select: first
        selector: "meta[property=\"og:image\"]"
        actions:
          - type: get_attribut
            argument: content
      - name: description
        type: string
        select: first
        selector: "#synopsisText"
        actions:
          - type: get_text
      - name: theme
        type: string[]
        selector: ".genre-pill"
        actions:
          - type: get_text
      - name: year
        type: number
        selector: ".oe-meta"
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '^(\d{4})'
            format: '{1}'
      # Infos de la fiche (dl .oe-infos). Les lignes varient selon l'œuvre
      # (ex. certaines fiches n'ont ni "Diffusion" ni "Durée"), donc il faut
      # s'ancrer sur les libellés plutôt que sur des positions nth-child.
      - name: release-date
        type: string
        select: first
        selector: ".oe-infos"
        actions:
          - type: get_html
          - type: regex_find_all
            pattern: '(?s)<dt[^>]*>\s*Diffusion\s*</dt>\s*<dd[^>]*>\s*(.*?)\s*</dd>'
            format: "{1}"
          - type: get_date
            format: dd_month_yyyy
            months:
              janv.: 1
              févr.: 2
              mars: 3
              avr.: 4
              mai: 5
              juin: 6
              juil.: 7
              août: 8
              sept.: 9
              oct.: 10
              nov.: 11
              déc.: 12
      - name: director
        type: string
        select: first
        selector: ".oe-infos"
        actions:
          - type: get_html
          - type: regex_find_all
            # The label is "Studio" on most sheets but "Studios" on some.
            pattern: '(?s)<dt[^>]*>\s*Studios?\s*</dt>\s*<dd[^>]*>\s*(.*?)\s*</dd>'
            format: "{1}"
      - name: duration
        type: number
        select: first
        selector: ".oe-infos"
        actions:
          - type: get_html
          - type: regex_find_all
            pattern: '(?s)<dt[^>]*>\s*Durée\s*</dt>\s*<dd[^>]*>\s*(.*?)\s*</dd>'
            format: "{1}"
          - type: normalize_duration
        # normalize_duration emits seconds for each episode ("25 min / ép." ->
        # 1500, "1 h 05" -> 3900). Sheets without a "Durée" row emit no value.
      - name: casting
        type: string[]
        selector: ".oe-perso.oe-staff .oe-perso-nom"
        select: all
        actions:
          - type: get_text
      # Season labels are duplicated across sibling groups ("Saison 1" in the
      # "Anime" group and in "Avatar : Les Sept Refuges"). CSS cannot bind a
      # group label to the seasons that follow it: each season group is an
      # `<h2>` immediately followed by a sibling `<div>` holding one `<script>`,
      # and CSS has no previous-sibling selector. Both elements are therefore
      # matched by the same entry so they are visited in document order: every
      # `<h2>` stores its own label in the request-scoped `@season_group`
      # variable and the `<script>` that follows prefixes its labels with it.
      - name: seasons > label
        type: string
        select: all
        selector: "h2.text-white.text-xl.font-bold.uppercase.border-b-2.mt-5.border-slate-500, div.flex.flex-wrap.overflow-y-hidden.justify-start.bg-slate-900.bg-opacity-70.rounded.mt-2.h-auto > script"
        actions:
          - type: get_text
          # `on_duplicate: replace` keeps the nearest preceding group label. The
          # pattern deliberately rejects anything that looks like a script body
          # (`(`, `)`, `"`, `;`, `*`), so season scripts cannot overwrite it.
          - type: extract_variables
            pattern: '^\s*([^()"*;]{1,80})\s*$'
            name: '@season_group'
            value: '{1}'
            on_duplicate: replace
          # The "Anime" group keeps its bare labels, as before.
          - type: extract_variables
            pattern: '^\s*Anime\s*$'
            name: '@season_group'
            value: ''
            on_duplicate: replace
          - type: regex_find_all
            pattern: '(?s)^(?:/\*.*?\*/\s*)?((?:[^/]|/[^*])*)(?:/\*.*)?$'
            format: "{1}"
          - type: regex_find_all
            pattern: '(?m)^[ \t]*panneauAnime\("([^"]+)"\s*,\s*"[^"]+"\);\s*$'
            format: "{1}"
          # `map` (unlike `format_text`) adds no value when the pipeline produced
          # none, so the `<h2>` matches contribute nothing and labels stay
          # aligned with `seasons > link`.
          - type: map
            argument: {}
            default: "{@season_group} - {}"
          - type: replace_variables
          # `extract_variables` trims the stored value, so an unprefixed group
          # ("Anime") leaves the separator of the template above behind.
          - type: regex_replace_all
            pattern: '^ - '
            replacement: ""
      - name: seasons > link
        type: string
        selector: "div.flex.flex-wrap.overflow-y-hidden.justify-start.bg-slate-900.bg-opacity-70.rounded.mt-2.h-auto > script"
        select: all
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '(?s)^(?:/\*.*?\*/\s*)?((?:[^/]|/[^*])*)(?:/\*.*)?$'
            format: "{1}"
          - type: regex_find_all
            pattern: '(?m)^[ \t]*panneauAnime\("[^"]+"\s*,\s*"([^"]+)"\);\s*$'
            format: "{1}"
          - type: resolve_url
      # Trailer. The page has no static playable iframe: the modal video
      # container is empty and `#bandeannonce` is only injected by JS at
      # click time. The jQuery snippet setting its `src` is itself commented
      # out in the HTML, so the only reliable source is the `data-youtube`
      # video id on the "Bande-annonce" button.
      - name: video/trailer
        type: string
        select: first
        selector: '[data-youtube]'
        actions:
          - type: get_attribut
            argument: data-youtube
          - type: format_text
            argument: "https://www.youtube.com/watch?v={}"
      # Editorial "Oeuvres similaires" rail, already in the detail response: no
      # extra call is needed, so only `entries` is emitted (no `link`, no
      # pagination). The rail sits after the seasons and never mixes with them,
      # and it reuses the same `as-carte` component as the catalogue listings.
      - name: recommendations
        type: object
        select: first
        selector: "div#containerSimilaires"
        entries:
          - name: entries
            type: object[]
            selector: "div.as-carte"
            select: all
            entries: *entries_catalog_cards

  # ---------------------------------------------------------------
  # Season
  # ---------------------------------------------------------------
  - name: get_season
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_anime_sama
    row_selector: "html"
    pre_process:
      - type: remove_text_blocks
        start: '<script>window.__CF$cv$params='
        end: '</script>'
    entries:
      - name: current_page
        type: number
        actions:
          - type: format_text
            argument: "1"
      - name: have_more
        type: boolean
        actions:
          - type: format_text
            argument: "false"
      - name: link
        type: string
        actions:
          - type: get_request_url
      - name: resolver
        type: string
        actions:
          - type: format_text
            argument: "stream-resolver"
      # The season page inlines the hoster directory used by its own player
      # labels (see `/js/contenu/lecteur.js`): hostname -> { "nom": "Vidmoly" }.
      - name: hoster-infos
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: '(?s)var\s+lecteursInfos\s*=\s*(\{.*?\});'
            format: "{1}"
      - name: languages
        type: object
        entries:
          - name: lang
            type: string
            actions:
              - type: get_request_url
              - type: regex_find_all
                pattern: '/(fr|vf|vostfr|vo|va|var|vkr|vcn|vqc|vf1|vf2)(?:/|$)'
                format: "{1}"
              - type: map
                argument:
                  fr: vf
                default: "{}"
          - name: link
            type: string
            actions:
              - type: get_request_url
      - name: languages
        type: object
        selector: "a[id^='switch']"
        select: all
        entries:
          - name: class
            type: string
            actions:
              - type: get_attribut
                argument: class
          - name: lang
            type: string
            actions:
              - type: get_attribut
                argument: href
              - type: regex_find_all
                pattern: '/?([^/]+)/?$'
                format: "{1}"
              - type: map
                argument:
                  fr: vf
                  vostfr: vo
                default: "{}"
          - name: link
            type: string
            actions: *actions_get_href_resolve
    post_process:
      # Every language page references its own `episodes.js` with a
      # `?filever=<file size>` cache-busting version that cannot be rebuilt from
      # the season link alone, so the script URL is read from each language page
      # before it is fetched.
      - type: fetch_regex_items_from_items
        source: languages
        request_field: link
        target: season-scripts
        pattern: '(?s)<script[^>]*\ssrc=["'']([^"'']*episodes\.js[^"'']*)["'']'
        copy_item_fields:
          - source: lang
            target: lang
        entries:
          - name: link
            type: string
            capture_group: 1
            actions:
              - type: resolve_url
      # Cloudflare blocks `episodes.js` hotlinking unless the request carries a
      # same-origin `Referer`, which the generic query fetch does not send.
      - type: fetch_regex_items_from_items
        source: season-scripts
        request_field: link
        target: player-arrays
        request_headers:
          - name: Referer
            actions:
              - type: format_text
                argument: "{base_url}/"
        pattern: "(?s)var\\s+eps(\\d+)\\s*=\\s*\\[(.*?)\\]\\s*;"
        copy_item_fields:
          - source: lang
            target: lang
        entries:
          - name: server-index
            type: number
            capture_group: 1
          - name: links
            type: string[]
            capture_group: 2
            actions:
              - type: regex_find_all
                pattern: "['\\\"]([^'\\\"]+)['\\\"]"
                format: "{1}"
          - name: name
            type: string[]
            capture_group: 2
            actions:
              - type: regex_find_all
                pattern: "['\\\"]([^'\\\"]+)['\\\"]"
                format: "{1}"
              - type: get_url_host
      - type: pivot_items_by_index
        source: player-arrays
        target: episodes
        values_field: links
        nested_field: players
        nested_value_field: web-link
        sort_by: server-index
        copy_item_fields:
          - source: lang
            target: lang
        copy_target_fields:
          - source: name
            target: name
        generated_fields:
          - name: episode-number
            type: number
            format: "{}"
          - name: title
            format: "Episode {}"
      # Turn the inline hoster directory into lookup items for `set_nested_fields`.
      - type: extract_regex_items
        source: hoster-infos
        target: hosters
        pattern: '"([^"]+)"\s*:\s*\{\s*"nom"\s*:\s*"([^"]+)"'
        entries:
          - name: host
            type: string
            capture_group: 1
          - name: label
            type: string
            capture_group: 2
      - type: set_nested_fields
        source: episodes
        nested_source: players
        fields:
          - target: resolver > kind
            value: "stream-resolver"
          - target: resolver > target_id
            copy_from: web-link
          - target: name
            host_from: web-link
            lookup:
              source: hosters
              key: host
              value: label
      - type: derive_pagination
        remove_fields:
          - languages
          - season-scripts
          - player-arrays
          - hoster-infos
          - hosters
