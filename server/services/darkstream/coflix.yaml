id: coflix
title: Coflix
logo: "{base_url}/wp-content/uploads/2023/01/cropped-coflix.png"
description:
  fr: "Films, Séries et Animés en streaming VF/HD."

http:
  mode: auto

parameters:
  - name: base_url
    value: https://coflix.cymru/
    description: "Base URL — update on domain change"

shared:

  media_types_coflix: &media_types_coflix
    - video/movie
    - video/show/serie
    - video/show/anime

  actions_img_html_to_url: &actions_img_html_to_url
    - type: regex_find_all
      pattern: 'src="(?:https?:)?(//[^"]+)'
      format: "https:{1}"

  actions_get_href_resolve: &actions_get_href_resolve
    - type: get_attribut
      argument: href
    - type: resolve_url

  actions_get_src_resolve: &actions_get_src_resolve
    - type: get_attribut
      argument: src
    - type: resolve_url

  optional_html_entry: &optional_html_entry
    - type: map
      default: "{}"
      argument:
        "false": null

  entries_catalog_item: &entries_catalog_item
    - name: title
      pointer: "/name"
    - name: link
      pointer: "/url"
    - name: web-link
      pointer: "/url"
    - name: img/poster > link
      pointer: "/path"
      actions: *actions_img_html_to_url
    - name: img/poster > link
      pointer: "/image"
      actions: *actions_img_html_to_url
    - name: media-type
      pointer: "/ts"
      actions:
        - type: map
          argument:
            movies: "video/movie"
            series: "video/show/serie"
            animes: "video/show/anime"
    - name: year
      pointer: "/release"
      actions:
        - type: map
          default: "{}"
          argument:
            "false": null
    - name: description
      pointer: "/excerpt"
      actions: *optional_html_entry
    - name: rating
      pointer: "/rating"
    - name: director
      pointer: "/director"
      actions: *optional_html_entry
    - name: casting
      pointer: "/casts"
      actions: *optional_html_entry

  entries_search_item: &entries_search_item
    - name: title
      pointer: "/title"
    - name: link
      pointer: "/url"
    - name: web-link
      pointer: "/url"
    - name: img/poster > link
      pointer: "/image"
      actions: *actions_img_html_to_url
    - name: media-type
      pointer: "/post_type"
      actions:
        - type: map
          argument:
            movies: "video/movie"
            series: "video/show/serie"
            animes: "video/show/anime"
    - name: year
      pointer: "/year"
      actions:
      - type: map
        default: "{}"
        argument:
          "false": null
    - name: description
      pointer: "/excerpt"
    - name: rating
      pointer: "/rating"
    - name: director
      pointer: "/director"
      actions: *optional_html_entry
    - name: casting
      pointer: "/cast"
      actions: *optional_html_entry

queries:

  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        value: "{service_id}"
      - name: title
        value: "{service_title}"
      - name: logo
        value: "{service_logo}"
      - name: description
        value: "{service_description}"

  - name: search
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{base_url}/suggest.php?query={search_terms}"
    media_types: *media_types_coflix
    row_pointer: "/"
    entries:
    - name: source
      pointer: "/0"
      select: first
      actions:
        - type: format_text
          argument: "{source}"
    - name: current_page
      pointer: "/0"
      select: first
      actions:
        - type: format_text
          argument: "1"
    - name: have_more
      pointer: "/0"
      select: first
      actions:
        - type: format_text
          argument: "false"
    - name: entries
      pointer: "/*"
      select: all
      entries:
        - name: title
          pointer: "/title"
        - name: link
          pointer: "/url"
        - name: web-link
          pointer: "/url"
        - name: img/poster > link
          pointer: "/image"
          actions: *actions_img_html_to_url
        - name: media-type
          pointer: "/post_type"
          actions:
            - type: map
              argument:
                movies: "video/movie"
                series: "video/show/serie"
                animes: "video/show/anime"
        - name: year
          pointer: "/year"
          actions:
          - type: map
            default: "{}"
            argument:
              "false": null
        - name: description
          pointer: "/excerpt"
        - name: rating
          pointer: "/rating"
        - name: director
          pointer: "/director"
          actions: *optional_html_entry
        - name: casting
          pointer: "/cast"
          actions: *optional_html_entry


  - name: load_home
    scraper_type: html
    media_types: *media_types_coflix
    base_url: "{base_url}"
    query_url: "{base_url}"
    row_selector: "html"
    entries:
      - name: source
        actions:
          - type: format_text
            argument: "{source}"

      - name: banners
        selector: 'article.splide__slide'
        entries: 
          - name: title
            selector: "h2"
            actions:
              - type: get_text
          - name: image
            selector: "figure.bg > img"
            select: all
            actions:
              - type: get_attribut
                argument: data-splide-lazy
              - type: format_text
                argument: "https:{}"
          - name: link
            selector: ul > li > a.btn
            actions:
              - type: get_attribut
                argument: href
          - name: web-link
            selector: ul > li > a.btn
            actions:
              - type: get_attribut
                argument: href
          - name: description
            selector: "div.entry-content > p"
            actions:
              - type: get_text
          - name: theme
            selector: "span.categories > div > a"
            actions:
              - type: get_text

      - name: categories
        entries:
          - name: key
            actions:
              - type: format_text
                argument: "movies"
          - name: label
            actions:
              - type: format_text
                argument: "Films"
          - name: request > query_url
            actions:
              - type: format_text
                argument: "{base_url}/wp-json/apiflix/v1/options/?post_type=movies&sort=1"
      - name: categories
        entries:
          - name: key
            actions:
              - type: format_text
                argument: "series"
          - name: label
            actions:
              - type: format_text
                argument: "Séries"
          - name: request > query_url
            actions:
              - type: format_text
                argument: "{base_url}/wp-json/apiflix/v1/options/?post_type=series&sort=1"
      - name: categories
        entries:
          - name: key
            actions:
              - type: format_text
                argument: "animes"
          - name: label
            actions:
              - type: format_text
                argument: "Animés"
          - name: request > query_url
            actions:
              - type: format_text
                argument: "{base_url}/wp-json/apiflix/v1/options/?post_type=animes&sort=1"
      - name: sections
        selector: ".main > section.wdgt_home_movies"
        select: all
        entries:
          - name: label
            selector: "header > div"
            actions:
                - type: get_text
          - name: entries
            selector: "div.movie-lst > div"
            select: all
            entries:
              - name: title
                selector: a
                actions: 
                  - type: get_attribut
                    argument: "aria-label"
              - name: link
                selector: a
                actions: 
                  - type: get_attribut
                    argument: href
              - name: web-link
                selector: a
                actions: 
                  - type: get_attribut
                    argument: href
              - name: img/poster > link
                selector: div > figure > img
                actions:
                  - type: get_attribut
                    argument: src
                  - type: format_text
                    argument: "http:{}"
              - name: year
                selector: .yearyear
                actions:
                  - type: get_text
              - name: rating
                selector: .imdb > span
                actions:
                  - type: get_text

  - name: get_category
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}&page={page}"
    media_types: *media_types_coflix
    row_pointer: "/"
    entries:
      - name: source
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: sections
        entries:
          - name: current_page
            actions:
              - type: format_text
                argument: "{page}"
          - name: have_more
            pointer: "/next"
          - name: page_size
            actions:
              - type: format_text
                argument: "20"
          - name: link
            actions:
              - type: format_text
                argument: "{query_url}"
          - name: entries
            pointer: "/results/*"
            select: all
            entries:
              - name: title
                pointer: "/name"
              - name: link
                pointer: "/url"
              - name: web-link
                pointer: "/url"
              - name: img/poster > link
                pointer: "/path"
                actions:
                  - type: regex_find_all
                    pattern: 'src="(?:https?:)?(//[^"]+)'
                    format: "https:{1}"
              - name: img/poster > link
                pointer: "/image"
                actions:
                  - type: regex_find_all
                    pattern: 'src="(?:https?:)?(//[^"]+)'
                    format: "https:{1}"
              - name: media-type
                pointer: "/ts"
                actions:
                  - type: map
                    argument:
                      movies: "video/movie"
                      series: "video/show/serie"
                      animes: "video/show/anime"
              - name: year
                pointer: "/release"
                actions:
                  - type: map
                    default: "{}"
                    argument:
                      "false": null
              - name: description
                pointer: "/excerpt"
                actions:
                  - type: html_to_text
                  - type: map
                    default: "{}"
                    argument:
                      "false": null
              - name: rating
                pointer: "/ranking"
              - name: director
                pointer: "/director"
                actions:
                  - type: map
                    default: "{}"
                    argument:
                      "false": null
              - name: casting
                pointer: "/casts"
                actions:
                  - type: map
                    default: "{}"
                    argument:
                      "false": null

  - name: get_section
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}&page={page}"
    media_types: *media_types_coflix
    row_pointer: "/"
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        remove_fields:
          - total_pages
    entries:
      - name: total_pages
        pointer: /total
      - name: source
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        actions:
          - type: format_text
            argument: "{page}"
      - name: have_more
        pointer: "/next"
      - name: page_size
        actions:
          - type: format_text
            argument: "20"
      - name: entries
        pointer: "/results/*"
        select: all
        entries:
          - name: source
            actions:
              - type: format_text
                argument: "{source}"
          - name: title
            pointer: "/name"
          - name: link
            pointer: "/url"
          - name: web-link
            pointer: "/url"
          - name: img/poster > link
            pointer: "/path"
            actions:
              - type: regex_find_all
                pattern: 'src="(?:https?:)?(//[^"]+)'
                format: "https:{1}"
          - name: img/poster > link
            pointer: "/image"
            actions:
              - type: regex_find_all
                pattern: 'src="(?:https?:)?(//[^"]+)'
                format: "https:{1}"
          - name: media-type
            pointer: "/ts"
            actions:
              - type: map
                argument:
                  movies: "video/movie"
                  series: "video/show/serie"
                  animes: "video/show/anime"
          - name: year
            pointer: "/release"
            actions:
              - type: map
                default: "{}"
                argument:
                  "false": null
          - name: description
            pointer: "/excerpt"
            actions:
              - type: html_to_text
              - type: map
                default: "{}"
                argument:
                  "false": null
          - name: rating
            pointer: "/rating"
          - name: director
            pointer: "/director"
            actions:
              - type: map
                default: "{}"
                argument:
                  "false": null
          - name: casting
            pointer: "/casts"
            actions:
              - type: map
                default: "{}"
                argument:
                  "false": null                     

  - name: get_entry
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_coflix
    row_selector: "html"
    entries:
      - name: source
        actions:
          - type: format_text
            argument: "{source}"
      - name: title
        selector: "h1.entry-title, h1"
        actions:
          - type: get_text
      - name: description
        selector: "div.summary p"
        actions:
          - type: get_text
      - name: img/poster > link
        selector: "figure > img"
        actions: *actions_get_src_resolve
      - name: year
        selector: ".year, span.release-year, .date"
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '(\d{4})'
            format: "{1}"
      - name: season > label
        selector: 'input[name="seasons"] + span'
        select: all
        actions:
          - type: get_text
      - name: season > link
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: 'name="seasons"\s[^>]*data-season="(\d+)"\s[^>]*post-id="(\d+)'
            format: "{base_url}/wp-json/apiflix/v1/series/{2}/{1}"
      - name: players
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: '<iframe[^>]+src="([^"]+)'
            format: "{1}"
        sub_queries:
          - scraper_type: html
            row_selector: "html"
            context_pointer: "/*"
            request_headers:
              - name: "Referer"
                actions:
                  - type: format_text
                    argument: "{base_url}"
            entries:
              - name: embed-link
                actions:
                  - type: get_response_body
                  - type: regex_find_all
                    pattern: "showVideo\\(\\s*['\"]([A-Za-z0-9+/=]+)['\"]"
                    format: "{1}"
                  - type: base64_decode
              - name: name
                actions:
                  - type: get_response_body
                  - type: regex_find_all
                    pattern: "showVideo\\(\\s*['\"]([A-Za-z0-9+/=]+)['\"]"
                    format: "{1}"
                  - type: base64_decode
                  - type: get_url_host
      - name: rating
        selector: "span.imdb > span"
        actions:
            - type: get_text
      - name: casting
        selector: p.cast > a
        select: all
        actions:
          - type: get_text
      - name: director
        selector: aside.title-content > p > a
        select: all
        actions:
          - type: get_text

      - name: year
        selector: "h1 + span"
        actions:
          - type: get_text
      - name: theme
        selector: "header > div > div > a"
        select: all
        actions:
          - type: get_text

  - name: get_season
    scraper_type: json
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types:
      - video/show/series
      - video/show/anime
    row_pointer: "/"
    entries:
      - name: current_page
        actions:
          - type: format_text
            argument: "1"
      - name: have_more
        actions:
          - type: format_text
            argument: "false"
    sub_queries:
      - context_pointer: "/episodes/*"
        target: episodes
        request_pointer: "/id"
        request_actions:
          - type: format_text
            argument: "{base_url}wp-json/apiflix/v1/playerepisode?post_id={}"
        row_pointer: "/"
        context_entries:
          - name: id
            pointer: "/id"
          - name: title
            pointer: "/title"
          - name: episode-number
            pointer: "/number"
          - name: img/preview > link
            pointer: "/image"
            actions: *actions_img_html_to_url
        entries:
          - name: players > embed-link
            pointer: "/links/online/*/link"
            select: all
          - name: release-date
            pointer: "/links/online/*/date"
            select: first