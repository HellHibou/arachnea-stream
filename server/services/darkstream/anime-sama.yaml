id: anime-sama
title: Anime-Sama
logo: https://raw.githubusercontent.com/Anime-Sama/IMG/img/autres/logo.png
description: 
  fr : "Anime-Sama est une plateforme de streaming et de lecture en ligne dédiée aux animés, mangas et webtoons. Elle propose un large catalogue de contenus, allant des dernières sorties aux classiques du genre, avec des options de filtrage par type de média, thème et langue."

http:
  mode: auto

parameters:
  - name: base_url
    value: https://anime-sama.to
    description: Base URL used to resolve Anime-Sama requests.

shared:

  media_types_anime_sama: &media_types_anime_sama
    - video/show/anime
    - images/manga
    - images/webtoon

  actions_get_src: &actions_get_src
    - type: get_attribut
      argument: src

  actions_get_alt: &actions_get_alt
    - type: get_attribut
      argument: alt

  actions_get_href: &actions_get_href
    - type: get_attribut
      argument: href

  actions_catalog_total_pages_from_response: &actions_catalog_total_pages_from_response
    - type: get_response_body
    - type: regex_find_all
      pattern: '(?s)<div\s+id=["'']list_pagination["''][^>]*>(.*?)</div>'
      format: "{1}"
    - type: regex_find_all
      pattern: '(?:[?&]|&amp;)page=(\d+)'
      format: "{1}"
    - type: max

  actions_get_href_resolve: &actions_get_href_resolve
    - type: get_attribut
      argument: href
    - type: resolve_url

  actions_get_href_catalog_root_resolve: &actions_get_href_catalog_root_resolve
    - type: get_attribut
      argument: href
    - type: regex_find_all
      pattern: '^(/catalogue/[^/]+)'
      format: "{1}"
    - type: resolve_url

  actions_split_comma_text: &actions_split_comma_text
    - type: get_text
    - type: split
      argument: ","

  actions_media_type_search: &actions_media_type_search
    - type: get_text
    - type: split
      argument: ","
    - type: map
      argument:
        Anime: "video/show/anime"
        Scans: "images/manga"
        Webtoon: "images/webtoon"
        Film: "video/movie"
        Autres: "video/show/other"

  actions_release_date_dd_mm_yyyy: &actions_release_date_dd_mm_yyyy
    - type: get_text
    - type: get_date
      format: dd_mm_yyyy

  actions_lang_from_request_url: &actions_lang_from_request_url
    - type: get_request_url
    - type: regex_find_all
      pattern: '/(fr|vf|vostfr|vo|va|var|vkr|vcn|vqc|vf1|vf2)(?:/|$)'
      format: "{1}"
    - type: map
      argument:
        fr: vf
        vostfr: vo
      default: "{}"

  actions_lang_from_switch_href: &actions_lang_from_switch_href
    - type: get_attribut
      argument: href
    - type: regex_find_all
      pattern: '/?([^/]+)/?$'
      format: "{1}"
    - type: map
      argument:
        fr: vf
        vostfr: vo
      default: "{}"

  entries_catalog_cards: &entries_catalog_cards
    - name: title
      selector: "h2.card-title"
      actions: 
        - type: get_text
    - name: title/alt
      selector: "p.alternate-titles"
      actions: 
        - type: get_text
    - name: media-type
      selector: "div.catalog-info > div.info-row:nth-child(2) > p.info-value"
      actions: *actions_media_type_search
    - name: img/landscape > link
      selector: "img.card-image"
      actions: *actions_get_src
    - name: description
      selector: "div.synopsis-content"
      actions:  
        - type: get_text
    - name: link
      selector: "a"
      actions: *actions_get_href_resolve
    - name: web-link
      selector: "a"
      actions: *actions_get_href_resolve
    - name: theme
      selector: "div.catalog-info > div.info-row:nth-child(1) > p.info-value"
      actions: *actions_split_comma_text
    - name: lang
      selector: "div.catalog-info > div.info-row:nth-child(3) > p.info-value"
      actions: *actions_split_comma_text

  entries_catalog_cards_with_other: &entries_catalog_cards_with_other
    - name: source
      actions:
        - type: format_text
          argument: "{source}"
    - name: title
      selector: "h2.card-title"
      actions:  
        - type: get_text
    - name: title/alt
      selector: "p.alternate-titles"
      actions:  
        - type: get_text
    - name: media-type
      selector: "div.catalog-info > div.info-row:nth-child(2) > p.info-value"
      actions: *actions_media_type_search
    - name: img/landscape > link
      selector: "img.card-image"
      actions: *actions_get_src
    - name: description
      selector: "div.synopsis-content"
      actions:  
        - type: get_text
    - name: link
      selector: "a"
      actions: *actions_get_href_resolve
    - name: web-link
      selector: "a"
      actions: *actions_get_href_resolve
    - name: theme
      selector: "div.catalog-info > div.info-row:nth-child(1) > p.info-value"
      actions: *actions_split_comma_text
    - name: lang
      selector: "div.catalog-info > div.info-row:nth-child(3) > p.info-value"
      actions: *actions_split_comma_text

  entries_latest_anime: &entries_latest_anime
    - name: title
      selector: "h2.card-title"
      actions:  
        - type: get_text
    - name: media-type
      actions:
        - type: format_text
          argument: "video/show/anime"
    - name: episode > label
      selector: "div.info-item.episode span.info-text"
      actions:  
        - type: get_text
    - name: release-date
      selector: "div.info-item.release-time span.time-text"
      actions: *actions_release_date_dd_mm_yyyy
    - name: lang
      selector: ".language-badge-top img"
      actions: *actions_get_alt
    - name: link
      selector: "a"
      actions: *actions_get_href_catalog_root_resolve
    - name: web-link
      selector: "a"
      actions: *actions_get_href_catalog_root_resolve
    - name: img/landscape > link
      selector: "img.card-image"
      actions: *actions_get_src

  entries_latest_scans: &entries_latest_scans
    - name: title
      selector: "h2.card-title"
      actions:  
        - type: get_text
    - name: media-type
      selector: ".scan-badge .badge-text"
      actions: *actions_media_type_search
    - name: episode > label
      selector: "div.info-item.chapter span.info-text"
      actions:  
        - type: get_text
    - name: release-date
      selector: "div.info-item.release-time span.time-text"
      actions: *actions_release_date_dd_mm_yyyy
    - name: lang
      selector: ".language-badge-top img"
      actions: *actions_get_alt
    - name: link
      selector: "a"
      actions: *actions_get_href_catalog_root_resolve
    - name: web-link
      selector: "a"
      actions: *actions_get_href_catalog_root_resolve
    - name: img/landscape > link
      selector: "img.card-image"
      actions: *actions_get_src

  get_category_entries: &get_category_entries
    - name: categories
      entries:
        - name: key
          actions:
            - type: format_text
              argument: "anime"
        - name: label
          actions:
            - type: format_text
              argument: "Anime"
        - name: request > query_url
          actions:
            - type: format_text
              argument: "{base_url}/catalogue/?type%5B%5D=Anime"
    - name: categories
      entries:
        - name: key
          actions:
            - type: format_text
              argument: "manga"
        - name: label
          actions:
            - type: format_text
              argument: "Scans"
        - name: request > query_url
          actions:
            - type: format_text
              argument: "{base_url}/catalogue/?type%5B%5D=Scans"
    - name: categories
      entries:
        - name: key
          actions:
            - type: format_text
              argument: "webtoon"
        - name: label
          actions:
            - type: format_text
              argument: "Webtoon"
        - name: request > query_url
          actions:
            - type: format_text
              argument: "{base_url}/catalogue/?type%5B%5D=Webtoon"
    - name: sections
      entries:
        - name: label
          actions:
            - type: format_text
              argument: "Catalogue"
        - name: link
          actions:
            - type: format_text
              argument: "{query_url}"
        - name: current_page
          actions:
            - type: format_text
              argument: "{page}"
        - name: total_pages
          actions: *actions_catalog_total_pages_from_response
        - name: entries
          selector: "div.catalog-card.card-base"
          select: all
          entries: *entries_catalog_cards_with_other

# ==========================================================
# Queries
# ==========================================================
queries:
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        value: "{service_id}"
      - name: title
        value: "{service_title}"
      - name: logo
        value: "{service_logo}"
      - name: description
        value: "{service_description}"
      - name: search_themes
        value:
          - "Action"
          - "Adolescence"
          - "Friendship"
          - "Love"
          - "Martial Arts"
          - "Assassination"
          - "Other World"
          - "Adventure"
          - "Fighting"
          - "Comedy"
          - "Crime"
          - "Demons"
          - "Donghua"
          - "Drama"
          - "Ecchi"
          - "School"
          - "Family"
          - "Fantasy"
          - "Fantasy"
          - "Ghibli"
          - "War"
          - "Harem"
          - "Historical"
          - "Horror"
          - "Isekai"
          - "Games"
          - "Josei"
          - "Magic"
          - "Mecha"
          - "Military"
          - "Monsters"
          - "Music"
          - "Mystery"
          - "Nostalgia"
          - "Politics"
          - "Psychological"
          - "Daily Life"
          - "Romance"
          - "Samurai"
          - "School Life"
          - "Science Fiction"
          - "Seinen"
          - "Shojo"
          - "Shonen"
          - "Slice of Life"
          - "Sports"
          - "Supernatural"
          - "Thriller"
          - "Tournaments"
          - "Work"
          - "Vampires"
          - "Revenge"
          - "Time Travel"

  - name: search
    scraper_type: html
    base_url: "{base_url}"
    media_types: *media_types_anime_sama
    query_url: "{base_url}/catalogue/?{media_type_filter}{themes_filter}search={search_terms}&page={page}"
    query_param_mappings: 
      - target_param: media_type_filter
        source_param: media_types
        item_suffix: "&"
        values:
          video/show/anime: "type%5B%5D=Anime"
          images/manga: "type%5B%5D=Scans"
          video/movie: "type%5B%5D=Film"
          video/show/other: "type%5B%5D=Autres"
          video/other: "type%5B%5D=Autres"
      - target_param: themes_filter
        source_param: themes
        item_suffix: "&"
        values:
          "Action" : "genre%5B%5D=Action"
          "Adolescence" : "genre%5B%5D=Adolescence"
          "Friendship" : "genre%5B%5D=Amitié"
          "Love" : "genre%5B%5D=Amour"
          "Martial Arts" : "genre%5B%5D=Arts martiaux"
          "Assassination" : "genre%5B%5D=Assassinat"
          "Other World" : "genre%5B%5D=Autre monde"
          "Adventure" : "genre%5B%5D=Aventure"
          "Fighting" : "genre%5B%5D=Combats"
          "Comedy" : "genre%5B%5D=Comédie"
          "Crime" : "genre%5B%5D=Crime"
          "Demons" : "genre%5B%5D=Démons"
          "Donghua" : "genre%5B%5D=Donghua"
          "Drama" : "genre%5B%5D=Drame"
          "Ecchi" : "genre%5B%5D=Ecchi"
          "School" : "genre%5B%5D=Ecole"
          "Family" : "genre%5B%5D=Famille"
          "Fantasy" : "genre%5B%5D=Fantastique"
          "Fantasy" : "genre%5B%5D=Fantasy"
          "Ghibli" : "genre%5B%5D=Ghibli"
          "War" : "genre%5B%5D=Guerre"
          "Harem" : "genre%5B%5D=Harem"
          "Historical" : "genre%5B%5D=Historique"
          "Horror" : "genre%5B%5D=Horreur"
          "Isekai" : "genre%5B%5D=Isekai"
          "Games" : "genre%5B%5D=Jeux"
          "Josei" : "genre%5B%5D=Josei"
          "Magic" : "genre%5B%5D=Magie"
          "Mecha" : "genre%5B%5D=Mechas"
          "Military" : "genre%5B%5D=Militaire"
          "Monsters" : "genre%5B%5D=Monstres"
          "Music" : "genre%5B%5D=Musique"
          "Mystery" : "genre%5B%5D=Mystère"
          "Nostalgia" : "genre%5B%5D=Nostalgie"
          "Politics" : "genre%5B%5D=Politique"
          "Psychological" : "genre%5B%5D=Psychologique"
          "Daily Life" : "genre%5B%5D=Quotidien"
          "Romance" : "genre%5B%5D=Romance"
          "Samurai" : "genre%5B%5D=Samouraïs"
          "School Life" : "genre%5B%5D=School Life"
          "Science Fiction" : "genre%5B%5D=Science-fiction"
          "Seinen" : "genre%5B%5D=Seinen"
          "Shojo" : "genre%5B%5D=Shôjo"
          "Shonen" : "genre%5B%5D=Shônen"
          "Slice of Life" : "genre%5B%5D=Slice of Life"
          "Sports" : "genre%5B%5D=Sport"
          "Supernatural" : "genre%5B%5D=Surnaturel"
          "Thriller" : "genre%5B%5D=Thriller"
          "Tournaments" : "genre%5B%5D=Tournois"
          "Work" : "genre%5B%5D=Travail"
          "Vampires" : "genre%5B%5D=Vampires"
          "Revenge" : "genre%5B%5D=Vengeance"
          "Time Travel" : "genre%5B%5D=Voyage temporel"


    row_selector: "html"
    entries:
      - name: source
        actions:
          - type: format_text
            argument: "{source}"
      - name: current_page
        actions:
          - type: format_text
            argument: "{page}"
      - name: total_pages
        actions: *actions_catalog_total_pages_from_response
      - name: entries
        selector: "div.catalog-card.card-base"
        select: all
        entries:
          - name: title
            selector: "h2.card-title"
            actions:  
              - type: get_text
          - name: title/alt
            selector: "p.alternate-titles"
            actions:  
              - type: get_text
          - name: media-type
            selector: "div.catalog-info > div.info-row:nth-child(2) > p.info-value"
            actions: *actions_media_type_search
          - name: img/poster > link
            selector: "img.card-image"
            actions: *actions_get_src
          - name: description
            selector: "div.synopsis-content"
            actions:  
              - type: get_text
          - name: link
            selector: "a"
            actions: *actions_get_href
          - name: web-link
            selector: "a"
            actions: *actions_get_href
          - name: theme
            selector: "div.catalog-info > div.info-row:nth-child(1) > p.info-value"
            actions: *actions_split_comma_text
          - name: lang
            selector: "div.catalog-info > div.info-row:nth-child(3) > p.info-value"
            actions: *actions_split_comma_text
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        remove_fields:
          - total_pages

  - name: get_entry
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_anime_sama
    row_selector: "html"
    entries:
      - name: title
        selector: "h4#titreOeuvre"
        actions:  
          - type: get_text
      - name: title/alt
        selector: "h2#titreAlter"
        actions:  
          - type: get_text
      - name: img/poster > link
        selector: "img#coverOeuvre"
        actions: *actions_get_src
      - name: description
        selector: "div.oeuvre-right p.leading-relaxed"
        actions:  
          - type: get_text
      - name: theme
        selector: "div.oeuvre-right > div:last-child > a.text-sm.text-gray-300"
        actions: *actions_split_comma_text
      - name: season > label
        selector: "div.flex.flex-wrap.overflow-y-hidden.justify-start.bg-slate-900.bg-opacity-70.rounded.mt-2.h-auto > script"
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '(?s)^(?:/\*.*?\*/\s*)?((?:[^/]|/[^*])*)(?:/\*.*)?$'
            format: "{1}"
          - type: regex_find_all
            pattern: '(?m)^[ \t]*panneauAnime\("([^"]+)"\s*,\s*"[^"]+"\);\s*$'
            format: "{1}"
      - name: season > link
        selector: "div.flex.flex-wrap.overflow-y-hidden.justify-start.bg-slate-900.bg-opacity-70.rounded.mt-2.h-auto > script"
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: '(?s)^(?:/\*.*?\*/\s*)?((?:[^/]|/[^*])*)(?:/\*.*)?$'
            format: "{1}"
          - type: regex_find_all
            pattern: '(?m)^[ \t]*panneauAnime\("[^"]+"\s*,\s*"([^"]+)"\);\s*$'
            format: "{1}"
          - type: resolve_url
      - name: video/trailer
        selector: 'div[id="sousBlocMiddle"] > div > script'
        actions:
          - type: get_text
            argument: src
          - type: regex_find_all
            pattern: '(https?://(?:www\.)?(?:youtube(?:-nocookie)?\.com/(?:embed/[A-Za-z0-9_-]+|watch\?v=[A-Za-z0-9_-]+)|youtu\.be/[A-Za-z0-9_-]+))'
            format: "{1}"

  - name: load_home
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}"
    media_types: *media_types_anime_sama
    row_selector: "html"
    entries: 
    - name: banners
      selector: "div.ak-slide"
      select: all
      entries: 
      - name: key
        actions:
          - type: format_text
            argument: "anime-sama-season-banner"
      - name: title
        selector: "h2.ak-slide-title"
        actions:
          - type: get_text
      - name: image
        selector: "img"
        actions: *actions_get_src
      - name: link
        selector: ".ak-slide-cta"
        actions:
        - type: get_attribut
          argument: href
        - type: regex_find_all
          pattern: '(/catalogue/[^/]+)(?:/[^/]+)*'
          format: "{base_url}{1}"
      - name: web-link
        selector: ".ak-slide-cta"
        actions:
        - type: get_attribut
          argument: href
        - type: regex_find_all
          pattern: '(/catalogue/[^/]+)(?:/[^/]+)*'
          format: "{base_url}{1}"
      - name: description
        selector: "p.ak-slide-synopsis"
        actions:
          - type: get_text
    - name: categories
      entries:
        - name: key
          actions:
            - type: format_text
              argument: "Animés"
        - name: label
          actions:
            - type: format_text
              argument: "Animés"
        - name: request > query_url
          actions:
            - type: format_text
              argument: "{base_url}/catalogue/?type%5B%5D=Anime"
    - name: categories
      entries:
        - name: key
          actions:
            - type: format_text
              argument: "manga"
        - name: label
          actions:
            - type: format_text
              argument: "Scans"
        - name: request > query_url
          actions:
            - type: format_text
              argument: "{base_url}/catalogue/?type%5B%5D=Scans"
    - name: categories
      entries:
        - name: key
          actions:
            - type: format_text
              argument: "webtoon"
        - name: label
          actions:
            - type: format_text
              argument: "Webtoon"
        - name: request > query_url
          actions:
            - type: format_text
              argument: "{base_url}/catalogue/?type%5B%5D=Webtoon"
    - name: sections
      selector: "div#containerSorties"
      entries:
        - name: label
          actions:
            - type: format_text
              argument: "Derniers contenus sortis"
        - name: entries
          selector: "div.catalog-card.card-base"
          select: all
          entries: *entries_catalog_cards
    - name: sections
      selector: "div#containerAjoutsAnimes"
      entries:
        - name: label
          actions:
            - type: format_text
              argument: "Derniers épisodes ajoutés"
        - name: entries
          selector: "div.anime-card-premium.card-base"
          select: all
          entries: *entries_latest_anime
    - name: sections
      selector: "div#containerAjoutsScans"
      entries:
        - name: label
          actions:
            - type: format_text
              argument: "Derniers scans ajoutés"
        - name: entries
          selector: "div.scan-card-premium.card-base"
          select: all
          entries: *entries_latest_scans
    - name: sections
      selector: "div#containerPepites"
      entries:
        - name: label
          actions:
            - type: format_text
              argument: "Découvrez des pépites"
        - name: entries
          selector: "div.catalog-card.card-base"
          select: all
          entries: *entries_catalog_cards

  - name: get_category
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}&page={page}"
    media_types: *media_types_anime_sama
    row_selector: "html"
    entries: *get_category_entries
    post_process:
      - type: derive_pagination
        source: sections
        total_pages_field: total_pages
        remove_fields:
          - total_pages

  - name: get_section
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}&page={page}"
    media_types: *media_types_anime_sama
    row_selector: "html"
    entries:
      - name: current_page
        actions:
          - type: format_text
            argument: "{page}"
      - name: total_pages
        actions: *actions_catalog_total_pages_from_response
      - name: entries
        selector: "div.catalog-card.card-base"
        select: all
        entries: *entries_catalog_cards_with_other
    post_process:
      - type: derive_pagination
        total_pages_field: total_pages
        remove_fields:
          - total_pages

  - name: get_season
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_anime_sama
    row_selector: "html"
    entries:
      - name: current_page
        actions:
          - type: format_text
            argument: "1"
      - name: have_more
        actions:
          - type: format_text
            argument: "false"
      - name: link
        actions:
          - type: get_request_url
      - name: languages
        entries:
          - name: lang
            actions: *actions_lang_from_request_url
          - name: link
            actions:
              - type: get_request_url
      - name: languages
        selector: "a[id^='switch']"
        select: all
        entries:
          - name: class
            actions:
              - type: get_attribut
                argument: class
          - name: lang
            actions: *actions_lang_from_switch_href
          - name: link
            actions: *actions_get_href_resolve
    post_process:
      - type: fetch_regex_items_from_items
        source: languages
        request_field: link
        request_actions:
          - type: regex_find_all
            pattern: '^(.*?)/?$'
            format: "{1}"
          - type: suffix
            argument: "/episodes.js"
        target: player-arrays
        pattern: "(?s)var\\s+eps(\\d+)\\s*=\\s*\\[(.*?)\\]\\s*;"
        copy_item_fields:
          - source: lang
            target: lang
        entries:
          - name: server-index
            capture_group: 1
          - name: links
            capture_group: 2
            actions:
              - type: regex_find_all
                pattern: "['\\\"]([^'\\\"]+)['\\\"]"
                format: "{1}"
          - name: name
            capture_group: 2
            actions:
              - type: regex_find_all
                pattern: "(?s).*?['\\\"]([^'\\\"]+)['\\\"].*"
                format: "{1}"
              - type: get_url_host
      - type: pivot_items_by_index
        source: player-arrays
        target: episodes
        values_field: links
        nested_field: players
        nested_value_field: embed-link
        sort_by: server-index
        copy_item_fields:
          - source: name
            target: name
          - source: lang
            target: lang
        copy_root_fields:
          - source: link
            target: season-link
        promote_first_nested_fields:
          - source: season-link
            target: link
        generated_fields:
          - name: episode-number
            format: "{}"
          - name: title
            format: "Episode {}"
