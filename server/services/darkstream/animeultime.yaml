id: animeultime
title: Anime Ultime
logo: "{base_url}/favicon.ico"
description:
  fr: "Animés, Dramas et Tokusatsu en streaming et Direct Download."
http:
  mode: auto


# ############################################################################
# Parameters
# ############################################################################
parameters:
  - name: base_url
    value: http://www.anime-ultime.net
    description: "Base URL — update on domain change"


# ############################################################################
# Shared structs
# ############################################################################
shared:
  media_types_default: &media_types_default
    - video/movie
    - video/show/anime
    - video/show/serie
    - audio/ost

  actions_poster_from_onmouseover: &actions_poster_from_onmouseover
    - type: get_attribut
      argument: onmouseover
    - type: regex_find_all
      pattern: "img=([^\"'\\s]+)"
      format: "{1}"
    - type: format_text
      argument: "{base_url}/img_resize.php?img={}"

  media_type_map_action: &media_type_map_action
    - type: get_text
    - type: map
      default: "video/other/{}"
      argument:
        "Episode": "video/show/anime"
        "OAV": "video/show/anime"
        "Tokusatsu" :  "video/show/serie"
        "Drama" :  "video/show/serie"
        "Film": "video/movie"
        "OST": "audio/ost"
  entries_top_item: &entries_top_item
    - name: title
      type: string
      actions:
        - type: get_text
        - type: regex_find_all
          pattern: "^(?:\\d+\\.\\s*)?(.*)"
          format: "{1}"
    - name: link
      type: string
      actions:
        - type: get_attribut
          argument: href
        - type: format_text
          argument: "{base_url}/{}"
    - name: web-link
      type: string
      actions:
        - type: get_attribut
          argument: href
        - type: format_text
          argument: "{base_url}/{}"
    - name: img/poster > link
      type: string
      actions: *actions_poster_from_onmouseover
    - name: source
      type: string
      actions:
        - type: format_text
          argument: "animeultime"
    - name: media-type
      type: string
      actions:
        - type: format_text
          argument: "video/show/serie"


# ############################################################################
# Queries
# ############################################################################
queries:

  # --------------------------------------------------------------------------
  # Service stream metadata
  # --------------------------------------------------------------------------
  - name: service_stream_metadata
    scraper_type: static
    entries:
      - name: id
        type: string
        value: "{service_id}"
      - name: title
        type: string
        value: "{service_title}"
      - name: logo
        type: string
        value: "{service_logo}"
      - name: description
        type: object
        value: "{service_description}"

  # ---------------------------------------------------------------
  # Home page
  # ---------------------------------------------------------------
  - name: load_home
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}"
    media_types: *media_types_default
    row_selector: "html"
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"

      # ---- Categories (menu de navigation) ----
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "animes"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Animés"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/series-0-1/anime/0---"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "dramas"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Dramas"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/series-0-1/drama/0---"
      - name: categories
        type: object[]
        entries:
          - name: key
            type: string
            actions:
              - type: format_text
                argument: "tokusatsu"
          - name: label
            type: string
            actions:
              - type: format_text
                argument: "Tokusatsu"
          - name: request > query_url
            type: string
            actions:
              - type: format_text
                argument: "{base_url}/series-0-1/tokusatsu/0---"

      # ---- Section: Derniers ajouts ----
      - name: sections
        type: object[]
        entries:
          - name: label
            type: string
            selector: "div.title_add"
            select: first
            actions:
              - type: get_text
              - type: regex_find_all
                pattern: "^([^:]+)"
                format: "{1}"
          - name: id
            type: string
            actions:
              - type: format_text
                argument: "latest-additions"
          - name: items
            type: object[]
            selector: "table.jtable tr:nth-child(n+2)"
            select: all
            entries:
              - name: title
                type: string
                select: first
                selector: "td + td a"
                actions:
                  - type: get_text
              - name: link
                type: string
                select: first
                selector: "td + td a"
                actions:
                  - type: get_attribut
                    argument: href
                  - type: format_text
                    argument: "{base_url}/{}"
              - name: web-link
                type: string
                select: first
                selector: "td + td a"
                actions:
                  - type: get_attribut
                    argument: href
                  - type: format_text
                    argument: "{base_url}/{}"
              - name: img/poster > link
                type: string
                select: first
                selector: "td + td a"
                actions: *actions_poster_from_onmouseover
              - name: media-type
                type: string
                selector: "td[align=center]:nth-of-type(5)"
                actions: *media_type_map_action
              - name: source
                type: string
                actions:
                  - type: format_text
                    argument: "animeultime"            

      # ---- Section: Top animes ---- enfant 4 (titre) et 5 (items)
      - name: sections
        type: object[]
        entries:
          - name: label
            type: string
            selector: "div.contain_stats > :nth-child(4)"
            select: first
            actions:
              - type: get_text
              - type: regex_find_all
                pattern: "^([^:]+)"
                format: "{1}"
          - name: id
            type: string
            actions:
              - type: format_text
                argument: "top-animes"
          - name: items
            type: object[]
            selector: "div.contain_stats > :nth-child(5) > a"
            select: all
            entries: *entries_top_item

      # ---- Section: Top dramas ---- enfant 6 (titre) et 7 (items)
      - name: sections
        type: object[]
        entries:
          - name: label
            type: string
            selector: "div.contain_stats > :nth-child(6)"
            select: first
            actions:
              - type: get_text
              - type: regex_find_all
                pattern: "^([^:]+)"
                format: "{1}"
          - name: id
            type: string
            actions:
              - type: format_text
                argument: "top-dramas"
          - name: items
            type: object[]
            selector: "div.contain_stats > :nth-child(7) > a"
            select: all
            entries: *entries_top_item

      # ---- Section: Top tokusatsu ---- enfant 8 (titre) et 9 (items)
      - name: sections
        type: object[]
        entries:
          - name: label
            type: string
            selector: "div.contain_stats > :nth-child(8)"
            select: first
            actions:
              - type: get_text
              - type: regex_find_all
                pattern: "^([^:]+)"
                format: "{1}"
          - name: id
            type: string
            actions:
              - type: format_text
                argument: "top-tokusatsu"
          - name: items
            type: object[]
            selector: "div.contain_stats > :nth-child(9) > a"
            select: all
            entries: *entries_top_item

  # ---------------------------------------------------------------
  # Category listing
  # ---------------------------------------------------------------
  - name: get_category
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_default
    row_selector: "html"
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: sections
        type: object[]
        entries:
        - name: entries
          type: object[]
          selector: tr:not(:first-child)
          select: all
          entries:
            - name: title
              type: string
              select: first
              selector: td + td > a
              actions:
                - type: get_text
            - name: description
              type: string
              select: first
              selector: strong
              actions:
                - type: get_text
            - name: link
              type: string
              select: first
              selector: "a"
              actions:
                - type: get_attribut
                  argument: href
                - type: format_text
                  argument: "{base_url}/{}"
            - name: web-link
              type: string
              select: first
              selector: "a"
              actions:
                - type: get_attribut
                  argument: href
                - type: format_text
                  argument: "{base_url}/{}"
            - name: img/poster > link
              type: string
              selector: "td > a"
              select: first
              actions:
                - type: get_attribut
                  argument: onmouseover
                - type: regex_find_all
                  pattern: "img=([^\"'\\s]+)"
                  format: "{1}"
                - type: format_text
                  argument: "{base_url}/img_resize.php?img={}"
            - name: media-type
              type: string
              selector: "td:nth-child(3)"
              actions:  *media_type_map_action
            - name: rating
              type: number
              select: first
              selector: "td:nth-child(5)"
              actions: 
               - type: get_text
               - type: regex_find_all
                 pattern: "([0-9\\.]+)"
                 format: "{1}"
 
            - name: source
              type: string
              actions:
                - type: format_text
                  argument: "animeultime"

  # --------------------------------------------------------------------------
  # Search
  # --------------------------------------------------------------------------
  - name: search
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{base_url}/search-0-1+{search_terms}"
    media_types: *media_types_default
    row_selector: "html"
    entries:
      - name: source
        type: string
        select: first
        actions:
          - type: format_text
            argument: "{source}"
      - name: entries
        type: object[]
        selector: "tr:not(:first-child)"
        select: all
        entries:
          - name: title
            type: string
            select: first
            selector: "a"
            actions:
              - type: get_text
          - name: link
            type: string
            select: first
            selector: "a"
            actions:
              - type: get_attribut
                argument: href
              - type: format_text
                argument: "{base_url}/{}"
          - name: web-link
            type: string
            select: first
            selector: "a"
            actions:
              - type: get_attribut
                argument: href
              - type: format_text
                argument: "{base_url}/{}"
          - name: img/poster > link
            type: string
            select: first
            selector: "a"
            actions:
              - type: get_attribut
                argument: onmouseover
              - type: regex_find_all
                pattern: "img=([^\"'\\s]+)"
                format: "{1}"
              - type: format_text
                argument: "{base_url}/img_resize.php?img={}"
          - name: media-type
            type: string
            selector: "td[align=center]"
            actions: *media_type_map_action
          - name: source
            type: string
            actions:
              - type: format_text
                argument: "animeultime"

  # ---------------------------------------------------------------
  # Entry detail page
  # ---------------------------------------------------------------
  - name: get_entry
    scraper_type: html
    base_url: "{base_url}"
    query_url: "{query_url}"
    media_types: *media_types_default
    row_selector: "html"
    entries:
      - name: title
        type: string
        select: first
        selector: "h1"
        actions:
          - type: get_text
      - name: title/alt
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: "TITRE ORIGINAL\\s*:\\s*([^<]+?)(?:<br|$)"
            format: "{1}"
      - name: year
        type: number
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: "ANN.?ES DE PRODUCTION\\s*:\\s*(\\d{4})"
            format: "{1}"
      - name: director
        type: string[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: "STUDIO\\s*:\\s*\\[([^\\]]+)\\]"
            format: "{1}"
      - name: theme
        type: string[]
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: "GENRES?\\s*:\\s*(.*?)(?:<br|$)"
            format: "{1}"
          - type: regex_find_all
            pattern: "\\[([^\\]]+)\\]"
            format: "{1}"
      - name: description
        type: string
        select: first
        selector: .principal_contain
        actions:
          - type: get_text
          - type: regex_find_all
            pattern: "^([\\s\\S]*?)\n[ \\t]*Date\n"
            format: "{1}"
      - name: img/poster > link
        type: string
        actions:
          - type: get_response_body
          - type: regex_find_all
            pattern: '<meta property="og:image" content="([^"]+)"'
            format: "{1}"
      - name: playlists
        type: object[]
        entries:
          - name: link
            type: string
            actions:
              - type: get_response_body
              - type: regex_find_all
                pattern: "'file'\\s*:\\s*'(/playlist-[^']+\\.xml)'"
                format: "{base_url}{1}"
    post_process:
      - type: fetch_regex_items_from_items
        source: playlists
        request_field: link
        target: episode
        pattern: '(?s)<item>.*?<title>([^<]+)</title>.*?<pubDate>([^<]+)</pubDate>.*?<media:content[^>]+url="([^"]+)"[^>]+duration="([^"]+)".*?<media:thumbnail[^>]+url="([^"]+)".*?<jwplayer:mediaid>([^<]+)</jwplayer:file>.*?<jwplayer:file>([^<]+)</jwplayer:file>.*?<jwplayer:hd.file>([^<]+)</jwplayer:hd.file>.*?</item>'
        entries:
          - name: title
            type: string
            capture_group: 1
          - name: episode-number
            type: number
            capture_group: 1
            actions:
              - type: regex_find_all
                pattern: '(?:^|\s)(\d+)\s*'
                format: "{1}"
          - name: release-date
            type: string
            capture_group: 2
            actions:
              - type: get_date
                format: yyyy_mm_dd_hh_mm_ss
          - name: duration
            type: string
            capture_group: 4
          - name: img/preview > link
            type: string
            capture_group: 5
          - name: link
            type: string
            capture_group: 6
            actions:
              - type: format_text
                argument: "{base_url}/info-0-1/{}#stream"
          - name: players > name
            type: string
            actions:
              - type: format_text
                argument: "HD"
          - name: players > direct-link
            type: string
            capture_group: 8
          - name: players > name
            type: string
            actions:
              - type: format_text
                argument: "SD"
          - name: players > direct-link
            type: string
            capture_group: 7
      - type: derive_pagination
        remove_fields:
          - playlists
