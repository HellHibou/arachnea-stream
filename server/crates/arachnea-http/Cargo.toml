[package]
name = "arachnea-http"
version.workspace = true
edition.workspace = true
license.workspace = true
autoexamples = false

[features]
default = []
arachnea-proxy = ["dep:arachnea-proxy", "arachnea-proxy/rquest"]
ghostwire = ["dep:ghostwire"]
chaser-cf = ["dep:chaser-cf", "dep:chaser-oxide"]
obscura = ["dep:obscura"]
tauri-cloudflare-solver = ["dep:cookie", "dep:tao", "dep:tauri", "dep:wry"]
tauri-cloudflare-solver-devtools = ["tauri-cloudflare-solver", "wry/devtools"]

[dependencies]
arachnea-core = { path = "../arachnea-core" }
arachnea-proxy = { path = "../arachnea-proxy", default-features = false, features = ["core", "connectors", "tower"], optional = true }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
chaser-cf = { workspace = true, optional = true }
chaser-oxide = { workspace = true, optional = true }
cookie = { workspace = true, optional = true }
futures.workspace = true
ghostwire = { workspace = true, optional = true }
# The Obscura `render` feature is excluded on purpose: Obscura's
# workspace-patched `taffy` and `cosmic-text` vendors are not applied to git
# dependencies, so `obscura-render` fails to compile against the crates.io
# releases. This is tracked as a separate follow-up in the Obscura integration
# plan (Phase 1b gate). The `stealth` feature is enabled: the workspace HTTP
# stack was migrated from `newwreq` to `wreq` (decision A1, integration plan
# Phase 1b), so a single BoringSSL stack (`btls`) is linked and the previous
# `links = "boringssl"` conflict with `boring-sys2` is gone.
obscura = { git = "https://github.com/h4ckf0r0day/obscura", rev = "eec047a188cc75b7a1a257397ad84493ee59c091", default-features = false, features = ["api", "stealth"], optional = true }
encoding_rs = "0.8"
http.workspace = true
httpdate.workspace = true
rand.workspace = true
rquest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tao = { workspace = true, optional = true }
tauri = { workspace = true, features = [], optional = true }
url.workspace = true
wry = { workspace = true, optional = true }

[[example]]
name = "cloudflare_hybrid"
path = "examples/cloudflare_hybrid.rs"
required-features = ["chaser-cf"]

[dev-dependencies]
# Enables the SQLite backend for typed-store validation tests.
arachnea-core = { path = "../arachnea-core", features = ["sqlite-persistence"] }
rusqlite = { workspace = true }
