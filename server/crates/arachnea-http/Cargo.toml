[package]
name = "arachnea-http"
version.workspace = true
edition.workspace = true
license.workspace = true
autoexamples = false

[features]
performance-diagnostics = ["arachnea-proxy?/performance-diagnostics"]
default = []
arachnea-proxy = ["dep:arachnea-proxy", "arachnea-proxy/rquest"]
ghostwire = ["dep:ghostwire"]
chaser-cf = ["dep:chaser-cf", "dep:chaser-oxide"]
tauri-cloudflare-solver = ["dep:cookie", "dep:tao", "dep:tauri", "dep:wry", "dep:urlencoding", "dep:objc2", "dep:objc2-foundation", "dep:objc2-web-kit", "dep:libloading", "dep:webview2-com", "dep:windows-core", "dep:webkit2gtk"]
tauri-cloudflare-solver-devtools = ["tauri-cloudflare-solver", "wry/devtools"]

[dependencies]
arachnea-core = { path = "../arachnea-core" }
arachnea-proxy = { path = "../arachnea-proxy", default-features = false, features = ["core", "connectors", "tower"], optional = true }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
chaser-cf = { workspace = true, optional = true }
chaser-oxide = { workspace = true, optional = true }
cookie = { workspace = true, optional = true }
futures.workspace = true
ghostwire = { workspace = true, optional = true }
encoding_rs = "0.8"
http.workspace = true
httpdate.workspace = true
rand.workspace = true
rquest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tao = { workspace = true, optional = true }
tauri = { workspace = true, features = [], optional = true }
url.workspace = true
urlencoding = { workspace = true, optional = true }
wry = { workspace = true, optional = true }

[[example]]
name = "cloudflare_hybrid"
path = "examples/cloudflare_hybrid.rs"
required-features = ["chaser-cf"]

[dev-dependencies]
rustls.workspace = true
tokio-rustls.workspace = true
# Enables the SQLite backend for typed-store validation tests.
arachnea-core = { path = "../arachnea-core", features = ["sqlite-persistence"] }
rusqlite = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libloading = { version = "0.8", optional = true }
objc2-web-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "WKWebViewConfiguration", "WKWebsiteDataStore"] }
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSProcessInfo"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = { version = "0.38", optional = true }
windows-core = { version = "0.61", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", optional = true, features = ["v2_38"] }
