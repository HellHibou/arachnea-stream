[package]
name = "arachnea-translation"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
document-vtt = ["dep:regex", "dep:url"]
api = ["runtime", "dep:url"]
runtime = ["dep:arachnea-core", "dep:futures", "dep:url"]
retrieval-http = ["dep:url", "dep:rquest", "dep:base64", "tokio/net"]
retrieval-proxy = ["retrieval-http", "dep:arachnea-proxy", "dep:arachnea-core", "dep:futures"]

[dependencies]
arachnea-proxy = { path = "../arachnea-proxy", optional = true, default-features = false, features = ["controller-service"] }
rquest = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
arachnea-core = { path = "../arachnea-core", optional = true, default-features = false }
arachnea-http = { path = "../arachnea-http", default-features = false }
arachnea-scrapyfy = { path = "../arachnea-scrapyfy", default-features = false }
url = { workspace = true, optional = true }
anyhow.workspace = true
futures = { workspace = true, optional = true }
async-trait.workspace = true
http.workspace = true
tracing.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
