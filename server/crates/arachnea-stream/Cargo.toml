[package]
name = "arachnea-stream"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "arachnea"
path = "src/main.rs"

[dependencies]
arachnea-core = { path = "../arachnea-core", features = ["sqlite-persistence"] }
arachnea-http = { path = "../arachnea-http", default-features = false, features = ["chaser-cf"] }
arachnea-scrapyfy = { path = "../arachnea-scrapyfy", default-features = false, features = ["arachnea-proxy", "sqlite-persistence"] }
arachnea-proxy =    { path = "../arachnea-proxy", features = ["controller-service"] }
argon2 = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
const_format.workspace = true
http.workspace = true
rand.workspace = true
regex.workspace = true
rquest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_urlencoded.workspace = true
xxhash-rust.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-opener.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true

[build-dependencies]
serde_json.workspace = true
tauri-build.workspace = true

[dev-dependencies]
arachnea-scrapyfy = { path = "../arachnea-scrapyfy", default-features = false, features = ["test-support"] }
