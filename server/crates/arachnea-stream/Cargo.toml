[package]
# Mirrored private-access suites are loaded as unit tests.
autotests = false
name = "arachnea-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "arachnea"
path = "src/main.rs"

[features]
default = []
performance-diagnostics = ["arachnea-proxy/performance-diagnostics", "arachnea-http/performance-diagnostics", "arachnea-scrapyfy/performance-diagnostics"]

[dependencies]
arachnea-core = { path = "../arachnea-core", features = ["sqlite-persistence"] }
arachnea-http = { path = "../arachnea-http", default-features = false, features = ["chaser-cf"] }
arachnea-scrapyfy = { path = "../arachnea-scrapyfy", default-features = false, features = ["arachnea-proxy", "sqlite-persistence"] }
arachnea-translation = { path = "../arachnea-translation", features = ["api", "document-vtt", "runtime", "retrieval-proxy"] }
arachnea-proxy =    { path = "../arachnea-proxy", features = ["controller-service"] }
argon2 = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
const_format.workspace = true
futures.workspace = true
http.workspace = true
rand.workspace = true
regex.workspace = true
rquest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_urlencoded.workspace = true
xxhash-rust.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-opener.workspace = true
thiserror.workspace = true
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }

[build-dependencies]
serde_json.workspace = true
tauri-build.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
arachnea-scrapyfy = { path = "../arachnea-scrapyfy", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
