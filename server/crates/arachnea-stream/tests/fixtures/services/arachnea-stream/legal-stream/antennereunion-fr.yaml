# Reference expectations; live qualification is recorded separately.
schema_version: 1
source: antennereunion-fr
source_config: arachnea-stream/legal-stream/antennereunion-fr.yaml

capabilities:
  expected: ["service_stream_metadata", "load_home", "get_section", "search", "get_entry", "get_live", "get_season", "list_lives", "resolve_stream"]
  not_expected: []

steps:
  - id: metadata
    operation: service_stream_metadata
    expect:
      items_path: []
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["id"]
        - ["title"]
        - ["logo"]

  - id: home
    operation: load_home
    expect:
      items_path: ["sections","*","entries"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
        - ["link"]

  - id: search
    operation: search
    inputs:
      query: "journal"
    expect:
      items_path: ["entries"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
        - ["link"]

  - id: entry
    operation: get_entry
    inputs:
      query_url:
        from_step: home
        items_path: ["sections","*","entries"]
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: []
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]

  - id: season_navigation
    operation: get_entry
    inputs:
      query_url: "https://proxies.antennereunion-production.eu-west-3.alphanetworks.tv/proxy/listContent?id=1000462&includeRoot=true&languageId=fra"
    expect:
      items_path: ["seasons"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["label"]
        - ["link"]

  - id: section
    operation: get_section
    inputs:
      query_url:
        from_step: season_navigation
        items_path: ["seasons"]
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: ["entries"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
        - ["link"]

  - id: season
    operation: get_season
    inputs:
      query_url:
        from_step: season_navigation
        items_path: ["seasons"]
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: ["episodes"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
        - ["link"]

  - id: lives
    operation: list_lives
    expect:
      items_path: []
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
        - ["link"]

  - id: live
    operation: get_live
    inputs:
      query_url:
        from_step: lives
        items_path: []
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: ["players"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["name"]
        - ["resolver", "kind"]
        - ["resolver", "target_id"]

  - id: stream
    operation: resolve_stream
    inputs:
      query_url:
        from_step: live
        items_path: ["players"]
        select: first_valid
        value_path: ["resolver", "target_id"]
    expect:
      items_path: []
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["stream_url"]
