# Reference expectations; live qualification is recorded separately.
schema_version: 1
source: telemb-be
source_config: arachnea-stream/legal-stream/telemb-be.yaml

capabilities:
  expected: ["service_stream_metadata","load_home","get_category","get_section","get_entry"]
  not_expected: ["search"]

steps:
  - id: metadata
    operation: service_stream_metadata
    expect:
      items_path: []
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["id"]
        - ["title"]
        - ["logo"]

  - id: home
    operation: load_home
    expect:
      items_path: ["categories"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["label"]
        - ["request","query_url"]

  - id: category
    operation: get_category
    inputs:
      query_url:
        from_step: home
        items_path: ["categories"]
        select: first_valid
        value_path: ["request","query_url"]
    expect:
      items_path: ["sections"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["label"]
        - ["link"]

  - id: section
    operation: get_section
    inputs:
      query_url:
        from_step: category
        items_path: ["sections"]
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: ["entries"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
        - ["link"]

  - id: entry
    operation: get_entry
    inputs:
      query_url:
        from_step: section
        items_path: ["entries"]
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: []
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
