# Reference expectations; live qualification is recorded separately.
schema_version: 1
source: telesambre-be
source_config: arachnea-stream/legal-stream/telesambre-be.yaml

capabilities:
  expected: ["service_stream_metadata", "load_home", "get_category", "get_section", "get_entry", "get_players", "get_live", "get_season", "list_lives"]
  not_expected: ["search"]

steps:
  - id: metadata
    operation: service_stream_metadata
    expect:
      items_path: []
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["id"]
        - ["title"]
        - ["logo"]

  - id: home
    operation: load_home
    expect:
      items_path: ["categories"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["label"]
        - ["request","query_url"]

  - id: category
    operation: get_category
    inputs:
      query_url:
        from_step: home
        items_path: ["categories"]
        select: first_valid
        value_path: ["request","query_url"]
    expect:
      items_path: ["sections"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["label"]
        - ["link"]

  - id: section
    operation: get_section
    inputs:
      query_url:
        from_step: category
        items_path: ["sections"]
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: ["entries"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
        - ["link"]

  - id: entry
    operation: get_entry
    inputs:
      query_url:
        from_step: section
        items_path: ["entries"]
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: []
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]

  - id: players
    operation: get_players
    inputs:
      query_url:
        from_step: section
        items_path: ["entries"]
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: ["players"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["name"]

  - id: programme_navigation
    operation: get_category
    inputs:
      query_url: "https://www.telesambre.be/emissions"
    expect:
      items_path: ["sections", "*", "entries"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
        - ["link"]

  - id: season_navigation
    operation: get_entry
    inputs:
      query_url:
        from_step: programme_navigation
        items_path: ["sections", "*", "entries"]
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: ["seasons"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["label"]
        - ["link"]

  - id: season
    operation: get_season
    inputs:
      query_url:
        from_step: season_navigation
        items_path: ["seasons"]
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: ["episodes"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
        - ["link"]

  - id: lives
    operation: list_lives
    expect:
      items_path: []
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["title"]
        - ["link"]

  - id: live
    operation: get_live
    inputs:
      query_url:
        from_step: lives
        items_path: []
        select: first_valid
        value_path: ["link"]
    expect:
      items_path: ["players"]
      min_count: 1
      min_valid_count: 1
      required_non_empty:
        - ["name"]
        - ["direct-link"]
