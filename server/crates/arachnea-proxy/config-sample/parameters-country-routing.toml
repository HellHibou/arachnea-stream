# Country routing through the generic request-parameter mechanism.
#
# HTTP example:
#   curl -x http://127.0.0.1:8080 -H "Arachnea-Proxy-Country: US" https://example.com
#
# SOCKS5 example:
#   curl --socks5 country=US:anything@127.0.0.1:1080 https://example.com

[server]
listen_http = "127.0.0.1:8080"
listen_socks = "127.0.0.1:1080"

[server.network]
allow_clients = ["127.0.0.0/8", "::1/128"]

[core]
profile = "advanced"

[core.routing]
default_chain = "direct"
allow_direct_fallback = true

[[core.parameter_handlers]]
kind = "country_routing"
parameter_name = "country"
http_header = "Arachnea-Proxy-Country"
forward_header = false
stop_on_match = true

[[core.parameter_handlers.routes]]
value = "US"
proxy = { name = "us-socks", kind = "socks5", endpoint = "127.0.0.1:9050", send_hostname = true }

[[core.parameter_handlers.routes]]
value = "BE"
proxy = { name = "be-http", kind = "http_proxy", endpoint = "127.0.0.1:8081", send_hostname = true }

[[core.chains]]
name = "direct"
nodes = [
  { name = "direct", kind = "direct" },
]
