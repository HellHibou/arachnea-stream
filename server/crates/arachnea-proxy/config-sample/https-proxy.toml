# HTTPS proxy listener. Use either PEM paths or DER paths for the certificate/key pair.

[server]
listen_http = "127.0.0.1:8080"
listen_https = "127.0.0.1:8443"
listen_socks = "127.0.0.1:1080"
tls_cert_pem_path = "server-cert.pem"
tls_key_pem_path = "server-key.pem"
allow_unsafe_public_bind_without_acl = false

[server.network]
allow_clients = ["127.0.0.0/8", "::1/128"]
max_connections = 1024

[core]
profile = "system_relay"
