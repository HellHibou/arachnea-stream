# Local HTTP/SOCKS proxy using the system relay profile.

[server]
listen_http = "127.0.0.1:8080"
listen_socks = "127.0.0.1:1080"
max_http_header_bytes = 16384
allow_unsafe_public_bind_without_acl = false

[server.network]
allow_clients = ["127.0.0.0/8", "::1/128"]
deny_clients = []
rate_limit_per_client_per_second = 50
max_connections = 1024

[core]
profile = "system_relay"
