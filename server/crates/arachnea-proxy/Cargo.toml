[package]
name = "arachnea-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
autoexamples = false

[features]
default = ["core", "connectors", "tower", "hyper"]
core = []
server = ["core"]
connectors = ["core"]
controller-service = ["core", "dep:arachnea-core"]
arachnea-dns = ["core", "dep:arachnea-dns"]
tower = ["connectors"]
hyper = ["tower"]
rquest = ["connectors", "server", "dep:rquest"]

[dependencies]
anyhow.workspace = true
arachnea-core = { path = "../arachnea-core", optional = true }
arachnea-dns = { path = "../arachnea-dns", default-features = false, features = ["core"], optional = true }
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
encoding_rs.workspace = true
http.workspace = true
ipnet.workspace = true
regex.workspace = true
rquest = { workspace = true, optional = true }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
tower-service.workspace = true
tracing.workspace = true
url.workspace = true
tracing-subscriber.workspace = true
webpki-roots.workspace = true

[[bin]]
name = "arachnea-proxy-server"
path = "src/server/bin/arachnea-proxy-server.rs"
required-features = ["server"]

[[example]]
name = "hyper_service"
path = "examples/hyper_service.rs"
required-features = ["hyper"]

[[example]]
name = "proxy_chain"
path = "examples/proxy_chain.rs"
required-features = ["tower"]

[[example]]
name = "proxy_pool"
path = "examples/proxy_pool.rs"
required-features = ["core"]

[[example]]
name = "rquest_loopback"
path = "examples/rquest_loopback.rs"
required-features = ["rquest"]

[[example]]
name = "country_routing_parameters"
path = "examples/country_routing_parameters.rs"
required-features = ["rquest"]

[[example]]
name = "smart_dns_parameters"
path = "examples/smart_dns_parameters.rs"
required-features = ["rquest"]

[[example]]
name = "dns_resolver"
path = "examples/dns_resolver.rs"
required-features = ["arachnea-dns"]

[[example]]
name = "proxy_single_forwarder"
path = "examples/single_forwarder.rs"
required-features = ["tower"]

[[example]]
name = "tower_http_get"
path = "examples/tower_http_get.rs"
required-features = ["tower"]
