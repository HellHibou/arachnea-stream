queries:
  - name: service_stream_metadata
    fields_result:
      - id
      - title
      - logo
      - description > fr

  - name: search
    fields_result:
      - duration
      - embed-link
      - id
      - img/poster > link
      - link
      - media-type
      - release-date
      - source
      - subtitle
      - title
      - description
      - web-link
    fields_optional:
      - channel
      - expire
      - theme

  - name: load_home
    fields_result:
      - banners > description
      - banners > image
      - banners > key
      - banners > link
      - banners > title
      - banners > video
      - banners > web-link
      - categories > image
      - categories > key
      - categories > label
      - categories > request > query_url
      - sections > label
      - sections > link
      - source

  - name: get_section
    fields_result:
      - current_page
      - entries > channel
      - entries > description
      - entries > duration
      - entries > expire
      - entries > img/poster > link
      - entries > link
      - entries > media-type
      - entries > release-date
      - entries > source
      - entries > theme
      - entries > title
      - entries > title/alt
      - entries > web-link
      - have_more

  - name: get_category
    fields_result:
      - sections > label
      - sections > link
      - source

  - name: get_entry
    fields_result:
      - description
      - duration
      - episode > description
      - episode > duration
      - episode > expire
      - episode > img/poster > link
      - episode > link
      - episode > players > resolver > kind
      - episode > players > resolver > stream > kind
      - episode > players > resolver > target_id
      - episode > release-date
      - episode > season-name
      - episode > title
      - img/poster > link
      - players > resolver > kind
      - players > resolver > stream > kind
      - players > resolver > target_id
      - release-date
      - season > label
      - season > link
      - theme
      - title
      - title/alt
      - web-link

    fields_optional:
      - casting
      - content-advisor
      - count-season
      - lang/audio
      - lang/subtitles
      - subtitles
      - video/trailer
      - media-type
      - expire
