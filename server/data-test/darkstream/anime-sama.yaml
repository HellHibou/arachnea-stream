queries:
  - name: service_stream_metadata
    fields_result:
      - id
      - title
      - logo
      - description

  - name: search
    fields_result:
      - description
      - img/poster > link
      - lang
      - link
      - media-type
      - source
      - theme
      - title
      - title/alt
      - web-link

  - name: load_home
    fields_result:
      - source
      - banners > key
      - banners > title
      - banners > image
      - banners > web-link
      - banners > link
      - categories > key
      - categories > label
      - categories > request > query_url
      - sections > label
      - sections > entries > description
      - sections > entries > title
      - sections > entries > link
      - sections > entries > web-link
      - sections > entries > img/landscape > link
      - sections > entries > release-date
      - sections > entries > media-type
      - sections > entries > theme
      - sections > entries > title/alt
      - sections > entries > lang

  - name: get_entry
    fields_result:
      - description
      - img/poster > link
      - season > label
      - season > link
      - theme
      - title
      - title/alt