queries:
  - name: service_stream_metadata
    fields_result:
      - id
      - title
      - logo
      - description > fr

  - name: search
    fields_result:
      - description
      - img/poster > link
      - link
      - release-date
      - source
      - title

  - name: load_home
    fields_result:
      - source
      - banners > key
      - banners > title
      - banners > image
      - banners > web-link
      - banners > link
      - banners > logo
      - categories > key
      - categories > label
      - categories > request > query_url
      - sections > label
      - sections > link

    fields_optional:
      - banners > subtitle
      - banners > description
      - banners > video

  - name: get_section
    fields_result:
      - current_page
      - have_more
      - entries > description
      - entries > title
      - entries > link
      - entries > web-link
      - entries > img/poster > link
      - entries > img/landscape > link
      - entries > release-date
      - entries > media-type

  - name: get_category
    fields_result:
      - sections > label
      - sections > link
      - source

  - name: get_entry
    fields_result:
      - content-advisor
      - description
      - img/logo > link
      - img/poster > link
      - link
      - media-type
      - release-date
      - title
      - web-link
