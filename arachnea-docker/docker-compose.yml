services:
  arachnea:
    # Runtime always consumes the local `latest` alias. The build wrapper tags
    # its resolved release both as `arachnea-stream:<version>` and `:latest`.
    image: arachnea-stream:latest
    # Do not pull or fall back to rebuilding with ARACHNEA_VERSION=latest.
    # Build the image first with `./build-image.sh`.
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        # Versioned release tag plus the local runtime alias consumed by
        # `docker compose up`.
        - arachnea-stream:${ARACHNEA_VERSION:-latest}
        - arachnea-stream:latest
      # Cross-build both native Linux ports in one go. Comment one line to
      # build a single architecture.
      platforms:
        - linux/amd64
        - linux/arm64
      # The release tree (`<project>/releases`, output of
      # `node build-release/release.mjs`) lives outside this folder, so Buildkit
      # cannot COPY from it directly: it travels as a named build context that
      # the Dockerfile reads (`COPY --from=releases ...`). Its root is
      # `ARACHNEA_RELEASES_DIR` in `arachnea-docker/.env` (see `.env.example`),
      # relative to this compose file so it follows the repository wherever it
      # is checked out; there is no default here on purpose (fail fast when the
      # variable is missing). Expected layout:
      #   <ARACHNEA_RELEASES_DIR>/release-<ARACHNEA_VERSION>/linux/
      #     arachnea-<ARACHNEA_VERSION>-linux-<arch>-portable.tar.gz
      additional_contexts:
        releases: "${ARACHNEA_RELEASES_DIR:?ARACHNEA_RELEASES_DIR is not set — copy .env.example to .env or export the variable}"
      args:
        # Release packaged into the image. `build-image.sh` resolves and
        # exports ARACHNEA_VERSION before calling Compose. Direct Compose builds
        # require an explicit environment value; the `latest` fallback exists
        # only for interpolation and cannot match a real release archive.
        ARACHNEA_VERSION: "${ARACHNEA_VERSION:-latest}"
        # Portable archive paths, relative to the `releases` build context
        # (additional_contexts above; a `../...` COPY path is forbidden by
        # BuildKit). Kept as explicit variables so another release layout
        # (folder or file naming) only needs editing these two lines.
        ARACHNEA_AMD64_ARCHIVE: "release-${ARACHNEA_VERSION:-latest}/linux/arachnea-${ARACHNEA_VERSION:-latest}-linux-amd64-portable.tar.gz"
        ARACHNEA_ARM64_ARCHIVE: "release-${ARACHNEA_VERSION:-latest}/linux/arachnea-${ARACHNEA_VERSION:-latest}-linux-arm64-portable.tar.gz"
    container_name: arachnea-stream
    ports:
      # Web interface + API. The host side maps the same `ARACHNEA_PORT`, so
      # changing the port in `.env` moves both sides together; use the
      # `HOST:CONTAINER` form (`- "127.0.0.1:${ARACHNEA_PORT:?}...`) to bind
      # loopback only.
      - "${ARACHNEA_PORT:-8080}:${ARACHNEA_PORT:-8080}"
    environment:
      # REST server port inside the container. The entrypoint pins it in the
      # persisted config.json (`server_port`); the binary itself rejects
      # `--server-port <value>` on the command line.
      ARACHNEA_PORT: "${ARACHNEA_PORT:-8080}"
      # `local` (loopback only) | `private` (container-local networks) |
      # `public` (any peer). `public` is the working default for published
      # ports: traffic forwarded by the Docker host does not originate from
      # the container's own subnets, so `private`/`local` answer 404 to it.
      # Use `private` only for container-to-container calls on the same
      # Docker network.
      ARACHNEA_NETWORK: "${ARACHNEA_NETWORK:-public}"
      # Public URL prefix when the service sits behind a path-based reverse
      # proxy (empty by default: the app is served from `/`). The entrypoint
      # pins it in the persisted config.json (`entrypoint_root`); an empty
      # value removes the key so `GET /` keeps working.
      ARACHNEA_ROOT: "${ARACHNEA_ROOT:-}"
      # The image starts Xvfb itself and chaser-cf reuses it
      # (CHROME_BIN, CHASER_VIRTUAL_DISPLAY=0). Chromium flags can be added
      # here, e.g. `--disable-gpu`; `--disable-dev-shm-usage` is always
      # ensured by the entrypoint.
      # CHASER_EXTRA_ARGS: "--disable-gpu"
    # Docker's *default* seccomp profile blocks the `clone`/`unshare` calls
    # Chromium needs to create its user-namespace sandbox. Chromium then aborts
    # with "No usable sandbox! ... you can try using --no-sandbox" and chaser-cf
    # fails to initialize. Unconfining seccomp lets the sandbox work as
    # intended, so Chromium (and therefore Cloudflare challenge solving) keeps
    # its process isolation instead of being neutered by `--no-sandbox`. The
    # container still runs as the non-root `arachnea` user and keeps the other
    # default hardening (capabilities, AppArmor, read-only /proc masks), and no
    # host-side configuration is required — which is what makes this the
    # portable choice for Windows/WSL2 Docker Desktop hosts as well.
    security_opt:
      - seccomp=unconfined
    volumes:
      # Persisted state: config.json, caches, Cloudflare session store
      # (the application `data/` directory).
      - arachnea-data:/app/data
    shm_size: 256m
    restart: unless-stopped

volumes:
  arachnea-data:
