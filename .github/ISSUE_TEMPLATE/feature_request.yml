name: Feature request
description: Suggest an idea or an improvement for Arachnea Stream.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve, and what is missing or painful today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. Include sketches or screenshots if useful.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - New YAML source (streaming platform or catalog)
        - Improvement to an existing YAML source
        - New scraper capability (action, post-processor...)
        - Frontend interface
        - Player / resolvers
        - Administration / server
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or features you have considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, links, or examples (e.g. the website and URLs involved for a new source).
